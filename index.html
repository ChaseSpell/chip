:root {
  --deep: #092c33;
  --felt: #0d3a42;
  --cloth: #145360;
  --cloth-hi: #1b6574;
  --rail: #4a3223;
  --rail-dk: #2e1f15;
  --sight: #d8c7a3;
  --chalk: #eef1e8;
  --chalk-dim: #a9c3c3;
  --line: #2b6068;
  --blue: #6fb6ea;
  --blue-ink: #06283a;
  --yellow: #f4bd3a;
  --yellow-ink: #2a1d00;
  --red: #b93a32;
  --red-text: #ff9288;
  /* Atkinson Hyperlegible Next (embedded above) was designed for maximum legibility */
  --display: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body: var(--display);
}
* { box-sizing: border-box; }
html { background: var(--deep); color: var(--chalk); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--deep); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- rail bar ---------- */
.rail-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px 14px;
  background: var(--rail);
  border-bottom: 3px solid var(--rail-dk);
}
.rail-bar::after {
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 4px; height: 5px; pointer-events: none;
  background-image: radial-gradient(circle, var(--sight) 2px, transparent 2.6px);
  background-size: calc(100% / 12) 100%; background-repeat: repeat-x; opacity: .75;
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; }
.ball8 {
  width: 30px; height: 30px; border-radius: 50%; flex: none; position: relative;
  background: radial-gradient(circle at 35% 30%, #5b5b5b, #111 62%);
  box-shadow: 0 1px 0 #0006;
}
.ball8::after {
  content: "8"; position: absolute; left: 50%; top: 50%; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
  border-radius: 50%; background: var(--chalk); color: #111; font: 700 11px/15px var(--body); text-align: center;
}
.bar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 519px) {
  .rail-bar { padding: 8px 12px 14px; flex-wrap: nowrap; }
  .brand-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--chalk-dim);
  background: transparent; font-weight: 600; touch-action: manipulation;
}
.btn:hover { background: #ffffff14; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn.primary:hover { background: #8cc5f0; }
.btn.warn { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: .92rem; }
.btn.ghost { border-color: transparent; }
.btn.on-rail { border-color: #e9d9b8aa; }
.btn.big { min-height: 54px; font-size: 1.1rem; }
.mode-btn[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.mode-btn[aria-pressed="false"] { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }

/* ---------- layout ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 120px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--chalk-dim); font-size: .95rem; margin-bottom: 12px; }
.stats b { color: var(--chalk); font-family: var(--display); font-size: 1.25rem; font-weight: 700; margin-right: 4px; }
.tabs { display: flex; gap: 4px; margin: 4px 0 18px; border-bottom: 2px solid var(--line); }
.tab { min-height: 44px; padding: 8px 18px; background: transparent; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; font-weight: 600; color: var(--chalk-dim); }
.tab[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--blue); }
.board { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
@media (min-width: 980px) { .board { grid-template-columns: minmax(0, 1fr) 320px; } }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 22px; }
.section-title { font-family: var(--display); font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
.section-title .count { font-size: 1.05rem; color: var(--chalk-dim); font-weight: 600; }
.muted { color: var(--chalk-dim); }

/* ---------- a table, seen from above ---------- */
.thead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding: 0 4px; }
.thead h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.tmeta { color: var(--chalk-dim); font-size: .95rem; text-align: right; }
.tmeta .time { color: var(--chalk); font-weight: 600; }
.frame { position: relative; background: var(--rail); padding: 14px; border-radius: 22px; box-shadow: 0 2px 0 var(--rail-dk); }
.frame::before, .frame::after {
  content: ""; position: absolute; left: 44px; right: 44px; height: 6px; pointer-events: none;
  background-image: radial-gradient(circle, var(--sight) 2px, transparent 2.6px);
  background-size: calc(100% / 7) 100%; background-repeat: repeat-x;
}
.frame::before { top: 4px; }
.frame::after { bottom: 4px; }
.felt {
  position: relative; padding: 18px 16px 16px; border-radius: 10px; background-color: var(--cloth);
  background-image:
    radial-gradient(circle at 0 0, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 100% 0, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 0 100%, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 100% 100%, #04171c 0 15px, transparent 16px);
  box-shadow: inset 0 2px 10px #0007;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch;
}
.vs { align-self: center; color: var(--chalk-dim); font-style: italic; }
.seat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pname { font-family: var(--display); font-weight: 800; font-size: var(--nf, 1.6rem); line-height: 1.1; letter-spacing: .035em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.pname.wrap { white-space: normal; overflow-wrap: anywhere; }   /* only when a name cannot fit on one line even at the smallest size */
.pname.cut { text-overflow: ellipsis; }
/* tap a player's name when they win: a faint plate behind the name shows it can be tapped */
button.pname.won {
  display: block; width: calc(100% + .28em); min-height: 54px; margin: 0 -.14em; padding: 6px 0; text-indent: .14em; text-align: left; color: inherit; border: 0; border-radius: .14em;
  background: rgba(255,255,255,.08); box-shadow: inset 0 -.06em 0 rgba(255,255,255,.28);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background .08s ease, transform .08s ease;
}
button.pname.won:hover { background: rgba(255,255,255,.2); }
button.pname.won:active { background: rgba(255,255,255,.3); transform: scale(.98); }
button.pname.won:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.pchips { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-height: 24px; }
.frac { color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.hint { color: var(--chalk-dim); font-size: .95rem; margin: -2px 0 12px; }
/* chips: a black disc with a dashed white rim; spent chips are an empty, fainter outline */
.chip { position: relative; box-sizing: border-box; display: inline-block; width: 18px; height: 18px; margin-right: 3px; border-radius: 50%; vertical-align: middle; }
.chip.on { background: #050505; border: 2px dashed #fff; }
.chip.off { background: transparent; border: 2px dashed rgba(255,255,255,.42); }
.slot { border: 2px dashed var(--yellow); border-radius: 10px; padding: 10px; align-items: flex-start; justify-content: center; color: var(--yellow); font-weight: 600; }
.slot .btn { margin-top: 4px; }
.tnote { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--yellow); font-weight: 600; }
.closed-tables { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; color: var(--chalk-dim); align-items: center; }
@media (max-width: 559px) {
  .felt { grid-template-columns: 1fr; }
  .vs { justify-self: center; }
  .tables { grid-template-columns: 1fr; }
}

/* ---------- waitlist ---------- */
.waitlist ol { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--line); }
.waitlist li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 10px 6px 10px 10px; border-bottom: 1px solid var(--line); }
.pos { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--chalk-dim); }
.who b { font-family: var(--display); font-size: 1.25rem; font-weight: 800; letter-spacing: .02em; display: block; overflow-wrap: anywhere; }
.who small { display: block; color: var(--yellow); margin-top: 2px; }
.ondeck { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 10px; background: var(--yellow); color: var(--yellow-ink); font: 700 .78rem/1.5 var(--body); letter-spacing: 0; vertical-align: middle; }
.empty { padding: 14px 10px; color: var(--chalk-dim); border-left: 3px solid var(--line); }

/* ---------- players table / log ---------- */
.data { width: 100%; border-collapse: collapse; }
.data th { text-align: left; font-weight: 600; color: var(--chalk-dim); padding: 6px 10px; border-bottom: 2px solid var(--line); }
.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.data td.num, .data th.num { text-align: center; font-variant-numeric: tabular-nums; }
.data .nm { font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: .03em; }
.scroll-x { overflow-x: auto; }
.block { margin-bottom: 30px; }
.place { font-family: var(--display); font-weight: 700; color: var(--chalk-dim); min-width: 3.2em; display: inline-block; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 82px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.log .t { color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.draw { columns: 2 220px; padding-left: 1.4em; margin: 0; }
.draw li { padding: 2px 0; break-inside: avoid; }

/* ---------- banners, champion ---------- */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding: 12px 14px; border-radius: 12px; background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.banner.info { background: #ffffff14; color: var(--chalk); border: 2px solid var(--line); }
.champ { text-align: center; padding: 26px 12px 30px; margin-bottom: 18px; border-top: 3px solid var(--sight); border-bottom: 3px solid var(--sight); }
.champ .trophy { font-size: 3rem; line-height: 1; }
.champ .nm { font-family: var(--display); font-weight: 800; letter-spacing: .03em; font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1.05; margin: 8px 0 4px; overflow-wrap: anywhere; }
.champ .sub { color: var(--chalk-dim); }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }

/* ---------- registration ---------- */
.reg { display: grid; grid-template-columns: 1fr; gap: 30px; align-items: start; }
@media (min-width: 900px) { .reg { grid-template-columns: minmax(0, 1fr) 340px; } .reg .start-panel { position: sticky; top: 92px; } }
.hero { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; margin-bottom: 6px; }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 18px 0 8px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { color: var(--chalk-dim); font-size: .92rem; }
.input, select.input, textarea.input {
  min-height: 46px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--felt); color: var(--chalk); width: 100%;
}
.input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px #6fb6ea55; }
.grow { flex: 1 1 200px; }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--felt); }
.stepper button { width: 44px; min-height: 42px; border: 0; background: transparent; font-size: 1.3rem; font-weight: 700; }
.stepper button:hover { background: #ffffff14; }
.stepper output { min-width: 38px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.roster { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--line); }
.roster li { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.roster .nm { font-family: var(--display); font-weight: 800; font-size: 1.25rem; letter-spacing: .03em; overflow-wrap: anywhere; }
#name-in, #late-name, #e-name { text-transform: uppercase; }   /* names show in capitals while you type them, too */
.start-panel { border-top: 3px solid var(--sight); padding-top: 14px; }
.start-panel .big-n { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; }
.est { margin: 10px 0 14px; color: var(--chalk-dim); }
.est b { color: var(--chalk); }
.problem { color: var(--red-text); font-weight: 600; margin: 8px 0; }

/* ---------- modal + toast ---------- */
.scrim, .toast { font-size: max(16px, 1rem); }   /* pop-ups stay a comfortable size on any screen, and grow on a big TV */
.scrim { position: fixed; inset: 0; z-index: 50; background: #021014cc; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 20px; } }
.modal { width: 100%; max-width: 35em; max-height: 92vh; overflow: auto; background: var(--felt); border: 3px solid var(--rail); border-radius: 20px 20px 0 0; padding: 20px 20px 22px; }
@media (min-width: 640px) { .modal { border-radius: 20px; } }
.modal h2 { font-family: var(--display); font-weight: 700; font-size: 1.7em; line-height: 1.1; margin-bottom: 10px; }
.modal p { margin: 8px 0; }
.modal .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; justify-content: flex-end; }
.modal .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.modal .stack .btn { text-align: left; }
.modal .btn.small, .toast .btn.small { font-size: .92em; }
.modal .btn.big { font-size: 1.1em; }
.modal .field label, .modal .lbl { font-size: .92em; }
.modal .grp { margin-top: 16px; font-family: var(--display); font-weight: 700; font-size: 1.15em; color: var(--chalk-dim); }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; }
.err { color: var(--red-text); font-weight: 600; margin-top: 8px; min-height: 1.2em; }
.toast {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60;
  display: flex; align-items: center; gap: 14px; width: max-content; max-width: min(92vw, 35em); cursor: pointer;
  padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--chalk); color: #10272b; font-weight: 600;
  box-shadow: 0 6px 24px #0008;
}
.toast.bad { background: var(--red); color: #fff; }
.toast .btn { border-color: #10272b; color: #10272b; min-height: 38px; }
.toast.bad .btn { border-color: #fff; color: #fff; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =====================================================================================================
   Wide screens (a TV): tables become a narrow strip on the left, the waitlist gets the room on the right.
   The class "tv" is set on <html> by the script when the Tables tab is showing on a screen 1280px or wider.
   Everything here scales with the screen width (16px per 1920px). --ts is the table name size, --wl the waitlist name size;
   the script sets them to the largest values that fit. Table chips and counts are fractions of --ts.
   ===================================================================================================== */
html.tv { font-size: clamp(12px, .83333vw, 40px); }
.tv .wrap { max-width: none; padding: .6rem 1.75rem 1rem; }
.tv .rail-bar { padding-top: .5rem; padding-bottom: .75rem; }
.tv .stats { margin-bottom: .25rem; }
.tv .tabs { margin: 0 0 .6rem; }
.tv .section-title { font-size: 1.5rem; margin-bottom: .35rem; }
.tv .hint { display: none; }
.tv .board { grid-template-columns: var(--tw, 26vw) minmax(0, 1fr); gap: 1.75rem; }
.tv .board.tcols2 { --tw: 33vw; }

/* ---------- the tables ---------- */
.tv .tables { grid-template-columns: 1fr; gap: .16em 1.25rem; font-size: var(--ts, 2.6rem); }
.tv .board.tcols2 .tables { grid-template-columns: 1fr 1fr; }
.tv .thead { line-height: 1; padding: 0 .1em .08em; margin: 0; align-items: flex-end; }
.tv .thead h3 { font-size: max(1.4rem, .4em); line-height: 1; font-weight: 800; }
.tv .tmeta { font-size: max(1.15rem, .32em); line-height: 1; color: var(--chalk); font-weight: 700; }
.tv .tmeta .time { font-weight: 700; }
.tv .tmeta .elapsed { margin-left: .35em; }
.tv .frame { padding: .1em; border-radius: .26em; }
.tv .frame::before, .tv .frame::after { display: none; }
.tv .felt { padding: .06em .2em .1em; gap: 0 .12em; grid-template-columns: 1fr .8em 1fr; align-items: stretch; align-content: stretch; border-radius: .12em; }
.tv .vs { font-size: .28em; align-self: center; text-align: center; }
.tv .seat { gap: 0; justify-content: space-between; min-width: 0; }
.tv .pname { font-size: var(--nf, var(--ts, 2.6rem)); height: calc(var(--ts, 2.6rem) * 1.08); line-height: calc(var(--ts, 2.6rem) * 1.08); white-space: nowrap; overflow: hidden; overflow-wrap: normal; }
.tv .who b.cut { text-overflow: ellipsis; }
.tv button.pname.won { min-height: 0; padding: 0; text-indent: .14em; }   /* indent instead of padding: the fit check and the ellipsis then agree on the width */
.tv .pchips { line-height: 1; min-height: 0; align-items: center; padding: .04em .02em 0; gap: 0 .25em; flex-wrap: nowrap; }
.tv .pchips > span[aria-hidden] { display: flex; align-items: center; white-space: nowrap; flex: none; }
.tv .felt .chip { width: var(--chip, calc(var(--ts, 2.6rem) * .46)); height: var(--chip, calc(var(--ts, 2.6rem) * .46)); margin-right: .06em; flex: none; }
.tv .felt .chip.on, .tv .felt .chip.off { border-width: .0575em; }
.tv .felt .frac { font-size: .36em; font-weight: 700; color: var(--chalk); line-height: 1; }
.tv .slot { font-size: max(1rem, .26em); line-height: 1.2; padding: .5em .6em; gap: .3em; }
.tv .slot .btn { margin-top: 0; }
.tv .tnote { font-size: max(1rem, .25em); line-height: 1.2; padding-top: .2em; }
.tv .closed-tables { margin-top: .7rem; font-size: 1rem; }

/* ---------- the waitlist: the priority zone ---------- */
.tv .waitlist .section-title { font-size: 2.4rem; margin-bottom: .5rem; }
.tv .waitlist .section-title .count { font-size: 1.6rem; }
.tv .waitlist ol { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 6), auto); grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 0 2rem; border-left: 0; font-size: var(--wl, 3rem); }
.tv .waitlist li { grid-template-columns: .85em minmax(0, 1fr) auto; gap: .15em; padding: .14em .1em .14em .05em; line-height: 1; }
.tv .waitlist .pos { font-size: .55em; align-self: center; text-align: right; padding-right: 0; }
.tv .who { min-width: 0; }
.tv .who b { font-size: 1em; display: block; white-space: nowrap; overflow: hidden; overflow-wrap: normal; line-height: 1.08; }
.tv .ondeck { font-size: max(.95rem, .3em); margin-left: .5em; padding: 0 .6em; line-height: 1.6; text-transform: none; }
.tv .who .pchips { min-height: 0; gap: 0 .3em; margin-top: .06em; padding: 0; flex-wrap: wrap; }
.tv .who .pchips > span[aria-hidden] { flex: 0 1 auto; flex-wrap: wrap; min-width: 0; }   /* a player with lots of chips wraps to a second line instead of running under Edit */
.tv .waitlist .chip { width: .5em; height: .5em; margin-right: .07em; }
.tv .waitlist .chip.on, .tv .waitlist .chip.off { border-width: max(1.5px, .0625em); }
.tv .waitlist .frac { font-size: max(1rem, .4em); color: var(--chalk-dim); }
.tv .who small { font-size: max(.9rem, .3em); line-height: 1.2; margin-top: .15em; }
.tv .scrim, .tv .toast { font-size: max(16px, 1.15rem); }   /* pop-ups and result messages read from further away on a big screen */
.tv .waitlist li .btn { font-size: .85rem; padding: 0 .45rem; min-height: 2rem; opacity: .75; align-self: center; }
.tv .empty { font-size: 1.6rem; }

</style>

/* Chip Tournament engine: pure rules, no DOM. Works in browser (global ChipEngine) and Node (module.exports). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) { module.exports = factory(); }
  else { root.ChipEngine = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var VERSION = 1;
  var UNDO_CAP = 150;
  // Parts of the state that Undo rewinds. Settings (default chips, planned tables, match minutes) and mode are not rewound.
  var SNAP_KEYS = ['phase', 'nextId', 'seq', 'players', 'tables', 'queue', 'draw', 'champion', 'startedAt', 'finishedAt'];

  /* ---------- small helpers ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function defaultRng() {
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] / 4294967296;
    }
    return Math.random();
  }

  function shuffle(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function fmtTime(ms) {
    if (ms === null || ms === undefined) return '';
    var d = new Date(ms);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ap;
  }

  function normName(n) { return String(n === undefined || n === null ? '' : n).replace(/\s+/g, ' ').trim(); }

  /* ---------- state ---------- */
  function newState() {
    return {
      v: VERSION,
      phase: 'registration',      // registration | active | finished
      mode: 'AUTO',               // AUTO | MANUAL
      defaultChips: 3,
      plannedTables: 4,
      matchMinutes: 10,
      nextId: 1,
      seq: 0,
      players: [],
      tables: [],
      queue: [],
      draw: [],
      champion: null,
      startedAt: null,
      finishedAt: null,
      log: [],
      undo: []
    };
  }

  function P(s, id) {
    for (var i = 0; i < s.players.length; i++) if (s.players[i].id === id) return s.players[i];
    return null;
  }
  function T(s, n) {
    for (var i = 0; i < s.tables.length; i++) if (s.tables[i].n === n) return s.tables[i];
    return null;
  }
  function activeCount(s) {
    var c = 0;
    for (var i = 0; i < s.players.length; i++) if (s.players[i].status === 'active') c++;
    return c;
  }
  function tableOf(s, id) {
    for (var i = 0; i < s.tables.length; i++) {
      var t = s.tables[i];
      if (t.open && (t.a === id || t.b === id)) return t;
    }
    return null;
  }
  function tableState(t) {
    if (!t.open) return 'closed';
    if (t.a && t.b) return 'match';
    if (t.a || t.b) return 'waiting';
    return 'empty';
  }
  function waitingTables(s) {
    return s.tables.filter(function (t) { return t.open && t.a && !t.b; })
      .sort(function (x, y) { return x.wseq - y.wseq; });
  }
  function label(p) { return p.name + ' (' + p.C + '/' + p.S + ')'; }

  function nameTaken(s, name, exceptId) {
    var low = name.toLowerCase();
    for (var i = 0; i < s.players.length; i++) {
      var p = s.players[i];
      if (p.id !== exceptId && p.name.toLowerCase() === low) return true;
    }
    return false;
  }

  /* No immediate rematch: two players can't be paired if each one's most recent opponent is the other.
     The rule is lifted when only two players remain. */
  function canPair(s, aId, bId) {
    if (aId === bId) return false;
    if (activeCount(s) <= 2) return true;
    var a = P(s, aId), b = P(s, bId);
    if (!a || !b) return false;
    if (a.lastOpp === bId && b.lastOpp === aId) return false;
    return true;
  }

  function addLog(s, now, type, data, text) {
    var e = data || {};
    e.i = s.log.length + 1;
    e.t = now;
    e.type = type;
    e.text = text;
    s.log.push(e);
  }

  /* ---------- undo plumbing ---------- */
  function snapshot(s, lbl, withMode) {
    var o = { label: lbl, logLen: s.log.length };
    SNAP_KEYS.forEach(function (k) { o[k] = clone(s[k]); });
    if (withMode) o.mode = s.mode;
    return o;
  }
  function restore(s, snap) {
    SNAP_KEYS.forEach(function (k) { s[k] = clone(snap[k]); });
    if (Object.prototype.hasOwnProperty.call(snap, 'mode')) s.mode = snap.mode;
    s.log.length = snap.logLen;
  }
  function act(s, lbl, fn, withMode) {
    var snap = snapshot(s, lbl, withMode);
    var r;
    try { r = fn(); }
    catch (e) { restore(s, snap); return { error: String(e && e.message ? e.message : e) }; }
    if (r && r.error) { restore(s, snap); return r; }
    s.undo.push(snap);
    if (s.undo.length > UNDO_CAP) s.undo.shift();
    return r || { ok: true };
  }
  function undo(s) {
    if (!s.undo.length) return { error: 'Nothing to undo' };
    var snap = s.undo.pop();
    restore(s, snap);
    return { ok: true, label: snap.label };
  }
  function undoLabel(s) { return s.undo.length ? s.undo[s.undo.length - 1].label : null; }

  /* ---------- registration ---------- */
  function addPlayer(s, name, chips) {
    name = normName(name);
    if (!name) return { error: 'Enter a name' };
    chips = parseInt(chips, 10);
    if (!(chips >= 1)) return { error: 'Starting chips must be 1 or more' };
    if (nameTaken(s, name)) return { error: '"' + name + '" is already registered. Add a last initial.' };
    var p = { id: s.nextId++, name: name, S: chips, C: chips, W: 0, reg: s.players.length + 1, status: 'active', lastOpp: null, place: null };
    s.players.push(p);
    return { ok: true, player: p };
  }

  function removePlayer(s, id) {
    if (s.phase !== 'registration') return { error: 'Use Drop once the tournament has started' };
    var i = s.players.findIndex(function (p) { return p.id === id; });
    if (i < 0) return { error: 'Player not found' };
    s.players.splice(i, 1);
    s.players.forEach(function (p, k) { p.reg = k + 1; });
    return { ok: true };
  }

  function editRegistered(s, id, patch) {
    if (s.phase !== 'registration') return { error: 'Not in registration' };
    var p = P(s, id);
    if (!p) return { error: 'Player not found' };
    if (patch.name !== undefined) {
      var nm = normName(patch.name);
      if (!nm) return { error: 'Enter a name' };
      if (nameTaken(s, nm, id)) return { error: '"' + nm + '" is already registered' };
      p.name = nm;
    }
    if (patch.S !== undefined) {
      var c = parseInt(patch.S, 10);
      if (!(c >= 1)) return { error: 'Starting chips must be 1 or more' };
      p.S = c; p.C = c;
    }
    return { ok: true };
  }

  /* ---------- start ---------- */
  function startTournament(s, nTables, now, rng) {
    if (s.phase !== 'registration') return { error: 'The tournament has already started' };
    nTables = parseInt(nTables, 10);
    if (!(nTables >= 1)) return { error: 'Enter the number of tables' };
    var n = s.players.length;
    if (n < 2 * nTables) return { error: 'Need at least ' + (2 * nTables) + ' players for ' + nTables + ' table' + (nTables === 1 ? '' : 's') + ' (you have ' + n + ')' };
    return act(s, 'Start tournament', function () {
      rng = rng || defaultRng;
      var order = s.players.map(function (p) { return p.id; });
      var isIdentity = function () { return order.every(function (id, i) { return id === s.players[i].id; }); };
      shuffle(order, rng);
      var tries = 0;
      while (n >= 3 && isIdentity() && tries++ < 20) shuffle(order, rng);
      if (n >= 3 && isIdentity()) order.push(order.shift()); // never seat players in registration order
      s.draw = order.slice();
      s.players.forEach(function (p) { p.C = p.S; p.W = 0; p.lastOpp = null; p.place = null; p.status = 'active'; });
      s.tables = [];
      for (var i = 1; i <= nTables; i++) {
        s.tables.push({ n: i, open: true, a: order[2 * i - 2], b: order[2 * i - 1], since: now, wseq: 0, note: null });
      }
      s.queue = order.slice(2 * nTables);
      s.phase = 'active';
      s.mode = 'AUTO';
      s.champion = null;
      s.startedAt = now;
      s.finishedAt = null;
      s.seq = 0;
      s.log = [];
      addLog(s, now, 'start', { tables: nTables }, 'Tournament started: ' + n + ' players, ' + nTables + ' tables');
      s.tables.forEach(function (t) {
        addLog(s, now, 'throw', { table: t.n }, 'Table ' + t.n + ': ' + P(s, t.a).name + ' vs ' + P(s, t.b).name);
      });
      return { ok: true };
    });
  }

  /* ---------- seating ---------- */
  function throwTo(s, t, qid, now) {
    var qi = s.queue.indexOf(qid);
    if (qi >= 0) s.queue.splice(qi, 1);
    t.b = qid; t.since = now; t.note = null; t.wseq = 0;
    addLog(s, now, 'throw', { table: t.n }, 'Table ' + t.n + ': ' + P(s, t.a).name + ' vs ' + P(s, t.b).name);
  }

  function fillWaiting(s, now) {
    var waiters = waitingTables(s);
    if (!waiters.length || !s.queue.length) return;
    var used = {}, pairs = [], left = [];
    waiters.forEach(function (t) {
      var pick = null;
      for (var i = 0; i < s.queue.length; i++) {
        var q = s.queue[i];
        if (used[q]) continue;
        if (canPair(s, t.a, q)) { pick = q; break; }
      }
      if (pick !== null) { used[pick] = true; pairs.push({ t: t, q: pick }); } else left.push(t);
    });
    // Repair: an unseated winner may swap challengers with an already-seated one.
    left.forEach(function (t) {
      for (var pi = 0; pi < pairs.length; pi++) {
        var pr = pairs[pi];
        if (!canPair(s, t.a, pr.q)) continue;
        var alt = null;
        for (var i = 0; i < s.queue.length; i++) {
          var q = s.queue[i];
          if (used[q]) continue;
          if (canPair(s, pr.t.a, q)) { alt = q; break; }
        }
        if (alt !== null) {
          used[alt] = true;
          var old = pr.q; pr.q = alt;
          pairs.push({ t: t, q: old });
          return;
        }
      }
    });
    pairs.sort(function (x, y) { return x.t.wseq - y.t.wseq; });
    pairs.forEach(function (pr) { throwTo(s, pr.t, pr.q, now); });
  }

  function fillEmpty(s, now) {
    s.tables.forEach(function (t) {
      if (!t.open || t.a || t.b) return;
      var q = s.queue;
      for (var i = 0; i < q.length; i++) {
        for (var j = i + 1; j < q.length; j++) {
          if (canPair(s, q[i], q[j])) {
            var a = q[i], b = q[j];
            q.splice(j, 1); q.splice(i, 1);
            t.a = a; t.b = null; t.wseq = 0;
            throwTo(s, t, b, now);
            return;
          }
        }
      }
    });
  }

  function settle(s, now) {
    if (s.phase !== 'active' || s.mode !== 'AUTO') return;
    fillWaiting(s, now);
    fillEmpty(s, now);
    s.tables.forEach(function (t) {
      if (t.open && !t.a && !t.b) {
        t.open = false; t.since = null; t.note = null; t.wseq = 0;
        addLog(s, now, 'close', { table: t.n }, 'Table ' + t.n + ' closed (no players)');
      }
    });
  }

  /* Two winners are waiting and nobody can challenge either: they should be consolidated onto one table. */
  function pendingConsolidation(s) {
    if (s.phase !== 'active') return null;
    var w = waitingTables(s);
    if (w.length < 2) return null;
    for (var i = 0; i < w.length; i++) {
      for (var k = 0; k < s.queue.length; k++) {
        if (canPair(s, w[i].a, s.queue[k])) return null;
      }
    }
    for (var x = 0; x < w.length; x++) {
      for (var y = x + 1; y < w.length; y++) {
        if (canPair(s, w[x].a, w[y].a)) return { tables: [w[x].n, w[y].n] };
      }
    }
    return null;
  }

  function consolidate(s, keepN, closeN, now) {
    var k = T(s, keepN), c = T(s, closeN);
    if (!k || !c || k === c) return { error: 'Pick two different tables' };
    if (tableState(k) !== 'waiting' || tableState(c) !== 'waiting') return { error: 'Both tables need a waiting winner' };
    if (!canPair(s, k.a, c.a)) return { error: 'Those two just played each other' };
    return act(s, 'Consolidate tables', function () {
      var wk = P(s, k.a), wc = P(s, c.a);
      k.b = c.a; c.a = null; c.b = null; c.open = false; c.since = null; c.note = null; c.wseq = 0;
      k.since = now; k.wseq = 0; k.note = 'Consolidated: flip for the break';
      addLog(s, now, 'consolidate', { table: k.n, closed: c.n },
        'Table ' + c.n + ' closed. Table ' + k.n + ': ' + wk.name + ' vs ' + wc.name + ' (flip for the break)');
      settle(s, now);
      return { ok: true };
    });
  }

  /* ---------- results ---------- */
  function finish(s, champ, now) {
    s.phase = 'finished';
    s.champion = champ.id;
    champ.place = 1;
    s.finishedAt = now;
    s.queue = [];
    s.tables.forEach(function (t) { t.a = null; t.b = null; t.since = null; t.note = null; t.wseq = 0; });
    addLog(s, now, 'champion', { player: champ.id }, champ.name + ' is the champion');
  }

  function removeFromPlay(s, p) {
    var qi = s.queue.indexOf(p.id);
    if (qi >= 0) s.queue.splice(qi, 1);
    var t = tableOf(s, p.id);
    if (t) {
      var opp = t.a === p.id ? t.b : t.a;
      t.a = opp || null; t.b = null; t.since = null; t.note = null;
      t.wseq = opp ? ++s.seq : 0;
    }
  }

  function eliminate(s, p, now) {
    var before = activeCount(s);
    removeFromPlay(s, p);
    p.status = 'eliminated';
    p.C = 0;
    p.place = before;
    p.elimAt = now;
  }

  function checkEnd(s, now) {
    var act1 = s.players.filter(function (p) { return p.status === 'active'; });
    if (act1.length === 1) { finish(s, act1[0], now); return true; }
    return false;
  }

  function reportResult(s, winnerId, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    var W = P(s, winnerId);
    var t = W ? tableOf(s, winnerId) : null;
    if (!W || W.status !== 'active' || !t || !(t.a && t.b)) return { error: 'That player is not in a match right now' };
    var loserId = t.a === winnerId ? t.b : t.a;
    var L = P(s, loserId);
    return act(s, 'Result: ' + W.name + ' def. ' + L.name, function () {
      var start = t.since;
      W.W += 1;
      L.C -= 1;
      W.lastOpp = L.id; L.lastOpp = W.id;
      t.a = W.id; t.b = null; t.since = null; t.note = null; t.wseq = ++s.seq;
      var elim = L.C <= 0;
      if (elim) { eliminate(s, L, now); } else { s.queue.push(L.id); }
      addLog(s, now, 'result', {
        table: t.n, winner: W.id, loser: L.id, start: start, loserC: L.C, elim: elim
      }, 'Table ' + t.n + ': ' + W.name + ' def. ' + L.name + (elim ? ' (' + L.name + ' eliminated)' : ' (' + L.name + ' ' + L.C + '/' + L.S + ')'));
      if (!checkEnd(s, now)) settle(s, now);
      return { ok: true, table: t.n, eliminated: elim, loser: L.id };
    });
  }

  /* ---------- manual throw / tables ---------- */
  function throwMatch(s, tableN, p1, p2, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    var t = T(s, tableN);
    if (!t || !t.open) return { error: 'That table is closed' };
    if (t.a && t.b) return { error: 'That table already has a match' };
    function inPool(id) {
      var p = P(s, id);
      if (!p || p.status !== 'active') return false;
      if (s.queue.indexOf(id) >= 0) return true;
      var ot = tableOf(s, id);
      return !!(ot && ot !== t && tableState(ot) === 'waiting');
    }
    var first, second;
    if (t.a) {
      if (!p1 || !inPool(p1)) return { error: 'Pick a challenger from the waitlist' };
      first = t.a; second = p1;
    } else {
      if (!p1 || !p2 || p1 === p2) return { error: 'Pick two different players' };
      if (!inPool(p1) || !inPool(p2)) return { error: 'Both players must be on the waitlist or waiting at a table' };
      first = p1; second = p2;
    }
    return act(s, 'Throw Table ' + tableN, function () {
      function take(id) {
        var qi = s.queue.indexOf(id);
        if (qi >= 0) { s.queue.splice(qi, 1); return; }
        var ot = tableOf(s, id);
        if (ot) { ot.a = null; ot.b = null; ot.since = null; ot.note = null; ot.wseq = 0; }
      }
      if (!t.a) { take(first); t.a = first; }
      take(second);
      t.b = second; t.since = now; t.note = null; t.wseq = 0;
      addLog(s, now, 'throw', { table: t.n, manual: true }, 'Table ' + t.n + ': ' + P(s, t.a).name + ' vs ' + P(s, t.b).name + ' (thrown manually)');
      settle(s, now);
      return { ok: true };
    });
  }

  function closeTable(s, n, now) {
    var t = T(s, n);
    if (!t || !t.open) return { error: 'Table is already closed' };
    if (t.a || t.b) return { error: 'Table ' + n + ' still has a player on it' };
    return act(s, 'Close Table ' + n, function () {
      t.open = false; t.since = null; t.note = null; t.wseq = 0;
      addLog(s, now, 'close', { table: n }, 'Table ' + n + ' closed');
      return { ok: true };
    });
  }

  function reopenTable(s, n, now) {
    var t = T(s, n);
    if (!t || t.open) return { error: 'Table is already open' };
    return act(s, 'Reopen Table ' + n, function () {
      t.open = true; t.a = null; t.b = null; t.since = null; t.note = null; t.wseq = 0;
      addLog(s, now, 'open', { table: n }, 'Table ' + n + ' reopened');
      settle(s, now);
      return { ok: true };
    });
  }

  function addTable(s, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    return act(s, 'Add table', function () {
      var n = 1;
      s.tables.forEach(function (t) { if (t.n >= n) n = t.n + 1; });
      s.tables.push({ n: n, open: true, a: null, b: null, since: null, wseq: 0, note: null });
      addLog(s, now, 'open', { table: n }, 'Table ' + n + ' added');
      settle(s, now);
      return { ok: true, table: n };
    });
  }

  function setMode(s, mode, now) {
    if (mode === 'MANUAL') { s.mode = 'MANUAL'; return { ok: true }; }
    if (s.mode === 'AUTO') return { ok: true };
    var snapMode = 'MANUAL';
    return act(s, 'Resume auto-throw', function () {
      s.mode = 'AUTO';
      settle(s, now);
      return { ok: true, prev: snapMode };
    }, true);
  }

  /* ---------- roster changes during play ---------- */
  function lateEntry(s, name, chips, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    name = normName(name);
    if (!name) return { error: 'Enter a name' };
    chips = parseInt(chips, 10);
    if (!(chips >= 1)) return { error: 'Starting chips must be 1 or more' };
    if (nameTaken(s, name)) return { error: '"' + name + '" is already registered. Add a last initial.' };
    return act(s, 'Late entry: ' + name, function () {
      var p = { id: s.nextId++, name: name, S: chips, C: chips, W: 0, reg: s.players.length + 1, status: 'active', lastOpp: null, place: null };
      s.players.push(p);
      s.queue.push(p.id);
      addLog(s, now, 'late', { player: p.id }, name + ' entered late (' + chips + ' chips), added to the bottom of the waitlist');
      settle(s, now);
      return { ok: true, player: p };
    });
  }

  function dropPlayer(s, id, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    var p = P(s, id);
    if (!p || p.status !== 'active') return { error: 'Only active players can be dropped' };
    if (activeCount(s) <= 1) return { error: 'Cannot drop the last player' };
    return act(s, 'Drop ' + p.name, function () {
      removeFromPlay(s, p);
      p.status = 'dropped';
      p.elimAt = now;
      addLog(s, now, 'drop', { player: p.id }, p.name + ' dropped out');
      if (!checkEnd(s, now)) settle(s, now);
      return { ok: true };
    });
  }

  function editPlayer(s, id, patch, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    var p = P(s, id);
    if (!p || p.status !== 'active') return { error: 'Only active players can be edited' };
    var nm = null, S2 = null, C2 = null;
    if (patch.name !== undefined) {
      nm = normName(patch.name);
      if (!nm) return { error: 'Enter a name' };
      if (nameTaken(s, nm, id)) return { error: '"' + nm + '" is already registered' };
    }
    if (patch.S !== undefined) {
      S2 = parseInt(patch.S, 10);
      if (!(S2 >= 1)) return { error: 'Starting chips must be 1 or more' };
    }
    if (patch.C !== undefined) {
      C2 = parseInt(patch.C, 10);
      if (!(C2 >= 0)) return { error: 'Chips remaining must be 0 or more' };
      if (C2 === 0 && activeCount(s) <= 1) return { error: 'Cannot eliminate the last player' };
    }
    return act(s, 'Edit ' + p.name, function () {
      var old = label(p);
      if (nm !== null) p.name = nm;
      if (S2 !== null) p.S = S2;
      if (C2 !== null) p.C = C2;
      if (C2 === 0) {
        eliminate(s, p, now);
        addLog(s, now, 'edit', { player: p.id }, p.name + ' set to 0 chips (eliminated)');
        if (!checkEnd(s, now)) settle(s, now);
      } else {
        addLog(s, now, 'edit', { player: p.id }, 'Edited ' + old + ' to ' + label(p));
      }
      return { ok: true };
    });
  }

  function reinstate(s, id, chips, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    var p = P(s, id);
    if (!p || p.status !== 'eliminated') return { error: 'Only eliminated players can be reinstated' };
    chips = parseInt(chips, 10);
    if (!(chips >= 1)) return { error: 'Chips must be 1 or more' };
    return act(s, 'Reinstate ' + p.name, function () {
      p.status = 'active'; p.C = chips; p.place = null; p.lastOpp = null; p.elimAt = null;
      s.queue.push(p.id);
      addLog(s, now, 'reinstate', { player: p.id }, p.name + ' reinstated with ' + chips + ' chip' + (chips === 1 ? '' : 's') + ', added to the bottom of the waitlist');
      settle(s, now);
      return { ok: true };
    });
  }

  /* ---------- read-only views ---------- */
  function where(s, id) {
    var t = tableOf(s, id);
    if (t) return { kind: 'table', n: t.n, waiting: !(t.a && t.b) };
    var qi = s.queue.indexOf(id);
    if (qi >= 0) return { kind: 'queue', pos: qi + 1 };
    return null;
  }

  /* For a waitlisted player: the waiting winner they cannot yet face again (or null). */
  function heldFrom(s, id) {
    var p = P(s, id);
    if (!p || s.queue.indexOf(id) < 0 || !p.lastOpp) return null;
    var t = tableOf(s, p.lastOpp);
    if (t && tableState(t) === 'waiting' && t.a === p.lastOpp && !canPair(s, id, p.lastOpp)) return p.lastOpp;
    return null;
  }

  function stats(s) {
    var res = s.log.filter(function (e) { return e.type === 'result'; });
    var durs = res.filter(function (e) { return e.start; }).map(function (e) { return e.t - e.start; });
    var avg = durs.length ? durs.reduce(function (a, b) { return a + b; }, 0) / durs.length : null;
    var act1 = s.players.filter(function (p) { return p.status === 'active'; });
    return {
      results: res.length,
      avgMatchMs: avg,
      active: act1.length,
      eliminated: s.players.filter(function (p) { return p.status === 'eliminated'; }).length,
      dropped: s.players.filter(function (p) { return p.status === 'dropped'; }).length,
      chipsInPlay: act1.reduce(function (a, p) { return a + p.C; }, 0),
      openTables: s.tables.filter(function (t) { return t.open; }).length
    };
  }

  /* Rough planning estimate used on the setup screen. */
  function estimateMinutes(totalChips, tables, matchMin) {
    if (!(tables >= 1) || !(totalChips > 0) || !(matchMin > 0)) return null;
    return totalChips * matchMin / tables;
  }

  /* ---------- exports ---------- */
  function dashboardText(s, timeFn) {
    timeFn = timeFn || fmtTime;
    var out = [];
    out.push('🎱 TOURNAMENT DASHBOARD');
    out.push('');
    out.push('Mode: ' + (s.mode === 'AUTO' ? 'AUTO' : 'MANUAL - PAUSED'));
    out.push('');
    if (s.phase === 'finished' && s.champion) out.push('🏆 Champion: ' + P(s, s.champion).name, '');
    out.push('Active Matches');
    var any = false;
    s.tables.forEach(function (t) {
      if (!t.open) return;
      if (t.a && t.b) { any = true; out.push('- Table ' + t.n + ' [' + timeFn(t.since) + ']: ' + label(P(s, t.a)) + ' vs. ' + label(P(s, t.b))); }
      else if (t.a) { any = true; out.push('- Table ' + t.n + ': ' + label(P(s, t.a)) + ' — Waiting for next challenger'); }
      else { any = true; out.push('- Table ' + t.n + ': (empty)'); }
    });
    if (!any) out.push('- (no open tables)');
    out.push('', 'Waitlist Queue (FIFO — Next up at the top)');
    if (!s.queue.length) out.push('(Queue empty — all active players on tables)');
    s.queue.forEach(function (id, i) { out.push((i + 1) + '. ' + label(P(s, id))); });
    out.push('', 'Active Players (Chips Remaining)', '');
    out.push('| Player | Chips Remaining | Wins | Status |', '| :--- | :---: | :---: | :--- |');
    s.players.filter(function (p) { return p.status === 'active'; })
      .sort(function (x, y) { return y.C - x.C || y.W - x.W || x.name.localeCompare(y.name); })
      .forEach(function (p) { out.push('| ' + p.name + ' | ' + p.C + '/' + p.S + ' | ' + p.W + ' | 🟢 Active |'); });
    out.push('', 'Eliminated Players');
    var el = s.players.filter(function (p) { return p.status === 'eliminated'; }).sort(function (x, y) { return x.place - y.place; });
    if (!el.length) out.push('(None yet)');
    el.forEach(function (p) { out.push('- ' + p.name + ' (0/' + p.S + ' chips), finished ' + ordinal(p.place)); });
    var dr = s.players.filter(function (p) { return p.status === 'dropped'; });
    if (dr.length) {
      out.push('', 'Dropped Players');
      dr.forEach(function (p) { out.push('- ' + p.name + ' (' + p.C + '/' + p.S + ' chips)'); });
    }
    return out.join('\n');
  }

  function ordinal(n) {
    var v = n % 100;
    var sfx = (v >= 11 && v <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
    return n + sfx;
  }

  function csvCell(v) {
    v = (v === null || v === undefined) ? '' : String(v);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function csvRows(rows) { return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n') + '\r\n'; }

  function resultsCSV(s) {
    var rows = [['Place', 'Player', 'Starting chips', 'Chips remaining', 'Wins', 'Status']];
    var ranked = s.players.filter(function (p) { return p.place; }).sort(function (a, b) { return a.place - b.place; });
    ranked.forEach(function (p) { rows.push([p.place, p.name, p.S, p.C, p.W, p.place === 1 ? 'Champion' : (p.status === 'eliminated' ? 'Eliminated' : 'Active')]); });
    s.players.filter(function (p) { return !p.place && p.status === 'active'; })
      .sort(function (a, b) { return b.C - a.C || b.W - a.W; })
      .forEach(function (p) { rows.push(['', p.name, p.S, p.C, p.W, 'Active']); });
    s.players.filter(function (p) { return p.status === 'dropped'; })
      .forEach(function (p) { rows.push(['', p.name, p.S, p.C, p.W, 'Dropped']); });
    return csvRows(rows);
  }

  function logCSV(s, timeFn) {
    timeFn = timeFn || fmtTime;
    var rows = [['#', 'Time', 'Event', 'Table', 'Started', 'Minutes', 'Winner', 'Loser', 'Loser chips left', 'Eliminated', 'Details']];
    s.log.forEach(function (e) {
      var isRes = e.type === 'result';
      rows.push([
        e.i, timeFn(e.t), e.type, e.table || '',
        isRes && e.start ? timeFn(e.start) : '',
        isRes && e.start ? (Math.round((e.t - e.start) / 600) / 100).toFixed(2) : '',
        isRes ? P(s, e.winner).name : '', isRes ? P(s, e.loser).name : '',
        isRes ? e.loserC : '', isRes ? (e.elim ? 'yes' : '') : '', e.text
      ]);
    });
    return csvRows(rows);
  }

  /* ---------- persistence ---------- */
  function serialize(s) { return JSON.stringify(s); }
  function deserialize(str) {
    var o = JSON.parse(str);
    if (!o || o.v !== VERSION || !Array.isArray(o.players) || !Array.isArray(o.tables) || !Array.isArray(o.queue) || !Array.isArray(o.log)) throw new Error('Not a valid tournament file');
    if (!Array.isArray(o.undo)) o.undo = [];
    return o;
  }

  return {
    VERSION: VERSION,
    newState: newState,
    addPlayer: addPlayer, removePlayer: removePlayer, editRegistered: editRegistered,
    startTournament: startTournament,
    reportResult: reportResult,
    pendingConsolidation: pendingConsolidation, consolidate: consolidate,
    throwMatch: throwMatch, closeTable: closeTable, reopenTable: reopenTable, addTable: addTable,
    setMode: setMode,
    lateEntry: lateEntry, dropPlayer: dropPlayer, editPlayer: editPlayer, reinstate: reinstate,
    undo: undo, undoLabel: undoLabel,
    canPair: canPair, activeCount: activeCount, tableOf: tableOf, tableState: tableState, waitingTables: waitingTables,
    where: where, heldFrom: heldFrom, stats: stats, estimateMinutes: estimateMinutes,
    P: P, T: T, label: label, fmtTime: fmtTime, ordinal: ordinal, normName: normName,
    dashboardText: dashboardText, resultsCSV: resultsCSV, logCSV: logCSV,
    serialize: serialize, deserialize: deserialize
  };
});

<script>
/* Chip tournament director: interface. Talks to ChipEngine; keeps everything in this browser (localStorage + backup files). */
(function () {
  'use strict';
  var E = window.ChipEngine;
  var KEY = 'chipTourney.v1';
  var app = document.getElementById('app');
  var modalRoot = document.getElementById('modal-root');
  var toastRoot = document.getElementById('toast-root');
  var fileInput = document.getElementById('file-input');

  var ui = { tab: 'tables', modal: null, lastFocus: null, tablesTouched: false, draftName: '', consDismissed: null, flips: {}, saveOK: true, toastTimer: null, batchText: '' };

  /* ---------- storage ---------- */
  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? E.deserialize(raw) : null; }
    catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, E.serialize(S)); ui.saveOK = true; }
    catch (e) {
      try { S.undo = S.undo.slice(-30); localStorage.setItem(KEY, E.serialize(S)); ui.saveOK = true; }
      catch (e2) { ui.saveOK = false; }
    }
  }
  var S = load() || E.newState();
  if (S.phase !== 'registration') ui.tablesTouched = true;
  try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); } catch (e) { ui.saveOK = false; }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  /* Player names are always shown in capitals so they read from across the room. Files you download and the copied dashboard text keep names as typed. */
  function dn(s) { return String(s).toUpperCase(); }
  var capKey = null, capRe = null;
  function capNames(text) {
    /* capitalise any player name that appears inside a sentence the engine wrote (log lines, undo labels, notes) */
    var names = S.players.map(function (p) { return p.name; }).filter(function (n) { return n && n.toUpperCase() !== n; });
    var key = names.join('\u0001');
    if (key !== capKey) {
      capKey = key;
      names.sort(function (a, b) { return b.length - a.length; });
      try {
        capRe = names.length ? new RegExp('(^|[^\\p{L}\\p{N}])(' + names.map(function (n) { return n.replace(/[.*+?^${}()|[\]\\\/-]/g, '\\$&'); }).join('|') + ')(?![\\p{L}\\p{N}])', 'gu') : null;
      } catch (e) { capRe = null; }
    }
    var t = String(text);
    return capRe ? t.replace(capRe, function (m, pre, nm) { return pre + nm.toUpperCase(); }) : t;
  }
  function now() { return Date.now(); }
  function P(id) { return E.P(S, id); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function rand() {
    if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
    return Math.random();
  }
  function fmtDur(min) {
    min = Math.round(min);
    if (min < 60) return min + ' min';
    var h = Math.floor(min / 60), m = min % 60;
    return h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function elapsed(since) { return Math.max(0, Math.floor((now() - since) / 60000)) + ' min'; }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function suggestedTables() {
    var n = S.players.length;
    return clamp(Math.round(n / 5), 1, Math.max(1, Math.floor(n / 2)));
  }
  function plannedTables() {
    var cap = Math.max(1, Math.floor(S.players.length / 2));
    return ui.tablesTouched ? clamp(S.plannedTables, 1, Math.max(cap, S.plannedTables)) : suggestedTables();
  }

  function chipsHTML(p) {
    var total = Math.max(p.S, p.C);
    if (total > 10) return '';
    var h = '<span aria-hidden="true">';
    for (var i = 0; i < total; i++) h += '<i class="chip ' + (i < p.C ? 'on' : 'off') + '"></i>';
    return h + '</span>';
  }
  function whereText(id) {
    var w = E.where(S, id);
    if (!w) return '';
    if (w.kind === 'table') return (w.waiting ? 'Waiting at Table ' : 'On Table ') + w.n;
    return 'Waitlist #' + w.pos;
  }

  /* ---------- commit / render ---------- */
  function commit() { save(); render(); }

  function render() {
    var active = document.activeElement, keepId = active && active.id, selStart = null, selEnd = null;
    try { if (active && active.selectionStart !== undefined) { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) { /* number inputs */ }
    var html = headerHTML() + '<main class="wrap">' + (ui.saveOK ? '' : '<div class="banner info">This browser is not saving automatically. Use Menu, then Export backup, so you do not lose the tournament.</div>');
    if (S.phase === 'registration') html += regHTML(); else html += activeHTML();
    html += '</main>';
    app.innerHTML = html;
    if (keepId) {
      var el = document.getElementById(keepId);
      if (el && !ui.modal) { el.focus(); try { if (selStart !== null) el.setSelectionRange(selStart, selEnd); } catch (e) { /* ignore */ } }
    }
    layout();
  }

  /* ---------- wide-screen (TV) layout ----------
     On a screen at least 1280px wide, the Tables tab becomes a narrow strip of tables on the left and a big, multi-column waitlist on the right.
     The CSS (html.tv) does the styling; this code picks the largest sizes that fit the screen. Narrower screens keep the compact layout. */
  var TV_MIN_W = 1280, TV_PAD = 22, LONG_NAME = 22, FONT_FACE = '"Atkinson Hyperlegible Next"';
  var rootEl = document.documentElement, fontsLoaded = !(document.fonts && document.fonts.load), fontsLoading = false, resizeTimer = null;

  function wantTV() { return window.innerWidth >= TV_MIN_W && S.phase === 'active' && ui.tab === 'tables'; }
  function r3(v) { return Math.round(v * 1000) / 1000; }
  /* the largest value in [lo, hi] (in steps) for which ok(v) holds; smaller values are assumed to fit whenever larger ones do */
  function largest(lo, hi, step, ok) {
    var a = 0, b = Math.round((hi - lo) / step), best = -1;
    while (a <= b) { var m = (a + b) >> 1; if (ok(r3(lo + m * step))) { best = m; a = m + 1; } else b = m - 1; }
    return best < 0 ? null : r3(lo + best * step);
  }
  function overflowX(list) {
    for (var i = 0; i < list.length; i++) if (list[i].scrollWidth > list[i].clientWidth + 1) return true;
    return false;
  }

  function fitTables() {
    var board = app.querySelector('.board'), tables = board && board.querySelector('.tables');
    if (!tables || !tables.children.length) return;
    var section = tables.parentNode, chipBoxes = tables.querySelectorAll('.pchips'), avail = window.innerHeight - TV_PAD;
    /* a size fits when every table (and the Closed row under them) is on screen with full-size chips, and the smallest allowed chips still fit sideways */
    function fits(ts) {
      tables.style.setProperty('--ts', ts + 'rem');
      tables.style.setProperty('--chip', 'calc(var(--ts) * .46)');
      if (section.getBoundingClientRect().bottom + window.pageYOffset > avail) return false;
      tables.style.setProperty('--chip', 'calc(var(--ts) * .4)');
      return !overflowX(chipBoxes);
    }
    board.classList.remove('tcols2');
    var ts = largest(1.2, 4.2, 0.1, fits);
    if (ts === null) { board.classList.add('tcols2'); ts = largest(1.2, 4.2, 0.1, fits); }   /* only when even the smallest size cannot fit in one column */
    if (ts === null) ts = 1.2;
    tables.style.setProperty('--ts', ts + 'rem');
    /* one chip size for every table: as large as the tightest seat allows */
    var f = 0.46;
    for (; f >= 0.3; f = r3(f - 0.02)) {
      tables.style.setProperty('--chip', 'calc(var(--ts) * ' + f + ')');
      if (!overflowX(chipBoxes)) break;
    }
    /* each name takes the largest size that fits its own seat; if even the smallest size is too long it ends in an ellipsis (the full name is in the label) */
    var names = tables.querySelectorAll('.pname');
    for (var i = 0; i < names.length; i++) fitName(names[i], ts, 1, 'cut');
  }

  /* shrink one name until it fits on a single line; `onFail` is the class to add if it still does not fit at the smallest size */
  function fitName(e, start, min, onFail) {
    var k = start;
    e.classList.remove('cut', 'wrap');
    e.style.setProperty('--nf', k + 'rem');
    if (e.scrollWidth <= e.clientWidth + 1) return;
    k = Math.max(min, r3(k * e.clientWidth / e.scrollWidth - 0.01));
    e.style.setProperty('--nf', k + 'rem');
    for (var g = 0; g < 60 && k > min && e.scrollWidth > e.clientWidth + 1; g++) { k = Math.max(min, r3(k - 0.02)); e.style.setProperty('--nf', k + 'rem'); }
    if (e.scrollWidth > e.clientWidth + 1) e.classList.add(onFail);
  }
  /* compact layout (phones, tablets): the same idea, and a name that still cannot fit on one line is allowed to wrap */
  function fitCompactNames() {
    var names = app.querySelectorAll('.tables .pname');
    for (var i = 0; i < names.length; i++) fitName(names[i], 1.6, 1.05, 'wrap');
  }

  function fitWaitlist() {
    var ol = app.querySelector('.waitlist ol');
    if (!ol) return;
    var n = ol.children.length, all = ol.querySelectorAll('.who b'), bs = [], best = null;
    /* one absurdly long name must not shrink the whole list: sizes are chosen for ordinary names, long ones are shrunk on their own below */
    for (var j = 0; j < all.length; j++) if (all[j].firstChild.textContent.length <= LONG_NAME) bs.push(all[j]);
    var avail = window.innerHeight - TV_PAD - (ol.getBoundingClientRect().top + window.pageYOffset);
    /* try 2, 3 and 4 columns (filled top to bottom); keep the one that allows the largest names */
    [2, 3, 4].forEach(function (cols) {
      var rows = Math.ceil(n / cols);
      ol.style.setProperty('--cols', cols); ol.style.setProperty('--rows', rows);
      var sz = largest(1.4, 5.2, 0.1, function (v) { ol.style.setProperty('--wl', v + 'rem'); return ol.scrollHeight <= avail && !overflowX(bs); });
      if (sz !== null && (!best || sz > best.s + 1e-9)) best = { cols: cols, rows: rows, s: sz };
    });
    if (!best) best = { cols: 4, rows: Math.ceil(n / 4), s: 1.4 };
    ol.style.setProperty('--cols', best.cols); ol.style.setProperty('--rows', best.rows); ol.style.setProperty('--wl', best.s + 'rem');
    for (var q = 0; q < all.length; q++) {
      var b = all[q];
      if (b.scrollWidth > b.clientWidth + 1) {
        b.style.fontSize = Math.max(0.5, r3(b.clientWidth / b.scrollWidth - 0.03)) + 'em';
        if (b.scrollWidth > b.clientWidth + 1) b.classList.add('cut');
      }
    }
  }

  function layout() {
    var tv = wantTV();
    rootEl.classList.toggle('tv', tv);
    if (!tv) { fitCompactNames(); return; }
    if (!fontsLoaded && !fontsLoading) {     /* measure again once the embedded font is ready, or the sizes would be picked for a fallback font */
      fontsLoading = true;
      var done = function () { fontsLoaded = true; fontsLoading = false; layout(); };
      try { Promise.all(['400', '700', '800'].map(function (w) { return document.fonts.load(w + ' 20px ' + FONT_FACE); })).then(done, done); } catch (e) { done(); }
    }
    fitTables();
    fitWaitlist();
  }
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 120); });

  /* ---------- header ---------- */
  function headerHTML() {
    var h = '<header class="rail-bar"><div class="brand"><span class="ball8" aria-hidden="true"></span><span class="brand-t">Chip tournament</span></div><div class="bar-actions">';
    if (S.phase === 'active') {
      var auto = S.mode === 'AUTO';

    }

    }
    h += '<button class="btn small on-rail" data-act="menu">Menu</button></div></header>';
    return h;
  }

  /* ---------- registration screen ---------- */
  function regHTML() {
    var n = S.players.length, tables = plannedTables();
    var h = '<div class="reg"><section><h1 class="hero">Who is playing?</h1>';

      '<div class="field"><span class="lbl">Starting chips</span><div class="stepper"><button type="button" data-act="def-dec" aria-label="One fewer chip">&minus;</button><output>' + S.defaultChips + '</output><button type="button" data-act="def-inc" aria-label="One more chip">+</button></div></div>' +
      '<button class="btn primary big" type="submit">Add player</button></form>';
    h += '<button class="btn small" data-act="batch-open">Paste a list of names</button>';
    h += '<ol class="roster" aria-label="Registered players">';
    S.players.forEach(function (p, i) {
      h += '<li><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(dn(p.name)) + '</span>' +

  }

  /* ---------- active / finished screens ---------- */
  function activeHTML() {
    var h = '';

    h += statsHTML();
    var pc = E.pendingConsolidation(S);
    if (pc && S.phase === 'active') {
      h += '<div class="banner"><span>Table ' + pc.tables[0] + ' and Table ' + pc.tables[1] + ' each have a winner waiting and no one left to challenge them.</span><button class="btn" data-act="consol-open" style="border-color:#2a1d00">Consolidate tables</button></div>';
    }

      var k = s.split(':');

    else h += logHTML();

  }

  function statsHTML() {
    var st = E.stats(S);
    var h = '<div class="stats"><span><b>' + st.active + '</b>of ' + S.players.length + ' players left</span><span><b>' + st.chipsInPlay + '</b>' + (st.chipsInPlay === 1 ? 'chip' : 'chips') + ' in play</span><span><b>' + st.results + '</b>' + (st.results === 1 ? 'result' : 'results') + '</span>';

  }

  function champHTML() {
    var c = P(S.champion);
    var h = '<section class="champ"><div class="trophy" aria-hidden="true">🏆</div><div class="sub">Champion</div><div class="nm">' + esc(dn(c.name)) + '</div>' +
      '<div class="sub">' + plural(c.W, 'win') + ' and ' + plural(c.C, 'chip') + ' left of ' + c.S + '</div>' +
      '<div class="row-actions"><button class="btn primary" data-act="csv-results">Download results</button><button class="btn" data-act="copy-text">Copy dashboard text</button><button class="btn" data-act="newc-open">Start over</button></div></section>';

  }

  /* Tapping a player's name on a running match records that player as the winner. Chips are display only. */
  function seat(p, withWon) {
    var nm = withWon
      ? '<button class="pname won" data-act="won" data-id="' + p.id + '" aria-label="' + esc(p.name) + ' won" title="Tap when ' + esc(dn(p.name)) + ' wins">' + esc(dn(p.name)) + '</button>'

  }

  function tableCard(t) {
    var st = E.tableState(t), meta, felt;
    if (st === 'match') {

      }

  }

  function finalHTML() {
    var ranked = S.players.filter(function (p) { return p.place; }).sort(function (a, b) { return a.place - b.place; });
    var h = '<section class="block"><h2 class="section-title">Final standings <span class="count">' + ranked.length + '</span></h2><ul class="log">';
    ranked.forEach(function (p) {

  function boardHTML() {
    var open = S.tables.filter(function (t) { return t.open; });

    if (S.phase === 'finished') h += '<p class="muted">The tournament is over. Use Undo if the last result was a mistake.</p>';

          '<span class="pchips">' + chipsHTML(p) + '<span class="frac">(' + p.C + '/' + p.S + ')</span></span>' +

  function logHTML() {

  /* ---------- toast ---------- */
  function toast(msg, o) {
    o = o || {};

    ui.toastTimer = setTimeout(function () { toastRoot.innerHTML = ''; }, o.undo ? 7000 : 5000);

  /* ---------- modals ---------- */
  function shell(title, body, actions) {
    return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><h2 id="mtitle">' + title + '</h2>' + body + (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div></div>';
  }
  var CANCEL = '<button type="button" class="btn" data-act="m-close">Cancel</button>';

  function openModal(m) {

  }
  function closeModal() {
    ui.modal = null; modalRoot.innerHTML = '';

    ui.lastFocus = null;
  }

  function poolFor(tableN) {
    var out = [];
    S.queue.forEach(function (id) { out.push({ id: id, from: 'Waitlist #' + (S.queue.indexOf(id) + 1) }); });
    E.waitingTables(S).forEach(function (t) { if (t.n !== tableN) out.push({ id: t.a, from: 'Winner waiting at Table ' + t.n }); });
    return out;
  }

  function renderModal() {

        }).join('');
        h = shell('Shuffled draw order', '<p class="muted">Seated in this order: players 1 and 2 on Table 1, 3 and 4 on Table 2, and so on. The rest wait in line.</p><ol class="draw">' + items + '</ol>',

      case 'batch':

      case 'late':
        h = shell('Add a late entrant',
