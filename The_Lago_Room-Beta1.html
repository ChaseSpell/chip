        let why = '';
        if (info.kind === 'one' && info.made) why = A5 ? mk(' SS2: a pat eight is a weak hand in A-5 — break it and draw to a six.') : ' Notes: a pat 9-5-4-3-2 type hand is broken — opened as a one-card draw.';
        if (info.kind === 'pat' && !inR && info.patScore < 84) why = A5 ? mk(' SS2: keep and play pat sevens or better; a pat eight is weak.') : ' MMG: ' + (pos === 'LJ' || pos === 'HJ' ? 'from early position open only pat eights or better.' : 'this pat hand is too rough.');
        if (inR) {
          const late = (pos === 'CO' || pos === 'BTN');
          const bookTxt = A5 ? (pos === 'BTN' && info.kind === 'three' ? mk(' SS2: draw three only to steal from the button (or from the blinds) — and only with A-2, A-3 or 2-3.')
            : info.kind === 'two' && info.score >= 83 ? mk(' SS2: A-2-3, A-2-4, A-3-4 and 2-3-4 play for any number of bets — draw from the bottom up.')
              : info.kind === 'pat' ? mk(' SS2: play a pat seven or better aggressively — make the drawers pay full price.') : '')
            : pos === 'BTN' && info.kind === 'three' ? ' MMG: the button adds three-card draws — a deuce with any card to an 8, 3-4 and 4-5.'
            : pos === 'CO' && info.kind === 'two' && !inRange(info, 'LJ', 0) ? ' MMG: the cutoff adds two-card draws like 8-5-2, 8-6-2, 8-7-2, 8-4-3, 8-5-3 and 8-6-3.'
              : (pos === 'LJ' || pos === 'HJ') && info.score < 78 && info.kind !== 'pat' ? ' MMG: the early-position range includes 8-3-2 / 8-4-2 / 7-6-2 two-card draws and rough one-card eights like 8-6-4-3 and 8-5-4-3.' : '';
          return act('raise', 'First in from ' + pos + ' with ' + d + ' (in the ' + pos + ' opening range).' + why + bookTxt + aNote, late ? 'steal' : '');
        }
        const sw = stealWiden(game, p, pos);
        if (sw.pts && inRange(info, pos, s - sw.pts)) return act('raise', 'Steal from the ' + pos + ' with ' + d + '.' + sw.note, 'steal');
        return act('fold', 'Fold ' + d + ' from ' + pos + ' — outside the first-raise-in range.' + why + aNote);
      }
      // limpers in front
      const isoPos = pos === 'BB' ? 'SB' : pos;
      if (inRange(info, isoPos, anteShift(game, isoPos, openRef(isoPos))) || agg) return act('raise', 'Raise to isolate the limper(s) with ' + d + '.', 'value');
      if ((pos === 'CO' || pos === 'BTN' || pos === 'SB') && sc >= 64) return act('call', 'Over-limp with ' + d + ' to see a cheap draw in position.');
      return act('fold', 'Fold ' + d + ' behind a limper.');
    }

    // ---------- facing a single raise ----------
    if (lvl === 2) {
      const lateOpener = ['CO', 'BTN', 'SB'].includes(c.openerPos);
      if (pos === 'BB') {
        // ToP ch. 4: big blind defence follows the ante structure too (the openers' ranges and the price both move)
        if (c.openerPos === 'SB' && c.opps === 1) {
          const s48 = anteShift(game, 'BB', 48);
          if (agg && opts.canRaise) return act('raise', 'Blind vs blind with ' + d + ': 3-bet — one-card draws are always raised.', 'value');
          if (sc >= 48 + s48) return act('call', 'BB vs SB heads-up with ' + d + '. Notes: call one more bet with anything remotely playable (even a 3-card draw to 3-4) — position plus 3-to-1 odds.' + (sc < 48 ? anteNote(game, 'BB', s48) : ''));
          return act('fold', 'BB vs SB: ' + d + ' is not even remotely playable.' + (sc >= 48 ? anteNote(game, 'BB', s48) : ''));
        }
        // MMG: from the blinds, flat-call two-card draws and 3-bet one-card draws (and pat hands) — the draw
        // announces the hand, and a flat-called one-card draw tells him it is a weak one
        const oneOrPat = (info.kind === 'one' && mem.flexAgg !== false) || info.kind === 'pat';
        // MMG: closing the action for one bet (3.5-to-1 or better), play every hand you would open from the
        // button; ToP ch. 4: that range follows the ante structure
        const sB = anteShift(game, 'BB', openRef('BTN'));
        const inBB = inRange(info, 'BTN', sB), inBBStd = inRange(info, 'BTN', 0);
        const bbNote = inBB !== inBBStd ? anteNote(game, 'BB', sB) : '';
        if ((agg || (oneOrPat && inBB)) && opts.canRaise) return act('raise', 'BB with ' + d + ': 3-bet. ' + (agg ? aggWhy : 'MMG: from the blinds, 3-bet the one-card draws and pat hands you play rather than flat-calling them.') + bbNote, 'value');
        // SS2: with a really strong draw in the BB against a late-position raiser, punish him by reraising — kept
        // as a minority play: MMG and the notes mostly flat two-card draws (ToP ch. 4: more often with big antes)
        if (lateOpener && c.opps === 1 && info.kind === 'two' && info.hasDeuce && sc >= 83 && opts.canRaise && R() < Math.min(0.9, 0.25 * anteRaiseF(game))) {
          return act('raise', 'BB with ' + d + ' vs a ' + c.openerPos + ' steal: 3-bet (mixed). SS2: a strong deuce draw in the big blind can make a late-position stealer pay; MMG and the notes mostly flat-call two-card draws, so this is the minority line.', 'value');
        }
        if (inBB) {
          let why;
          if (info.kind === 'three') why = 'Notes: it is usually correct to draw three out of the BB as long as it costs only one more bet. MMG: closing the action for one bet, play every hand you would open from the button.';
          else if (sc < 75 && !info.hasDeuce) why = 'Notes: in the BB add some 8-draws (3-4-8, 3-5-8) and the sevens without a deuce (3-4-7, 3-5-7, 3-6-7, 4-5-7) — get to the draw cheaply; calling one raise is fine.';
          else if (sc < 75) why = 'Notes: you can defend the blind with 2-card draws with an 8 (2-3-8, 2-4-8).';
          else why = flatWhy;
          return act('call', 'Defend the BB with ' + d + '. ' + why + bbNote);
        }
        return act('fold', 'BB: ' + d + ' is too weak to defend even for one bet (MMG: the BB defends the button opening range).' + bbNote);
      }
      if (pos === 'SB') {
        // MMG: facing one raise from the small blind, play the under-the-gun range (here: the LJ range) — worst
        // position all hand, not closing the action, a worse price than the big blind
        const sL = anteShift(game, 'LJ', openRef('LJ'));
        const inSB = inRange(info, 'LJ', sL);
        const oneOrPat = (info.kind === 'one' && mem.flexAgg !== false) || info.kind === 'pat';
        if ((agg || (oneOrPat && inSB)) && opts.canRaise) return act('raise', 'SB vs ' + c.openerPos + ' open with ' + d + ': 3-bet. ' + (agg ? aggWhy : 'MMG: 3-bet the one-card draws and pat hands you play from the blinds.'), 'value');
        if (inSB) {
          // MMG: against a very loose opener (three-card draws, 7-6-5 type two-card draws) 3-bet wider from the SB
          // to push the equity edge and fold out the big blind
          const op = c.opener >= 0 ? game.players[c.opener] : null;
          const looseOpener = op && op.isHuman && op.stats.hands >= 20 && op.stats.pfr / op.stats.hands > 0.3;
          if (looseOpener && opts.canRaise) return act('raise', 'SB with ' + d + ' vs a loose opener: 3-bet. MMG: when the opener raises lots of weak draws, 3-bet wider from the small blind to push your equity and drive out the big blind.', 'isolate');
          if (info.kind === 'two' && sc >= 86 && R() < 0.35 * anteRaiseF(game) && opts.canRaise) return act('raise', 'SB with ' + d + ': 3-bet to isolate — out of position you want to be drawing to the nuts, and this is one of the best two-card draws.', 'balance');
          return act('call', 'SB with ' + d + ': call. MMG: from the small blind defend the under-the-gun (LJ) range, flat-calling two-card draws.' + (mem.flexAgg === false ? ' ' + flatWhy : ''));
        }
        return act('fold', 'SB vs open with ' + d + '. MMG: from the small blind play only the under-the-gun (LJ) range — the worst position all hand and not closing the action.');
      }
      // MMG: facing a raise, 3-bet every one-card draw you play (never flat one — it tells him it is weak);
      // exception: on the button with a weak player in the blinds, flat some to let him in behind you
      const oneCard = info.kind === 'one' && mem.flexAgg !== false;
      const weakBlind = pos === 'BTN' && game.players.some((q) => q.isHuman && !q.folded && q !== p && ['SB', 'BB'].includes(game.posName(q.seat)) && isCallingStation(game, q));
      if (agg && opts.canRaise) {
        if (weakBlind && oneCard && R() < 0.35) return act('call', 'Flat-call the ' + c.openerPos + ' open with ' + d + ' on the button. MMG: with a weak player in the blinds, flat some strong hands to let him in — he has to act first all hand.', 'trap');
        return act('raise', '3-bet vs ' + c.openerPos + ' open with ' + d + '. ' + aggWhy, 'value');
      }
      if (sc >= 83) {
        // SS2 reraises premium two-card draws to isolate; MMG and the notes mostly flat them (a small edge,
        // a bloated pot, more variance) — so isolation 3-bets stay a minority play (user's choice, 2026-11-18)
        const isoFreq = Math.min(0.95, (info.kind !== 'two' ? 0 : pos === 'BTN' ? (sc >= 86 ? 0.25 : 0.15) : (c.callers === 0 ? 0.22 : 0.08)) * anteRaiseF(game));
        if (opts.canRaise && R() < isoFreq) {
          return act('raise', '3-bet the ' + c.openerPos + ' open with ' + d + ' to isolate (mixed). ' + (pos === 'BTN'
            ? 'SS2: on the button, 3-bet to play the pot heads-up with position — kept as the minority line, since MMG and the notes mostly flat two-card draws.'
            : 'SS2: in position, reraise premium two-card draws to isolate one player (mixed with your notes\' flat-calling for balance).'), 'isolate');
        }
        if (oneCard && opts.canRaise) return act('raise', '3-bet vs ' + c.openerPos + ' open with ' + d + '. MMG and the notes: raise every one-card draw you play.', 'value');
        return act('call', 'Call the ' + c.openerPos + ' open with ' + d + '. ' + flatWhy);
      }
      if (sc >= 75) {
        const pc = pos === 'BTN' ? 0.45 : lateOpener ? 0.6 : 0.3;
        if (R() < pc) {
          if (oneCard && opts.canRaise) return act('raise', '3-bet vs ' + c.openerPos + ' open with ' + d + '. MMG and the notes: never flat-call a one-card draw — raise the ones you play.', 'value');
          return act('call', 'Call with ' + d + '. Notes: 2-3-6 / 2-4-6 / 2-5-6 / 2-6-7 — be more likely to call on the button and/or when the opener is in late position.');
        }
        return act('fold', 'Fold ' + d + ' to the raise. Notes: consider folding 2-3-6 / 2-4-6 / 2-5-6 / 2-6-7 to a single raise.');
      }
      if (sc >= 64 && info.hasDeuce && pos === 'BTN' && lateOpener && R() < 0.3) return act('call', 'Call with ' + d + ' on the button vs a late opener (mixed). Notes: be more likely to call with the button and a late-position opener.');
      if (sc >= 64) return act('fold', 'Fold ' + d + '. Notes: strongly consider folding 2-x-8 draws to a single raise if you are not in the blinds.');
      return act('fold', 'Fold ' + d + ' facing a raise.');
    }

    // ---------- facing a 3-bet ----------
    if (lvl === 3) {
      const alreadyIn = p.roundBet >= 2 * game.stakes.small;
      if (agg && opts.canRaise) return act('raise', 'Cap it with ' + d + '. ' + aggWhy, 'value');
      const md = alreadyIn ? predrawMdf(game, p, opts, c) : null;
      // MMG: facing a 3-bet, cap or fold a pat hand — flat-calling turns it face up. A pat nine is a fold, except
      // blind against blind or button against a blind (MDF can also keep it, as a cap)
      if (info.kind === 'pat' && !agg) {
        const bvb = c.opps === 1 && ((pos === 'SB' || pos === 'BB') && ['SB', 'BB'].includes(game.posName(c.lastRaiser)) || (pos === 'BTN' && ['SB', 'BB'].includes(game.posName(c.lastRaiser))));
        if (bvb || (md && md.defend)) {
          const why = bvb ? 'MMG: a pat nine is playable blind against blind or button against a blind — and pat hands are capped, never flat-called.' : predrawMdfHead(md, '3-bet', 'opened with from ' + pos) + ' MMG: pat hands are capped, never flat-called.';
          return opts.canRaise ? act('raise', 'Cap it with ' + d + '. ' + why, 'value') : act('call', 'Call with ' + d + '. ' + why, 'value');
        }
        return act('fold', 'Fold ' + d + ' facing the 3-bet. MMG: cap or fold pat hands; a pat nine is an underdog three-way and folds here.' + (md ? ' ' + predrawMdfHead(md, '3-bet', 'opened with from ' + pos) + ' This hand is among the weakest of them — the part MDF lets me fold.' : ''));
      }
      if (sc >= 83 || (agg && !opts.canRaise)) return act('call', 'Call the 3-bet with ' + d + '. Notes: the premium two-card draws are playable for any amount of bets.');
      // MDF (the user's MDF notes): heads-up, the opener re-raised must defend his opening range
      if (md && md.defend) return act('call', 'Call the 3-bet with ' + d + '. ' + predrawMdfHead(md, '3-bet', 'opened with from ' + pos) + ' ' + d + ' is not among the weakest of them, so it defends (heads-up after opening, the notes\' 3-bet folds apply only to the weakest opens).', 'mdf');
      const r = (() => {
        if (alreadyIn && sc >= 75) {
          if (R() < 0.55) return act('call', 'Call one more bet with ' + d + ' (mixed) — already invested, good price.');
          return act('fold', 'Fold ' + d + ' facing the 3-bet. Notes: strongly consider folding 2-x-6 draws facing a 3-bet.');
        }
        if (pos === 'BB' && !alreadyIn) return act('fold', 'Fold ' + d + '. Notes: with rough draws, calling one raise is fine; calling two raises is suicide.');
        if (sc >= 64 && sc < 75) return act('fold', 'Fold ' + d + '. Notes: fold the 2-x-8 draws facing a 3-bet.');
        return act('fold', 'Fold ' + d + ' facing a 3-bet.');
      })();
      return md && r.type === 'fold' ? act('fold', r.reason + ' ' + predrawMdfHead(md, '3-bet', 'opened with from ' + pos) + ' This hand is among the weakest of them — the part MDF lets me fold.', r.tag) : r;
    }

    // ---------- capped (or heads-up beyond the cap) ----------
    if (opts.canRaise && c.opps === 1 && sc >= 97 && lvl < 6) return act('raise', 'Heads-up (no cap) with ' + d + ': keep raising with the nuts-type holding.', 'value');
    // MMG: facing a cap without having raised yourself, play only one-card wheel (seven) draws and good pat eights
    if (p.roundBet < 2 * game.stakes.small) {
      const maxR = info.kind === 'one' ? Math.max(...TD.maskRanksAsc(info.mask)) : 0;
      if (maxR >= 8) return act('fold', 'Fold ' + d + ' to the cap. MMG: facing a cap, play one-card seven draws and good pat eights only — an eight draw may be drawing thin or dead.');
      if (info.kind === 'pat' && info.patScore < 93) return act('fold', 'Fold ' + d + ' to the cap. MMG: facing a cap, only good pat eights (8-6 or better) and one-card seven draws continue.');
    }
    if (agg || sc >= 83) return act('call', 'Call the cap with ' + d + '.');
    if (p.roundBet >= 3 * game.stakes.small && sc >= 75) return act('call', 'Call the last bet with ' + d + ' — pot odds after investing three bets.');
    const mdCap = predrawMdf(game, p, opts, c);
    if (mdCap && mdCap.defend) return act('call', 'Call with ' + d + '. ' + predrawMdfHead(mdCap, 're-raise', 'raised with') + ' ' + d + ' is not among the weakest of them, so it defends.', 'mdf');
    return act('fold', 'Fold ' + d + ' to the cap.' + (mdCap ? ' ' + predrawMdfHead(mdCap, 're-raise', 'raised with') + ' This hand is among the weakest of them — the part MDF lets me fold.' : ''));
  }

  /* Pre-draw MDF: heads-up, a player whose raise was re-raised (the opener facing a 3-bet, the 3-bettor
     facing a 4-bet) must keep defending at least MDF of the range he raised with — and more, since all
     three draws are still to come. Cold-calling a 3-bet and multiway pots stay with the notes. */
  function predrawMdf(game, p, opts, c) {
    if (c.opps !== 1 || opts.toCall <= 0) return null;
    const last = lastAgg(game, 0);
    if (!last || last.seat === p.seat) return null;
    if (!game.actions.some((a) => a.street === 0 && a.seat === p.seat && (a.type === 'raise' || a.type === 'bet'))) return null;
    const risk = last.amount > 0 ? last.amount : opts.toCall;
    const foldMdf = clamp(risk / opts.pot, 0, 1);
    const foldMax = foldMdf * MDF_FOLD_KEEP[2];
    return { risk, reward: opts.pot - risk, foldMdf, foldMax, defend: predrawShareAbove(game, p) < 1 - foldMax };
  }
  function predrawMdfHead(md, word, rangeTxt) {
    return 'MDF applies to every raise: his ' + word + ' risks ' + money(md.risk) + ' to win ' + money(md.reward) + ', so I can fold no more than ' +
      pct1(md.foldMdf) + ' of the hands I ' + rangeTxt + '; with all three draws to come he can still draw out, so I defend more than that.';
  }
  // share of the range I raised with pre-draw (as the opponent's range model sees it) that is stronger than my hand
  function predrawShareAbove(game, p) {
    if (EQ_CACHE && 'selfPre' in EQ_CACHE) return EQ_CACHE.selfPre;
    const pk = predrawKey(game, p);
    const model = { key: pk.key, pos: pk.pos, human: false, ante: anteModel(game, pk.pos) };
    const mine = TD.predrawScoreFast(p.hand);
    const all = [];
    for (let i = 0; i < 52; i++) all.push(i);
    const pool = new Pool(all);
    let above = 0, total = 0;
    for (let it = 0; it < 3000; it++) {
      pool.reset();
      const h = [pool.draw(), pool.draw(), pool.draw(), pool.draw(), pool.draw()];
      const s = TD.predrawScoreFast(h);
      const w = rangeAccept(s, model);
      total += w;
      if (s > mine) above += w; else if (s === mine) above += w / 2;
    }
    const v = total ? above / total : 0;
    if (EQ_CACHE) EQ_CACHE.selfPre = v;
    return v;
  }

  /* ---------------- draw decisions ---------------- */
  function candidates(hand, d) {
    const D = TD.rankMaskOf(hand);
    const out = [];
    if (POP[D] === 5 && TD.isMadeLow(hand)) out.push({ n: 0, keep: hand.slice(), val: TD.PATV[d - 1][D], kind: 'pat' });
    for (let k = 4; k >= 0; k--) {
      if (k > POP[D]) continue;
      const r = TD.bestOfSize(D, k, d);
      if (r.mask < 0) continue;
      const keep = TD.cardsForMask(hand, r.mask);
      let v = r.val;
      if (!A5 && k === 4 && keep.every((c) => TD.suitOf(c) === TD.suitOf(keep[0]))) v *= 0.85; // flush risk (2-7 only)
      out.push({ n: 5 - k, keep, val: v, kind: 'draw', mask: r.mask });
    }
    return out.sort((a, b) => b.val - a.val);
  }

  function keepIdx(hand, keep) {
    const disc = [];
    hand.forEach((c, i) => { if (!keep.includes(c)) disc.push(i); });
    return disc;
  }

  function decideDraw(game, p) {
    const k = game.drawRound, d = 3 - k;
    const hand = p.hand, mem = p.bot;
    const opps = opponentsOf(game, p);
    const ip = isIP(game, p, opps);
    const hn = TD.handName(hand);
    // MoP ch. 29: an all-in opponent can't be bluffed, so a snow can never win the main pot — draw instead
    if (mem.snow && opps.some((o) => o.allIn)) {
      mem.snow = false;
      mem.snowAborted = true;
      const cs = candidates(hand, d);
      const best = cs.find((x) => x.n > 0) || cs[0];
      return { discard: keepIdx(hand, best.keep), reason: 'Snow aborted — an opponent is all-in, and an all-in player can\'t be bluffed out of the main pot (' + (best.n ? 'drawing ' + best.n + ' to ' + hstr(best.keep) : 'pat') + ').', tag: 'snow' };
    }
    // SS2: abort the snow as soon as someone else stands pat — except heads-up on the last draw, in
    // position, when he only called my bet/raise after the 2nd draw: his pat hand is capped, and standing
    // pat behind him keeps my range polarized (strong made hands + snows), so the snow sometimes continues
    if (mem.snow && opps.length === 1 && k === 2 && ip && opps[0].draws[k] === 0) {
      const mine = iRaisedHeCalled(game, p, opps[0], 2);
      if (mine) {
        if (mem.snowContinue === undefined) mem.snowContinue = R() < 0.6;
        if (mem.snowContinue) {
          mem.snowSince = 3;
          return { discard: [], reason: 'Stand pat behind his pat hand, continuing the snow (' + hstr(hand) + '). He only called my ' + mine + ' and stood pat first, so his hand is capped; patting behind him keeps my range polarized — strong made hands or snows.', tag: 'snow' };
        }
      }
    }
    if (mem.snow && opps.some((o) => o.draws.length && o.draws[o.draws.length - 1] === 0)) {
      mem.snow = false;
      mem.snowAborted = true;
      const cs = candidates(hand, d);
      const best = cs.find((x) => x.n > 0) || cs[0];
      return { discard: keepIdx(hand, best.keep), reason: 'Snow aborted — an opponent stood pat too. SS2: once someone else pats, give up the snow and draw (' + (best.n ? 'drawing ' + best.n + ' to ' + hstr(best.keep) : 'pat') + ').', tag: 'snow' };
    }
    if (mem.snow) {
      return { discard: [], reason: 'Stand pat with ' + hstr(hand) + ' — continuing the snow (representing a made hand).', tag: 'snow' };
    }
    // MMG snow set-up: heads-up out of position, both drew two on the first draw, it went check-check (he didn't
    // improve), and I paired cards he needs (not deuces — everyone has a deuce). Stand pat now and represent two
    // good cards: believable, since a pat hand would have tried to check-raise.
    if (k === 1 && opps.length === 1 && !ip && p.draws[0] === 2 && opps[0].draws[0] === 2 && !TD.isMadeLow(hand) &&
        !game.actions.some((a) => a.street === 1 && (a.type === 'bet' || a.type === 'raise'))) {
      const pr = pairOf(hand);
      if (pr >= 3 && pr <= 8 && !isCallingStation(game, opps[0]) && R() < 0.35 * SNOW_F) {
        mem.snow = true; mem.snowSince = 2;
        return { discard: [], reason: 'Snow: stand pat with ' + hstr(hand) + '. MMG: we both drew two and checked it through, so he didn\'t improve; I paired ' + RPL[pr].toLowerCase() + ' he needs. Standing pat now looks like two good cards — I would have tried to check-raise a pat hand.', tag: 'snow' };
      }
    }
    // snow set-up from trips: draw one first, then stand pat (SS2: more believable than patting off the bat)
    if (mem.snowPlan && k === 0) {
      mem.snowPlan = false;
      const cnt = {};
      hand.forEach((c) => { cnt[TD.rankOf(c)] = (cnt[TD.rankOf(c)] || 0) + 1; });
      const tripRank = +Object.keys(cnt).find((r) => cnt[r] >= 3);
      let worst = -1;
      hand.forEach((c, i) => { if (TD.rankOf(c) !== tripRank && (worst < 0 || TD.rankOf(c) > TD.rankOf(hand[worst]))) worst = i; });
      if (worst < 0) worst = hand.findIndex((c) => TD.rankOf(c) === tripRank);
      mem.snow = true; mem.snowSince = 1;
      return { discard: [worst], reason: 'Snow set-up with ' + hstr(hand) + ': draw one now and stand pat from the next draw. SS2: holding three of the key low cards makes a snow credible, and drawing one first looks less suspicious than patting right away.', tag: 'snow' };
    }
    let cands = candidates(hand, d);
    if (!cands.length) return { discard: [0, 1, 2, 3, 4], reason: 'Draw five.' };
    // first draw: no one-card draws to a nine or worse (2-7, Chase's rule); A-5 (SS2): none to a seven or worse.
    // With three draws to come, a two-card draw makes a better hand than that too often.
    let firstNote = '';
    if (k === 0 && cands.some((c) => c.n >= 2)) {
      const weak = cands.filter((c) => c.n === 1 && TD.weakFirstOne(c.mask));
      if (weak.length) {
        const contender = weak.find((c) => c.val >= cands[0].val * 0.78 || (mem.plan && mem.plan.draw === 1));
        cands = cands.filter((c) => !weak.includes(c));
        if (contender) {
          const top = Math.max(...contender.keep.map(TD.rankOf));
          firstNote = A5 ? mk(' SS2: no one-card draws to a seven or worse on the first draw (with A-2-3-7, draw two to A-2-3), so not drawing one to ') + hstr(contender.keep) + mk('.')
            : ' Not drawing one to ' + hstr(contender.keep) + ': on the first draw, drawing one to a ' + (top === 9 ? 'nine is a marginal play at best' : TD.RANK_WORD[top].toLowerCase() + ' is never right') + '. With three draws to come, the two-card draw ends up with a better hand too often.';
        }
      }
    }
    let choice = cands[0];
    let reason = '';
    let tag = '';
    const rsD = hand.map(TD.rankOf).sort((a, b) => b - a);
    const madeLow = TD.isMadeLow(hand);
    const patC = cands.find((c) => c.n === 0);
    const oneC = cands.find((c) => c.n === 1);
    const drewThisRound = opps.filter((o) => o.draws.length > k).map((o) => o.draws[k]);
    // SS2 (A-5): a pat seven or better is kept, on every draw
    if (A5 && madeLow && rsD[0] <= 8 && patC && !mem.snow) {
      return { discard: [], reason: ['1st', '2nd', '3rd'][k] + ' draw: stand pat with ' + mk(hn.short) + '.' + mk(' SS2: in A-5 a pat seven or better should be kept and played aggressively.'), tag: '' };
    }
    // SS2: an 8-6 or 8-5 should never be broken
    if (k >= 1 && madeLow && rsD[0] === 8 && rsD[1] <= 6 && patC) {
      return { discard: [], reason: ['1st', '2nd', '3rd'][k] + ' draw: stand pat with ' + mk(hn.short) + '. SS2: 8-6s and 8-5s stay pat; if you are convinced it is beaten, fold instead of breaking.', tag: '' };
    }
    // SS2: an 8-7 made on the first draw — break it if an opponent stood pat in front of you and you hold a smooth seven draw
    if (k === 1 && madeLow && rsD[0] === 8 && rsD[1] === 7 && patC && oneC) {
      const smooth = Math.max(...oneC.keep.map(TD.rankOf)) <= 7 && (TD.PSCORE[TD.rankMaskOf(oneC.keep)] || 0) >= 90;
      if (drewThisRound.includes(0) && smooth) {
        return { discard: keepIdx(hand, oneC.keep), reason: '2nd draw: break the 8-7 and draw to ' + hstr(oneC.keep) + '. SS2: with an opponent standing pat in front of you, ask what you can beat — break the rough eight when you hold such a smooth seven draw.', tag: '' };
      }
      if (!drewThisRound.includes(0)) {
        return { discard: [], reason: '2nd draw: stand pat with ' + mk(hn.short) + '. SS2: with no one else pat yet, keep the eight.', tag: '' };
      }
    }
    // last draw: SS2 stand-pat thresholds
    if (k === 2 && madeLow && patC && oneC && !mem.play) {
      const stillDrawing = drewThisRound.filter((n) => n > 0).length;
      const waiting = opps.length - drewThisRound.length; // opponents who draw after us
      const premiumUnder = (TD.PSCORE[TD.rankMaskOf(oneC.keep)] || 0) >= 89 && Math.max(...oneC.keep.map(TD.rankOf)) <= 7;
      if (opps.length === 1 && ip && stillDrawing === 1) {
        if (rsD[0] <= 10) return { discard: [], reason: '3rd draw: stand pat with ' + mk(hn.short) + ' behind his draw. SS2: in position against a lone drawer, a ten or better is a stand-pat hand.', tag: '' };
        if (rsD[0] === 11) {
          if (premiumUnder) return { discard: keepIdx(hand, oneC.keep), reason: '3rd draw: break the jack and draw to ' + hstr(oneC.keep) + '. SS2: even after he draws one, draw one too when your draw is better — you keep the betting edge and act last on the river.', tag: '' };
          return { discard: [], reason: '3rd draw: stand pat with ' + mk(hn.short) + '. Notes/SS2: a pat jack is a slight favourite over any one-card draw.', tag: '' };
        }
      }
      // MMG: out of position you can't see his draw first, so pat every nine or better; pat a ten only when the
      // draw under it is rough (like an 8-7), break it with a strong one (a seven draw)
      if (opps.length === 1 && !ip && opps[0].draws[k - 1] > 0 && rsD[0] <= 10) {
        const strongUnder = Math.max(...oneC.keep.map(TD.rankOf)) <= 7;
        if (rsD[0] <= 9 || !strongUnder) return { discard: [], reason: '3rd draw: stand pat with ' + mk(hn.short) + '. MMG: out of position, pat all nines or better' + (rsD[0] === 10 ? ', and a ten when the draw under it is rough (' + hstr(oneC.keep) + ')' : '') + '.', tag: '' };
        return { discard: keepIdx(hand, oneC.keep), reason: '3rd draw: break the ten and draw to ' + hstr(oneC.keep) + '. MMG: out of position, pat a ten only without a strong draw underneath — this is a seven draw.', tag: '' };
      }
      if (opps.length === 1 && !ip && rsD[0] === 11) {
        return { discard: keepIdx(hand, oneC.keep), reason: '3rd draw: break the jack and draw to ' + hstr(oneC.keep) + '. SS2: out of position, without knowing whether he draws or stands pat, always draw with a jack.', tag: '' };
      }
      if (opps.length >= 2 && rsD[0] <= 9 && waiting + stillDrawing >= 2) {
        return { discard: [], reason: '3rd draw: stand pat with ' + mk(hn.short) + '. SS2: three-way against two drawers, pat any nine or better — it is the favourite.', tag: '' };
      }
    }
    if (mem.breakNext) {
      mem.breakNext = false;
      const brk = cands.find((c) => c.n === 1);
      if (brk) return { discard: keepIdx(hand, brk.keep), reason: 'Called the 3-bet to the play: break to ' + hstr(brk.keep) + ' as planned.', tag: 'play' };
    }

    // Making a play on the turn: decide vs the opponent's response
    if (mem.play && k === 2 && opps.length === 1) {
      const opp = opps[0];
      const oppDrew = opp.draws.length > k ? opp.draws[k] : null;
      const pat = cands.find((c) => c.n === 0);
      const brk = cands.find((c) => c.n === 1);
      if (oppDrew !== null && oppDrew > 0 && pat) {
        if (hn.top === 9 || R() < 0.6) {
          return { discard: [], reason: 'The play worked — opponent broke and draws ' + oppDrew + '. Stand pat with ' + mk(hn.short) + '. Notes: if he breaks, you should probably stand pat.', tag: 'play' };
        }
        if (brk) return { discard: keepIdx(hand, brk.keep), reason: 'Opponent broke. Notes: a pat ten vs a one-card draw has similar equity to breaking, and the draw has positive implied odds on the river — break to ' + hstr(brk.keep) + '.', tag: 'play' };
      }
    }

    // honour the predraw plan on the first draw (balance: raise-&-draw-1 vs call-&-draw-2)
    if (k === 0 && mem.plan) {
      const planned = cands.find((c) => c.n === mem.plan.draw);
      if (planned && planned.val >= cands[0].val * 0.78) {
        choice = planned;
        reason = 'Draw ' + planned.n + ' to ' + hstr(planned.keep) + ' as planned predraw (' + (planned.n === 1 ? 'raised and drawing one' : 'flat-called and drawing two') + ').';
      }
    }

    if (!reason) {
      const top = cands[0], sec = cands[1];
      const closeGap = k === 2 ? 0.14 : 0.09;
      const involvesPat = top.n === 0 || (sec && sec.n === 0);
      if (sec && opps.length && (top.val - sec.val < closeGap || (involvesPat && k >= 1))) {
        const pool = [top, sec];
        const third = cands[2];
        if (third && top.val - third.val < closeGap * 0.6) pool.push(third);
        let best = null;
        // SS2 "keep the 8 or draw to the wheel?" bias
        const lastOpp = opps.map((o) => o.draws[o.draws.length - 1]).filter((x) => x !== undefined);
        const deadWheel = p.discards.filter((x) => TD.rankOf(x) <= 7).length + hasBlockers(hand);
        const mx = (ks) => (ks.length ? Math.max(...ks.map(TD.rankOf)) : 0);
        for (const c of pool) {
          let e = mcEquity(game, p, { mode: 'draw', keep: c.keep, budget: 90, iters: opps.length === 1 ? 420 : 300 });
          c.eq = e;
          let adj = e;
          if (opps.length === 1 && ip && c.n >= 1) adj += 0.02; // implied odds on the river in position
          if (opps.length >= 2 && c.n === 0) adj += 0.015;
          if (mx(c.keep) === 8 && c.n >= 1) {
            if (opps.length >= 2) adj -= 0.025;                                   // more opponents: go for the wheel
            if (lastOpp.length && lastOpp.every((n) => n >= 3)) adj += 0.04;     // they need lots of help: keep the 8
            if (!ip) adj -= 0.02; else if (lastOpp.every((n) => n >= 2)) adj += 0.02; // OOP draw to the nuts
            if (deadWheel >= 3) adj += 0.02;                                      // paired/dead wheel cards: keep the 8
          }
          c.adj = adj;
          if (!best || adj > best.adj) best = c;
        }
        choice = best;
        const alt = pool.find((c) => c !== best);
        reason = buildDrawReason(game, p, choice, alt, hand, hn, k, opps, ip);
      } else {
        reason = buildDrawReason(game, p, choice, sec, hand, hn, k, opps, ip);
      }
    }
    return { discard: keepIdx(hand, choice.keep), reason: reason + (choice.n >= 2 ? firstNote : ''), tag };
  }

  function buildDrawReason(game, p, choice, alt, hand, hn, k, opps, ip) {
    const which = ['1st', '2nd', '3rd'][k];
    // no simulated equity numbers in the explanation: only say which close alternative was weighed
    const eqTxt = (choice.eq !== undefined && alt && alt.eq !== undefined)
      ? ' (a close call: preferred to ' + (alt.n === 0 ? 'standing pat' : alt.keep.length ? 'drawing ' + alt.n + ' to ' + hstr(alt.keep) : 'drawing five') + ' in the AI\'s simulations)'
      : '';
    const oppDraws = opps.map((o) => (o.draws.length > k ? o.draws[k] : null)).filter((x) => x !== null);
    if (choice.n === 0) {
      let r = which + ' draw: stand pat with ' + mk(hn.short) + eqTxt + '.';
      // quote the notes' numbers only in the exact spots the notes describe
      const drawingOne = (o) => (o.draws.length > k ? o.draws[k] : o.draws[k - 1]) === 1;
      if (k === 2 && hn.cat === 0 && hn.top === 11 && opps.length === 1 && drawingOne(opps[0])) r += ' Notes: a pat jack is a slight favourite over a one-card draw with one draw left (about 50-55%); the decision depends on breakability and river implied odds.';
      else if (k === 2 && hn.cat === 0 && hn.top === 9 && hn.second === 7 && opps.length === 2 && opps.every(drawingOne)) r += ' Notes: a pat 9-7 has about 40% equity against two opponents both drawing one.';
      return r;
    }
    let r = which + ' draw: draw ' + choice.n + (choice.keep.length ? ' to ' + hstr(choice.keep) : '') + eqTxt + '.';
    if (alt && alt.n === 0) {
      r += ' Breaking the pat ' + mk(hn.short) + '.';
      if (k === 0 && hn.top === 9) r += ' Notes: pat 9-5-4-3-2 type hands are broken early.';
      if (k === 2 && hn.top === 11) r += ' Notes: a pat jack vs a one-card draw is close; this one breaks to a strong draw with river implied odds.';
    } else if (alt && choice.eq !== undefined) {
      const mx = (ks) => (ks.length ? Math.max(...ks.map(TD.rankOf)) : 0);
      const cm = mx(choice.keep), am = mx(alt.keep);
      const ctx = oppDraws.length ? ' (opponents drew ' + oppDraws.join(', ') + ')' : '';
      if (cm <= 7 && am === 8 && choice.n === alt.n + 1) r += ' Breaking the 8 to draw to the wheel' + ctx + '. Notes: keeping the 8 depends on the number of opponents, their draw counts, position and discards.';
      else if (cm === 8 && am <= 7 && alt.n === choice.n + 1) r += ' Keeping the 8 rather than drawing to the wheel' + ctx + '. Notes: it depends on the number of opponents, their draw counts, position and discards.';
    }
    if (k === 0) r += ' Drawing from the bottom up.';
    return r;
  }

  /* ---------------- learning the user's tendencies ----------------
     The Mathematics of Poker (ch. 3, 5, 9): update beliefs from every observation, but shrink observed
     frequencies toward a prior (a Bayesian estimate) — a few hands can't separate a 30% habit from a 50%
     one — and keep the resulting adjustments modest and capped, since swinging to the maximally
     exploitive extreme is easy to spot and counter-exploit. */
  function shrunk(k, n, prior, weight) { return (k + prior * weight) / ((n || 0) + weight); }
  function userPosterior(game) {
    const um = game.userModel || {};
    return {
      riverFold: shrunk(um.riverFolds || 0, um.riverBetFaced || 0, 0.35, 8),
      riverBluff: shrunk(um.riverBluffShown || 0, um.riverAggShown || 0, 0.12, 10),
      turnStab: shrunk(um.turnStab || 0, um.turnStabOpp || 0, 0.35, 6),
      shown: um.riverAggShown || 0, bluffs: um.riverBluffShown || 0,
      // Theory of Poker ch. 25 (exploiting typical mistakes): folds his blind to steals / check-raises after a draw
      stealFold: shrunk(um.stealFolds || 0, um.stealFaced || 0, 0.55, 10),
      checkRaise: shrunk(um.cr || 0, um.crOpp || 0, 0.12, 10),
      riverBetFaced: um.riverBetFaced || 0, riverFolds: um.riverFolds || 0,
      stealFaced: um.stealFaced || 0, stealFolds: um.stealFolds || 0, crOpp: um.crOpp || 0, cr: um.cr || 0
    };
  }
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  // ToP ch. 25 #7: against a player who never check-raises, bet many more hands behind him. 0 = no evidence
  // (or he check-raises as often as expected), up to 0.45 when he plainly doesn't check-raise.
  function userNoCheckRaise(game, opp) {
    if (!opp || !opp.isHuman) return 0;
    return clamp((0.12 - userPosterior(game).checkRaise) * 6, 0, 0.45);
  }
  function noCheckRaiseNote(game) {
    const u = userPosterior(game);
    return ' He has check-raised ' + plural(u.cr, 'time') + ' in ' + plural(u.crOpp, 'spot') + ' where he checked and then faced a bet. ToP (Sklansky): bet many more hands behind a player who doesn\'t check-raise.';
  }
  // ToP ch. 25 #5: a player who folds too often on the end — bluff him more, but don't bet fair hands for value
  function userFoldsRiver(game, opp) {
    if (!opp || !opp.isHuman) return false;
    const u = userPosterior(game);
    return u.riverBetFaced >= 8 && u.riverFold > 0.5;
  }
  // ToP ch. 25 #6: a player who folds his blind too often — steal more. Score points to widen the steal range by.
  function stealWiden(game, p, pos) {
    if (!['CO', 'BTN', 'SB'].includes(pos)) return { pts: 0 };
    const h = game.players.find((q) => q.isHuman && !q.folded && q !== p);
    if (!h) return { pts: 0 };
    const hp = game.posName(h.seat);
    if (hp !== 'SB' && hp !== 'BB') return { pts: 0 };
    const u = userPosterior(game);
    const only = pos === 'SB'; // the SB stealing from a BB: he is the only player left behind
    const pts = clamp((u.stealFold - 0.55) * (only ? 40 : 20), 0, only ? 12 : 6);
    if (pts < 1) return { pts: 0 };
    return { pts, note: ' He has folded his blind to ' + plural(u.stealFolds, 'steal') + ' out of ' + u.stealFaced + '. ToP (Sklansky): steal more often from a player who folds his blind too much' +
      (only ? ' — when he is the only player left behind, try it most of the time' : '') + '.' };
  }
  // how far the user's shown-down river bluffing departs from the prior: >0 bluffs more, <0 less (capped)
  function userBluffShift(game, opp, scale, lo, hi) {
    if (!opp || !opp.isHuman) return 0;
    return clamp((userPosterior(game).riverBluff - 0.12) * scale, lo, hi);
  }
  function userBluffNote(game, opp, shift) {
    if (!opp || !opp.isHuman || Math.abs(shift) < 0.04) return '';
    const u = userPosterior(game);
    return ' He has been called on the river ' + u.shown + ' time' + (u.shown === 1 ? '' : 's') + ' after betting or raising and showed a bluff in ' + u.bluffs +
      ' — ' + (shift > 0 ? 'more bluffs than expected, so I defend a little wider' : 'fewer bluffs than expected, so I give up a little more often') + ' (a modest adjustment, as the evidence is still thin).';
  }

  /* ---------------- post-draw betting ---------------- */
  // SS2: never try to make a play or bluff a calling station
  // (MoP ch. 5: only extreme styles can be identified from a small sample, so the rates are shrunk first)
  function isCallingStation(game, opp) {
    if (!opp || !opp.isHuman) return false;
    const s = opp.stats;
    if (s.hands < 15) return false;
    return shrunk(s.showdowns, s.hands, 0.24, 20) > 0.36 || shrunk(s.vpip, s.hands, 0.32, 20) > 0.43;
  }
  function tripsRank(hand) {
    const cnt = {};
    for (const c of hand) { const r = TD.rankOf(c); cnt[r] = (cnt[r] || 0) + 1; }
    for (const r in cnt) if (cnt[r] >= 3) return +r;
    return 0;
  }
  function hasBlockers(hand) {
    // paired low cards = we hold extra low cards our opponent needs
    const cnt = {};
    for (const c of hand) { const r = TD.rankOf(c); cnt[r] = (cnt[r] || 0) + 1; }
    let dupLow = 0;
    for (const r in cnt) if (+r <= 7 && cnt[r] >= 2) dupLow += cnt[r] - 1;
    return dupLow;
  }

  // River bluffing frequency with a hand that has no showdown value. MoP ch. 11/13: bluffs should be
  // alpha = 1/(P+1) as many as value bets (P = pot in bets), so bigger pots get FEWER bluffs — each bluff
  // needs to work less often. 7% at an 8-bet pot matches the notes' "every now and then". Against the user
  // it also shifts smoothly (and capped) with how often he folds to river bets.
  function bluffFreqVs(game, opp, pot, unit) {
    const P = pot && unit ? pot / unit : 8;
    let f = 0.07 * 9 / (P + 1);
    if (opp && opp.isHuman) f *= clamp(1 + (userPosterior(game).riverFold - 0.35) * 3.5, 0.25, 2.5);
    return clamp(f * BLUFF_F, 0.01, 0.22);
  }

  function myRoundActs(game, p) {
    return game.actions.filter((a) => a.street === game.street && a.seat === p.seat);
  }

  /* ---------------- minimum defense frequency (the user's MDF notes) ----------------
     A bet or raise of B into a pot that, after it, holds `pot` shows a profit with ANY hand if I fold
     more than B / pot of my range; defending the rest (the MDF) stops that. The notes' point is WHEN
     that matters:
     - Facing a RAISE it always does: raising with any hand is almost never profitable, so the range
       that bet (or raised) has to keep defending at least the MDF share of itself.
     - Facing a BET it does only when the bettor could not just bet everything: he leads out of
       position into the player with the stronger range (the last aggressor, or the player a card
       ahead). A bettor with position AND the stronger range may profit betting any hand; folding more
       than MDF against him is no mistake.
     - While draws remain, calling lets even his weakest hands draw out, so defend MORE than MDF.
     Heads-up only: multiway, the defense is shared between the players still to act (MoP ch. 29). */
  const money = (n) => '$' + Math.round(n).toLocaleString();
  const streetTxt = (s) => (s === 0 ? 'before the draw' : 'after the ' + ['1st', '2nd', '3rd'][s - 1] + ' draw');
  const drawTxt = (n) => (n === 0 ? 'stood pat' : 'drew ' + n);
  // with draws still to come, use only part of the fold share MDF allows (the notes: "defend more")
  const MDF_FOLD_KEEP = [1, 0.7, 0.5];

  function lastAgg(game, st) {
    let last = null;
    for (const a of game.actions) if (a.street === st && (a.type === 'bet' || a.type === 'raise')) last = a;
    return last;
  }

  // Who comes into this betting round with the stronger range: the player who drew fewer cards on the
  // last draw; with equal draws, the last player whose bet or raise was called.
  function rangeEdge(c) {
    const { game, p, opp, st } = c;
    if (c.myLast !== undefined && c.oppLast !== undefined && c.myLast !== c.oppLast) {
      return c.myLast < c.oppLast ? { who: 'me', why: 'I ' + drawTxt(c.myLast) + ', he ' + drawTxt(c.oppLast) }
        : { who: 'him', why: 'he ' + drawTxt(c.oppLast) + ', I ' + drawTxt(c.myLast) };
    }
    for (let s = st - 1; s >= 0; s--) {
      const mine = iRaisedHeCalled(game, p, opp, s);
      if (mine) return { who: 'me', why: 'he called my ' + mine + ' ' + streetTxt(s) };
      const his = iRaisedHeCalled(game, opp, p, s);
      if (his) return { who: 'him', why: 'I called his ' + his + ' ' + streetTxt(s) };
    }
    return { who: 'even', why: '' };
  }

  // Does MDF bind on the bet or raise I'm facing? (heads-up, after the first draw)
  function mdfSpot(c) {
    if (!c.opp || c.toCall <= 0 || c.st === 0) return null;
    const last = lastAgg(c.game, c.st);
    if (!last || last.seat !== c.opp.seat) return null;
    const risk = last.amount > 0 ? last.amount : c.toCall;
    const foldMdf = clamp(risk / c.pot, 0, 1);
    const m = { risk, reward: c.pot - risk, foldMdf, foldMax: foldMdf * MDF_FOLD_KEEP[clamp(c.dRem, 0, 2)] };
    if (c.lvl >= 2) {
      const heChecked = c.game.actions.some((a) => a.street === c.st && a.seat === c.opp.seat && a.type === 'check');
      m.word = c.lvl >= 3 ? 're-raise' : heChecked ? 'check-raise' : 'raise';
      m.mine = c.lvl >= 3 ? 'raise' : 'bet';
      return Object.assign(m, { applies: true, kind: 'raise' });
    }
    m.edge = rangeEdge(c);
    m.word = 'bet';
    if (c.ip && m.edge.who !== 'him') return Object.assign(m, { applies: true, kind: 'lead' });
    if (!c.ip && m.edge.who === 'him') return Object.assign(m, { applies: false, kind: 'none' });
    return Object.assign(m, { applies: false, kind: 'mixed' });
  }

  function mdfHead(c, m) {
    const more = c.dRem > 0 ? '; with ' + c.dRem + ' draw' + (c.dRem > 1 ? 's' : '') + ' to come he can still draw out, so I defend more than that' : '';
    if (m.kind === 'raise') {
      return 'MDF applies to every raise: his ' + m.word + ' risks ' + money(m.risk) + ' to win ' + money(m.reward) + ', so I can fold no more than ' +
        pct1(m.foldMdf) + ' of the hands I ' + m.mine + ' with here' + more + '.';
    }
    return 'He led out of position into the stronger range (' + m.edge.why + '), so MDF applies: his bet risks ' + money(m.risk) + ' to win ' +
      money(m.reward) + ', so I can fold no more than ' + pct1(m.foldMdf) + ' of my range' + more + '.';
  }
  function mdfWhyNot(m) {
    return 'MDF doesn\'t bind here: he has position and the stronger range (' + m.edge.why + '), so he may profit betting any hand — folding more than MDF to him is no mistake.';
  }

  // Share of my own range in this line (predraw action, draws and betting so far, as the opponent sees
  // it) that is stronger than the hand I hold now: 0 = the top of my range, 1 = the bottom.
  function selfShareAbove(c) {
    if (EQ_CACHE && 'self' in EQ_CACHE) return EQ_CACHE.self;
    const { game, p } = c;
    const model = buildModel(game, p);
    model.human = false;
    const all = [];
    for (let i = 0; i < 52; i++) all.push(i);
    const pool = new Pool(all);
    const mine = TD.strengthNow(p.hand, c.dRem);
    const budget = game.fastForward ? 20 : 60, minIt = game.fastForward ? 60 : 160, maxIt = 400;
    const t0 = performance.now();
    let above = 0, n = 0;
    for (let it = 0; it < maxIt; it++) {
      if (it >= minIt && (it & 15) === 0 && performance.now() - t0 > budget) break;
      pool.reset();
      const s = TD.strengthNow(sampleOpponent(model, pool), c.dRem);
      if (s > mine + 1e-9) above++;
      else if (s >= mine - 1e-9) above += 0.5;
      n++;
    }
    const v = n ? above / n : 0;
    if (EQ_CACHE) EQ_CACHE.self = v;
    return v;
  }

  // MDF as a floor: a fold in a spot where MDF binds stands only if the hand is among the weakest part
  // of my range (the share MDF lets me fold); otherwise it becomes a call. MDF never turns a call into a
  // fold — it is a minimum, and defending more is fine.
  function mdfFloor(c, r) {
    if (r.type !== 'fold' || r.tag === 'snow' || r.tag === 'play' || c.p.bot.snow) return r;
    const m = mdfSpot(c);
    if (!m) return r;
    if (!m.applies) return m.kind === 'none' ? act('fold', r.reason + ' ' + mdfWhyNot(m), r.tag) : r;
    let target = 1 - m.foldMax; // defend at least this share of my range
    let shift = 0;
    // river: shown-down evidence about the user's river bluffing moves the floor a little (capped)
    if (c.st === 3) { shift = userBluffShift(c.game, c.opp, 1.2, -0.12, 0.08); target = clamp(target + shift, 0.5, 0.98); }
    const head = mdfHead(c, m);
    const handTxt = c.drawing ? ', drawing ' + c.nextDraw + ' to ' + hstr(c.keepNow) : ' with ' + mk(c.hn.short);
    const bluffNote = shift ? userBluffNote(c.game, c.opp, shift) : '';
    if (selfShareAbove(c) >= target) {
      return act('fold', r.reason + ' ' + head + ' This hand is among the weakest of them — the part MDF lets me fold.' + bluffNote, r.tag);
    }
    return act('call', 'Call' + handTxt + '. ' + head + ' This hand is not among the weakest of them, so it is part of the range that has to defend' +
      (/Notes|SS2/.test(r.reason) ? ' (with MDF, the notes\' fold applies only to the weakest of them)' : '') + '.' + bluffNote, 'mdf');
  }

  function postdraw(game, p, opts) {
    const st = game.street;
    const mem = p.bot;
    const opps = opponentsOf(game, p);
    // MoP ch. 29: an all-in opponent can't fold, so a snow can never win the main pot — drop it and
    // play the hand on its merits (as a draw, before the last draw)
    let snowNote = '';
    if (mem.snow && opps.some((o) => o.allIn)) {
      mem.snow = false; mem.snowAborted = true;
      snowNote = 'Snow abandoned — an opponent is all-in and can\'t be bluffed out of the main pot. ';
    }
    const N = opps.length;
    const ip = isIP(game, p, opps);
    const dRem = 3 - st;
    const hand = p.hand;
    const hn = TD.handName(hand);
    const made = hn.cat === 0;
    const nextDraw = dRem > 0 ? (mem.snow ? 0 : TD.policyDrawCount(hand, dRem)) : 0;
    const drawing = nextDraw > 0;
    const E = mcEquity(game, p, { mode: 'bet', patForever: !!mem.snow });
    const myActs = myRoundActs(game, p);
    const iBet = myActs.some((a) => a.type === 'bet' || a.type === 'raise');
    const c = {
      game, p, opts, st, N, ip, dRem, hand, hn, made, nextDraw, drawing, E,
      toCall: opts.toCall, pot: opts.pot, unit: opts.unit, lvl: opts.betLevel,
      canRaise: opts.canRaise, myLast: p.draws[st - 1], iBet,
      potOdds: opts.toCall > 0 ? opts.toCall / (opts.pot + opts.toCall) : 0,
      opp: N === 1 ? opps[0] : null, opps
    };
    if (c.opp) { c.oppLast = c.opp.draws[st - 1]; c.oppPrev = st >= 2 ? c.opp.draws[st - 2] : null; }
    c.myPrev = st >= 2 ? p.draws[st - 2] : null;
    c.oppsLast = opps.map((o) => o.draws[st - 1]);
    c.cardAhead = c.oppsLast.length > 0 && c.oppsLast.every((n) => n > nextDraw);
    c.cardBehind = c.oppsLast.some((n) => n < nextDraw);
    c.improved = c.myLast >= 1 && nextDraw < c.myLast;
    c.keepNow = drawing ? TD.policyKeep(hand, dRem) : hand;
    c.premiumDraw = drawing && c.keepNow.some((x) => TD.rankOf(x) === 2) && Math.max(...c.keepNow.map(TD.rankOf)) <= 7;
    c.deadWheel = p.discards.filter((x) => TD.rankOf(x) <= 7).length + hasBlockers(hand);
    c.allInOpp = opps.some((o) => o.allIn);
    let r = null;
    if (mem.snow) r = snowAction(c);
    if (!r) r = standardCheck(c);
    if (!r && mem.crPlan === st && c.toCall > 0 && c.canRaise && c.lvl === 1) r = act('raise', 'Check-raise as planned with ' + mk(hn.short) + '.', 'check-raise');
    if (!r && mem.play && mem.playStreet === st && c.toCall > 0 && c.lvl >= 3) {
      r = mem.play === 'fold' ? act('fold', 'The play got 3-bet: easy fold with ' + mk(hn.short) + ' (that is why this hand was chosen to make the play).', 'play')
        : act('call', 'The play got 3-bet: call and break to the premium draw underneath — the easy decision planned in advance.', 'play');
      if (mem.play !== 'fold') mem.breakNext = true;
    }
    if (!r) {
      if (st === 1) r = flopRules(c);
      else if (st === 2) r = turnRules(c);
      else r = riverRules(c);
    }
    if (!r) r = generic(c);
    // MoP ch. 29 (dry side pot): with an opponent all-in, a bluff that folds out the other live player only
    // hands the main pot to the all-in player — so no bluffs, snows or plays
    if (c.allInOpp && (r.type === 'bet' || r.type === 'raise') && (r.tag === 'bluff' || r.tag === 'snow' || r.tag === 'play')) {
      if (r.tag === 'play') mem.play = undefined;
      mem.snow = false;
      const why = 'an opponent is all-in, so folding out the other player would only hand the main pot to the all-in player (MoP: never bluff into a dry side pot)';
      r = c.toCall === 0 ? act('check', 'No bluff — ' + why + '.')
        : c.E >= c.potOdds ? act('call', 'Just call — ' + why + '; ' + priceTxt(c) + '.') : act('fold', 'Fold — no bluff-raise: ' + why + '.');
    }
    r = gateRaise(c, r);
    // MMG: after the first draw, having bet and been raised, re-raise only a pat hand — 3-betting a draw is pure spew
    if (st === 1 && c.iBet && c.toCall > 0 && c.drawing && r.type === 'raise' && r.tag !== 'snow' && r.tag !== 'play') {
      r = act('call', 'Call — still drawing (to ' + hstr(c.keepNow) + '). MMG: after betting and getting raised on the first draw, 3-bet only when pat; re-raising a draw is pure spew.', '');
    }
    r = mdfFloor(c, r);
    if (snowNote) r = act(r.type, snowNote + (r.reason || ''), r.tag);
    return r;
  }

  // On the previous street, did the opponent make the last bet/raise and I just called it?
  function calledHimLastStreet(c) {
    const acts = c.game.actions.filter((a) => a.street === c.st - 1 && (a.type === 'bet' || a.type === 'raise' || a.type === 'call'));
    let lastAgg = -1;
    acts.forEach((a, i) => { if (a.type === 'bet' || a.type === 'raise') lastAgg = i; });
    if (lastAgg < 0 || acts[lastAgg].seat !== c.opp.seat) return null;
    const called = acts.slice(lastAgg + 1).some((a) => a.seat === c.p.seat && a.type === 'call');
    return called ? acts[lastAgg].type : null;
  }

  // On `street`, was the last bet/raise mine, and did he call it? Returns 'bet' / 'raise' or null.
  function iRaisedHeCalled(game, me, opp, street) {
    const acts = game.actions.filter((a) => a.street === street && (a.type === 'bet' || a.type === 'raise' || a.type === 'call'));
    let last = -1;
    acts.forEach((a, i) => { if (a.type === 'bet' || a.type === 'raise') last = i; });
    if (last < 0 || acts[last].seat !== me.seat) return null;
    return acts.slice(last + 1).some((a) => a.seat === opp.seat && a.type === 'call') ? acts[last].type : null;
  }
  // Heads-up river in position: I bet/raised after the 2nd draw, he called, he stood pat first and I stood
  // pat behind him. My range here is polarized: strong made hands or snows.
  function polarizedIP(c) {
    if (!c.opp || !c.ip || c.st !== 3 || c.myLast !== 0 || c.oppLast !== 0) return null;
    return iRaisedHeCalled(c.game, c.p, c.opp, 2);
  }

  // Standard play: heads-up, out of position, I called his bet or raise and then we both stood pat —
  // check to the player in position (with the nuts, check intending to check-raise).
  function standardCheck(c) {
    if (!c.opp || c.ip || c.toCall > 0 || c.st < 2 || c.myLast !== 0 || c.oppLast !== 0 || c.p.bot.snow) return null;
    const his = calledHimLastStreet(c);
    if (!his) return null;
    const after = ['', '1st', '2nd', '3rd'][c.st - 1];
    const rs = c.hand.map(TD.rankOf).sort((a, b) => b - a);
    const nut = c.made && rs[0] <= 7;
    if (nut) c.p.bot.crPlan = c.st;
    const what = his === 'raise' ? 'his raise' : 'his bet';
    return act('check', 'I called ' + what + ' after the ' + after + ' draw and then we both stood pat: check to the player in position — the standard play. ' +
      (his === 'raise' ? 'Raising and then standing pat behind my pat hand represents a strong made hand, so ' + (nut ? 'with ' + mk(c.hn.short) + ' I check intending to check-raise.' : 'a hand like ' + mk(c.hn.short) + ' is too weak to lead for value into that range.')
        : (nut ? 'With ' + mk(c.hn.short) + ' I check intending to check-raise.' : 'Leading into his pat range with ' + mk(c.hn.short) + ' only gets called by better.')), 'standard');
  }

  // re-raise discipline: 3-bets and beyond need a near-nut hand
  function gateRaise(c, r) {
    if (r.type !== 'raise' || c.toCall === 0) return r;
    // notes: "In general, you should only raise the river with a strong eight or a seven."
    // (deliberate bluff-raises with a snow are part of a polarized range and pass through)
    if (c.st === 3 && r.tag !== 'bluff') {
      const rs = c.hand.map(TD.rankOf).sort((a, b) => b - a);
      const strong = c.made && (rs[0] <= 7 || (rs[0] === 8 && (rs[1] <= 5 || (rs[1] === 6 && rs[2] <= 4))));
      if (!strong) {
        if (c.E >= c.potOdds) return act('call', 'River: call with ' + mk(c.hn.short) + ' — notes: only raise the river with a strong eight or a seven.', '');
        return act('fold', 'River: fold ' + mk(c.hn.short) + '.', '');
      }
    }
    if (c.lvl < 2) return r;
    const nutty = c.made && c.nextDraw === 0 && (c.hn.top <= 7 || (c.hn.top === 8 && c.hn.second <= 5));
    const need = c.lvl === 2 ? 0.68 : c.lvl === 3 ? 0.8 : 0.92;
    const ok = c.E >= need && (c.lvl < 3 || nutty) && c.lvl < 6 && !(c.lvl >= 4 && c.st === 3 && !(c.hn.top === 7 && c.hn.second <= 5));
    if (ok) return r;
    return act('call', 'Call rather than re-raise (' + c.lvl + ' bets in — further re-raises need a near-nut hand). ' + r.reason, r.tag === 'value' ? '' : r.tag);
  }

  function snowAction(c) {
    // polarized line (he called my raise, we both stood pat): the snow is the bluff part of my range
    const polar = polarizedIP(c);
    if (polar) {
      if (c.toCall === 0) return act('bet', 'Snow: he called my ' + polar + ' and checked after we both stood pat. My range is polarized — strong made hands or snows — so bet the snow as a bluff.', 'snow');
      if (c.lvl === 1 && c.canRaise && R() < 0.2 * SNOW_F) return act('raise', 'Snow: he led into my polarized range (strong made hands or snows). Bluff-raise this time — the snow part of my range sometimes raises the lead.', 'bluff');
      c.p.bot.snow = false;
      return act('fold', 'Snow: he led into my polarized range. The snow part of my range folds to the lead (and sometimes bluff-raises); my made hands never fold here.', 'snow');
    }
    const since = c.p.bot.snowSince || 1;
    const someonePat = c.opps.some((o) => o.draws.slice(since).includes(0) || (c.st >= 2 && o.draws[c.st - 1] === 0));
    if (someonePat) {
      c.p.bot.snow = false;
      return c.toCall === 0 ? act('check', 'Snow abandoned — an opponent stood pat too. SS2: once someone else pats, give up the snow (draw if it isn\'t bet to you).', 'snow')
        : act('fold', 'Snow abandoned — an opponent stood pat and bets. SS2: when someone else stays pat, fold to a bet.', 'snow');
    }
    if (c.toCall === 0) return act('bet', 'Snowing: bet as if pat (' + hstr(c.hand) + ') — representing a made hand while holding the opponent\'s cards.', 'snow');
    if (c.lvl <= 1 && c.st < 3 && c.potOdds < 0.18) return act('call', 'Snowing: call one bet and keep representing a pat hand.', 'snow');
    c.p.bot.snow = false;
    return act('fold', 'Snow abandoned facing aggression.', 'snow');
  }

  function flopRules(c) {
    const { opp, ip, toCall, myLast, nextDraw, unit } = c;
    // MMG: having checked to the player in position who drew fewer cards, respond to his bet: check-raise a pat
    // hand, just call with a draw (improved or not — his bet can be a pat hand that 3-bets a check-raise)
    const lp = c.p.bot.leadPlan;
    if (lp && lp.st === c.st && toCall > 0 && c.lvl === 1) {
      if (c.made && nextDraw === 0 && c.canRaise) return act('raise', 'Check-raise with ' + mk(c.hn.short) + ' as planned. MMG: after checking to the player who drew fewer cards, check-raise when you are pat.', 'check-raise');
      if (nextDraw <= 2) {
        return act('call', lp.disguise ? 'Just call, as planned: keep the improved draw (' + hstr(c.keepNow) + ') disguised as a rough one.'
          : 'Call with ' + (c.drawing ? 'the draw to ' + hstr(c.keepNow) : mk(c.hn.short)) + '. MMG: after checking to the player who drew fewer cards, call his bet with a draw — check-raising one only gets 3-bet by his pat hands.', lp.disguise ? 'trap' : '');
      }
    }
    // check-raised in position with an unimproved one-card draw
    if (opp && ip && c.iBet && toCall > 0 && myLast === 1 && nextDraw === 1 && c.oppLast > myLast) {
      return act('call', 'Check-raised in position: just call with the unimproved one-card draw. Notes: don\'t 3-bet here — play GTO.', 'gto');
    }
    // bet in position and got check-raised: MDF applies to every raise — and with two draws to come,
    // defend substantially more than MDF (the weakest hands that still fold are left to the MDF floor)
    if (opp && ip && c.iBet && toCall > 0) {
      // MMG: 3-bet only a pat hand — re-raising while still drawing is pure spew
      if (c.E > 0.6 && c.canRaise && c.made && nextDraw === 0) return act('raise', '3-bet the check-raise with pat ' + mk(c.hn.short) + ': well ahead of his range. MMG: improved to pat, bet and got raised — 3-bet.', 'value');
      if (c.E >= c.potOdds * 0.5) {
        const m = mdfSpot(c);
        return act('call', 'Facing a check-raise: defend — ' + priceTxt(c) + ' (' + money(c.pot) + ' pot, ' + money(c.toCall) + ' to call). ' + (m ? mdfHead(c, m) : ''), 'mdf');
      }
    }
    // two bets cold with an unimproved two-card draw
    if (toCall >= 2 * unit && c.p.roundBet === 0 && nextDraw >= 2 && myLast >= 2) {
      if (R() < 0.9) return act('fold', 'Facing a bet and a raise with an unimproved two-card draw. Notes: you will usually be up against one-card draws and pat hands — fold.');
    }
    // 3-way: improved to a one-card draw, raise to isolate with position
    if (c.N >= 2 && toCall > 0 && c.lvl === 1 && myLast === 2 && nextDraw === 1 && c.canRaise) {
      const acts = c.game.actions.filter((a) => a.street === 1 && (a.type === 'bet'));
      const bettor = acts.length ? c.game.players[acts[0].seat] : null;
      const behind = c.opps.filter((q) => c.game.actOrder(q.seat) > c.game.actOrder(c.p.seat) && !c.game.actions.some((a) => a.street === 1 && a.seat === q.seat));
      if (bettor && bettor.draws[0] === 1 && c.game.actOrder(c.p.seat) > c.game.actOrder(bettor.seat) && behind.length) {
        return act('raise', 'Caught to a one-card draw; raise the one-card drawer\'s bet to get heads-up with position. Notes: in a 3-way pot raise here; heads-up in position just call.', 'isolate');
      }
    }
    if (opp && ip && toCall > 0 && c.lvl === 1 && myLast === 2 && nextDraw === 1 && c.E < 0.6) {
      return act('call', 'Improved to a one-card draw heads-up with position: just call the bet. Notes: heads-up in position, call rather than raise.');
    }
    // snow spot
    if (opp && ip && toCall === 0 && c.oppLast >= 2 && myLast >= 2 && nextDraw >= 2 && hasBlockers(c.hand) >= 2 && bestSub[c.dRem][TD.rankMaskOf(c.hand)] < 0.45 && !isCallingStation(c.game, opp)) {
      if (R() < 0.5 * SNOW_F) {
        c.p.bot.snow = true; c.p.bot.snowSince = 1;
        return act('bet', 'Snow spot: heads-up in position, he checked, my draw is poor but I caught ' + hasBlockers(c.hand) + ' blockers (' + hstr(c.hand) + '). Notes: "a pretty ideal snow spot". I will stand pat from here.', 'snow');
      }
    }
    // SS2: trash/trouble hands (no deuce) — abort the mission if they don't improve quickly
    if (c.p.bot.trouble && toCall > 0 && nextDraw >= 2 && c.E < 0.3) {
      return act('fold', 'Unimproved rough draw without a deuce facing a bet. SS2: trouble hands that don\'t improve right away go in the muck.');
    }
    // MMG: in position, both drew the same number and he leads — raise only a pat hand, otherwise call: he says
    // he improved, but not by how much, and a raise with a slight edge gets 3-bet whenever you are far behind
    if (opp && ip && toCall > 0 && c.lvl === 1 && !c.iBet && c.oppLast === myLast) {
      if (c.made && nextDraw === 0 && c.canRaise) return act('raise', 'He drew ' + myLast + ' like me and leads; I\'m pat with ' + mk(c.hn.short) + ': raise. MMG: against a lead after equal draws, raise only when pat.', 'value');
      if (c.drawing && nextDraw <= 2) return act('call', 'He drew ' + myLast + ' like me and leads: call with the draw to ' + hstr(c.keepNow) + '. MMG: he improved by an unknown amount — just call; raising a slight edge gets 3-bet when far behind.');
    }
    // MMG: in position, equal draws, he checks — bet if I improved, check if not (barely ahead at best, and a
    // check-raise would be a disaster)
    if (opp && ip && toCall === 0 && c.oppLast === myLast && myLast > 0) {
      if (c.improved) return act('bet', 'Equal draws, he checked and I improved to ' + (nextDraw === 0 ? mk(c.hn.short) : 'a ' + nextDraw + '-card draw') + ': bet. MMG: in position after equal draws, bet when you improve.', 'value');
      return act('check', 'Equal draws, he checked and I didn\'t improve: check back. MMG: unimproved, you are barely ahead at best, and getting check-raised would be a disaster.');
    }
    // SS2: drawing two to a premium hand in a raised multiway pot — call one bet whether you improve or not
    if (c.N >= 2 && toCall > 0 && toCall <= unit && c.p.roundBet === 0 && nextDraw >= 2 && c.premiumDraw) {
      return act('call', 'Multiway, drawing two to ' + hstr(c.keepNow) + ': call one bet. SS2: in a raised multiway pot a premium two-card draw is worth one bet even unimproved.');
    }
    if (toCall === 0) {
      // MMG: the player who drew the fewest cards has the betting lead. When a player in position drew fewer
      // cards than me, check my whole range — even when I made a pat hand: it gives virtual position and gives
      // nothing away; then check-raise pat hands and call with draws (SS2's turn advice agrees: made a hand after
      // being a card behind, he bets automatically — check-raise). ToP ch. 3/8 (the 2-7 big-blind example in the
      // notes): with a premium one-card draw this check-call also disguises it as a rough one (not vs a calling station)
      const fewerBehind = c.opps.some((q) => c.game.actOrder(q.seat) > c.game.actOrder(c.p.seat) && q.draws[0] < myLast);
      if (fewerBehind) {
        const disguise = opp && c.improved && nextDraw === 1 && c.premiumDraw && !isCallingStation(c.game, opp);
        c.p.bot.leadPlan = { st: c.st, disguise };
        if (disguise) return act('check', 'Caught a premium one-card draw (' + hstr(c.keepNow) + ') after drawing ' + myLast + ' to his ' + c.oppLast + ': check and just call his bet. MMG: he drew fewer cards, so he has the betting lead — check everything to him. ToP (Sklansky): flat-calling makes the draw look rough, so he pays more when it gets there (the 2-7 big-blind example in the notes).', 'trap');
        return act('check', 'A player behind me drew fewer cards, so he has the betting lead: check' + (c.made && nextDraw === 0 ? ', planning to check-raise ' + mk(c.hn.short) : '') + '. MMG: check the whole range to the player in position who drew fewer — virtual position, and nothing given away.', c.made && nextDraw === 0 ? 'check-raise' : '');
      }
      // SS2: a card ahead of everyone — it's safe to bet (except the 2-vs-two-3s case)
      if (c.cardAhead) {
        const exception = myLast === 2 && nextDraw >= 2 && c.N >= 2 && c.oppsLast.every((n) => n >= 3);
        if (exception) return act('check', 'Drew two and missed against two players drawing three. SS2: with two players on three-card draws behind you, one likely improved — take the free card.');
        return act('bet', (nextDraw === 0 ? 'Pat' : 'Drawing ' + nextDraw) + ' vs opponents drawing ' + c.oppsLast.join(', ') + ': bet. SS2: when you need fewer cards than every opponent, betting is safe' + (myLast === 1 && !c.improved ? ', whether you improved or not' : '') + '.', 'card-ahead');
      }
      // SS2: out of position drawing the same number of cards — straightforward
      if (!ip && c.oppsLast.every((n) => n === myLast)) {
        if (c.improved) return act('bet', 'Improved to ' + (nextDraw === 0 ? hstr(c.hand) : 'a ' + nextDraw + '-card draw') + ' out of position: bet. SS2: drawing the same number as your opponents, bet when you improve.', 'value');
        return act('check', 'Out of position, drew ' + myLast + ' like my opponent' + (c.N > 1 ? 's' : '') + ' and missed: check. SS2: play it straightforward — check when you miss; betting would only lose an extra bet when he improves.');
      }
    }
    return freezeRule(c);
  }

  function freezeRule(c) {
    const { hn, ip, toCall, made, nextDraw } = c;
    if (!(ip && toCall > 0 && c.lvl === 1 && made && nextDraw === 0)) return null;
    const rs = c.hand.map(TD.rankOf).sort((a, b) => b - a);
    const strong = hn.top <= 7 || (hn.top === 8 && hn.second <= 5);
    // "decent-to-strong eights" / roughly 9-5-4-3-2 to 8-6-4-3-2 (not the rough 8-7-6s)
    const decent = (rs[0] === 8 && rs[1] === 6) || (rs[0] === 8 && rs[1] === 7 && rs[2] <= 5) || (rs[0] === 9 && rs[1] <= 5);
    if (strong && c.canRaise) return act('raise', 'Pat ' + mk(hn.short) + ' — a premium hand: raise for value.', 'value');
    if (decent) {
      // ToP ch. 8: disguising a hand gains little multiway or against players who don't fold (no freeze there)
      if (c.N > 1) return null;
      // Freezing only works with one draw left: the flat call makes him think I'll draw, he pats a worse hand
      // and is drawing dead. With two draws to come he still gets another draw to break, so no freeze —
      // raise to charge his draw (and leave a pat bettor to the general rules)
      if (c.st < 2) {
        if (c.oppLast > 0 && c.canRaise) return act('raise', 'Raise with ' + mk(hn.short) + ' — no freeze with two draws to come. Freezing only works on the last draw, where a worse pat hand stays pat and is drawing dead; here he would still get another draw to break and outdraw me, so charge his draw instead.', 'value');
        return null;
      }
      // MMG: with one draw left, in position with a very good but beatable hand (8-7-4-3-2, 8-6-5-4-3) and a pat
      // opponent betting, just call: a raise lets him break and draw; calling keeps him pat, and dead when I'm ahead
      if (c.st === 2 && c.oppLast === 0 && rs[0] === 8 && rs[1] >= 6) return act('call', 'Just call with ' + mk(hn.short) + ' — he is pat and bets. MMG: with a very good but beatable hand in position, don\'t raise and give him the chance to break; if I\'m ahead, he stays drawing dead.', 'freeze');
      if (isCallingStation(c.game, c.opp) && c.canRaise) return act('raise', 'Raise ' + mk(hn.short) + ' for value instead of freezing. ToP (Sklansky): don\'t slowplay against a player who rarely folds a fair hand — bet decent hands for value.', 'value');
      if (R() < 0.75) return act('call', 'Freeze: flat call in position with ' + mk(hn.short) + ' — a good, but not best, pat hand. Notes: freezing represents a narrow range (roughly 9-5-4-3-2 to 8-6-4-3-2), so expect a leveling war on the river.', 'freeze');
      if (c.canRaise) return act('raise', 'Raise with ' + mk(hn.short) + ' (mixed with freezing for balance).', 'balance');
    }
    return null;
  }

  function turnRules(c) {
    const { opp, ip, toCall, myLast, nextDraw, hn, unit, game, p } = c;
    const rs = c.hand.map(TD.rankOf).sort((a, b) => b - a);
    const strongPat = c.made && nextDraw === 0 && (rs[0] <= 7 || (rs[0] === 8 && rs[1] <= 6));
    // MMG: making trips or two pair on the second draw is a decent time to snow — the hand has little potential,
    // and the low cards I hold are cards he needs (e.g. all four 8s gone: he must make a 7 or call light). The snow
    // needs to work about 30% of the time (two big bets to win the pot), and the book holds most players snow too
    // little. Heads-up only, against a player still drawing, never against a calling station.
    if (opp && !p.bot.snow && myLast >= 1 && c.oppLast >= 1 && (hn.cat === TD.CAT.TRIPS || hn.cat === TD.CAT.TWOPAIR) && !c.premiumDraw && !isCallingStation(game, opp)) {
      const cnt = {};
      c.hand.forEach((x) => { const r = TD.rankOf(x); cnt[r] = (cnt[r] || 0) + 1; });
      const blocked = Object.keys(cnt).filter((r) => cnt[r] >= 2 && +r >= 3 && +r <= 8).map(Number);
      if (blocked.length) {
        const what = hn.cat === TD.CAT.TRIPS ? 'trips' : 'two pair';
        const why = 'MMG: making ' + what + ' on the second draw is a decent time to snow — ' + blocked.map((r) => RPL[r].toLowerCase()).join(' and ') + ' he needs are in my hand, the hand has little potential, and the snow only has to work about 30% of the time.';
        if (toCall === 0 && R() < 0.5 * SNOW_F) { p.bot.snow = true; p.bot.snowSince = 2; return act('bet', 'Snow with ' + hstr(c.hand) + ': bet and stand pat. ' + why, 'snow'); }
        if (toCall > 0 && c.lvl === 1 && c.canRaise && R() < 0.35 * SNOW_F) { p.bot.snow = true; p.bot.snowSince = 2; return act('raise', 'Snow with ' + hstr(c.hand) + ': raise and stand pat. ' + why, 'snow'); }
      }
    }
    // SS2 snow: both drew one, he checks, I paired low cards — bet and stand pat
    if (opp && ip && toCall === 0 && c.oppLast === 1 && myLast === 1 && nextDraw >= 1 && pairOf(c.hand) > 0 && pairOf(c.hand) <= 5 && !c.made && !isCallingStation(game, opp) && R() < 0.12 * SNOW_F) {
      p.bot.snow = true; p.bot.snowSince = 2;
      return act('bet', 'Snow: both drew one, he checked (probably still drawing) and I paired a wheel card (' + hstr(c.hand) + '). SS2: bet and stand pat — if he misses, keep bluffing; he will fold most hands that miss.', 'snow');
    }
    // SS2 snow: drawing two vs his one, he bets, I catch pairs of wheel cards — raise and stand pat
    if (opp && ip && toCall > 0 && c.lvl === 1 && c.canRaise && c.oppLast === 1 && myLast === 2 && nextDraw >= 2 && hasBlockers(c.hand) >= 2 && !isCallingStation(game, opp) && R() < 0.2 * SNOW_F) {
      p.bot.snow = true; p.bot.snowSince = 2;
      return act('raise', 'Snow: drawing two vs his one, I caught paired wheel cards (' + hstr(c.hand) + '). SS2: rather than call and draw two as an underdog, raise and stand pat; abort if he stands pat too.', 'snow');
    }
    // SS2: always check to an opponent who is a card ahead (he bets automatically)
    if (opp && toCall === 0 && c.cardBehind && !c.made) {
