<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Lago Room — Limit 2-7 Triple Draw</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160a08">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
/* =====================================================================
   The Lago Room — Limit 2-7 Triple Draw
   Layouts: portrait (phones, 900 x variable design px) and landscape
   (1600 x 900 design px), scaled to fit the screen.
   Themes: Classic (burgundy salon), Light (high-legibility), Dark (minimal).
   ===================================================================== */

/* ---------------- theme tokens ---------------- */
body.theme-classic {
  --bg: #0c0605;
  --text: #f4ead4; --text-dim: rgba(244, 234, 212, 0.72); --muted: rgba(244, 234, 212, 0.55);
  --num: #ffe7a6; --accent: #d4b06a; --accent-hi: #f3dca0; --accent-lo: #8c6a2f; --on-accent: #1e1005;
  --panel-bg: rgba(22, 11, 9, 0.92); --panel-line: rgba(212, 176, 106, 0.4); --panel-solid: #1c0e0b;
  --plate-bg: linear-gradient(180deg, rgba(46, 24, 18, 0.97), rgba(16, 8, 6, 0.97)); --plate-border: rgba(212, 176, 106, 0.65); --plate-shadow: 0 6px 16px rgba(0,0,0,0.6);
  --avatar-ring: #d4b06a;
  --felt-bg: radial-gradient(ellipse 55% 60% at 50% 46%, #9a2236 0%, #7a1627 38%, #55101c 72%, #3e0812 100%);
  --felt-line: rgba(243, 220, 160, 0.16); --logo: rgba(243, 220, 160, 0.17);
  --rail-bg: radial-gradient(ellipse at 50% 12%, rgba(255, 220, 170, 0.22), transparent 42%), linear-gradient(180deg, #3d2318 0%, #22120c 50%, #140a07 100%);
  --track-bg: linear-gradient(180deg, #6e3a20, #4a2312 45%, #321608);
  --label-bg: rgba(10, 4, 3, 0.82); --label-text: #fff3d6; --label-border: rgba(255, 255, 255, 0.12);
  --pill-bg: rgba(255, 255, 255, 0.10); --pill-text: #fff3d6; --pill-border: rgba(212, 176, 106, 0.55);
  --pill-empty-bg: rgba(0, 0, 0, 0.35); --pill-empty-text: rgba(244, 234, 212, 0.28);
  --pill-pat-bg: #e8c46a; --pill-pat-text: #1e1005;
  --bubble-bg: #f4ead4; --bubble-text: #1a0d0a; --bubble-raise: linear-gradient(180deg, #f3d98e, #c9963c);
  --btn-fold: linear-gradient(180deg, #b23441, #6b1520); --btn-call: linear-gradient(180deg, #2f8a5d, #17482f); --btn-raise: linear-gradient(180deg, #e8bd5c, #a8771f);
  --btn-raise-text: #1e1005; --btn-draw: linear-gradient(180deg, #3a6c9f, #173452); --btn-neutral: linear-gradient(180deg, #4a3a34, #2a1e1a);
  --card-face: linear-gradient(160deg, #fffdf7 0%, #f6efdf 60%, #ece1c8 100%); --card-edge: rgba(60, 40, 20, 0.45);
  --card-back: radial-gradient(circle at 50% 50%, rgba(243, 220, 160, 0.55) 0 7%, transparent 8%), repeating-linear-gradient(45deg, rgba(243, 220, 160, 0.18) 0 2px, transparent 2px 9px), repeating-linear-gradient(-45deg, rgba(243, 220, 160, 0.18) 0 2px, transparent 2px 9px), linear-gradient(160deg, #7d1a2b, #4a0c18);
  --card-back-border: #f1e6cf;
  --good: #8fdc9b; --bad: #ff8f8f; --turn: rgba(255, 215, 130, 0.65);
  --suit-s: #15110f; --suit-c: #15110f; --suit-h: #c0142c; --suit-d: #c0142c;
  --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
body.theme-light {
  --bg: #e9edf2;
  --text: #14181d; --text-dim: #3c4652; --muted: #66717e;
  --num: #0b1b33; --accent: #1f5fbf; --accent-hi: #1f5fbf; --accent-lo: #9fb3cf; --on-accent: #ffffff;
  --panel-bg: #ffffff; --panel-line: #c5ced9; --panel-solid: #ffffff;
  --plate-bg: #ffffff; --plate-border: #9aa6b4; --plate-shadow: 0 3px 10px rgba(20, 30, 45, 0.18);
  --avatar-ring: #9aa6b4;
  --felt-bg: radial-gradient(ellipse 60% 60% at 50% 46%, #6fae86 0%, #5c9b74 60%, #4d8a64 100%);
  --felt-line: rgba(255, 255, 255, 0.35); --logo: rgba(255, 255, 255, 0.28);
  --rail-bg: linear-gradient(180deg, #5b6673, #46505b); --track-bg: #8a96a3;
  --label-bg: #ffffff; --label-text: #0b1b33; --label-border: #9aa6b4;
  --pill-bg: #ffffff; --pill-text: #0b1b33; --pill-border: #6b7786;
  --pill-empty-bg: #edf0f4; --pill-empty-text: #a2acb8;
  --pill-pat-bg: #ffcf3f; --pill-pat-text: #1b1300;
  --bubble-bg: #0b1b33; --bubble-text: #ffffff; --bubble-raise: #c77700;
  --btn-fold: #c62f3d; --btn-call: #1d8a4e; --btn-raise: #ffc233; --btn-raise-text: #1b1300; --btn-draw: #1f5fbf; --btn-neutral: #59636f;
  --card-face: #ffffff; --card-edge: #7d8794;
  --card-back: repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 3px, transparent 3px 10px), #2457a8;
  --card-back-border: #ffffff;
  --good: #137a3c; --bad: #c62f3d; --turn: rgba(31, 95, 191, 0.55);
  --suit-s: #111111; --suit-c: #111111; --suit-h: #d0021b; --suit-d: #d0021b;
  --serif: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
body.theme-dark {
  --bg: #0b0d10;
  --text: #f2f4f7; --text-dim: #b4bcc6; --muted: #7d8794;
  --num: #ffffff; --accent: #ffc94d; --accent-hi: #ffc94d; --accent-lo: #5a4a20; --on-accent: #111111;
  --panel-bg: #14171c; --panel-line: #2b313a; --panel-solid: #14171c;
  --plate-bg: #191d23; --plate-border: #343b45; --plate-shadow: none;
  --avatar-ring: #343b45;
  --felt-bg: #171b21;
  --felt-line: #262c34; --logo: rgba(255, 255, 255, 0.06);
  --rail-bg: #0f1216; --track-bg: #2b313a;
  --label-bg: #000000; --label-text: #ffc94d; --label-border: #343b45;
  --pill-bg: #262c34; --pill-text: #ffffff; --pill-border: #4a525e;
  --pill-empty-bg: #12151a; --pill-empty-text: #3e4652;
  --pill-pat-bg: #ffc94d; --pill-pat-text: #111111;
  --bubble-bg: #f2f4f7; --bubble-text: #0b0d10; --bubble-raise: #ffc94d;
  --btn-fold: #2a2f37; --btn-call: #2a2f37; --btn-raise: #ffc94d; --btn-raise-text: #111111; --btn-draw: #2a2f37; --btn-neutral: #2a2f37;
  --card-face: #ffffff; --card-edge: #000000;
  --card-back: repeating-linear-gradient(45deg, rgba(255, 201, 77, 0.10) 0 3px, transparent 3px 10px), #3a424e;
  --card-back-border: #8a95a5;
  --good: #5fd38d; --bad: #ff6b6b; --turn: rgba(255, 201, 77, 0.5);
  --suit-s: #111111; --suit-c: #111111; --suit-h: #d0021b; --suit-d: #d0021b;
  --serif: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
body.four-color { --suit-c: #138a3b !important; --suit-d: #1b5fd1 !important; }

/* ---------------- layout tokens (design px; the stage is scaled to fit) ---------------- */
body.landscape {
  --plate-w: 270px; --plate-h: 84px; --hero-plate-w: 300px; --avatar: 64px;
  --fs-name: 19px; --fs-stack: 27px; --fs-pos: 14px;
  --pill-w: 46px; --pill-h: 36px; --fs-pill: 23px;
  --fs-bet: 23px; --fs-pot: 27px; --fs-bubble: 20px; --fs-label: 19px;
  --fs-street: 19px; --fs-street-sub: 15px;
  --fs-btn: 24px; --fs-btn-sub: 20px; --btn-h: 80px; --fs-msg: 17px;
  --chip: 30px; --dealer: 40px;
  --hero-cw: 108px; --hero-ch: 150px; --bot-cw: 58px; --bot-ch: 80px;
}
body.landscape.compact {
  --fs-name: 21px; --fs-stack: 31px; --pill-w: 50px; --pill-h: 40px; --fs-pill: 27px;
  --fs-bet: 27px; --fs-pot: 31px; --fs-bubble: 23px; --fs-label: 22px; --fs-street: 22px; --fs-street-sub: 18px;
  --fs-btn: 28px; --fs-btn-sub: 24px; --btn-h: 88px; --fs-msg: 20px;
}
body.portrait {
  --plate-w: 222px; --plate-h: 96px; --hero-plate-w: 340px; --avatar: 56px;
  --fs-name: 25px; --fs-stack: 35px; --fs-pos: 21px;
  --pill-w: 62px; --pill-h: 48px; --fs-pill: 33px;
  --fs-bet: 33px; --fs-pot: 38px; --fs-bubble: 29px; --fs-label: 27px;
  --fs-street: 28px; --fs-street-sub: 23px;
  --fs-btn: 40px; --fs-btn-sub: 33px; --btn-h: 150px; --fs-msg: 26px;
  --chip: 38px; --dealer: 52px;
  --hero-cw: 156px; --hero-ch: 218px; --bot-cw: 66px; --bot-ch: 92px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; touch-action: manipulation; }
body.portrait .land-only, body.landscape .port-only { display: none !important; }

/* ---------------- room (classic only) ---------------- */
#room { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
body:not(.theme-classic) #room > div { display: none; }
.room-wall { position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255, 196, 120, 0.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 158px, rgba(212,176,106,0.10) 158px 160px, rgba(0,0,0,0.25) 160px 164px, rgba(0,0,0,0) 164px 322px),
    linear-gradient(180deg, #3a1714 0%, #2a0f0d 38%, #1b0a08 62%, #120706 100%); }
.room-wall::after { content: ''; position: absolute; left: 0; right: 0; top: 57%; height: 10px; background: linear-gradient(180deg, #8c6a2f, #f0d79a 40%, #6b4d1f); opacity: 0.35; }
.room-glow { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 12% 22%, rgba(255, 190, 110, 0.20), transparent 9%), radial-gradient(circle at 88% 22%, rgba(255, 190, 110, 0.20), transparent 9%); }
.room-chandelier { position: absolute; left: 50%; top: -60px; width: 900px; height: 260px; transform: translateX(-50%); pointer-events: none; filter: blur(14px); opacity: 0.55;
  background: radial-gradient(circle at 20% 40%, rgba(255, 120, 60, 0.55), transparent 12%), radial-gradient(circle at 34% 60%, rgba(255, 200, 80, 0.55), transparent 11%), radial-gradient(circle at 48% 38%, rgba(240, 90, 120, 0.45), transparent 12%), radial-gradient(circle at 62% 62%, rgba(110, 170, 255, 0.35), transparent 11%), radial-gradient(circle at 76% 42%, rgba(255, 170, 70, 0.5), transparent 12%); }
.room-carpet { position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
  background: radial-gradient(circle at 50% 50%, rgba(212,176,106,0.10) 0 3px, transparent 4px) 0 0 / 38px 38px, linear-gradient(180deg, rgba(40, 8, 10, 0) 0%, #2c0a0d 30%, #1d0608 100%); }
.room-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 52%, transparent 45%, rgba(0,0,0,0.72) 100%); }

/* ---------------- stage ---------------- */
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage { position: relative; width: 1600px; height: 900px; transform-origin: 50% 50%; flex: none; }
#spot-cone { position: absolute; left: 260px; top: -120px; width: 1080px; height: 980px; pointer-events: none; display: none;
  background: radial-gradient(ellipse 50% 60% at 50% 55%, rgba(255, 214, 150, 0.16), rgba(255, 200, 130, 0.06) 45%, transparent 70%);
  clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); filter: blur(18px); mix-blend-mode: screen; }
body.theme-classic.landscape #spot-cone { display: block; }

/* ---------------- top bar & info bar ---------------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; z-index: 20; pointer-events: none; }
#topbar > * { pointer-events: auto; }
#brand { display: flex; align-items: center; gap: 14px; color: var(--accent-hi); }
#brand .crest { color: var(--accent-hi); }
#brand .t1 { font-family: var(--serif); letter-spacing: 6px; color: var(--accent-hi); white-space: nowrap; }
#brand .t2 { letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; white-space: nowrap; }
#toolbar { display: flex; align-items: center; }
.tb { position: relative; border: 2px solid var(--panel-line); background: var(--panel-bg); color: var(--text); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.tb svg { fill: none; stroke: var(--accent-hi); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tb.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.tb .badge { position: absolute; top: -8px; right: -8px; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: #d23545; color: #fff; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px var(--bg); }
#infobar { position: absolute; z-index: 20; display: flex; justify-content: space-between; align-items: center; color: var(--text-dim); pointer-events: none; }
#infobar > * { pointer-events: auto; }
#infobar-right { display: flex; align-items: center; gap: 14px; }
#session-net b { font-weight: 800; color: var(--text); }
#session-net .pos { color: var(--good); } #session-net .neg { color: var(--bad); }
.ib-btn { border: 2px solid var(--accent); background: transparent; color: var(--accent-hi); font-weight: 800; border-radius: 22px; cursor: pointer; }

body.landscape #topbar { height: 74px; padding: 0 22px 0 26px; }
body.landscape #brand .crest { width: 48px; height: 48px; }
body.landscape #brand .t1 { font-size: 23px; }
body.landscape #brand .t2 { font-size: 13px; margin-top: 2px; }
body.landscape #toolbar { gap: 8px; }
body.landscape .tb { height: 44px; padding: 0 15px; border-radius: 22px; font-size: 15px; gap: 8px; }
body.landscape .tb svg { width: 19px; height: 19px; }
body.landscape .tb.icon-only { width: 44px; padding: 0; }
body.landscape #infobar { left: 26px; right: 24px; top: 76px; font-size: 15px; }
/* phone held sideways: bigger icon-only toolbar, larger info text */
body.landscape.compact #brand .t2 { display: none; }
body.landscape.compact #brand .t1 { font-size: 28px; }
body.landscape.compact .tb { width: 66px; height: 58px; padding: 0; border-radius: 16px; }
body.landscape.compact .tb span { display: none; }
body.landscape.compact .tb svg { width: 30px; height: 30px; }
body.landscape.compact #infobar { top: 78px; font-size: 21px; }
body.landscape.compact #log { font-size: 19px; }

body.portrait #topbar { height: 96px; padding: 0 16px 0 22px; }
body.portrait #brand { gap: 12px; }
body.portrait #brand .crest { width: 58px; height: 58px; }
body.portrait #brand .t1 { font-size: 30px; letter-spacing: 4px; }
body.portrait #brand .t2 { display: none; }
body.portrait #toolbar { gap: 10px; }
body.portrait .tb { width: 84px; height: 76px; border-radius: 18px; }
body.portrait .tb span { display: none; }
body.portrait .tb svg { width: 38px; height: 38px; }
body.portrait #infobar { left: 22px; right: 22px; top: 98px; height: 52px; font-size: 25px; }
body.portrait .ib-btn { font-size: 24px; padding: 6px 18px; }

/* ---------------- table ---------------- */
#table { position: absolute; }
#table .shadow { position: absolute; inset: 18px -10px -38px -10px; border-radius: 50%; background: rgba(0,0,0,0.55); filter: blur(30px); }
body.theme-light #table .shadow { background: rgba(30, 45, 60, 0.25); }
body.theme-dark #table .shadow { display: none; }
#table .rail { position: absolute; inset: 0; border-radius: 50%; background: var(--rail-bg);
  box-shadow: inset 0 2px 1px rgba(255, 225, 180, 0.28), inset 0 -6px 14px rgba(0,0,0,0.7), 0 10px 30px rgba(0,0,0,0.5); }
body.theme-light #table .rail { box-shadow: inset 0 2px 1px rgba(255,255,255,0.25), 0 6px 18px rgba(20,30,45,0.25); }
body.theme-dark #table .rail { box-shadow: none; border: 2px solid #232830; }
#table .racetrack { position: absolute; inset: 30px; border-radius: 50%; background: var(--track-bg);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45), inset 0 0 0 4px var(--accent-lo), inset 0 0 0 5px rgba(243, 220, 160, 0.5); }
body:not(.theme-classic) #table .racetrack { box-shadow: none; }
#table .felt { position: absolute; inset: 50px; border-radius: 50%; overflow: hidden; background: var(--felt-bg);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4), inset 0 12px 40px rgba(0,0,0,0.5); }
body.theme-light #table .felt { box-shadow: inset 0 0 0 3px rgba(255,255,255,0.35), inset 0 8px 24px rgba(0,0,0,0.12); }
body.theme-dark #table .felt { box-shadow: inset 0 0 0 2px #262c34; }
body.theme-classic #table .felt::before { content: ''; position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0.9 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>"); }
#table .felt::after { content: ''; position: absolute; inset: 44px 60px; border-radius: 50%; border: 2px solid var(--felt-line); }
#table .felt-light { position: absolute; inset: 50px; border-radius: 50%; pointer-events: none; display: none;
  background: radial-gradient(ellipse 42% 46% at 50% 44%, rgba(255, 222, 170, 0.20), transparent 70%); mix-blend-mode: screen; }
body.theme-classic #table .felt-light { display: block; }
.felt-logo { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; color: var(--logo); pointer-events: none; white-space: nowrap; }
.felt-logo .ln1 { font-family: var(--serif); letter-spacing: 12px; text-indent: 12px; }
.felt-logo .ln2 { font-family: var(--serif); letter-spacing: 6px; text-indent: 6px; margin-top: 4px; }
.felt-crest { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 160px; height: 160px; color: var(--logo); opacity: 0.6; }
body.theme-dark .felt-crest { display: none; }
body.landscape .felt-logo { top: 58px; } body.landscape .felt-logo .ln1 { font-size: 34px; } body.landscape .felt-logo .ln2 { font-size: 13px; }
body.portrait .felt-logo { bottom: 70px; } body.portrait .felt-logo .ln1 { font-size: 44px; } body.portrait .felt-logo .ln2 { display: none; }
body.portrait .felt-crest { width: 200px; height: 200px; }

/* ---------------- center: pot with burn cards (one per draw = the street) ---------------- */
#pot { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; z-index: 7; cursor: pointer; }
#pot .pot-stack { position: relative; min-width: calc(var(--chip) * 3.2); height: calc(var(--chip) * 1.9); display: flex; align-items: flex-end; justify-content: center; }
#pot .pot-chips { position: relative; z-index: 2; display: flex; align-items: flex-end; }
#pot .pot-burns { position: absolute; left: 50%; bottom: calc(var(--chip) * 0.35); width: 0; height: 0; z-index: 1; }
#pot .pot-burns .card { --cw: calc(var(--chip) * 1.4); --ch: calc(var(--chip) * 1.96); bottom: 0; top: auto; transform-origin: 50% 100%; }
#pot .pot-amt { margin-top: 6px; background: var(--label-bg); border: 2px solid var(--label-border); color: var(--label-text); padding: 4px 18px; border-radius: 999px; font-size: var(--fs-pot); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
#pot .pot-game { margin-top: 3px; color: var(--label-text); opacity: 0.6; font-size: calc(var(--fs-pot) * 0.62); font-weight: 600; letter-spacing: 0.04em; white-space: nowrap; }
#pot .pot-tip { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 8px; display: none; white-space: nowrap; z-index: 30;
  font-size: var(--fs-bet); font-weight: 700; padding: 6px 16px; border-radius: 12px; background: var(--panel-solid); color: var(--text); border: 2px solid var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
#pot .pot-tip b { color: var(--accent-hi); }
#pot.tip .pot-tip { display: block; }
@media (hover: hover) { #pot:hover .pot-tip { display: block; } }
#pot.empty { opacity: 0; pointer-events: none; }

/* ---------------- cards (sizes in em: 100em = card width) ---------------- */
.card { --cw: var(--hero-cw); --ch: var(--hero-ch); position: absolute; width: var(--cw); height: var(--ch); font-size: calc(var(--cw) / 100); border-radius: 8em; }
.card.sm { --cw: var(--bot-cw); --ch: var(--bot-ch); }
.card.face { background: var(--card-face); color: var(--suit-s); box-shadow: 0 0 0 1.6em var(--card-edge), 0 6em 14em rgba(0,0,0,0.35); }
body.theme-classic .card.face { box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 0 0 1em var(--card-edge), 0 5em 12em rgba(0,0,0,0.45); }
body.theme-dark .card.face { box-shadow: 0 0 0 1.4em #000; }
.card.face.su-h { color: var(--suit-h); } .card.face.su-d { color: var(--suit-d); } .card.face.su-c { color: var(--suit-c); }
.card .cr { position: absolute; left: 7em; top: 4em; display: flex; flex-direction: column; align-items: center; line-height: 1; }
.card .cr .rk { font-size: 36em; font-weight: 800; letter-spacing: -1px; font-family: "Segoe UI", system-ui, Roboto, Arial, sans-serif; }
body.theme-classic .card .cr .rk { font-family: var(--serif); font-weight: 700; }
.card .cr svg { width: 22em; height: 22em; margin-top: 2em; fill: currentColor; }
.card .cr.br { left: auto; top: auto; right: 7em; bottom: 4em; transform: rotate(180deg); }
.card .pip { position: absolute; left: 50%; top: 57%; width: 50em; height: 50em; transform: translate(-50%, -50%); fill: currentColor; }
.card .face-letter { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); font-size: 58em; font-weight: 800; opacity: 0.9; }
.card .face-frame { position: absolute; inset: 24em 20em; border: 1.6em solid currentColor; border-radius: 5em; opacity: 0.28; }
.card.sm .cr { left: 6em; top: 3em; }
.card.sm .cr .rk { font-size: 46em; }
.card.sm .cr svg { width: 28em; height: 28em; }
.card.sm .cr.br, .card.sm .face-letter, .card.sm .face-frame { display: none; }
.card.sm .pip { width: 44em; height: 44em; left: 64%; top: 70%; }
.card.back { background: var(--card-back); box-shadow: inset 0 0 0 4em var(--card-back-border), 0 0 0 1em rgba(0,0,0,0.5), 0 4em 10em rgba(0,0,0,0.4); }
body.theme-dark .card.back { box-shadow: inset 0 0 0 3em var(--card-back-border); }

/* hero hand */
#hero-cards { position: absolute; }
#hero-cards .card { transition: left 0.38s cubic-bezier(.2,.8,.2,1), top 0.22s ease, filter 0.2s, opacity 0.2s; }
#hero-cards.selectable .card { cursor: pointer; }
#hero-cards .card.sel { top: -18% !important; }
#hero-cards .card.sel::after { content: 'DISCARD'; position: absolute; left: 0; right: 0; bottom: 0.7em; text-align: center; font-size: 14em; font-weight: 800; letter-spacing: 0.04em; color: #fff; background: #c62f3d; padding: 0.2em 0; }
#hero-cards .card.sel { filter: saturate(0.75) brightness(0.96); }
#hero-cards.folded .card { filter: grayscale(0.7) brightness(0.55); }

/* ---------------- seats ---------------- */
.seat { position: absolute; width: 0; height: 0; }
.seat .plate { position: absolute; left: calc(var(--plate-w) / -2); top: calc(var(--plate-h) / -2); width: var(--plate-w); height: var(--plate-h); z-index: 3;
  display: flex; align-items: center; gap: 10px; padding: 0 12px 0 10px; border-radius: calc(var(--plate-h) / 2);
  background: var(--plate-bg); border: 2px solid var(--plate-border); box-shadow: var(--plate-shadow); }
.seat.hero .plate { width: var(--hero-plate-w); left: calc(var(--hero-plate-w) / -2); }
.seat .avatar { position: relative; flex: none; width: var(--avatar); height: var(--avatar); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: var(--av, #555); color: #fff; font-weight: 800; font-size: calc(var(--avatar) * 0.36); box-shadow: 0 0 0 3px var(--avatar-ring); }
body.theme-classic .seat .avatar { font-family: var(--serif); font-weight: 400; font-size: calc(var(--avatar) * 0.4); }
.seat .ptext { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; line-height: 1.08; }
.seat .pname { font-size: var(--fs-name); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat .pstack { font-size: var(--fs-stack); font-weight: 800; color: var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.5px; }
.seat .pos { position: absolute; right: 14px; top: calc(var(--fs-pos) * -0.95); font-size: var(--fs-pos); font-weight: 800; letter-spacing: 1px; padding: 2px 9px; border-radius: 999px; background: var(--panel-solid); border: 2px solid var(--accent); color: var(--accent-hi); }
.seat .pos:empty { display: none; }
.seat .allin { position: absolute; left: 50%; bottom: calc(var(--fs-pos) * -0.95); transform: translateX(-50%); font-size: var(--fs-pos); font-weight: 800; padding: 1px 10px; border-radius: 999px; background: #d23545; color: #fff; display: none; }
.seat.is-allin .allin { display: block; }
.seat .draws { position: absolute; transform: translate(-50%, -50%); display: flex; gap: 6px; z-index: 4; }
.seat .draws i { display: flex; align-items: center; justify-content: center; width: var(--pill-w); height: var(--pill-h); border-radius: 10px; font-style: normal; font-size: var(--fs-pill); font-weight: 800; font-variant-numeric: tabular-nums;
  background: var(--pill-empty-bg); color: var(--pill-empty-text); border: 2px solid transparent; }
.seat .draws i.done { background: var(--pill-bg); color: var(--pill-text); border-color: var(--pill-border); }
.seat .draws i.pat { background: var(--pill-pat-bg); color: var(--pill-pat-text); border-color: var(--pill-pat-bg); font-size: calc(var(--fs-pill) * 0.62); letter-spacing: 0.5px; }
.seat .draws i.next { border: 2px dashed var(--accent); }
.seat .bubble { position: absolute; transform: translate(-50%, -50%) scale(0.6); opacity: 0; transition: transform 0.2s ease, opacity 0.2s ease; z-index: 6; white-space: nowrap; pointer-events: none;
  padding: 3px 14px; border-radius: 999px; font-size: var(--fs-bubble); font-weight: 800; background: var(--bubble-bg); color: var(--bubble-text); box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
.seat .bubble.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.seat .bubble.raise, .seat .bubble.bet, .seat .bubble.cap { background: var(--bubble-raise); color: #1b1300; }
.seat .bubble.fold, .seat .bubble.muck { background: #6b6460; color: #fff; }
.seat .bubble.draw { background: #1f4f86; color: #fff; }
.seat .bubble.pat { background: var(--pill-pat-bg); color: var(--pill-pat-text); }
.seat .cards { position: absolute; left: 0; top: 0; z-index: 2; }
.seat .hand-label { position: absolute; transform: translate(-50%, -50%); z-index: 7; white-space: nowrap; font-size: var(--fs-label); font-weight: 800; padding: 3px 14px; border-radius: 999px;
  background: var(--label-bg); border: 2px solid var(--accent); color: var(--label-text); display: none; }
.seat .hand-label.show { display: block; }
.seat .hand-label.win { background: var(--accent); color: var(--on-accent); }
.seat.folded .plate { opacity: 0.45; filter: grayscale(0.6); }
.seat.folded .draws { opacity: 0.45; }
.seat.turn .plate { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent), 0 0 24px var(--turn); }
.seat .timer { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); pointer-events: none; display: none; }
.seat.turn.thinking .timer { display: block; }
.seat .timer circle { fill: none; stroke: var(--accent); stroke-width: 4; stroke-dasharray: 214; transform: rotate(-90deg); transform-origin: 50% 50%; animation: think 1.2s linear infinite; stroke-linecap: round; }
@keyframes think { 0% { stroke-dashoffset: 214; } 100% { stroke-dashoffset: -214; } }
.seat.winner .plate { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent), 0 0 30px var(--turn); }

#dealer-btn { position: absolute; width: var(--dealer); height: var(--dealer); margin: calc(var(--dealer) / -2) 0 0 calc(var(--dealer) / -2); border-radius: 50%; z-index: 8;
  background: radial-gradient(circle at 40% 35%, #ffffff, #e8e2d6 60%, #bfb6a4); box-shadow: 0 0 0 2px #6b5a3a, 0 3px 8px rgba(0,0,0,0.5);
  color: #1a0d0a; font-weight: 800; font-size: calc(var(--dealer) * 0.5); display: flex; align-items: center; justify-content: center;
  transition: left 0.6s cubic-bezier(.3,.9,.3,1), top 0.6s cubic-bezier(.3,.9,.3,1); }
body.theme-dark #dealer-btn { background: #ffffff; box-shadow: none; }

/* ---------------- chips & bets ---------------- */
.bet { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; z-index: 6; pointer-events: none; }
.bet .amt { font-size: var(--fs-bet); font-weight: 800; color: var(--label-text); background: var(--label-bg); padding: 2px 12px; border-radius: 999px; font-variant-numeric: tabular-nums; border: 2px solid var(--label-border); white-space: nowrap; }
.chipstack { position: relative; display: flex; gap: 3px; align-items: flex-end; }
.chipcol { position: relative; width: var(--chip); }
.chip { position: absolute; left: 0; width: var(--chip); height: var(--chip); border-radius: 50%;
  background: radial-gradient(circle, var(--c) 0 34%, rgba(255,255,255,0.95) 35% 39%, var(--c) 40% 62%, transparent 63%), repeating-conic-gradient(from 8deg, #fff 0 14deg, var(--c) 14deg 45deg);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 2px 0 rgba(0,0,0,0.5); }
.chip.c1 { --c: #8fa3b8; } .chip.c5 { --c: #b3192e; } .chip.c25 { --c: #1f7a43; } .chip.c100 { --c: #1b1b1f; } .chip.c500 { --c: #6a2c8f; }
.chip.c1000 { --c: #c9962e; } .chip.c5000 { --c: #b5622a; } .chip.c25000 { --c: #1c8a8a; }
.fly-chip { position: absolute; z-index: 30; transition: transform 0.45s cubic-bezier(.3,.8,.3,1), opacity 0.45s; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
#fx .card { transition: transform var(--dur, 0.32s) cubic-bezier(.25,.8,.3,1), opacity 0.25s; }

/* ---------------- action panel ---------------- */
#action-panel { position: absolute; z-index: 25; }
#action-panel .msg { font-size: var(--fs-msg); color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.theme-light #action-panel .msg { color: var(--text-dim); }
#action-btns, #pre-actions { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; }
.abtn { position: relative; flex: 1; height: var(--btn-h); border-radius: 14px; border: 2px solid rgba(0,0,0,0.25); cursor: pointer; color: #fff; font-weight: 800; font-size: var(--fs-btn);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: transform .08s, filter .15s; }
body.theme-classic .abtn { box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -3px 0 rgba(0,0,0,0.25), 0 6px 14px rgba(0,0,0,0.55); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
.abtn small { font-size: var(--fs-btn-sub); font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.95; }
.abtn:active { transform: translateY(2px); }
.abtn:disabled { opacity: 0.35; cursor: default; filter: grayscale(0.5); }
.abtn kbd { position: absolute; right: 10px; top: 6px; font-family: inherit; font-size: 12px; opacity: 0.5; font-weight: 700; }
body.portrait .abtn kbd { display: none; }
.abtn.fold { background: var(--btn-fold); }
.abtn.call, .abtn.deal { background: var(--btn-call); }
.abtn.raise, .abtn.pat { background: var(--btn-raise); color: var(--btn-raise-text); text-shadow: none !important; }
.abtn.draw { background: var(--btn-draw); }
.abtn.neutral { background: var(--btn-neutral); }
body.theme-dark .abtn.fold { border-color: #d0485a; color: #ff8a96; }
body.theme-dark .abtn.call, body.theme-dark .abtn.deal { border-color: #3fbf75; color: #7ff0ae; }
body.theme-dark .abtn.draw { border-color: #5aa0ff; color: #a9cdff; }
body.theme-dark .abtn.neutral { border-color: #4a525e; color: #d6dbe1; }
.pre { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; height: calc(var(--btn-h) * 0.7); border-radius: 14px; background: var(--panel-bg); border: 2px solid var(--panel-line); cursor: pointer; font-size: calc(var(--fs-btn) * 0.75); font-weight: 700; color: var(--text); }
.pre .box { width: 1.1em; height: 1.1em; border-radius: 5px; border: 3px solid var(--accent); display: flex; align-items: center; justify-content: center; }
.pre.on { border-color: var(--accent); }
.pre.on .box { background: var(--accent); }
.pre.on .box::after { content: ''; width: 0.5em; height: 0.28em; border-left: 3px solid var(--on-accent); border-bottom: 3px solid var(--on-accent); transform: rotate(-45deg) translate(1px, -1px); }

body.landscape #action-panel { right: 24px; bottom: 16px; width: 500px; height: 124px; }
body.landscape #action-panel .msg { position: absolute; left: 0; right: 0; top: 0; text-align: right; }
body.portrait #action-panel { left: 24px; right: 24px; bottom: 22px; height: calc(var(--btn-h) + 50px); }
body.portrait #action-panel .msg { position: absolute; left: 0; right: 0; top: 0; text-align: center; }

/* ---------------- log panel (landscape) ---------------- */
#log-panel { position: absolute; left: 20px; bottom: 16px; width: 440px; height: 160px; z-index: 22; border-radius: 12px; background: var(--panel-bg); border: 2px solid var(--panel-line); display: flex; flex-direction: column; overflow: hidden; }
body.portrait #log-panel { display: none; }
#log-panel .lh { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-hi); padding: 7px 12px 4px; border-bottom: 1px solid var(--panel-line); font-weight: 700; }
#log { flex: 1; overflow-y: auto; padding: 4px 12px 8px; font-size: 15px; line-height: 1.45; color: var(--text); user-select: text; }
#log div, .log-live div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:is(#log, .log-live, .hh-log) .hand { color: var(--accent-hi); margin-top: 4px; font-weight: 700; }
:is(#log, .log-live, .hh-log) .win { color: var(--good); font-weight: 700; }
:is(#log, .log-live, .hh-log) .show { color: var(--accent-hi); }
:is(#log, .log-live, .hh-log) .draw { color: #3f86e8; }
body.theme-classic :is(#log, .log-live, .hh-log) .draw { color: #a9c9ea; }
:is(#log, .log-live, .hh-log) .sys { color: var(--muted); font-style: italic; }

/* ---------------- banner ---------------- */
#banner { position: absolute; transform: translate(-50%, -50%) scale(0.9); opacity: 0; z-index: 35; pointer-events: none; transition: all 0.3s ease;
  padding: 10px 28px; border-radius: 28px; background: var(--panel-solid); border: 2px solid var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  font-size: calc(var(--fs-pot) * 0.8); font-weight: 800; color: var(--text); white-space: nowrap; text-align: center; }
#banner small { display: block; font-size: 0.7em; font-weight: 600; color: var(--text-dim); margin-top: 2px; }
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
body.zooming .card, body.zooming #dealer-btn, body.zooming .seat .bubble { transition: none !important; }
body.zooming #seats, body.zooming #bets, body.zooming #pot { opacity: 0.55; }

/* ---------------- drawer (native px) ---------------- */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100vw; z-index: 60; transform: translateX(100%); transition: transform 0.3s cubic-bezier(.3,.9,.3,1);
  background: var(--panel-solid); border-left: 2px solid var(--panel-line); box-shadow: -14px 0 40px rgba(0,0,0,0.45); display: flex; flex-direction: column; color: var(--text); }
body.portrait #drawer { width: 100vw; border-left: none; }
#drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; padding: 10px 12px 0; gap: 2px; border-bottom: 2px solid var(--panel-line); padding-top: max(10px, env(safe-area-inset-top)); }
.tab { padding: 12px 12px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.on { color: var(--accent-hi); border-bottom-color: var(--accent); }
.drawer-close { margin-left: auto; width: 40px; height: 40px; border-radius: 20px; border: 2px solid var(--panel-line); background: transparent; color: var(--text); cursor: pointer; font-size: 18px; margin-bottom: 6px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px 40px; font-size: 15px; line-height: 1.5; user-select: text; -webkit-user-select: text; }
.drawer-body h4 { font-family: var(--serif); font-weight: 700; color: var(--accent-hi); font-size: 18px; margin: 14px 0 6px; }
.log-live { font-size: 15px; line-height: 1.55; }
.hh-item { border: 2px solid var(--panel-line); border-radius: 10px; margin-bottom: 8px; }
.hh-sum { padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; flex-wrap: wrap; }
.hh-sum .n { color: var(--accent-hi); font-weight: 700; }
.hh-sum .r { font-variant-numeric: tabular-nums; font-weight: 800; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.hh-log { display: none; padding: 4px 12px 10px; font-size: 14px; border-top: 1px dashed var(--panel-line); }
.hh-item.open .hh-log { display: block; }
.mini-cards { display: inline-flex; gap: 2px; vertical-align: middle; }
.mc { display: inline-block; min-width: 26px; padding: 1px 4px; border-radius: 4px; background: #ffffff; color: #111; font-weight: 800; font-size: 14px; text-align: center; line-height: 18px; border: 1px solid #9aa6b4; }
.mc.h { color: var(--suit-h); } .mc.d { color: var(--suit-d); } .mc.c { color: var(--suit-c); }
.mc.dim { opacity: 0.45; }
.rv-player { border: 2px solid var(--panel-line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.rv-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.rv-head .nm { font-weight: 800; }
.rv-head .ps { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 1px 7px; border-radius: 8px; border: 2px solid var(--accent); color: var(--accent-hi); }
.rv-head .net { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.rv-line { font-size: 14px; margin: 4px 0; }
.st { display: inline-block; min-width: 66px; color: var(--accent-hi); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
.rv-dec { font-size: 14px; margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--panel-line); }
.tagb { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 1px 6px; border-radius: 7px; margin-right: 5px; text-transform: uppercase; vertical-align: 1px; background: rgba(127,127,127,0.25); color: var(--text); }
.tagb.snow { background: #2c4b6e; color: #dcebfa; } .tagb.freeze { background: #2a5d6a; color: #d9f5fb; } .tagb.play { background: #6e3a2a; color: #ffe2d3; }
.tagb.mdf { background: #3f5a2a; color: #e6f8d4; } .tagb.bluff { background: #7a2235; color: #ffe0e6; } .tagb.check-raise { background: #5c3a7a; color: #f0e2ff; }
.tagb.steal { background: #6a5520; color: #fff1c9; } .tagb.isolate { background: #23524a; color: #d6fff7; } .tagb.card-ahead { background: #234e7a; color: #dcecff; }
.rv-empty, .muted { color: var(--muted); font-style: italic; }
.rv-player.coach { border-color: var(--accent); }
.coach-sum { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.vb { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.6px; padding: 2px 8px; border-radius: 9px; text-transform: uppercase; }
.vb.agree { background: #1f7a43; color: #fff; } .vb.mixed { background: #b07a12; color: #fff; } .vb.differs { background: #c62f3d; color: #fff; }
.cn { padding: 8px 0 8px 10px; border-left: 4px solid var(--panel-line); margin: 6px 0; }
.cn.cn-agree { border-left-color: #1f7a43; } .cn.cn-mixed { border-left-color: #b07a12; } .cn.cn-differs { border-left-color: #c62f3d; }
.cn-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.cn-line { font-size: 14px; margin: 2px 0; }
.cn-why { font-size: 14px; margin-top: 3px; line-height: 1.45; }
table.stats { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.stats th { text-align: right; font-weight: 700; color: var(--accent-hi); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 6px 4px; border-bottom: 2px solid var(--panel-line); }
table.stats td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--panel-line); }
table.stats th:first-child, table.stats td:first-child { text-align: left; }
table.stats tr.me td { font-weight: 800; }
.stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { border: 2px solid var(--panel-line); border-radius: 10px; padding: 9px 10px; }
.stat-card .k { font-size: 11px; letter-spacing: 1px; color: var(--accent-hi); text-transform: uppercase; font-weight: 700; }
.stat-card .v { font-size: 22px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sel-hand { background: var(--panel-solid); color: var(--text); border: 2px solid var(--panel-line); border-radius: 8px; padding: 6px 8px; font-size: 15px; }
.drawer-body::-webkit-scrollbar, #log::-webkit-scrollbar { width: 8px; }
.drawer-body::-webkit-scrollbar-thumb, #log::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 4px; }

/* ---------------- modals (native px) ---------------- */
#modal-root { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(5, 5, 8, 0.6); }
#modal-root.show { display: flex; }
.modal { width: 580px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; border-radius: 18px; padding: 26px 28px 24px;
  background: var(--panel-solid); border: 2px solid var(--accent); box-shadow: 0 30px 80px rgba(0,0,0,0.6); color: var(--text); }
body.theme-classic .modal { background: linear-gradient(180deg, #2a1410, #140906); }
.modal.wide { width: 720px; }
.modal h2 { font-family: var(--serif); font-weight: 700; color: var(--accent-hi); font-size: 28px; letter-spacing: 2px; margin: 4px 0 6px; text-align: center; }
body.theme-classic .modal h2 { font-weight: 400; letter-spacing: 3px; }
.modal .sub { text-align: center; color: var(--text-dim); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
.modal p, .modal li { font-size: 15px; line-height: 1.6; }
.modal .crest { display: block; width: 80px; height: 80px; margin: 0 auto 6px; color: var(--accent-hi); }
.modal .row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.mbtn { min-width: 160px; min-height: 50px; padding: 0 22px; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--on-accent); }
body.theme-classic .mbtn { background: linear-gradient(180deg, #e2b75a, #a8771f); border-color: rgba(0,0,0,0.4); color: #1e1005; }
.mbtn.ghost { background: transparent !important; color: var(--text) !important; border: 2px solid var(--panel-line); }
.mbtn:disabled { opacity: 0.4; cursor: default; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--panel-line); font-size: 16px; }
.setting .lbl { font-weight: 600; }
.setting .lbl small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.set-group { margin-top: 18px; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-hi); }
.seg { display: flex; border: 2px solid var(--panel-line); border-radius: 20px; overflow: hidden; flex: none; }
.seg button { background: transparent; border: none; color: var(--text); padding: 9px 13px; font-size: 14px; font-weight: 700; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.switch { width: 52px; height: 30px; border-radius: 15px; background: rgba(127,127,127,0.35); border: 2px solid var(--panel-line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--accent); border-color: var(--accent); }
.switch.on::after { left: 25px; }
.theme-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.theme-opt { border: 3px solid var(--panel-line); border-radius: 12px; padding: 8px; cursor: pointer; text-align: center; font-weight: 800; font-size: 14px; background: transparent; color: var(--text); }
.theme-opt.on { border-color: var(--accent); }
.theme-opt .sw { height: 54px; border-radius: 8px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.theme-opt .sw span { width: 22px; height: 30px; border-radius: 4px; background: #fff; border: 1px solid #777; font-size: 13px; color: #111; display: flex; align-items: center; justify-content: center; font-weight: 800; }
.stakes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 8px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; }
.field input { width: 100%; font-size: 20px; font-weight: 800; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--panel-line); background: var(--bg); color: var(--text); font-variant-numeric: tabular-nums; -webkit-user-select: text; user-select: text; }
.field input:focus { outline: none; border-color: var(--accent); }
.field .ro { font-size: 20px; font-weight: 800; padding: 10px 12px; border-radius: 10px; border: 2px dashed var(--panel-line); color: var(--text-dim); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.presets button { border: 2px solid var(--panel-line); background: transparent; color: var(--text); border-radius: 18px; padding: 7px 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
.err { color: var(--bad); font-weight: 700; font-size: 14px; min-height: 20px; margin-top: 10px; }
.rank-list { columns: 2; font-size: 14px; padding-left: 18px; }
.rules h3 { font-family: var(--serif); color: var(--accent-hi); font-size: 18px; margin: 16px 0 4px; }
.rules ul { margin: 4px 0; padding-left: 20px; }
.kbd { display: inline-block; border: 1px solid var(--panel-line); border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--accent-hi); }
body.portrait .modal { padding: 22px 18px 20px; }
body.portrait .setting { font-size: 17px; }
body.portrait .seg button { padding: 10px 11px; font-size: 14px; }

/* ---------------- play every seat ---------------- */
#focus-tag { position: absolute; transform: translate(-50%, -50%); z-index: 24; pointer-events: none; opacity: 0; transition: opacity 0.2s;
  padding: 5px 16px; border-radius: 16px; background: var(--panel-solid); border: 2px solid var(--accent); color: var(--text);
  font-size: calc(var(--fs-msg) * 0.95); font-weight: 800; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
#focus-tag.show { opacity: 1; }
.setting.off { opacity: 0.45; }
.setting.off .switch { cursor: not-allowed; }
.cn-seat { margin: 0 8px; }
/* play every seat: seats and bets glide round when the table turns to the next player */
body.turning .seat, body.turning .bet, body.turning #dealer-btn { transition: left 0.42s cubic-bezier(.3,.9,.3,1), top 0.42s cubic-bezier(.3,.9,.3,1); }
/* play every seat, fixed table: a glowing yellow ring marks the seat being played */
@keyframes seatGlow { 0%, 100% { box-shadow: 0 0 0 4px #ffd21f, 0 0 22px 6px rgba(255, 210, 31, 0.75); } 50% { box-shadow: 0 0 0 6px #ffe14d, 0 0 40px 14px rgba(255, 210, 31, 0.95); } }
.seat.glow .plate { border-color: #ffd21f !important; animation: seatGlow 1.4s ease-in-out infinite; }
.seat.glow .avatar { box-shadow: 0 0 0 4px #ffd21f, 0 0 18px 6px rgba(255, 210, 31, 0.9); }
.seat.glow { --gw: var(--plate-w); }
.seat.hero.glow { --gw: var(--hero-plate-w); }
.seat.glow::before { content: ''; position: absolute; left: calc(var(--gw) / -2 - 30px); top: calc(var(--plate-h) / -2 - 34px); width: calc(var(--gw) + 60px); height: calc(var(--plate-h) + 68px);
  border-radius: 50%; border: 5px solid #ffd21f; box-shadow: 0 0 24px 6px rgba(255, 210, 31, 0.7), inset 0 0 24px 4px rgba(255, 210, 31, 0.45); pointer-events: none; z-index: 1; animation: seatRing 1.4s ease-in-out infinite; }
@keyframes seatRing { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

  <script>
/* =====================================================================
   Lowball Triple Draw — card utilities, hand evaluation,
   draw-value tables (dynamic programming) and predraw hand scoring.
   Two games share everything here:
   - '27': Deuce-to-Seven (aces high, straights and flushes count against you)
   - 'A5': Ace-to-Five (aces low, straights and flushes don't count; A-2-3-4-5 is the nuts)
   Both games are built once when the page loads (one namespace each); TD.setGame(g) swaps which
   one the engine, UI and bots see, so the table can change games between hands (Mix mode).

   Ranks are handled as "levels" 2..14 = position from the bottom of the deck for the game:
   - 2-7: level = the card's rank (deuce = 2 ... ace = 14)
   - A-5: the ace is the lowest card: ace = 2, deuce = 3 ... king = 14
   Rank masks use bit (level - 2). Strategy thresholds written for 2-7 therefore read
   one rank lower in A-5 (an A-5 six-low plays like a 2-7 seven-low), which matches how
   A-5 hands run about a rank lower than 2-7 hands.
   ===================================================================== */
'use strict';
window.TD = window.TD || {};

(function (BASE) {
  const startGame = function () {
    let g = null;
    try { const m = /game=(a5|27)/i.exec(window.location.hash || ''); if (m) g = m[1].toUpperCase(); } catch (e) { /* ignore */ }
    if (!g) { try { const st = JSON.parse(window.localStorage.getItem('lago27.settings') || '{}'); if (st && st.game === 'A5') g = 'A5'; /* the game last played */ } catch (e) { /* ignore */ } }
    return g === 'A5' ? 'A5' : '27';
  };

 function buildCards(TD, GAME) {
  const A5 = GAME === 'A5';

  const RANK_CH_STD = ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A']; // by true rank - 2
  const RANK_CH = A5 ? ['A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'] : RANK_CH_STD; // by level - 2
  const W = ['Deuce', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Jack', 'Queen', 'King', 'Ace'];
  const WP = ['Deuces', 'Threes', 'Fours', 'Fives', 'Sixes', 'Sevens', 'Eights', 'Nines', 'Tens', 'Jacks', 'Queens', 'Kings', 'Aces'];
  const RANK_WORD = {}, RANK_PLURAL = {};
  for (let i = 0; i < 13; i++) {
    const j = A5 ? (i + 12) % 13 : i; // A-5: level 2 is the ace
    RANK_WORD[i + 2] = W[j]; RANK_PLURAL[i + 2] = WP[j];
  }
  const SUIT_CH = ['s', 'h', 'd', 'c'];

  // level of each card (0..51, card = (rank-2)*4 + suit)
  const LEVEL = new Uint8Array(52);
  for (let c = 0; c < 52; c++) LEVEL[c] = A5 ? (((c >> 2) + 1) % 13) + 2 : (c >> 2) + 2;
  const rankOf = (c) => LEVEL[c];          // level (see above)
  const trueRank = (c) => (c >> 2) + 2;    // the printed rank: 2..14, ace = 14
  const suitOf = (c) => c & 3;
  const rch = (r) => RANK_CH[r - 2];       // level -> printed character
  const cardStr = (c) => RANK_CH_STD[c >> 2] + SUIT_CH[suitOf(c)];

  // popcount for 13-bit rank masks (bit i = level i+2)
  const POP = new Uint8Array(8192);
  for (let m = 1; m < 8192; m++) POP[m] = POP[m >> 1] + (m & 1);

  function rankMaskOf(cards) {
    let m = 0;
    for (const c of cards) m |= 1 << (LEVEL[c] - 2);
    return m;
  }
  function maskRanksAsc(m) {
    const out = [];
    for (let i = 0; i < 13; i++) if (m & (1 << i)) out.push(i + 2);
    return out;
  }
  function maskStr(m) { return maskRanksAsc(m).reverse().map(rch).join('-'); }
  function patternMask(str) { // "A234" / "2347" or "2-3-4-7" -> mask, in this game's characters
    let m = 0;
    for (const ch of str.replace(/-/g, '')) {
      const idx = RANK_CH.indexOf(ch.toUpperCase());
      if (idx >= 0) m |= 1 << idx;
    }
    return m;
  }
  // a pattern written in 2-7 terms, read as levels: in A-5 it names the hand one rank lower
  // ("2347" -> A-2-3-6). Used for strategy tables written for 2-7.
  function levelMask(str) {
    let m = 0;
    for (const ch of str.replace(/-/g, '')) {
      const idx = RANK_CH_STD.indexOf(ch.toUpperCase());
      if (idx >= 0) m |= 1 << idx;
    }
    return m;
  }
  function isStraightMask27(m) {
    if (POP[m] !== 5) return false;
    let low = 0;
    while (!(m & (1 << low))) low++;
    return (m >> low) === 31;
  }
  const isStraightMask = A5 ? () => false : isStraightMask27;

  /* ---------- 2-7 evaluator: LOWER value = BETTER lowball hand ----------
     Aces are always high, A-2-3-4-5 is NOT a straight (it is ace-high),
     straights and flushes count against you. */
  const CAT = { HIGH: 0, PAIR: 1, TWOPAIR: 2, TRIPS: 3, STRAIGHT: 4, FLUSH: 5, FULL: 6, QUADS: 7, SFLUSH: 8 };
  const CAT_BASE = 1048576; // 16^5
  const _cnt = new Uint8Array(15);
  function eval27(cards) {
    _cnt.fill(0);
    const s0 = cards[0] & 3;
    let flush = true;
    for (let i = 0; i < 5; i++) {
      _cnt[(cards[i] >> 2) + 2]++;
      if ((cards[i] & 3) !== s0) flush = false;
    }
    const groups = [];
    for (let x = 14; x >= 2; x--) if (_cnt[x]) groups.push(_cnt[x] * 16 + x);
    groups.sort((a, b) => b - a);
    const distinct = groups.length;
    let cat;
    if (distinct === 5) {
      const straight = (groups[0] & 15) - (groups[4] & 15) === 4;
      if (straight && flush) cat = CAT.SFLUSH;
      else if (flush) cat = CAT.FLUSH;
      else if (straight) cat = CAT.STRAIGHT;
      else cat = CAT.HIGH;
    } else if (distinct === 4) cat = CAT.PAIR;
    else if (distinct === 3) cat = (groups[0] >> 4) === 3 ? CAT.TRIPS : CAT.TWOPAIR;
    else cat = (groups[0] >> 4) === 4 ? CAT.QUADS : CAT.FULL;
    let tb = 0;
    for (const g of groups) {
      const x = g & 15, c = g >> 4;
      for (let k = 0; k < c; k++) tb = tb * 16 + x;
    }
    return cat * CAT_BASE + tb;
  }
  /* ---------- A-5 evaluator: LOWER value = BETTER ----------
     Aces are always low, straights and flushes don't count: 5-4-3-2-A (the wheel)
     is the nuts. Pairs and worse rank as usual (a pair of aces is the best pair). */
  function evalA5(cards) {
    _cnt.fill(0);
    for (let i = 0; i < 5; i++) _cnt[LEVEL[cards[i]]]++;
    const groups = [];
    for (let x = 14; x >= 2; x--) if (_cnt[x]) groups.push(_cnt[x] * 16 + x);
    groups.sort((a, b) => b - a);
    const distinct = groups.length;
    let cat;
    if (distinct === 5) cat = CAT.HIGH;
    else if (distinct === 4) cat = CAT.PAIR;

      if (this.street === 0 && opts.toCall > 0 && opts.betLevel === 2) {

        const raises = prev.filter((a) => a.street === 0 && (a.type === 'raise' || a.type === 'bet'));

      if (this.street >= 1 && opts.toCall > 0 && opts.canRaise && prev.some((a) => a.street === this.street && a.seat === p.seat && a.type === 'check')) {
        um.crOpp = (um.crOpp || 0) + 1;

    // If the user made the last bet/raise after the final draw and was called, his hand is shown (he
    // shows first). Count how often those called river bets/raises were bluffs (a pair or worse, or a
    // queen-high or worse) — direct, unbiased evidence of how often he bluffs the river.
    trackUserShowdown() {
      if (this.street !== 3 || this.allSeats) return;
      const agg = this.actions.filter((a) => a.street === 3 && (a.type === 'bet' || a.type === 'raise'));
      if (!agg.length) return;
      const p = this.players[agg[agg.length - 1].seat];
      if (!p.isHuman || p.folded || !p.shown) return;
      const um = this.userModel;
      um.riverAggShown = (um.riverAggShown || 0) + 1;
      const hn = TD.handName(p.hand);
      if (hn.cat !== 0 || hn.top >= 12) um.riverBluffShown = (um.riverBluffShown || 0) + 1;
    }

    /* ---------- coach notes (user's decisions vs the AI strategy) ---------- */
    coachNoteBet(p, opts, act, res) {
      if (!res || !res.top) return;
      const ut = TD.AI.normType(act.type, opts);
      const pu = res.dist[ut] || 0;
      const verdict = (ut === res.top || pu >= 0.5) ? 'agree' : pu >= 0.12 ? 'mixed' : 'differs';
      const capping = opts.betLevel + 1 >= CAP_BETS && !opts.headsUp;
      const label = (t) => (t === 'raise' ? (opts.isBet ? 'bet' : capping ? 'cap' : 'raise') : t);
      const dist = Object.keys(res.dist).sort((a, b) => res.dist[b] - res.dist[a]).map((k) => label(k) + ' ' + Math.round(res.dist[k] * 100) + '%').join(' · ');
      this.coachNotes.push({
        seat: p.seat, street: this.street, phase: 'bet', user: label(ut), ai: label(res.top), dist, verdict,
        why: res.samples[res.top] ? res.samples[res.top].reason : '',
        userWhy: ut !== res.top && res.samples[ut] ? res.samples[ut].reason : '',
        eq: res.eq, potOdds: opts.toCall ? opts.toCall / (opts.pot + opts.toCall) : 0, toCall: opts.toCall
      });
      this.coachStats[verdict]++;
      TD.AI.coachCommit(p, res, ut);
    }
    coachNoteDraw(p, drawIdx, discardIdx, res, cmp) {
      if (!res || !cmp) return;
      const hs = TD.AI.hstr;
      const desc = (keep) => (keep.length === 5 ? 'stand pat' : 'draw ' + (5 - keep.length) + (keep.length ? ' to ' + hs(keep) : ''));
      const verdict = cmp.same ? 'agree' : (cmp.eqUser >= cmp.eqAI - 0.02 ? 'mixed' : 'differs');
      this.coachNotes.push({
        seat: p.seat, street: drawIdx + 1, phase: 'draw', user: desc(cmp.userKeep), ai: desc(cmp.aiKeep), verdict, why: res.reason,
        eqAI: cmp.eqAI, eqUser: cmp.eqUser
      });
      this.coachStats[verdict]++;
    }

    addReview(p, reason, tag) {
      this.reviewNotes.push({ seat: p.seat, name: p.name, street: this.street, phase: this.drawRound >= 0 && this.inDraw ? 'draw' : 'bet', reason, tag: tag || '' });
    }

    /* ---------- draws ---------- */
    /* Casino procedure for each draw round:
       1) starting left of the button, every player declares how many cards he
          draws and discards them;
       2) once all declarations are complete, the dealer burns one card;

      a[t] = c; a[j] = o; this.pos[c] = t; this.pos[o] = j;

  }

  /* ---------------- opponent range model ---------------- */
  function streetSummary(game, seat, street) {
    let aggr = 0, raises = 0, calls = 0, checks = 0;
    for (const a of game.actions) {
      if (a.seat !== seat || a.street !== street) continue;
      if (a.type === 'bet' || a.type === 'raise') aggr++;
      if (a.type === 'raise') raises++;
      else if (a.type === 'call') calls++;
      else if (a.type === 'check') checks++;

  }

  function predrawKey(game, opp) {
    const acts = game.actions.filter((a) => a.street === 0 && a.seat === opp.seat && a.type !== 'post');
    const pos = game.posName(opp.seat);
    let maxRaise = 0, callLevel = 0, checked = false;
    for (const a of acts) {
      if (a.type === 'raise' || a.type === 'bet') maxRaise = Math.max(maxRaise, a.level);
      if (a.type === 'call') callLevel = Math.max(callLevel, a.level);
      if (a.type === 'check') checked = true;

  /* ---------------- the ante structure (Theory of Poker ch. 4) ----------------

      cnt[clamp(TD.predrawScoreFast(h), 0, 100)]++;

  // score points to move a predraw threshold by in this structure (negative = looser)

    const key = A.toFixed(6) + pos + thr;
    if (ANTE_SHIFT.has(key)) return ANTE_SHIFT.get(key);
    const tail = scoreTail(), t0 = clamp(Math.round(thr), 1, 100);
    const target = clamp(tail[t0] * Math.pow(A / ANTE_REF, ANTE_POWER[pos]), 0, 1);
    let best = t0, err = Math.abs(tail[t0] - target);
    for (let s = 1; s <= 100; s++) {

  // ToP ch. 4: with large antes, raise good hands rather than slowplay them (letting players in cheaply);
  // with small antes, slowplay more. Scales the notes' mixed reraise-to-isolate frequencies (1 = standard).

  function anteNote(game, pos, shift) {
    if (!shift) return '';

      ' big bets, ' + (shift < 0 ? 'more' : 'less') + ' than the standard 0.75, so the ' + pos + ' range is ' + (shift < 0 ? 'wider' : 'tighter') + ' than in the notes.';

  function rangeAccept(score, model) {

      case '3bet': return score >= 89 - loosen ? 1 : score >= 83 - loosen ? 0.25 : 0.03;
      case '4bet': return score >= 91 - loosen ? 1 : score >= 86 - loosen ? 0.3 : 0.02;
      case 'call': return score >= 64 - loosen ? (score >= 91 ? 0.3 : 1) : 0.04;
      case 'bbdefend': return score >= 48 + (ante.bb || 0) - loosen ? (score >= 91 ? 0.3 : 1) : 0.05;
      case 'call3': return score >= 78 - loosen ? (score >= 93 ? 0.4 : 1) : 0.04;

  function actionLik(sum, s, street) {

    if (sum.raises > 0) {

  function buildModel(game, opp) {

    // ToP ch. 25 #3/#5: the user's river calling range is as wide as his river folding says (a player who never

  }

  function anteModel(game, pos) {

  }

  function forcedKeep(hand, k, d) {
    if (k >= 5) return hand.slice();

    const D = TD.rankMaskOf(hand);
    if (POP[D] >= k) {
      const { mask } = TD.bestOfSize(D, k, d);
      return TD.cardsForMask(hand, mask);

    return hand.slice().sort((a, b) => a - b).slice(0, k);
  }

  function drawInto(hand, keep, pool) {
    const out = keep.slice();

  // w widens/narrows the calling range: against the user it follows how often he folds to river bets

  function sampleOpponent(model, pool) {

    const strongLine = model.streets.some((s, i) => s && ((i >= 2 && s.raises > 0) || s.aggr >= 2));
    const MAX = strongLine || model.hypoCall ? 110 : 24;
    let best = null, bestW = -1;
    for (let att = 0; att < MAX; att++) {
      const save = pool.top;
      let hand = [pool.draw(), pool.draw(), pool.draw(), pool.draw(), pool.draw()];
      let w = rangeAccept(TD.predrawScoreFast(hand), model);
      let ok = R() <= w;
      for (let k = 0; k < model.draws.length; k++) {
        const n = model.draws[k];
        const dRem = 3 - k;
        const natural = TD.policyDrawCount(hand, dRem);
        let pc;
        if (n === 0) {
          if (natural === 0) pc = 1;
          else if (TD.isMadeLow(hand)) {
            const D = TD.rankMaskOf(hand);

          } else pc = 0.03; // a pat junk hand = a snow

      }

      if (model.hypoCall) {

  let EQ_CACHE = null; // shared equity results while the coach samples a decision many times

  /* ---------------- predraw ---------------- */

      case 'two': return mk(info.label.split('-').reverse().join('-')) + ' two-card draw';

      if (sc >= 70) return mk('a raising two-card draw (SS2: A-2-5 down to 2-5-6 are good enough to raise with, not to cold-call two bets outside the blinds; consider folding the weaker half to a raise)');
      if (sc >= 58) return mk('a marginal two-card draw (SS2: 3-5-6 or 4-5-6, late position only)');
      return mk('a rough draw');

    if (sc >= 83) return 'a premium two-card draw (2-3-4, 2-3-5, 2-3-7, 2-4-5, 2-4-7, 2-5-7: playable for any number of bets)';
    if (sc >= 75) return 'a 2-x-6 / 2-6-7 type draw (play most spots, fold to too much action)';

    else if (mem.flexAgg === false && info.style === 'flex-eight') flatWhy = d + ' with a premium ' + core + ' underneath: flat call and plan to draw two to ' + core + ' (mixed with raising and drawing one for balance).';
    else if (info.kind === 'one') flatWhy = d + ': flat call (mixed).';

      if (lvl === 1 && c.limpers.length === 0 && ['CO', 'BTN', 'SB'].includes(pos) && opts.canRaise) return act('raise', 'Raise with ' + hstr(p.hand) + ', planning to snow.' + why, 'snow');
      if (pos === 'BB' && lvl === 1) return opts.canRaise ? act('raise', 'Raise the BB option with ' + hstr(p.hand) + ', planning to snow.' + why, 'snow') : act('check', 'Check.');
      if (pos === 'BB' && lvl === 2 && c.opps === 1) return act('call', 'Defend with ' + hstr(p.hand) + ', planning to snow heads-up.' + why, 'snow');
      mem.snowPlan = false;

    if (lvl === 1) {

      }

        const s = anteShift(game, pos, openRef(pos));
