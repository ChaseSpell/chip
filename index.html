        break;
      case 'edit': {
        var p = P(m.id);
        h = shell('Edit ' + esc(dn(p.name)),
          '<form data-form="edit" data-id="' + p.id + '"><div class="field"><label for="e-name">Name</label><input id="e-name" name="name" class="input" value="' + esc(p.name) + '" data-autofocus></div>' +
          '<div style="display:flex;gap:12px;margin-top:10px"><div class="field" style="flex:1"><label for="e-c">Chips remaining</label><input id="e-c" name="C" class="input" type="number" min="0" inputmode="numeric" value="' + p.C + '"></div>' +
          '<div class="field" style="flex:1"><label for="e-s">Starting chips</label><input id="e-s" name="S" class="input" type="number" min="1" inputmode="numeric" value="' + p.S + '"></div></div>' +
          '<p class="muted">Setting chips remaining to 0 eliminates the player.</p><p class="err" role="alert"></p>' +
          '<div class="actions"><button type="button" class="btn danger" data-act="drop-open" data-id="' + p.id + '" style="margin-right:auto">Drop from tournament</button>' + CANCEL + '<button class="btn primary" type="submit">Save</button></div></form>');
        break;
      }
      case 'drop': {
        var dp = P(m.id), where = E.where(S, dp.id);
        h = shell('Drop ' + esc(dn(dp.name)) + '?',
          '<p>' + esc(dn(dp.name)) + ' leaves the tournament' + (where && where.kind === 'table' ? ', and their opponent waits for a new challenger. No win is awarded.' : '.') + '</p><p class="err" role="alert"></p>',
          CANCEL + '<button class="btn danger" data-act="drop-go" data-id="' + dp.id + '" data-autofocus>Drop ' + esc(dn(dp.name)) + '</button>');
        break;
      }
      case 'reinstate': {
        var rp = P(m.id);
        h = shell('Reinstate ' + esc(dn(rp.name)),
          '<form data-form="reinstate" data-id="' + rp.id + '"><div class="field"><label for="r-chips">Chips to give back</label><input id="r-chips" name="chips" class="input" type="number" min="1" inputmode="numeric" value="1" data-autofocus></div>' +
          '<p class="muted">They go to the bottom of the waitlist.</p><p class="err" role="alert"></p><div class="actions">' + CANCEL + '<button class="btn primary" type="submit">Reinstate</button></div></form>');
        break;
      }
      case 'consol': {
        var pc = E.pendingConsolidation(S);
        if (!pc) { ui.modal = null; modalRoot.innerHTML = ''; return; }
        var a = E.T(S, pc.tables[0]), b = E.T(S, pc.tables[1]);
        h = shell('Consolidate tables',
          '<p>Two winners are waiting and no one is left to challenge them:</p><p><b>' + esc(dn(E.label(P(a.a)))) + '</b> on Table ' + a.n + '<br><b>' + esc(dn(E.label(P(b.a)))) + '</b> on Table ' + b.n + '</p><p>They play each other (flip for the break) and one table closes. Which table do they play on?</p>' +
          '<div class="stack"><button class="btn primary big" data-act="consol-go" data-keep="' + a.n + '" data-close="' + b.n + '" data-autofocus>Play on Table ' + a.n + ', close Table ' + b.n + '</button>' +
          '<button class="btn primary big" data-act="consol-go" data-keep="' + b.n + '" data-close="' + a.n + '">Play on Table ' + b.n + ', close Table ' + a.n + '</button></div><p class="err" role="alert"></p>',
          '<button class="btn" data-act="consol-later">Decide later</button>');
        break;
      }
      case 'throw': {
        var tt = E.T(S, m.n), pool = poolFor(m.n);
        if (tt.a) {
          var w = P(tt.a);
          h = shell('Challenger for ' + esc(dn(w.name)) + ' on Table ' + tt.n,
            (pool.length ? '<div class="stack">' + pool.map(function (c) {
              var cp = P(c.id), blocked = !E.canPair(S, tt.a, c.id);
              return '<button class="btn" data-act="throw-go" data-n="' + tt.n + '" data-a="' + c.id + '"><span class="pick"><span><b>' + esc(dn(cp.name)) + '</b> <span class="frac">(' + cp.C + '/' + cp.S + ')</span></span><span class="muted">' + esc(c.from) + (blocked ? ', just played ' + esc(dn(w.name)) : '') + '</span></span></button>';
            }).join('') + '</div>' : '<p class="muted">No one is waiting.</p>') + '<p class="err" role="alert"></p>', CANCEL);
        } else {
          var opts = pool.map(function (c) { var cp = P(c.id); return '<option value="' + c.id + '">' + esc(dn(cp.name)) + ' (' + cp.C + '/' + cp.S + '), ' + esc(c.from) + '</option>'; }).join('');
          h = shell('Throw a match on Table ' + tt.n,
            '<form data-form="throw-empty" data-n="' + tt.n + '"><div class="field"><label for="t1">First player</label><select id="t1" name="p1" class="input" data-autofocus>' + opts + '</select></div>' +
            '<div class="field" style="margin-top:10px"><label for="t2">Second player</label><select id="t2" name="p2" class="input">' + opts + '</select></div><p class="err" role="alert"></p>' +
            '<div class="actions">' + CANCEL + '<button class="btn primary" type="submit">Throw match</button></div></form>');
        }
        break;
      }
      case 'menu':
        h = shell('Menu',
          (S.phase === 'active' ? '<div class="grp">During play</div><div class="stack"><button class="btn" data-act="late-open">Add a late entrant</button><button class="btn" data-act="add-table">Add a table</button></div>' : '') +
          (S.phase !== 'registration' ? '<div class="grp">Share</div><div class="stack"><button class="btn" data-act="copy-text">Copy dashboard text</button><button class="btn" data-act="csv-results">Download results (CSV)</button><button class="btn" data-act="csv-log">Download match log (CSV)</button></div>' : '') +
          '<div class="grp">Backup</div><div class="stack"><button class="btn" data-act="export-json">Export backup file</button><button class="btn" data-act="import-pick">Import backup file</button></div>' +
          '<div class="grp">Start over</div><div class="stack"><button class="btn" data-act="newc-open" data-keep="1">New tournament with the same players</button><button class="btn danger" data-act="newc-open" data-keep="0">Clear everything</button></div>',
          '<button class="btn" data-act="m-close">Close</button>');
        break;
      case 'text':
        h = shell(esc(m.title), '<p class="muted">Select all and copy.</p><textarea class="input" rows="14" readonly data-autofocus onfocus="this.select()">' + esc(m.text) + '</textarea>', '<button class="btn primary" data-act="m-close">Done</button>');
        break;
      case 'newc':
        h = shell(m.keep ? 'Start over with the same players?' : 'Clear everything?',
          '<p>' + (m.keep ? 'Everyone stays registered with their starting chips. Chips, wins and the log are reset.' : 'All players, results and the log are removed. Export a backup first if you might need them.') + '</p>',
          CANCEL + '<button class="btn danger" data-act="newc-go" data-keep="' + (m.keep ? 1 : 0) + '" data-autofocus>' + (m.keep ? 'Start over' : 'Clear everything') + '</button>');
        break;
    }
    modalRoot.innerHTML = h;
    var f = modalRoot.querySelector('[data-autofocus]') || modalRoot.querySelector('button, input, select');
    if (f) f.focus();
  }

  /* ---------- batch parsing ---------- */
  function parseBatch(text) {
    var out = [];
    String(text).split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;
      var mt = line.match(/^(.*?)\s*[,;:\t]\s*(\d+)\s*(?:chips?)?$/i) || line.match(/^(.*?)\s*\(\s*(\d+)\s*(?:chips?)?\s*\)$/i) || line.match(/^(.*\D)\s+(\d+)\s*(?:chips?)?$/i);
      if (mt && mt[1].trim()) out.push({ name: mt[1].trim(), chips: parseInt(mt[2], 10) });
      else out.push({ name: line.replace(/[,;:]+$/, '').trim(), chips: S.defaultChips });
    });
    return out;
  }
  function batchPreview(text) {
    var list = parseBatch(text);
    if (!list.length) return 'No names yet.';
    return plural(list.length, 'player') + ': ' + list.slice(0, 6).map(function (p) { return esc(dn(p.name)) + ' (' + p.chips + ')'; }).join(', ') + (list.length > 6 ? ', and ' + (list.length - 6) + ' more' : '');
  }

  /* ---------- files ---------- */
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  function stamp() {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
  }
  function copyText(text, title) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove();
        if (ok) { toast('Copied'); return; }
      } catch (e) { /* fall through */ }
      openModal({ type: 'text', title: title, text: text });
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    else fallback();
  }

  /* ---------- actions ---------- */
  function afterChange(opts) {
    commit();
    if (opts && opts.toast) toast(opts.toast, opts.undo ? { undo: true } : null);
    maybePrompt();
  }
  function maybePrompt() {
    if (ui.modal || S.phase !== 'active' || S.mode !== 'AUTO') return;
    var pc = E.pendingConsolidation(S);
    if (!pc) return;
    var key = pc.tables.join(',') + ':' + S.seq;
    if (ui.consDismissed === key) return;
    ui.consKey = key;
    openModal({ type: 'consol' });
  }
  function doUndo() {
    var r = E.undo(S);
    if (r.error) { toast(r.error, { bad: true }); return; }
    ui.flips = {};
    commit(); toast('Undid: ' + r.label);
  }
  function fail(r) { toast(r.error, { bad: true }); }

  var actions = {
    /* registration */
    'def-dec': function () { S.defaultChips = clamp(S.defaultChips - 1, 1, 20); commit(); },
    'def-inc': function () { S.defaultChips = clamp(S.defaultChips + 1, 1, 20); commit(); },
    'reg-dec': function (el) { var p = P(+el.dataset.id); E.editRegistered(S, p.id, { S: Math.max(1, p.S - 1) }); commit(); },
    'reg-inc': function (el) { var p = P(+el.dataset.id); E.editRegistered(S, p.id, { S: Math.min(20, p.S + 1) }); commit(); },
    'reg-remove': function (el) { E.removePlayer(S, +el.dataset.id); commit(); },
    'tbl-dec': function () { S.plannedTables = Math.max(1, plannedTables() - 1); ui.tablesTouched = true; commit(); },
    'tbl-inc': function () { S.plannedTables = Math.min(40, plannedTables() + 1); ui.tablesTouched = true; commit(); },
    'batch-open': function () { openModal({ type: 'batch' }); },
    'batch-add': function () {
      var list = parseBatch(ui.batchText), added = 0, skipped = [];
      list.forEach(function (p) { var r = E.addPlayer(S, p.name, p.chips); if (r.ok) added++; else skipped.push(p.name); });
      if (!list.length) { modalErr('Type or paste at least one name.'); return; }
      ui.batchText = ''; closeModal(); commit();
      toast('Added ' + plural(added, 'player') + (skipped.length ? '. Skipped ' + skipped.length + ' that could not be added: ' + skipped.slice(0, 3).map(dn).join(', ') : ''));
    },
    'start-open': function () { openModal({ type: 'start' }); },
    'start-go': function () {
      var r = E.startTournament(S, plannedTables(), now());
      if (r.error) { modalErr(r.error); return; }
      ui.tab = 'tables'; ui.flips = {}; ui.consDismissed = null;
      closeModal(); commit(); openModal({ type: 'draw' });
    },

    /* play */
    won: function (el) {
      var id = +el.dataset.id, w = P(id), t = E.tableOf(S, id);
      if (!t || !t.a || !t.b) { toast('That match is already finished.', { bad: true }); return; }
      var l = P(t.a === id ? t.b : t.a), n = t.n;
      var r = E.reportResult(S, id, now());
      if (r.error) { fail(r); return; }
      delete ui.flips[n];
      var msg = w.name + ' def. ' + l.name + (r.eliminated ? '. ' + l.name + ' is eliminated.' : '. ' + l.name + ' has ' + l.C + ' left.');
      if (S.phase === 'finished') msg = w.name + ' wins the tournament';
      afterChange({ toast: msg, undo: true });
    },
    undo: function () { doUndo(); },
    'undo-toast': function () { doUndo(); },
    mode: function () {
      var r = E.setMode(S, S.mode === 'AUTO' ? 'MANUAL' : 'AUTO', now());
      if (r.error) { fail(r); return; }
      afterChange({ toast: S.mode === 'AUTO' ? 'Auto-throw is on' : 'Auto-throw paused. Results still count; throw matches yourself.', undo: false });
    },
    tab: function (el) { ui.tab = el.dataset.tab; render(); },
    flip: function (el) {
      var t = E.T(S, +el.dataset.n); if (!t) return;
      ui.flips[t.n] = P(rand() < 0.5 ? t.a : t.b).name; render();
    },
    'consol-open': function () { ui.consKey = null; openModal({ type: 'consol' }); },
    'consol-go': function (el) {
      var keep = +el.dataset.keep, close = +el.dataset.close;
      var r = E.consolidate(S, keep, close, now());
      if (r.error) { modalErr(r.error); return; }
      var t = E.T(S, keep);
      closeModal(); afterChange({ toast: 'Table ' + close + ' closed. ' + P(t.a).name + ' vs ' + P(t.b).name + ' on Table ' + keep + ': flip for the break.', undo: true });
    },
    'consol-later': function () { if (ui.consKey) ui.consDismissed = ui.consKey; closeModal(); },
    'throw-open': function (el) { openModal({ type: 'throw', n: +el.dataset.n }); },
    'throw-go': function (el) {
      var n = +el.dataset.n, a = +el.dataset.a, t = E.T(S, n);
      if (t.a && !E.canPair(S, t.a, a) && !window.confirm(dn(P(a).name) + ' and ' + dn(P(t.a).name) + ' just played each other. Throw the rematch anyway?')) return;
      var r = E.throwMatch(S, n, a, null, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: 'Match thrown on Table ' + n, undo: true });
    },
    'close-table': function (el) {
      var r = E.closeTable(S, +el.dataset.n, now()); if (r.error) { fail(r); return; }
      afterChange({ toast: 'Table ' + el.dataset.n + ' closed', undo: true });
    },
    'reopen-table': function (el) {
      var r = E.reopenTable(S, +el.dataset.n, now()); if (r.error) { fail(r); return; }
      afterChange({ toast: 'Table ' + el.dataset.n + ' reopened', undo: true });
    },
    'add-table': function () {
      var r = E.addTable(S, now()); if (r.error) { fail(r); return; }
      closeModal(); afterChange({ toast: 'Table ' + r.table + ' added', undo: true });
    },

    /* roster during play */
    edit: function (el) { openModal({ type: 'edit', id: +el.dataset.id }); },
    'drop-open': function (el) { openModal({ type: 'drop', id: +el.dataset.id }); },
    'drop-go': function (el) {
      var p = P(+el.dataset.id);
      var r = E.dropPlayer(S, p.id, now()); if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: p.name + ' dropped', undo: true });
    },
    'reinstate-open': function (el) { openModal({ type: 'reinstate', id: +el.dataset.id }); },
    'late-open': function () { openModal({ type: 'late' }); },

    /* menu and files */
    menu: function () { openModal({ type: 'menu' }); },
    'copy-text': function () { closeModal(); copyText(E.dashboardText(S), 'Dashboard text'); },
    'csv-results': function () { closeModal(); download('chip-tournament-results-' + stamp() + '.csv', E.resultsCSV(S), 'text/csv'); },
    'csv-log': function () { closeModal(); download('chip-tournament-log-' + stamp() + '.csv', E.logCSV(S), 'text/csv'); },
    'export-json': function () { closeModal(); download('chip-tournament-backup-' + stamp() + '.json', E.serialize(S), 'application/json'); toast('Backup file downloaded'); },
    'import-pick': function () { fileInput.value = ''; fileInput.click(); },
    'newc-open': function (el) { openModal({ type: 'newc', keep: el.dataset.keep === '1' }); },
    'newc-go': function (el) {
      var keep = el.dataset.keep === '1', old = S, s = E.newState();
      s.defaultChips = old.defaultChips; s.matchMinutes = old.matchMinutes; s.plannedTables = old.plannedTables;
      if (keep) old.players.forEach(function (p) { E.addPlayer(s, p.name, p.S); });
      S = s; ui.tab = 'tables'; ui.flips = {}; ui.consDismissed = null; ui.tablesTouched = false;
      closeModal(); commit();
    },
    'toast-close': function () { clearTimeout(ui.toastTimer); toastRoot.innerHTML = ''; },
    'm-close': function () { closeModal(); },
    scrim: function (el, e) { if (e.target === el) closeModal(); }
  };

  var forms = {
    add: function (form) {
      var r = E.addPlayer(S, form.elements.name.value, S.defaultChips);
      if (r.error) { toast(r.error, { bad: true }); return; }
      ui.draftName = ''; commit();
      var n = document.getElementById('name-in'); if (n) n.focus();
    },
    late: function (form) {
      var r = E.lateEntry(S, form.elements.name.value, form.elements.chips.value, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: r.player.name + ' added to the waitlist', undo: true });
    },
    edit: function (form) {
      var id = +form.dataset.id, p = P(id), patch = {};
      var name = form.elements.name.value, c = form.elements.C.value, s2 = form.elements.S.value;
      if (E.normName(name) !== p.name) patch.name = name;
      if (String(c).trim() !== '' && parseInt(c, 10) !== p.C) patch.C = c;
      if (String(s2).trim() !== '' && parseInt(s2, 10) !== p.S) patch.S = s2;
      if (!Object.keys(patch).length) { closeModal(); return; }
      var r = E.editPlayer(S, id, patch, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: 'Saved', undo: true });
    },
    reinstate: function (form) {
      var id = +form.dataset.id;
      var r = E.reinstate(S, id, form.elements.chips.value, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: P(id).name + ' reinstated', undo: true });
    },
    'throw-empty': function (form) {
      var n = +form.dataset.n, a = +form.elements.p1.value, b = +form.elements.p2.value;
      if (a === b) { modalErr('Pick two different players.'); return; }
      if (!E.canPair(S, a, b) && !window.confirm('Those two just played each other. Throw the rematch anyway?')) return;
      var r = E.throwMatch(S, n, a, b, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: 'Match thrown on Table ' + n, undo: true });
    }
  };

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = actions[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    var fn = forms[form.getAttribute('data-form')];
    if (fn) fn(form);
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-input');
    if (k === 'name') ui.draftName = e.target.value;
    else if (k === 'mm') {
      S.matchMinutes = e.target.value; save();
      var est = document.getElementById('est');
      if (est) est.innerHTML = estHTML(S.players.reduce(function (a, p) { return a + p.S; }, 0), plannedTables());
    } else if (k === 'batch') {
      ui.batchText = e.target.value;
      var pv = document.getElementById('batch-preview'); if (pv) pv.innerHTML = batchPreview(ui.batchText);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.modal) closeModal();
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = E.deserialize(String(rd.result));
        if (!window.confirm('Replace the current tournament with this backup (' + s.players.length + ' players)?')) return;
        S = s; ui.tablesTouched = true; ui.flips = {}; ui.consDismissed = null; closeModal(); commit(); toast('Backup loaded');
      } catch (err) { toast('That file is not a tournament backup.', { bad: true }); }
    };
    rd.readAsText(f);
  });

  /* keep the "min" counters on running matches fresh */
  setInterval(function () {
    if (document.hidden) return;
    var els = document.querySelectorAll('.elapsed[data-since]');
    for (var i = 0; i < els.length; i++) els[i].textContent = elapsed(+els[i].getAttribute('data-since'));
  }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !ui.modal) render(); });

  render();
  maybePrompt();
})();

</script>
</body>
</html>
