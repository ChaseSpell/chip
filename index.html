:root {
  --deep: #092c33;
  --felt: #0d3a42;
  --cloth: #145360;
  --cloth-hi: #1b6574;
  --rail: #4a3223;
  --rail-dk: #2e1f15;
  --sight: #d8c7a3;
  --chalk: #eef1e8;
  --chalk-dim: #a9c3c3;
  --line: #2b6068;
  --blue: #6fb6ea;
  --blue-ink: #06283a;
  --yellow: #f4bd3a;
  --yellow-ink: #2a1d00;
  --red: #b93a32;
  --red-text: #ff9288;
  /* Atkinson Hyperlegible Next (embedded above) was designed for maximum legibility */
  --display: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body: var(--display);
}
* { box-sizing: border-box; }
html { background: var(--deep); color: var(--chalk); font: 16px/1.45 var(--body); -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--deep); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- rail bar ---------- */
.rail-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px 14px;
  background: var(--rail);
  border-bottom: 3px solid var(--rail-dk);
}
.rail-bar::after {
  content: ""; position: absolute; left: 24px; right: 24px; bottom: 4px; height: 5px; pointer-events: none;
  background-image: radial-gradient(circle, var(--sight) 2px, transparent 2.6px);
  background-size: calc(100% / 12) 100%; background-repeat: repeat-x; opacity: .75;
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.35rem; letter-spacing: .01em; flex: 1 1 auto; min-width: 0; }
.brand-t { min-width: 0; display: flex; align-items: baseline; overflow: hidden; white-space: nowrap; }
.brand-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* if space runs out, the title shortens with "..." */
.brand-end { flex: none; white-space: pre; font-weight: 600; opacity: .9; }                     /* the finish time always stays whole */
.bar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: none; }
@media (max-width: 519px) { .bar-actions { flex: 1 1 auto; justify-content: flex-end; } }   /* the buttons wrap onto a second row if they ever don't fit */
/* the Menu's Pause / Resume tournament button: its symbol is drawn here so it looks the same on every device */
.pause-item { display: flex; align-items: center; justify-content: center; }
.pi { display: inline-block; flex: none; box-sizing: border-box; margin-right: .55em; }
.pi-pause { width: .62em; height: .78em; border-left: .22em solid currentColor; border-right: .22em solid currentColor; }
.pi-play { width: 0; height: 0; border-top: .4em solid transparent; border-bottom: .4em solid transparent; border-left: .66em solid currentColor; }
.pause-note { margin: 6px 0 0; font-size: .92em; }
@media (max-width: 519px) {
  .rail-bar { padding: 8px 12px 14px; flex-wrap: nowrap; }
  .brand-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* a tournament title gets its own row under the buttons on a phone */
  .rail-bar.titled { flex-wrap: wrap; row-gap: 6px; }
  .rail-bar.titled .brand { order: 2; flex: 1 0 100%; font-size: 1.15rem; }
  .rail-bar.titled .brand-t { position: static; width: auto; height: auto; clip: auto; }
  .rail-bar.titled .bar-actions { margin-left: auto; }
}

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--chalk-dim);
  background: transparent; font-weight: 600; touch-action: manipulation;
}
.btn:hover { background: color-mix(in srgb, var(--chalk) 8%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--blue) 80%, #fff); }
.btn.warn { background: var(--yellow); border-color: var(--yellow); color: var(--yellow-ink); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: .92rem; }
.btn.ghost { border-color: transparent; }
.btn.on-rail { border-color: color-mix(in srgb, var(--sight) 67%, transparent); }
.btn.big { min-height: 54px; font-size: 1.1rem; }

/* ---------- layout ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 120px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--chalk-dim); font-size: .95rem; margin-bottom: 12px; }
.stats b { color: var(--chalk); font-family: var(--display); font-size: 1.25rem; font-weight: 700; margin-right: 4px; }
.tabs { display: flex; gap: 4px; margin: 4px 0 18px; border-bottom: 2px solid var(--line); }
.tab { min-height: 44px; padding: 8px 18px; background: transparent; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; font-weight: 600; color: var(--chalk-dim); }
.tab[aria-selected="true"] { color: var(--chalk); border-bottom-color: var(--blue); }
.board { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
@media (min-width: 980px) { .board { grid-template-columns: minmax(0, 1fr) 320px; } }
.tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 22px; }
.section-title { font-family: var(--display); font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; margin-bottom: 8px; display: flex; align-items: baseline; gap: 10px; }
.section-title .count { font-size: 1.05rem; color: var(--chalk-dim); font-weight: 600; }
.muted { color: var(--chalk-dim); }

/* ---------- a table, seen from above ---------- */
.thead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; padding: 0 4px; }
.thead h3 { font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.tmeta { color: var(--chalk-dim); font-size: .95rem; text-align: right; }
.tmeta .time { color: var(--chalk); font-weight: 600; }
.frame { position: relative; background: var(--rail); padding: 14px; border-radius: 22px; box-shadow: 0 2px 0 var(--rail-dk); }
/* diamonds, placed like a real table: 6 on each long rail (3 each side of the side pocket) and 3 on each short rail,
   spaced from the pocket centres. ::before draws the long rails, ::after the short rails. */
.frame::before, .frame::after { content: ""; position: absolute; pointer-events: none; background-repeat: no-repeat; background-size: 6px 6px; }
.frame::before { left: 14px; right: 14px; top: 4px; bottom: 4px;
  background-image: radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px);
  background-position: calc(12.5% - 2.25px) 0, calc(25% - 1.5px) 0, calc(37.5% - 0.75px) 0, calc(62.5% + 0.75px) 0, calc(75% + 1.5px) 0, calc(87.5% + 2.25px) 0, calc(12.5% - 2.25px) 100%, calc(25% - 1.5px) 100%, calc(37.5% - 0.75px) 100%, calc(62.5% + 0.75px) 100%, calc(75% + 1.5px) 100%, calc(87.5% + 2.25px) 100%; }
.frame::after { top: 14px; bottom: 14px; left: 4px; right: 4px;
  background-image: radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px), radial-gradient(circle, var(--sight) 2px, transparent 2.6px);
  background-position: 0 calc(25% - 1.5px), 0 calc(50% + 0px), 0 calc(75% + 1.5px), 100% calc(25% - 1.5px), 100% calc(50% + 0px), 100% calc(75% + 1.5px); }
.felt {
  position: relative; padding: 18px 16px 16px; border-radius: 10px; background-color: var(--cloth);
  background-image:
    radial-gradient(circle at 0 0, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 100% 0, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 0 100%, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 100% 100%, #04171c 0 15px, transparent 16px),
    radial-gradient(circle at 50% 0, #04171c 0 13px, transparent 14px), radial-gradient(circle at 50% 100%, #04171c 0 13px, transparent 14px);   /* side pockets */
  box-shadow: inset 0 2px 10px #0007;
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch;
}
.vs { align-self: center; color: var(--chalk-dim); font-style: italic; }
.seat { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pname { font-family: var(--display); font-weight: 800; font-size: var(--nf, 1.6rem); line-height: 1.1; letter-spacing: .035em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
.pname.pwrap { white-space: normal; overflow-wrap: anywhere; }   /* only when a name cannot fit on one line even at the smallest size */
.pname.cut { text-overflow: ellipsis; }
/* tap a player's name when they win: a faint plate behind the name shows it can be tapped */
button.pname.won {
  display: block; width: calc(100% + .28em); min-height: 54px; margin: 0 -.14em; padding: 6px 0; text-indent: .14em; text-align: left; color: inherit; border: 0; border-radius: .14em;
  background: color-mix(in srgb, var(--chalk) 8%, transparent); box-shadow: inset 0 -.06em 0 color-mix(in srgb, var(--chalk) 28%, transparent);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background .08s ease, transform .08s ease;
}
button.pname.won:hover { background: color-mix(in srgb, var(--chalk) 20%, transparent); }
button.pname.won:active { background: color-mix(in srgb, var(--chalk) 30%, transparent); transform: scale(.98); }
button.pname.won:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.pchips { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 8px; min-height: 24px; }
.frac { color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.hint { color: var(--chalk-dim); font-size: .95rem; margin: -2px 0 12px; }
/* chips: a disc in the chip base color with a dashed rim in the chip rim color (black and white unless changed in Colors);
   spent chips are an empty outline in the secondary text color */
.chip { position: relative; box-sizing: border-box; display: inline-block; width: 18px; height: 18px; margin-right: 3px; border-radius: 50%; vertical-align: middle; }
.chip.on { background: var(--chip-face, #050505); border: 2px dashed var(--chip-rim, #fff); }
.chip.off { background: transparent; border: 2px dashed color-mix(in srgb, var(--chalk-dim) 70%, transparent); }
.slot { border: 2px dashed var(--yellow); border-radius: 10px; padding: 10px; align-items: flex-start; justify-content: center; color: var(--yellow); font-weight: 600; }
.slot .btn { margin-top: 4px; }
.tnote { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--yellow); font-weight: 600; }
.closed-tables { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; color: var(--chalk-dim); align-items: center; }
@media (max-width: 559px) {
  .felt { grid-template-columns: 1fr; }
  .vs { justify-self: center; }
  .tables { grid-template-columns: 1fr; }
}

/* ---------- waitlist ---------- */
.waitlist ol { list-style: none; margin: 0; padding: 0; border-left: 3px solid var(--line); }
.waitlist li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; padding: 10px 6px 10px 10px; border-bottom: 1px solid var(--line); }
/* a player's name is the way to edit them (waitlist, the playoff draw list, the Players tab) */
.who[data-act], .nm-edit { cursor: pointer; border-radius: 6px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.who[data-act]:active, .nm-edit:active { opacity: .65; }
@media (hover: hover) { .who[data-act]:hover b, .nm-edit:hover { text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .12em; } }
.nm-edit { display: inline-block; padding: 6px 0; }
.pos { font-family: var(--display); font-weight: 700; font-size: 1.25rem; color: var(--chalk-dim); }
.who b { font-family: var(--display); font-size: 1.25rem; font-weight: 800; letter-spacing: .02em; display: block; overflow-wrap: anywhere; }
.who small { display: block; color: var(--yellow); margin-top: 2px; }
.empty { padding: 14px 10px; color: var(--chalk-dim); border-left: 3px solid var(--line); }
/* estimated waits: the inputs behind them under the heading, and each spot's time on its chip line */
.eta-note { color: var(--chalk-dim); font-size: .9rem; margin: -2px 0 10px; }
.eta { margin-left: 8px; font-weight: 700; color: var(--chalk); font-variant-numeric: tabular-nums; white-space: nowrap; }
.eta.paused { color: var(--chalk-dim); }   /* "Paused" in place of a wait while the tournament is paused */

/* ---------- most-wins ticker ---------- */
.ticker { overflow: hidden; white-space: nowrap; font-family: var(--display); font-weight: 800; letter-spacing: .035em; text-transform: uppercase; color: var(--chalk); line-height: 1.25;
  font-size: 1.35rem; margin: -4px 0 10px; padding: 5px 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
.tk-track { display: inline-flex; }
.tk-run { padding-right: 4em; flex: none; }
.tk-lbl { color: var(--yellow); }
.ticker.still { white-space: normal; }
.ticker.still .tk-track { display: block; }   /* not scrolling (the device asks for less motion): the text wraps instead */
.ticker.still .tk-run { padding-right: 0; }

/* ---------- three-player playoff ---------- */
.po-badge { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px; border-radius: 10px; background: var(--yellow); color: var(--yellow-ink); font-weight: 700; font-size: .92rem; }
.po-box { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.po-box .pname { max-width: 100%; }
.po-big { font-family: var(--display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.po-up { color: var(--chalk-dim); }
.po-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.po-panel .section-title { margin-bottom: 10px; }
.po-champ { padding: 10px 0 12px; margin-bottom: 12px; border-top: 3px solid var(--sight); border-bottom: 3px solid var(--sight); }
.po-champ span { display: block; color: var(--chalk-dim); }
.po-champ b { display: block; font-family: var(--display); font-weight: 800; font-size: 2rem; letter-spacing: .03em; line-height: 1.1; overflow-wrap: anywhere; }
.po-stand { list-style: none; margin: 0 0 14px; padding: 0; border-top: 2px solid var(--line); }
.po-stand li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.po-stand b { display: block; font-family: var(--display); font-weight: 800; font-size: 1.25rem; letter-spacing: .02em; overflow-wrap: anywhere; }
.po-stand small { display: block; color: var(--yellow); font-weight: 600; margin-top: 2px; }
.po-stand .rec { font-family: var(--display); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.po-stand li.out b { color: var(--chalk-dim); text-decoration: line-through; }
.po-sched { list-style: none; margin: 0; padding: 0; }
.po-sched li { padding: 7px 0; border-bottom: 1px solid var(--line); }
.po-sched .now { color: var(--yellow); font-weight: 700; }
.po-sched .if { color: var(--chalk-dim); padding-left: 1.2em; }
.po-foot { margin-top: 10px; }
.po-names { font-family: var(--display); font-weight: 800; font-size: 1.2em; letter-spacing: .03em; }
.po-tiles { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.po-tile { display: inline-flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 16px 8px 10px; border-radius: 12px; border: 2px solid var(--chalk-dim); background: transparent; font-family: var(--display); font-weight: 800; font-size: 1.1em; letter-spacing: .03em; touch-action: manipulation; }
.po-tile .num { display: inline-flex; align-items: center; justify-content: center; width: 1.7em; height: 1.7em; border-radius: 50%; border: 2px dashed var(--chalk-dim); font-size: .85em; }
.po-tile .sub { font-family: var(--body); font-weight: 600; font-size: .8em; letter-spacing: 0; color: var(--chalk-dim); }
.po-tile[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.po-tile[aria-pressed="true"] .num { border: 0; background: var(--blue-ink); color: var(--blue); }
.po-tile.sits .num { border-style: solid; }
.po-plan { margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); line-height: 1.7; }
.po-al { display: grid; grid-template-columns: 2em minmax(0, 1fr) 5.5em; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.po-al b { font-family: var(--display); font-weight: 800; letter-spacing: .03em; overflow-wrap: anywhere; }
.po-al .input { text-align: center; font-weight: 700; }

/* ---------- playoff rounds ---------- */
.pr-round { margin: 0 0 12px; }
.pr-side .po-sched li { display: block; padding: 7px 0; line-height: 1.35; font-size: inherit; }   /* not a waitlist row */
.pr-rtitle { font-weight: 700; margin-bottom: 2px; }
.po-sched .void { color: var(--chalk-dim); text-decoration: line-through; }
.pr-note { margin: 0 0 12px; color: var(--chalk-dim); }
.pr-note.now { color: var(--yellow); font-weight: 700; }
.pr-sub { font-size: 1.1rem; font-weight: 700; margin: 6px 0 6px; }
.pr-sub .count { color: var(--chalk-dim); font-weight: 600; }
.pr-plan { margin-top: 14px; padding-top: 6px; border-top: 1px solid var(--line); }
.pr-mline { display: grid; grid-template-columns: 6.5em minmax(0, 1fr) 11em; gap: 10px; align-items: center; padding: 6px 0; }
.pr-mline > span:nth-child(2) { overflow-wrap: anywhere; }
.pr-mline select.input { min-height: 40px; padding: 4px 8px; }
@media (max-width: 560px) { .pr-mline { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

/* ---------- players table / log ---------- */
.data { width: 100%; border-collapse: collapse; }
.data th { text-align: left; font-weight: 600; color: var(--chalk-dim); padding: 6px 10px; border-bottom: 2px solid var(--line); }
.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.data td.num, .data th.num { text-align: center; font-variant-numeric: tabular-nums; }
.data .nm { font-family: var(--display); font-weight: 800; font-size: 1.2rem; letter-spacing: .03em; }
.scroll-x { overflow-x: auto; }
.block { margin-bottom: 30px; }
.place { font-family: var(--display); font-weight: 700; color: var(--chalk-dim); min-width: 3.2em; display: inline-block; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 82px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.log .t { color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.log li > span { min-width: 0; overflow-wrap: anywhere; }   /* a very long name wraps instead of pushing the page sideways */
.draw { columns: 2 220px; padding-left: 1.4em; margin: 0; }
.draw li { padding: 2px 0; break-inside: avoid; }

/* ---------- banners, champion ---------- */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; padding: 12px 14px; border-radius: 12px; background: var(--yellow); color: var(--yellow-ink); font-weight: 600; }
.banner.info { background: color-mix(in srgb, var(--chalk) 8%, transparent); color: var(--chalk); border: 2px solid var(--line); }
.champ { text-align: center; padding: 18px 0 26px; margin-bottom: 18px; }
/* the champion's box: like the Most wins box, but bigger, with a thicker border in its own color */
.champ-box { max-width: 52em; margin: 0 auto; padding: 20px 22px 22px; border: 5px solid var(--sight); border-radius: 24px; }
.champ .trophy { font-size: 3rem; line-height: 1; }
.champ .nm { font-family: var(--display); font-weight: 800; letter-spacing: .03em; font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1.05; margin: 8px 0 4px; overflow-wrap: anywhere; }
.champ .sub { color: var(--chalk-dim); }
.champ .confetti { white-space: nowrap; font-size: .62em; vertical-align: .1em; letter-spacing: 0; }
.champ .confetti:first-child { margin-right: .45em; }
.champ .confetti:last-child { margin-left: .45em; }
.champ .fleur { font-size: .8em; vertical-align: .06em; }
.champ .nw { white-space: nowrap; }
.champ .nm.breakable .nw { white-space: normal; }   /* a single word wider than the screen even at the smallest size */
.champ .nm.stacked .confetti { display: block; margin: 0; }   /* a name too long for one line: 🎊🎊🎊🎊 above it, 🎉🎉🎉🎉 below */
/* Most wins: under the champion, clearly smaller than the champion */
.mostwins { display: flex; align-items: center; gap: 14px; max-width: 26em; margin: 16px auto 0; padding: 10px 16px; text-align: left;
  border: 2px solid var(--yellow); border-radius: 14px; }
.mw-em { font-size: 2.2rem; line-height: 1; flex: none; }
.mw-lbl { color: var(--yellow); font-weight: 700; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; }
.mw-nm { font-family: var(--display); font-weight: 800; font-size: 1.45rem; letter-spacing: .03em; line-height: 1.15; overflow-wrap: anywhere; }
.mw-sub { color: var(--chalk-dim); font-size: .9rem; }
/* the Longest run award sits beside Most wins, and goes under it on a narrow screen */
.awards { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; gap: 12px; margin-top: 16px; }
.awards .mostwins { margin: 0; flex: 0 1 24em; }
/* a player on a run of 3 or more wins: 🔥 and the count beside their chips */
.run { font-weight: 800; color: var(--yellow); white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.data .run { margin-left: .35em; font-size: .85em; }
/* "Dropped" beside the name of a player who left the tournament */
.tag { display: inline-block; margin-left: .45em; padding: 1px .6em; border-radius: 999px; border: 1.5px solid var(--chalk-dim); color: var(--chalk-dim);
  font-family: var(--body); font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; vertical-align: .2em; }
/* TV cues: a match thrown in the last minute glows (the rail pulses in the highlight color, 30 pulses of 2 seconds);
   a match clock turns amber past 1.5 times the average match and red past 2 times */
.frame.fresh { animation: freshglow 2s ease-in-out var(--fresh-delay, 0s) 30; }
@keyframes freshglow {
  0%, 100% { background-color: var(--rail); box-shadow: 0 2px 0 var(--rail-dk), 0 0 0 2px color-mix(in srgb, var(--blue) 45%, transparent); }
  50% { background-color: var(--blue); box-shadow: 0 2px 0 var(--rail-dk), 0 0 0 4px var(--blue), 0 0 18px 4px color-mix(in srgb, var(--blue) 65%, transparent); }
}
@media (prefers-reduced-motion: reduce) {
  .frame.fresh { animation: freshstill 60s steps(1, end) var(--fresh-delay, 0s) 1; }
  @keyframes freshstill { from, to { background-color: var(--blue); box-shadow: 0 2px 0 var(--rail-dk), 0 0 0 4px var(--blue); } }
}
.elapsed.slow, .elapsed.vslow { display: inline-block; padding: 0 .35em; border-radius: .3em; font-weight: 800; line-height: 1.25; }
.elapsed.slow { background: var(--yellow); color: var(--yellow-ink); }
.elapsed.vslow { background: var(--red); color: #fff; }

/* ---------- phone view: the QR button and its status dot, the QR pop-up, the setup pop-up ---------- */
.qr-btn { display: inline-flex; align-items: center; gap: 7px; }
.pdot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--chalk-dim); }
.pdot.ok { background: #3fcf7f; }
.pdot.warn { background: var(--yellow); }
.pdot.bad { background: var(--red-text); }
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.qr-box { width: min(72vw, 50vh, 24em); background: #fff; border-radius: 12px; overflow: hidden; }
.qr-box svg { display: block; width: 100%; height: auto; }
.qr-say { font-weight: 700; font-size: 1.1em; }
.qr-url, .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.qr-url { font-size: .85em; color: var(--chalk-dim); overflow-wrap: anywhere; margin: 0; }
/* the phone page check under the QR code: fine (green), a problem players would hit (red), or couldn't check (plain) */
.qr-check { margin: 0; padding: 6px 10px; border-radius: 8px; font-size: .92em; color: var(--chalk-dim); }
.qr-check.ok { color: var(--chalk); background: color-mix(in srgb, #3fcf7f 16%, transparent); }
.qr-check.warn { color: var(--yellow-ink); background: var(--yellow); }
.qr-check.bad { color: #fff; background: var(--red); font-weight: 700; }
.app-ver { margin: 18px 0 0; text-align: center; font-size: .85em; }
/* Phone view setup: what's missing after a check, the folded address fields, the hint under the key */
.ph-issue { margin: 12px 0; padding: 12px 14px; border: 2px solid var(--yellow); border-radius: 12px; background: color-mix(in srgb, var(--yellow) 12%, transparent); }
.ph-issue p { margin: 6px 0 0; }
.ph-issue textarea { margin-top: 10px; }
.ph-adv { margin-top: 16px; }
.ph-adv > summary { cursor: pointer; padding: 6px 0; color: var(--blue); font-weight: 700; }
.ph-adv[open] > summary { margin-bottom: 8px; }
.ph-hint { display: block; margin-top: 5px; line-height: 1.35; }
textarea.mono { font-size: .82em; line-height: 1.35; }

/* ---------- the read-only phone page (opened from the QR link) ---------- */
.vw-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
  background: var(--rail); border-bottom: 3px solid var(--rail-dk); }
.vw-title { min-width: 0; font-weight: 700; font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vw-live { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 999px; font-size: .85rem; font-weight: 700;
  background: color-mix(in srgb, var(--chalk) 10%, transparent); }
.vw { max-width: 40em; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
.vw-sec { margin-top: 20px; }
.vw-wait { margin-top: 40px; text-align: center; color: var(--chalk-dim); font-size: 1.1rem; }
.vw-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font-weight: 700; font-size: 1.3rem; }
.vw-h .count { color: var(--chalk-dim); font-size: 1rem; font-weight: 600; }
.vw-note { color: var(--chalk-dim); font-size: .9rem; margin: 6px 0 0; }
.vw-me { margin-top: 16px; padding: 14px 16px; border: 2px solid var(--blue); border-radius: 14px; background: color-mix(in srgb, var(--blue) 12%, transparent); }
.vw-me-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.vw-me .nm { min-width: 0; font-weight: 800; font-size: 1.7rem; letter-spacing: .03em; line-height: 1.1; overflow-wrap: anywhere; }
.vw-me .big { margin-top: 6px; font-weight: 700; font-size: 1.3rem; }
.vw-me .sub { margin-top: 2px; color: var(--chalk-dim); }
.vw-me-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; }   /* chips and wins */
.vw-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5em, 1fr)); gap: 8px; }
.vw-pick .btn { font-weight: 800; letter-spacing: .03em; overflow-wrap: anywhere; }
.vw-tbl { margin-bottom: 10px; padding: 10px 12px; border: 3px solid var(--rail); border-radius: 12px; background: var(--cloth); }
.vw-tbl.fresh { border-color: var(--blue); box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 45%, transparent); }
.vw-tbl .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; color: var(--chalk-dim); font-size: .92rem; }
.vw-tbl .top b { color: var(--chalk); }
.vw-tbl .pl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 0; }
.vw-tbl .pl b { min-width: 0; font-weight: 800; font-size: 1.25rem; letter-spacing: .03em; overflow-wrap: anywhere; }
.vw-tbl .pl.me b { color: var(--blue); }
.vw-tbl .pl .pchips { flex: none; justify-content: flex-end; min-height: 0; }
.vw-tbl .vs { color: var(--chalk-dim); font-size: .85rem; font-style: italic; }
.vw-tbl .tn { margin-top: 4px; color: var(--yellow); font-weight: 600; }
.vw-row { display: grid; grid-template-columns: 2.2em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--line); }
.vw-row.st { grid-template-columns: 5.2em minmax(0, 1fr) auto; }
.vw-row.nopos { grid-template-columns: minmax(0, 1fr) auto; }
.vw-more > summary { cursor: pointer; list-style: none; padding: 10px 0 4px; border-top: 1px solid var(--line); }
.vw-more > summary::-webkit-details-marker { display: none; }
.vw-more > summary::after { content: "Show"; margin-left: auto; color: var(--blue); font-size: 1rem; font-weight: 700; }
.vw-more[open] > summary::after { content: "Hide"; }
.vw-row.me { border-radius: 8px; background: color-mix(in srgb, var(--blue) 16%, transparent); }
.vw-row .pos { color: var(--chalk-dim); font-weight: 700; font-variant-numeric: tabular-nums; }
.vw-row .who { min-width: 0; }
.vw-row .who b { font-weight: 800; font-size: 1.1rem; letter-spacing: .03em; overflow-wrap: anywhere; }
.vw-row .who .pchips { min-height: 0; margin-top: 2px; }
.vw-row .r { text-align: right; white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; }
.vw .champ { padding-bottom: 6px; }
.vw-foot { margin-top: 28px; color: var(--chalk-dim); font-size: .85rem; text-align: center; }
.vw-tt { min-width: 0; }
.vw-end { color: var(--chalk-dim); font-size: .85rem; font-weight: 700; }
.vw-wins { margin-top: 14px; padding: 8px 12px; border: 1.5px solid var(--yellow); border-radius: 10px; background: color-mix(in srgb, var(--yellow) 12%, transparent); font-weight: 800; letter-spacing: .02em; }
.vw-wins .lbl { color: var(--yellow); font-size: .85em; letter-spacing: .05em; text-transform: uppercase; }
.vw-wins .sep { color: var(--chalk-dim); }
/* the player's match history: a line of text opens it; one row per match, latest first (W or L, the opponent, when it
   started and under that how long it lasted, and a line with the table, a playoff match's name, and the chips left after
   a loss). The line of text is in the Main text color, which the color settings keep readable on every background. */
.vw-hist-tg { display: inline-flex; align-items: center; gap: .45em; margin-top: 8px; min-height: 36px; padding: 0; border: 0; background: none;
  color: var(--chalk); font: inherit; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .22em; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); }
.vw-hist-tg::after { content: ""; width: .42em; height: .42em; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
  transform: translateY(-.12em) rotate(45deg); }
.vw-hist-tg[aria-expanded="true"]::after { transform: translateY(.12em) rotate(-135deg); }
.vw-hist { margin: 2px 0 0; padding: 0; list-style: none; }
.vw-hist li { display: grid; grid-template-columns: 1.85rem minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.vw-hist .res { grid-row: span 2; display: flex; align-items: center; justify-content: center; width: 1.85rem; height: 1.85rem; box-sizing: border-box;
  border-radius: 50%; font-weight: 800; font-size: .9rem; }
.vw-hist .w .res { background: var(--blue); color: var(--blue-ink); }
.vw-hist .l .res { border: 2px solid var(--red-text); color: var(--red-text); }
.vw-hist .so .res { font-size: 1.15rem; }
.vw-hist .opp { align-self: start; min-width: 0; font-weight: 800; letter-spacing: .03em; overflow-wrap: anywhere; }
.vw-hist .vs { margin-right: .3em; color: var(--chalk-dim); font-weight: 600; letter-spacing: 0; }
.vw-hist .tm { align-self: start; justify-self: end; color: var(--chalk-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vw-hist .det { grid-column: 2; color: var(--chalk-dim); font-size: .88rem; }
.vw-hist .dur { grid-column: 3; justify-self: end; align-self: start; color: var(--chalk-dim); font-size: .88rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.vw-hist .out { color: var(--red-text); font-weight: 700; }
.vw-hist-none { margin: 4px 0 0; color: var(--chalk-dim); }
.vw-paused { color: var(--chalk-dim); font-weight: 700; }   /* a waitlist spot while the tournament is paused */
/* the spot shot pop-up: 🎯 or ❌, a word and a line, for under three seconds */
#fx-root { position: fixed; inset: 0; z-index: 55; pointer-events: none; }
.shotfx { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, #021014 55%, transparent);
  animation: fxfade 2.7s ease forwards; }
.fxcard { position: relative; text-align: center; font-size: clamp(16px, 1.35vw, 52px); padding: 1.4em 2em; min-width: 16em; max-width: 90vw; border-radius: 18px; background: var(--felt); color: var(--chalk); border: 4px solid var(--blue); }
.shotfx.miss .fxcard { border-color: var(--red); }
.fxem { font-size: 5em; line-height: 1; display: inline-block; animation: fxpop .55s cubic-bezier(.2, 1.6, .4, 1) both; }
.shotfx.miss .fxem { animation: fxpop .4s ease both, fxshake .5s .4s ease; }
.fxring { position: absolute; left: 50%; top: 3.9em; width: 6.5em; height: 6.5em; margin: -3.25em 0 0 -3.25em; border-radius: 50%; border: 5px solid var(--blue); animation: fxring 1s ease-out both; }
.fxbig { font-family: var(--display); font-weight: 800; font-size: 2.6em; letter-spacing: .05em; margin-top: .12em; }
.shotfx.hit .fxbig { color: var(--blue); }
.shotfx.miss .fxbig { color: var(--red-text); }
.fxsub { font-size: 1.2em; font-weight: 600; }
.fxwin { margin-top: .4em; font-size: 1.3em; font-weight: 700; color: var(--yellow); }
@keyframes fxfade { 0% { opacity: 0; } 8% { opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxpop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes fxshake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(4px); } }
@keyframes fxring { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fxem, .fxring, .shotfx.miss .fxem { animation: none; } .fxring { display: none; } }
.trail { letter-spacing: .08em; }
.po-stand .rec .trail { display: block; font-size: .8em; }
.po-stand .rec .strk { display: block; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; justify-content: center; }

/* ---------- registration ---------- */
.reg { display: grid; grid-template-columns: 1fr; gap: 30px; align-items: start; }
@media (min-width: 900px) { .reg { grid-template-columns: minmax(0, 1fr) 340px; } .reg .start-panel { position: sticky; top: 92px; } }
.hero { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; margin-bottom: 6px; }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 18px 0 8px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .lbl { color: var(--chalk-dim); font-size: .92rem; }
.input, select.input, textarea.input {
  min-height: 46px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--felt); color: var(--chalk); width: 100%;
}
.input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 33%, transparent); }
.grow { flex: 1 1 200px; }
.stepper { display: inline-flex; align-items: center; gap: 0; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--felt); }
.stepper button { width: 44px; min-height: 42px; border: 0; background: transparent; font-size: 1.3rem; font-weight: 700; }
.stepper button:hover { background: color-mix(in srgb, var(--chalk) 8%, transparent); }
.stepper output { min-width: 38px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.3rem; }
.roster { list-style: none; margin: 14px 0 0; padding: 0; border-top: 2px solid var(--line); }
.roster li { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.roster .nm { font-family: var(--display); font-weight: 800; font-size: 1.25rem; letter-spacing: .03em; overflow-wrap: anywhere; }
#name-in, #e-name { text-transform: uppercase; }   /* names show in capitals while you type them, too */
.start-panel { border-top: 3px solid var(--sight); padding-top: 14px; }
.start-panel .big-n { font-family: var(--display); font-weight: 700; font-size: 3rem; line-height: 1; }
.est { margin: 10px 0 14px; color: var(--chalk-dim); }
.est b { color: var(--chalk); }
.problem { color: var(--red-text); font-weight: 600; margin: 8px 0; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; margin-top: 14px; cursor: pointer; }
.opt input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--blue); }
.opt b { display: block; font-weight: 600; }
.opt small { display: block; color: var(--chalk-dim); font-size: .9rem; margin-top: 2px; }
.opt.locked { cursor: default; }
.opt.locked input { opacity: .5; }
.modal .opt { margin-top: 8px; }
.tnums { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0; }

/* ---------- Colors pop-up ---------- */
.sch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
.sch .btn { padding: 8px 6px; }
.crows { border-top: 1px solid var(--line); }
.crow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 9px 6px; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; cursor: pointer; }
.crow:hover, .crow.sel { background: color-mix(in srgb, var(--chalk) 7%, transparent); }
.crow b { display: block; font-weight: 700; }
.crow small { display: block; color: var(--chalk-dim); font-size: .85em; }
.sw { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--chalk-dim); }
.hex { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--chalk-dim); font-size: .9em; }
.ced { padding: 12px 6px 6px; border-bottom: 1px solid var(--line); }
.cgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; }
.cgrid button { aspect-ratio: 1; min-height: 28px; border-radius: 8px; border: 3px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .5); }
.cgrid button.on { border-color: var(--chalk); }
.chex { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.chex label { color: var(--chalk-dim); }
.chex .input { width: 7.5em; min-height: 40px; font-family: ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; }
@media (max-width: 519px) { .cgrid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.chipsets { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5em, 1fr)); gap: 8px; margin: 8px 0 12px; }
.chipset { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--chalk-dim); background: transparent; font-weight: 600; text-align: left; cursor: pointer; }
.chipset:hover { background: color-mix(in srgb, var(--chalk) 8%, transparent); }
.chipset.on { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue) inset; }
.chipset .chip { width: 26px; height: 26px; flex: none; margin: 0; border-width: 3px; }
.chipset small { color: var(--chalk-dim); font-weight: 400; }
.tnums .tnum { width: 4.4em; min-width: 0; text-align: center; font-family: var(--display); font-weight: 700; font-size: 1.2rem; }

/* ---------- modal + toast ---------- */
.scrim, .toast { font-size: max(16px, 1rem); }   /* pop-ups stay a comfortable size on any screen, and grow on a big TV */
.scrim { position: fixed; inset: 0; z-index: 50; background: #021014cc; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
@media (min-width: 640px) { .scrim { align-items: center; padding: 20px; } }
.modal { width: 100%; max-width: 35em; max-height: 92vh; overflow: auto; background: var(--felt); border: 3px solid var(--rail); border-radius: 20px 20px 0 0; padding: 20px 20px 22px; }
@media (min-width: 640px) { .modal { border-radius: 20px; } }
.modal h2 { font-family: var(--display); font-weight: 700; font-size: 1.7em; line-height: 1.1; margin-bottom: 10px; }
.modal p { margin: 8px 0; }
.modal .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; justify-content: flex-end; }
.modal .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.modal .stack .btn { text-align: left; }
.modal .btn.small, .toast .btn.small { font-size: .92em; }
.modal .btn.big { font-size: 1.1em; }
.modal .field label, .modal .lbl { font-size: .92em; }
.modal .grp { margin-top: 16px; font-family: var(--display); font-weight: 700; font-size: 1.15em; color: var(--chalk-dim); }
.pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; }
.err { color: var(--red-text); font-weight: 600; margin-top: 8px; min-height: 1.2em; }
.toast {
  position: fixed; left: 50%; bottom: calc(3 * (18px + env(safe-area-inset-bottom))); transform: translateX(-50%); z-index: 60;   /* three times as far up as it used to sit */
  display: flex; align-items: center; gap: 14px; width: max-content; max-width: min(92vw, 35em); cursor: pointer;
  padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--chalk); color: var(--deep); font-weight: 600;
  box-shadow: 0 6px 24px #0008;
}
.toast.bad { background: var(--red); color: #fff; }
.toast .btn { border-color: var(--deep); color: var(--deep); min-height: 38px; }
.toast.bad .btn { border-color: #fff; color: #fff; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: pop .18s ease-out; } @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =====================================================================================================
   Wide screens (a TV): tables become a narrow strip on the left, the waitlist gets the room on the right.
   The class "tv" is set on <html> by the script when the Tables tab is showing on a screen 1280px or wider.
   Everything here scales with the screen width (16px per 1920px). --ts is the table name size, --wl the waitlist name size;
   the script sets them to the largest values that fit. Table chips and counts are fractions of --ts.
   ===================================================================================================== */
html.tv { font-size: clamp(12px, .83333vw, 40px); }
.tv .wrap { max-width: none; padding: .6rem 1.75rem 1rem; }
.tv .rail-bar { padding-top: .5rem; padding-bottom: .75rem; }
.tv .brand { font-size: 2.1rem; }
.tv .stats { margin-bottom: .25rem; }
.tv .tabs { margin: 0 0 .6rem; }
.tv .section-title { font-size: 1.5rem; margin-bottom: .35rem; }
.tv .hint { display: none; }
.tv .board { grid-template-columns: var(--tw, 26vw) minmax(0, 1fr); gap: 1.75rem; }   /* the script widens the tables' part (--tw) when they need it */

/* ---------- the tables ---------- */
.tv .tables { grid-template-columns: repeat(var(--tc, 1), minmax(0, 1fr)); gap: .16em 1.25rem; font-size: var(--ts, 2.6rem); }
/* a narrow table card (many tables, or a phone held sideways): the header stays on one line and leaves out the start time
   (the match clock stays); if even that is too wide, the clock moves under the table number */
.tv .tables > article { container-type: inline-size; }
.tv .thead { flex-wrap: wrap; row-gap: 0; }
.tv .thead h3, .tv .tmeta { white-space: nowrap; }
.tv .tmeta { margin-left: auto; }
@container (max-width: 17rem) { .tv .tmeta .time { display: none; } }
.tv .thead { line-height: 1; padding: 0 .1em .08em; margin: 0; align-items: flex-end; }
.tv .thead h3 { font-size: max(1.4rem, .4em); line-height: 1; font-weight: 800; }
.tv .tmeta { font-size: max(1.15rem, .32em); line-height: 1; color: var(--chalk); font-weight: 700; }
.tv .tmeta .time { font-weight: 700; }
.tv .tmeta .elapsed { margin-left: .35em; }
.tv .frame { padding: .1em; border-radius: .26em; }
.tv .frame::before, .tv .frame::after { display: none; }
.tv .felt { padding: .06em .2em .1em; gap: 0 .12em; grid-template-columns: 1fr .8em 1fr; align-items: stretch; align-content: stretch; border-radius: .12em; }
/* The pockets, in proportion to the table (its size is the font size here) and clear of the names and chips. On a small
   table they'd only be clutter: below 30px (a table about 50px deep) their size works out to 0, so they're left off. */
.tv .felt {
  --pk: clamp(0px, (1em - 30px) * 1000, .15em); --pks: clamp(0px, (1em - 30px) * 1000, .13em);
  background-image:
    radial-gradient(circle at 0 0, #04171c 0 var(--pk), transparent calc(var(--pk) + min(1px, var(--pk)))),
    radial-gradient(circle at 100% 0, #04171c 0 var(--pk), transparent calc(var(--pk) + min(1px, var(--pk)))),
    radial-gradient(circle at 0 100%, #04171c 0 var(--pk), transparent calc(var(--pk) + min(1px, var(--pk)))),
    radial-gradient(circle at 100% 100%, #04171c 0 var(--pk), transparent calc(var(--pk) + min(1px, var(--pk)))),
    radial-gradient(circle at 50% 0, #04171c 0 var(--pks), transparent calc(var(--pks) + min(1px, var(--pks)))),
    radial-gradient(circle at 50% 100%, #04171c 0 var(--pks), transparent calc(var(--pks) + min(1px, var(--pks))));
}
/* an empty table's dashed box sits clear of the side pockets (its own font is smaller, so this is in table sizes) */
.tv .felt > .slot:only-child { margin: calc(var(--ts, 2.6rem) * .08) 0 calc(var(--ts, 2.6rem) * .04); }
.tv .vs { font-size: .28em; align-self: center; text-align: center; }
.tv .seat { gap: 0; justify-content: space-between; min-width: 0; }
.tv .pname { font-size: var(--nf, var(--ts, 2.6rem)); height: calc(var(--ts, 2.6rem) * 1.08); line-height: calc(var(--ts, 2.6rem) * 1.08); white-space: nowrap; overflow: hidden; overflow-wrap: normal; }
.tv .who b.cut { text-overflow: ellipsis; }
.tv button.pname.won { min-height: 0; padding: 0; text-indent: .14em; }   /* indent instead of padding: the fit check and the ellipsis then agree on the width */
.tv .pchips { line-height: 1; min-height: 0; align-items: center; padding: .04em .02em 0; gap: 0 .25em; flex-wrap: nowrap; }
.tv .pchips > span[aria-hidden] { display: flex; align-items: center; white-space: nowrap; flex: none; }
.tv .felt .chip { width: var(--chip, calc(var(--ts, 2.6rem) * .46)); height: var(--chip, calc(var(--ts, 2.6rem) * .46)); margin-right: .06em; flex: none; }
.tv .felt .chip.on, .tv .felt .chip.off { border-width: .0575em; }
.tv .felt .frac { font-size: .36em; font-weight: 700; color: var(--chalk); line-height: 1; }
.tv .felt .run { font-size: .42em; line-height: 1; margin-left: .1em; flex: none; }
.tv .slot { font-size: max(1rem, .26em); line-height: 1.2; padding: .5em .6em; gap: .3em; }
.tv .slot .btn { margin-top: 0; }
.tv .tnote { font-size: max(1rem, .25em); line-height: 1.2; padding-top: .2em; }
.tv .closed-tables { margin-top: .7rem; font-size: 1rem; }

/* ---------- the waitlist: the priority zone ---------- */
.tv .waitlist .section-title { font-size: 2.4rem; margin-bottom: .5rem; }
/* the most-wins ticker: in the space beside the counts and tabs (the script sets its left edge, top and height) */
.tv .wrap { position: relative; }
.tv .ticker { position: absolute; right: 1.75rem; display: flex; align-items: center; margin: 0; padding: 0 0 0 .4em; border: 0; border-left: 3px solid var(--line); font-size: 2.5rem; }
.tv .ticker.still { font-size: 1.3rem; }
.tv .waitlist .section-title .count { font-size: 1.6rem; }
.tv .waitlist ol { display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 6), auto); grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: 0 1.25rem; border-left: 0; font-size: var(--wl, 3rem); }
.tv .waitlist li { grid-template-columns: .75em minmax(0, 1fr); gap: .15em; padding: .12em .1em .12em .05em; line-height: 1; }
.tv .waitlist .pos { font-size: .6em; align-self: center; text-align: right; padding-right: 0; }
/* each player is two lines: the name with the chips beside it, then the wait. Tapping the name opens Edit */
.tv .who { min-width: 0; display: grid; grid-template-columns: minmax(0, max-content) 1fr; column-gap: .3em; align-items: center; cursor: pointer;
  padding: .12em 0; margin: -.12em 0; }   /* the tap area covers the row's full height */
.tv .who b { grid-column: 1; min-width: 0; }
.tv .who b { font-size: 1em; display: block; white-space: nowrap; overflow: hidden; overflow-wrap: normal; line-height: 1.08; }
.tv .who .pchips { display: contents; }
.tv .who .pchips > span[aria-hidden], .tv .who .pchips > .frac { grid-column: 2; grid-row: 1; justify-self: start; flex-wrap: nowrap; min-width: max-content; }
.tv .who .pchips > span[aria-hidden] + .frac { display: none; }   /* the chips already show the count */
.tv .waitlist .chip { width: .42em; height: .42em; margin-right: .07em; }
.tv .waitlist .chip.on, .tv .waitlist .chip.off { border-width: max(1.5px, .0625em); }
.tv .waitlist .frac { font-size: max(1rem, .4em); color: var(--chalk-dim); }
.tv .who small { grid-column: 1 / -1; font-size: max(.9rem, .3em); line-height: 1.2; margin-top: .15em; }
.tv .scrim, .tv .toast { font-size: max(16px, 1.15rem); }   /* pop-ups and result messages read from further away on a big screen */
/* when the whole waitlist can't fit beside the tables: the top of the list, and how many more are waiting */
.wl-more { display: none; }
.tv .wl-more:not(:empty) { display: block; margin: .35rem 0 0; font-size: 1.4rem; font-weight: 700; color: var(--chalk-dim); }
.tv .waitlist li.wl-cut { display: none; }
/* while the size is being chosen: names at 72%, the smallest a too-wide name may shrink to */
.tv .waitlist ol.probe .who b { font-size: .72em; }
/* a touch screen in this layout (an iPad or a phone held sideways): buttons stay big enough for a finger */
@media (pointer: coarse) {
  .tv .bar-actions .btn { min-height: 40px; }
}
.tv .empty { font-size: 1.6rem; }
.tv .eta-note { font-size: 1.15rem; margin: -.2rem 0 .5rem; }
/* the estimated wait: the second line, lined up with the name */
.tv .waitlist .eta { grid-column: 1 / -1; min-width: 0; font-size: .64em; line-height: 1.12; margin: .06em 0 0; }

/* ---------- the playoff on a big screen: the table on the left, standings and schedule on the right ---------- */
.tv .po-box { font-size: max(1.1rem, .3em); line-height: 1.25; gap: .35em; padding: .3em .2em; }
.tv .po-box .po-big { font-size: 1.7em; }
.tv .po-box .btn { font-size: 1em; min-height: 2.6em; padding: .3em .9em; }
.tv .po-panel { font-size: 1.5rem; }
.tv .po-panel .section-title { font-size: 2.4rem; margin-bottom: .5rem; }
.tv .po-stand li { grid-template-columns: 1.4em minmax(0, 1fr) auto; padding: .35em .2em; }
.tv .po-stand .pos { font-size: 1.1em; }
.tv .po-stand b, .tv .po-stand .rec { font-size: 1.7em; }
.tv .po-stand small { font-size: .85em; }
.tv .po-champ b { font-size: 2.8em; }
.tv .po-sched li { padding: .3em 0; }

/* ---------- playoff rounds on a big screen ---------- */
.tv .pr-side .pr-round, .tv .pr-side .pr-note { font-size: 1.5rem; }
.tv .pr-side .pr-rtitle { font-size: 1.15em; }
.tv .pr-side .po-sched li { display: block; padding: .3em 0; line-height: 1.3; font-size: inherit; }
.tv .pr-side .pr-sub { font-size: 2rem; margin: .4rem 0 .3rem; }

/* ---------- the big-screen layout on a short screen (a phone held sideways): a slimmer top so the board gets the room ---------- */
.tv-short .rail-bar { padding-bottom: .5rem; }
.tv-short .brand { font-size: 1.5rem; }
.tv-short .stats { font-size: .85rem; margin-bottom: 0; }
.tv-short .stats b { font-size: 1rem; }
.tv-short .tabs { margin-bottom: .35rem; }
.tv-short .tab { min-height: 36px; padding: 4px 14px; }
.tv-short .section-title { font-size: 1.2rem; margin-bottom: .15rem; }
.tv-short .waitlist .section-title { font-size: 1.5rem; margin-bottom: .2rem; }
.tv-short .waitlist .section-title .count { font-size: 1.1rem; }
.tv-short .eta-note { display: none; }
.tv-short .waitlist .pos { font-size: max(12px, .6em); }
.tv-short .waitlist .eta { font-size: max(12px, .64em); }

/* ---------- iPhones and iPads: keep clear of the camera cutout and the rounded corners (all of these are zero on other screens) ---------- */
.rail-bar { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: max(10px, env(safe-area-inset-top)); }
@media (max-width: 519px) { .rail-bar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); padding-top: max(8px, env(safe-area-inset-top)); } }
.tv .rail-bar { padding-top: max(.5rem, env(safe-area-inset-top)); }
.tv-short .rail-bar { padding-top: max(.3rem, env(safe-area-inset-top)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.tv .wrap { padding-left: max(1.75rem, env(safe-area-inset-left)); padding-right: max(1.75rem, env(safe-area-inset-right)); }
.tv .ticker { right: max(1.75rem, env(safe-area-inset-right)); }
</style>
