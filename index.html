    h += '<button class="btn small" data-act="batch-open">Paste a list of names</button>';
    h += '<ol class="roster" aria-label="Registered players">';
    S.players.forEach(function (p, i) {
      h += '<li><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(dn(p.name)) + '</span>' +
        '<span class="stepper"><button data-act="reg-dec" data-id="' + p.id + '" aria-label="One fewer chip for ' + esc(p.name) + '">&minus;</button><output>' + p.S + '</output><button data-act="reg-inc" data-id="' + p.id + '" aria-label="One more chip for ' + esc(p.name) + '">+</button></span>' +
        '<button class="btn small ghost" data-act="reg-remove" data-id="' + p.id + '" aria-label="Remove ' + esc(p.name) + '">Remove</button></li>';
    });
    h += '</ol>';
    if (!n) h += '<p class="empty">No players yet. Type a name above and press Enter.</p>';
    h += '</section>';

    var chips = S.players.reduce(function (a, p) { return a + p.S; }, 0);
    var problem = regProblem(), nums = plannedNums();
    h += '<aside class="start-panel"><div class="field" style="margin-bottom:16px"><label for="title-in">Tournament title</label><input id="title-in" class="input" maxlength="60" autocomplete="off" placeholder="Chip tournament" value="' + esc(S.title || '') + '" data-input="title">' +
      '<span class="muted" style="font-size:.9rem">Shown in the top bar. Leave it blank for "Chip tournament".</span></div><div class="big-n">' + n + '</div><div class="muted">' + (n === 1 ? 'player' : 'players') + ' registered, ' + plural(chips, 'chip') + ' in all</div>' +
      '<div class="field" style="margin-top:14px"><span class="lbl">Tables</span><div class="stepper"><button data-act="tbl-dec" aria-label="One fewer table">&minus;</button><output>' + tables + '</output><button data-act="tbl-inc" aria-label="One more table">+</button></div>' +
      '<span class="muted" style="font-size:.9rem">Suggested: ' + suggestedTables() + ' (one per 5 players)</span></div>' +
      '<div class="field" style="margin-top:12px"><span class="lbl" id="tn-lbl">Table numbers</span><div class="tnums" role="group" aria-labelledby="tn-lbl">' +
      nums.map(function (v, i) {
        return '<input id="tn-' + i + '" class="input tnum" type="text" inputmode="numeric" maxlength="3" autocomplete="off" value="' + esc(v) + '" data-input="tnum" data-i="' + i + '" aria-label="Number for table ' + (i + 1) + ' of ' + nums.length + '">';
      }).join('') + '</div>' +
      '<span class="muted" style="font-size:.9rem">Type the number on each table. No repeats.</span></div>' +
      '<label class="opt" for="pr-opt"><input id="pr-opt" type="checkbox" data-input="pr-opt"' + (S.playoffRounds ? ' checked' : '') + '>' +
      '<span><b>Playoff rounds at ' + E.PR_MAX + ' players or fewer</b><small>Auto-throw stops when a result leaves ' + E.PR_MAX + ' players or fewer. After each round the players draw in person for the next one.' +
      (S.playoffRounds && n >= 2 && n <= E.PR_MAX ? ' With ' + n + ' players registered, round 1 is an in-person draw too.' : '') + '</small></span></label>' +
      '<div class="field" style="margin-top:12px"><label for="mm">Average match length (minutes)</label><input id="mm" class="input" type="number" min="1" step="0.5" inputmode="decimal" value="' + esc(S.matchMinutes) + '" data-input="mm"></div>' +
      '<p class="est" id="est">' + estHTML(tables) + '</p>' +
      '<p class="problem" id="problem">' + problem + '</p>' +
      '<button class="btn primary big" style="width:100%" data-act="start-open"' + (problem || !n ? ' disabled' : '') + '>Draw and start</button></aside></div>';
    return h;
  }
  function estHTML(tables) {
    var mm = parseFloat(S.matchMinutes);
    if (!(mm > 0)) return 'Enter a match length for a time estimate.';
    var m = E.plannedMinutes(S.players.map(function (p) { return p.S; }), tables, mm);
    if (m === null) return 'Add players for a time estimate.';
    return 'Estimated length: <b>' + fmtDur(Math.round(m / 5) * 5) + '</b> (the night played out from these chips and tables at your match length). Breaks and delays add to it.';
  }

  /* ---------- active / finished screens ---------- */
  function activeHTML() {
    var h = '';
    if (S.phase === 'finished') h += champHTML();
    h += statsHTML();
    if (ui.tab === 'tables') h += tickerHTML();
    if (E.isPaused(S)) {
      h += '<div class="banner pause-banner" role="status"><span><b>\u23F8\uFE0F Tournament paused</b> since ' + E.fmtTime(S.pause.at) + '. Match clocks, wait times and the finish time are on hold.</span>' +
        '<button class="btn" data-act="play-resume" style="border-color:var(--yellow-ink)">Resume tournament</button></div>';
    }
    var po = E.playoffCandidates(S);
    if (po) {
      h += '<div class="banner"><span>Three players left: ' + po.map(function (id) { return esc(dn(P(id).name)); }).join(', ') + '. You can finish with a round robin playoff.</span><button class="btn" data-act="po-offer" style="border-color:var(--yellow-ink)">Begin playoff</button></div>';
    }
    if (S.phase === 'active' && S.pr && !S.rr) {
      var di = E.prDrawInfo(S), run = E.runningCount(S);
      if (di) h += '<div class="banner"><span>Playoff rounds. ' + di.n + ' players left: draw for round ' + di.round + ', ' + di.name + '.</span><button class="btn" data-act="pr-draw-open" style="border-color:var(--yellow-ink)">Enter the draw</button></div>';
      else if (S.pr.stage === 'finishing') h += '<div class="banner"><span>Playoff rounds. ' + E.activeCount(S) + ' players left. The draw for round 1 comes after ' + (run === 1 ? 'the match in progress finishes.' : 'the ' + run + ' matches in progress finish.') + '</span></div>';
    }
    var pc = E.pendingConsolidation(S);
    if (pc && S.phase === 'active') {
      h += '<div class="banner"><span>Table ' + pc.tables[0] + ' and Table ' + pc.tables[1] + ' each have a winner waiting and no one left to challenge them.</span><button class="btn" data-act="consol-open" style="border-color:var(--yellow-ink)">Consolidate tables</button></div>';
    }
    h += '<div class="tabs" role="tablist">' + ['tables:🎱 Tables', 'players:🐎 Players', 'log:📒 Log'].map(function (s) {
      var k = s.split(':');
      return '<button class="tab" role="tab" data-act="tab" data-tab="' + k[0] + '" aria-selected="' + (ui.tab === k[0]) + '">' + k[1] + '</button>';
    }).join('') + '</div>';
    if (ui.tab === 'tables') h += (S.phase === 'finished' ? finalHTML() : (S.rr ? playoffBoardHTML() : (S.pr ? prBoardHTML() : boardHTML())));
    else if (ui.tab === 'players') h += playersHTML();
    else h += logHTML();
    return h;
  }

  /* ---------- the most-wins ticker: the top three win totals scrolling across the top of the Tables tab ----------
     Hidden until the first result. Tied players share a spot; if more than three share a spot, that spot and the ones below it
     wait until the tie thins out (for the top spot it says how many are tied, so the ticker never goes blank). */
  var TK_LABELS = ['MOST WINS', '2ND MOST WINS', '3RD MOST WINS'], TK_SPEED = 3.2;   /* speed in letter-heights per second */
  function joinNames(names) { return names.length > 2 ? names.slice(0, -1).join(', ') + ' &amp; ' + names[names.length - 1] : names.join(' &amp; '); }
  function tickerRun() {
    var tiers = E.winTiers(S, 3), parts = [];
    for (var i = 0; i < tiers.length; i++) {
      var t = tiers[i];
      if (t.ids.length > 3) {
        if (i === 0) parts.push('<span class="tk-lbl">' + TK_LABELS[0] + ':</span> ' + t.ids.length + ' PLAYERS TIED WITH ' + t.wins);
        break;
      }
      parts.push('<span class="tk-lbl">' + TK_LABELS[i] + ':</span> ' + joinNames(t.ids.map(function (id) { return esc(dn(P(id).name)); })) + ' ' + t.wins);
    }
    return parts.join(', ');
  }
  function tickerHTML() {
    var run = S.phase === 'active' ? tickerRun() : '';
    return run ? '<div class="ticker" role="marquee" aria-label="Most wins"><div class="tk-track"><span class="tk-run">' + run + '</span></div></div>' : '';
  }
  /* on the TV the ticker sits in the space beside the counts and tabs, over the right-hand column; everywhere it scrolls at a steady speed */
  /* The ticker's scroll never ends by itself, and every redraw builds a new ticker, so the last scroll is stopped first;
     otherwise each one kept running on a ticker no longer on screen, and a night of taps piled up hundreds of them. */
  var tickerAnim = null;
  function placeTicker() {
    if (tickerAnim) { tickerAnim.cancel(); tickerAnim = null; }
    var t = app.querySelector('.ticker');
    if (!t) return;
    var track = t.querySelector('.tk-track'), run = track.querySelector('.tk-run');
    [].slice.call(track.querySelectorAll('.tk-run[aria-hidden]')).forEach(function (c) { track.removeChild(c); });
    t.style.left = t.style.top = t.style.height = t.style.fontSize = '';
    if (rootEl.classList.contains('tv')) {
      var wrap = app.querySelector('.wrap'), st = app.querySelector('.stats'), tb = app.querySelector('.tabs'), col = app.querySelector('.board > :nth-child(2)');
      if (wrap && st && tb && col) {
        var w = wrap.getBoundingClientRect(), tr = tb.getBoundingClientRect();
        var between = st.nextElementSibling !== t || t.nextElementSibling !== tb;   /* a banner between the counts and the tabs: stay beside the tabs only */
        var beside = [].slice.call(tb.children).concat(between ? [] : [].slice.call(st.children));
        var right = Math.max.apply(null, beside.map(function (c) { return c.getBoundingClientRect().right; }));   /* never over the counts or the tab buttons */
        var top = between ? tr.top : st.getBoundingClientRect().top, bottom = tr.bottom - 8;
        t.style.left = (Math.max(col.getBoundingClientRect().left, right + 24) - w.left) + 'px';
        t.style.top = (top - w.top) + 'px'; t.style.height = (bottom - top) + 'px';
        var fs = parseFloat(getComputedStyle(t).fontSize);
        if (fs * 1.3 > bottom - top) t.style.fontSize = ((bottom - top) / 1.3) + 'px';
      }
    }
    var still = !track.animate || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    t.classList.toggle('still', !!still);
    if (still) return;
    var runW = run.getBoundingClientRect().width;
    if (!runW) return;
    for (var i = Math.ceil(t.clientWidth / runW) + 1; i > 0; i--) { var c = run.cloneNode(true); c.setAttribute('aria-hidden', 'true'); track.appendChild(c); }
    var dur = runW / (parseFloat(getComputedStyle(t).fontSize) * TK_SPEED) * 1000;
    tickerAnim = track.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(' + (-runW) + 'px)' }], { duration: dur, iterations: Infinity });
    tickerAnim.currentTime = performance.now() % dur;   /* position follows the clock, so a new render (a result, Undo) does not restart the scroll */
  }

  function statsHTML() {
    var st = E.stats(S);
    var h = '<div class="stats"><span><b>' + st.active + '</b>of ' + S.players.length + ' players left</span><span><b>' + st.chipsInPlay + '</b>' + (st.chipsInPlay === 1 ? 'chip' : 'chips') + ' in play</span><span><b>' + st.results + '</b>' + (st.results === 1 ? 'result' : 'results') + '</span>';
    if (st.avgMatchMs && st.avgMatchMs >= 30000) h += '<span><b>' + (st.avgMatchMs / 60000).toFixed(1) + '</b>min average match</span>';
    return h + '</div>';
  }

  function champName(name) {
    /* ⚜️ NAME ⚜️ — each word is kept whole, and each fleur stays with the first or last word, so a long name wraps between words only */
    var fl = '<span class="fleur" aria-hidden="true">⚜️</span>';
    var w = dn(name).trim().split(/\s+/).map(esc);
    w[0] = fl + '&nbsp;' + w[0];
    w[w.length - 1] = w[w.length - 1] + '&nbsp;' + fl;
    return w.map(function (x) { return '<span class="nw">' + x + '</span>'; }).join(' ');
  }
  function champHTML() {
    var c = P(S.champion);
    var h = '<section class="champ"><div class="champ-box"><div class="trophy" aria-hidden="true">🏆</div><div class="sub">Champion</div>' +
      '<div class="nm"><span class="confetti" aria-hidden="true">🎊🎊🎊🎊</span><span class="champ-name">' + champName(c.name) + '</span><span class="confetti" aria-hidden="true">🎉🎉🎉🎉</span></div>' +
      '<div class="sub">' + (c.po ? 'Won the round robin playoff. ' : '') + plural(c.W, 'match win') + ', ' + c.C + ' of ' + c.S + ' chips left' + (c.po ? ' when chip play ended' : '') + '</div></div>' +
      awardsHTML() +
      '<div class="row-actions"><button class="btn primary" data-act="csv-results">Download results</button><button class="btn" data-act="copy-text">Copy dashboard text</button><button class="btn" data-act="newc-open">Start over</button></div></section>';
    return h;
  }

  /* ---------- win runs: 🔥 and the count beside a player on a run of RUN_MIN wins or more (worked out once per render) ---------- */
  var RUN_MIN = 3, RUNS = { cur: {}, best: {}, top: 0, ids: [] };
  function runBadge(id) {
    var n = RUNS.cur[id] || 0;
    return n >= RUN_MIN ? '<span class="run" title="' + n + ' wins in a row" aria-label="' + n + ' wins in a row">🔥' + n + '</span>' : '';
  }
  function isLongestRun(id) { return RUNS.top >= 2 && RUNS.ids.indexOf(id) >= 0; }

  /* ---------- TV cues ----------
     A match thrown in the last minute glows. The glow is started as if from the moment the match was thrown, so a redraw
     doesn't restart it, and it ends by itself a minute in. A match clock turns amber past 1.5 times the average match
     and red past 2 times (the same average the waitlist uses: your setup estimate first, then the real one). */
  var FRESH_MS = 60000;
  function frameOpen(since) {
    var age = since ? now() - since : FRESH_MS;
    return age >= 0 && age < FRESH_MS ? '<div class="frame fresh" style="--fresh-delay:' + (-age) + 'ms">' : '<div class="frame">';
  }
  var avgMemo = { key: null, val: null };
  function avgMin() {
    var last = S.log.length ? S.log[S.log.length - 1].t : 0, key = S.log.length + '|' + last + '|' + S.matchMinutes;
    if (avgMemo.key !== key) { var am = E.avgMatch(S); avgMemo = { key: key, val: am ? am.avgMin : null }; }
    return avgMemo.val;
  }
  function clockClass(since) {
    var a = avgMin();
    if (!a || !since) return '';
    var m = E.playMs(S, since, now()) / 60000;
    return m > 2 * a ? ' vslow' : (m > 1.5 * a ? ' slow' : '');
  }
  function clockHTML(since) { return '<span class="elapsed' + clockClass(since) + '" data-since="' + since + '">' + elapsed(since) + '</span>'; }

  /* Tapping a player's name on a running match records that player as the winner. Chips are display only. */
  function seat(p, withWon) {
    var nm = withWon
      ? '<button class="pname won" data-act="won" data-id="' + p.id + '" aria-label="' + esc(p.name) + ' won" title="Tap when ' + esc(dn(p.name)) + ' wins">' + esc(dn(p.name)) + '</button>'
      : '<div class="pname">' + esc(dn(p.name)) + '</div>';
    return '<div class="seat">' + nm + '<div class="pchips">' + chipsHTML(p) + '<span class="frac">(' + p.C + '/' + p.S + ')</span>' + runBadge(p.id) + '</div></div>';
  }

  /* "Semi-final 1 · ", "Play-in · ", "Final · " for a playoff-round match on this table */
  function prTableLabel(t) {
    if (!S.pr || S.rr) return '';
    if (S.pr.stage === 'final') return 'Final &middot; ';
    var cur = S.pr.cur;
    if (!cur) return '';
    for (var i = 0; i < cur.matches.length; i++) {
      var m = cur.matches[i];
      if (m.state === 'on' && m.table === t.n) return esc(capFirst(E.prMatchName(cur, m))) + ' &middot; ';
    }
    return '';
  }

  function tableCard(t) {
    var st = E.tableState(t), meta, felt;
    if (st === 'match') {
      meta = prTableLabel(t) + '<span class="time">' + E.fmtTime(t.since) + '</span> ' + clockIcon() + ' ' + clockHTML(t.since);
      felt = seat(P(t.a), true) + '<div class="vs">vs.</div>' + seat(P(t.b), true);
      if (t.note) {
        var fl = ui.flips[t.n];
        felt += '<div class="tnote"><span>' + esc(capNames(t.note)) + '</span>' + (fl ? '<span>Break: ' + esc(dn(fl)) + '</span>' : '') + '<button class="btn small" data-act="flip" data-n="' + t.n + '" style="color:var(--yellow);border-color:var(--yellow)">Flip a coin</button></div>';
      }
    } else if (st === 'waiting') {
      meta = 'Waiting';
      var canPick = S.queue.length || E.waitingTables(S).length > 1;
      felt = seat(P(t.a), false) + '<div class="vs">vs.</div>' +
        '<div class="seat slot"><span>Waiting for next challenger</span>' + (canPick ? '<button class="btn small warn" data-act="throw-open" data-n="' + t.n + '">Choose challenger</button>' : '') + '</div>';
    } else {
      meta = 'Empty';
      var poolN = S.queue.length + E.waitingTables(S).length;
      felt = '<div class="seat slot" style="grid-column:1/-1"><span>Empty table</span><span style="display:flex;gap:8px;flex-wrap:wrap">' +
        (poolN >= 2 && !S.pr ? '<button class="btn small warn" data-act="throw-open" data-n="' + t.n + '">Throw a match</button>' : '') +
        (S.tables.filter(function (x) { return x.open; }).length > 1   /* the last open table can't be closed */
          ? '<button class="btn small" data-act="close-table" data-n="' + t.n + '" style="color:var(--chalk);border-color:var(--chalk-dim)">Close table</button>' : '') + '</span></div>';
    }
    return '<article><div class="thead"><h3>Table ' + t.n + '</h3><div class="tmeta">' + meta + '</div></div>' + frameOpen(st === 'match' ? t.since : null) + '<div class="felt">' + felt + '</div></div></article>';
  }

  /* Most wins: every match win counts, playoff matches included. Tied players share it. */
  function mostWinsHTML() {
    var mw = E.mostWins(S);
    if (!mw) return '';
    var names = mw.ids.map(function (id) { return esc(dn(P(id).name)); });
    var who = names.length > 2 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names.join(' and ');
    return '<div class="mostwins"><span class="mw-em" aria-hidden="true">🦁</span><div><div class="mw-lbl">Most wins</div><div class="mw-nm">' + who + '</div>' +
      '<div class="mw-sub">' + plural(mw.wins, 'match win') + (mw.ids.length > 1 ? ' each, tied for the most' : ', the most of anyone') + '</div></div></div>';
  }
  /* Longest run: the most wins in a row anyone had tonight. Tied players share it. */
  function longestRunHTML() {
    if (RUNS.top < 2) return '';
    var names = RUNS.ids.map(function (id) { return esc(dn(P(id).name)); });
    var who = names.length > 2 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names.join(' and ');
    return '<div class="mostwins"><span class="mw-em" aria-hidden="true">🔥</span><div><div class="mw-lbl">Longest run</div><div class="mw-nm">' + who + '</div>' +
      '<div class="mw-sub">' + RUNS.top + ' wins in a row' + (RUNS.ids.length > 1 ? ' each, tied for the longest' : ', the longest of the night') + '</div></div></div>';
  }
  function awardsHTML() {
    var h = mostWinsHTML() + longestRunHTML();
    return h ? '<div class="awards">' + h + '</div>' : '';
  }
  function isMostWins(id) { var mw = E.mostWins(S); return !!(mw && mw.ids.indexOf(id) >= 0); }
  function droppedTag(p) { return p.status === 'dropped' ? '<span class="tag">Dropped</span>' : ''; }
  function placeLabel(p) { var m = E.medal(p.place); return (m ? m + ' ' : '') + E.placeText(p); }

  function finalHTML() {
    var ranked = S.players.filter(function (p) { return p.place; }).sort(E.byPlace);
    var h = '<section class="block"><h2 class="section-title">Final standings <span class="count">' + ranked.length + '</span></h2><ul class="log">';
    ranked.forEach(function (p) {
      h += '<li style="grid-template-columns:96px 1fr"><span class="place">' + placeLabel(p) + '</span><span><span style="font-family:var(--display);font-weight:700;font-size:1.2rem">' + esc(dn(p.name)) + '</span>' + droppedTag(p) + (isMostWins(p.id) ? ' <span title="Most wins">🦁</span>' : '') + (isLongestRun(p.id) ? ' <span title="Longest run">🔥</span>' : '') + ' <span class="frac">(' + p.C + '/' + p.S + ' chips, ' + plural(p.W, 'win') + (E.isTied(p) ? ', tied for ' + E.placeText(p) : '') + (p.po ? ', placed in the playoff' : '') + ')</span></span></li>';
    });
    h += '</ul><p class="muted" style="margin-top:12px">Use Undo if the last result was a mistake.</p></section>';
    return h;
  }

  function boardHTML() {
    var open = S.tables.filter(function (t) { return t.open; });
    var closed = S.tables.filter(function (t) { return !t.open; });
    var h = '<div class="board"><section aria-label="Tables"><h2 class="section-title">Tables <span class="count">' + open.length + ' open</span></h2>';
    if (S.phase === 'active' && open.some(function (t) { return E.tableState(t) === 'match'; })) h += '<p class="hint">Tap a player\'s name when they win the match.</p>';
    if (S.phase === 'finished') h += '<p class="muted">The tournament is over. Use Undo if the last result was a mistake.</p>';
    else h += '<div class="tables">' + open.map(tableCard).join('') + '</div>';
    if (closed.length && S.phase === 'active') {
      h += '<div class="closed-tables"><span>Closed:</span>' + closed.map(function (t) {
        return '<button class="btn small" data-act="reopen-table" data-n="' + t.n + '">Reopen Table ' + t.n + '</button>';
      }).join('') + '</div>';
    }
    h += '</section><aside class="waitlist" aria-label="Waitlist"><h2 class="section-title">Waitlist <span class="count">' + S.queue.length + '</span></h2>';
    var we = S.queue.length ? E.waitEstimate(S) : null, paused = E.isPaused(S);
    if (paused && S.queue.length) h += '<p class="eta-note">\u23F8\uFE0F Tournament paused: wait times come back when play resumes.</p>';
    else if (we) {
      h += '<p class="eta-note">' + oneDec(we.avgMin) + ' min average ' + (we.source === 'actual' ? '(actual)' : '(your estimate)') + ' &divide; ' + plural(we.playing, 'table') + ' playing &asymp; ' + oneDec(we.perSpotMin) + ' min per spot</p>';
    }
    if (!S.queue.length) h += '<p class="empty">Queue empty. Everyone still in is on a table.</p>';
    else {
      h += '<p class="hint">Tap a name to edit.</p><ol>';   /* the hint shows on phones and laptops; the big screen hides hints */
      S.queue.forEach(function (id, i) {
        var p = P(id), held = E.heldFrom(S, id);
        h += '<li><span class="pos">' + (i + 1) + '</span><div class="who" data-act="edit" data-id="' + id + '" role="button" tabindex="0" title="Tap to edit"><b>' + esc(dn(p.name)) + '</b>' +
          '<span class="pchips">' + chipsHTML(p) + '<span class="frac">(' + p.C + '/' + p.S + ')</span>' +
          (paused ? '<span class="eta paused">Paused</span>' : (we ? '<span class="eta" title="Estimated wait">' + waitText((i + 1) * we.perSpotMin) + '</span>' : '')) + '</span>' +
          (held ? '<small>Just lost to ' + esc(dn(P(held).name)) + ', plays after the next result</small>' : '') + '</div></li>';
      });
      h += '</ol><p class="wl-more" aria-live="off"></p>';   /* the big screen fills this in when only the top of the list fits */
    }
    return h + '</aside></div>';
  }

  /* ---------- playoff rounds: tables on the left; the round and who is waiting for the draw on the right ---------- */
  function prRoundTitle(cur) {
    return 'Round ' + cur.round + ': ' + ({ three: 'three matches', playin: 'play-in', semis: 'semi-finals' })[cur.kind];
  }
  function prMatchLine(cur, m) {
    var name = esc(capFirst(E.prMatchName(cur, m))), a = poName(m.a), b = poName(m.b);
    if (m.state === 'done') return '<li>&#10003; ' + name + ': ' + poName(m.winner) + ' def. ' + poName(m.loser) + '</li>';
    if (m.state === 'on') return '<li class="now">&#9654; ' + name + ': ' + a + ' vs ' + b + ', now on Table ' + m.table + '</li>';
    if (m.state === 'pending') return '<li>' + name + ': ' + a + ' vs ' + b + ', next free table</li>';
    return '<li class="void">' + name + ': ' + a + ' vs ' + b + ', not played</li>';
  }

  function prBoardHTML() {
    var pr = S.pr, open = S.tables.filter(function (t) { return t.open; }), closed = S.tables.filter(function (t) { return !t.open; });
    var running = E.runningCount(S), left = E.activeCount(S);
    var h = '<div class="board"><section aria-label="Tables"><h2 class="section-title">Tables <span class="count">' + open.length + ' open</span></h2>';
    if (running) h += '<p class="hint">Tap a player\'s name when they win the match.</p>';
    h += '<div class="tables">' + open.map(tableCard).join('') + '</div>';
    if (closed.length) {
      h += '<div class="closed-tables"><span>Closed:</span>' + closed.map(function (t) {
        return '<button class="btn small" data-act="reopen-table" data-n="' + t.n + '">Reopen Table ' + t.n + '</button>';
      }).join('') + '</div>';
    }
    h += '</section><aside class="waitlist pr-side" aria-label="Playoff rounds"><h2 class="section-title">Playoff rounds <span class="count">' + left + ' left</span></h2>';
    var cur = pr.cur || pr.last;
    if (pr.stage === 'final') {
      var ft = open.filter(function (t) { return E.tableState(t) === 'match'; })[0];
      h += '<p class="pr-note now">Final' + (ft ? ' on Table ' + ft.n + ': ' + poName(ft.a) + ' vs ' + poName(ft.b) : '') + '. Match after match until one player is out of chips.</p>';
    } else {
      if (cur) h += '<div class="pr-round"><div class="pr-rtitle">' + prRoundTitle(cur) + (pr.cur ? '' : ', done') + '</div><ul class="po-sched">' + cur.matches.map(function (m) { return prMatchLine(cur, m); }).join('') + '</ul></div>';
      var di = E.prDrawInfo(S);
      if (pr.stage === 'finishing') h += '<p class="pr-note">Auto-throw has stopped. The draw for round 1 comes after ' + (running === 1 ? 'the match in progress finishes.' : 'the ' + running + ' matches in progress finish.') + '</p>';
      else if (di) h += '<p class="pr-note now">Next: the in-person draw for round ' + di.round + ', ' + di.name + '.</p>';
      else if (pr.stage === 'draw' && left === 3) h += '<p class="pr-note now">Next: the round robin playoff.</p>';
      var pool = S.queue.map(P).sort(function (x, y) { return x.name.localeCompare(y.name); });
      h += '<h3 class="pr-sub">Waiting for the draw <span class="count">' + pool.length + '</span></h3>';
      if (!pool.length) h += '<p class="empty">Nobody is waiting.</p>';
      else {
        h += '<ol class="pr-pool">';
        pool.forEach(function (p) {
          h += '<li><span class="pos" aria-hidden="true">&bull;</span><div class="who" data-act="edit" data-id="' + p.id + '" role="button" tabindex="0" title="Tap to edit"><b>' + esc(dn(p.name)) + '</b>' +
            '<span class="pchips">' + chipsHTML(p) + '<span class="frac">(' + p.C + '/' + p.S + ')</span></span></div></li>';
        });
        h += '</ol>';
      }
    }
    return h + '</aside></div>';
  }

  /* one player's spot shots so far, in order: 🎯 made, ❌ missed */
  function shotTrail(id) {
    var so = S.rr && S.rr.shootout;
    if (!so) return '';
    return so.attempts.filter(function (a) { return a.id === id; }).map(function (a) { return a.made ? '🎯' : '❌'; }).join('');
  }

  /* ---------- the three-player round robin playoff ---------- */
  function poRecord(id) { return S.rr.wins[id] + '–' + S.rr.losses[id]; }
  function poName(id) { return esc(dn(P(id).name)); }

  function poSeat(id, sub) {
    var p = P(id);
    return '<div class="seat"><button class="pname won" data-act="po-won" data-id="' + id + '" aria-label="' + esc(p.name) + ' won" title="Tap when ' + esc(dn(p.name)) + ' wins">' + esc(dn(p.name)) + '</button>' +
      '<div class="pchips"><span class="frac">' + sub + '</span>' + runBadge(id) + '</div></div>';
  }

  function playoffTableCard() {
    var rr = S.rr, meta = '', felt = '';
    if (rr.current) {
      var dec = rr.stage === 'decider', c = rr.current;
      meta = (dec ? 'For 2nd place' : 'Match ' + (rr.matches.length + 1)) + ' &middot; <span class="time">' + E.fmtTime(c.since) + '</span> ' + clockIcon() + ' ' + clockHTML(c.since);
      felt = poSeat(c.a, dec ? 'Playing for 2nd' : 'Playoff ' + poRecord(c.a)) + '<div class="vs">vs.</div>' + poSeat(c.b, dec ? 'Playing for 2nd' : 'Playoff ' + poRecord(c.b));
    } else if (rr.stage === 'tie') {
      meta = 'Tied';
      felt = '<div class="po-box"><div class="po-big">Everyone is 1&ndash;1</div><div>How do you want to break the tie?</div><div class="po-btns">' +
        '<button class="btn warn" data-act="po-keep">Keep going: ' + poName(rr.tie.winner) + ' vs ' + poName(rr.tie.sitter) + '</button>' +
        '<button class="btn warn" data-act="po-shoot-open">Spot shot shootout</button></div></div>';
    } else if (rr.stage === 'shootout') {
      var so = rr.shootout, id = rr.order[so.turn];
      meta = 'Spot shot shootout';
      felt = '<div class="po-box"><div class="po-up">Shooting now</div><div class="pname">' + poName(id) + '</div>' +
        '<div>' + so.strikes[id] + (so.strikes[id] === 1 ? ' miss' : ' misses') + ' so far, out at ' + so.allowed[id] + (shotTrail(id) ? ' &middot; <span class="trail">' + shotTrail(id) + '</span>' : '') + '</div>' +
        '<div class="po-btns"><button class="btn primary big" data-act="po-made">🎯 Made it</button><button class="btn danger big" data-act="po-miss">❌ Missed</button></div></div>';
    }
    return '<article><div class="thead"><h3>Table ' + rr.table + '</h3><div class="tmeta">' + meta + '</div></div>' + frameOpen(rr.current ? rr.current.since : null) + '<div class="felt">' + felt + '</div></div></article>';
  }

  function ifWinsText(id) {
    var r = E.playoffIfWins(S, id);
    if (!r) return '';
    var lead = 'If ' + poName(id) + ' wins: ';
    if (r.champion) return lead + poName(id) + ' is champion, then ' + poName(r.decider[0]) + ' vs ' + poName(r.decider[1]) + ' for 2nd';
    if (r.tie) return lead + 'everyone is 1&ndash;1, then you choose keep going or a shootout';
    return lead + poName(r.next[0]) + ' vs ' + poName(r.next[1]) + ' next';
  }

  function playoffPanelHTML() {
    var rr = S.rr, so = rr.shootout, h = '<aside class="po-panel" aria-label="Playoff"><h2 class="section-title">Round robin playoff</h2>';
    if (rr.champion) h += '<div class="po-champ"><span>Champion</span><b>' + poName(rr.champion) + '</b></div>';
    h += '<ol class="po-stand">';
    rr.order.forEach(function (id, i) {
      var out = rr.stage === 'shootout' && so.out.indexOf(id) >= 0, tag = '';
      if (rr.champion === id) tag = 'Champion';
      else if (rr.current && (rr.current.a === id || rr.current.b === id)) tag = rr.stage === 'decider' ? 'Playing for 2nd' : 'Playing now';
      else if (rr.stage === 'shootout') tag = out ? 'Out, takes ' + E.ordinal(3 - so.out.indexOf(id)) : (rr.order[so.turn] === id ? 'Shooting now' : '');
      else if (rr.current) tag = 'Sits out';
      var rec = rr.stage === 'shootout' ? (shotTrail(id) ? '<span class="trail">' + shotTrail(id) + '</span>' : '') + '<span class="strk">' + so.strikes[id] + ' of ' + so.allowed[id] + ' misses</span>' : poRecord(id);
      h += '<li' + (out ? ' class="out"' : '') + '><span class="pos">' + (i + 1) + '</span><div><b>' + poName(id) + '</b>' + (tag ? '<small>' + tag + '</small>' : '') + '</div><span class="rec">' + rec + '</span></li>';
    });
    h += '</ol><ul class="po-sched">';
    rr.matches.forEach(function (m) {
      h += '<li>&#10003; ' + (m.kind === 'decider' ? '2nd place' : 'Match ' + m.n) + ': ' + poName(m.winner) + ' def. ' + poName(m.loser) + '</li>';
    });
    if (rr.stage === 'tie') h += '<li class="now">Everyone is 1&ndash;1. Choose on the table: keep going, or a spot shot shootout.</li>';
    if (rr.stage === 'shootout') h += '<li class="now">Spot shot shootout: ' + poName(rr.order[so.turn]) + ' shoots next</li>';
    if (rr.current) {
      h += '<li class="now">&#9654; ' + (rr.stage === 'decider' ? '2nd place' : 'Match ' + (rr.matches.length + 1)) + ': ' + poName(rr.current.a) + ' vs ' + poName(rr.current.b) + ', now on Table ' + rr.table + '</li>';
      if (rr.stage === 'rr') h += '<li class="if">' + ifWinsText(rr.current.a) + '</li><li class="if">' + ifWinsText(rr.current.b) + '</li>';
    }
    h += '</ul>';
    if (rr.stage === 'rr' && !rr.matches.length) h += '<p class="muted po-foot">The winner of each match stays on and plays whoever sat out. First to 2 wins is champion.</p>';
    return h + '</aside>';
  }

  function playoffBoardHTML() {
    var h = '<div class="board"><section aria-label="Playoff table"><h2 class="section-title">Playoff table</h2>';
    if (S.rr.current) h += '<p class="hint">Tap a player\'s name when they win the match.</p>';
    h += '<div class="tables">' + playoffTableCard() + '</div></section>';
    return h + playoffPanelHTML() + '</div>';
  }

  function playersHTML() {
    var act = S.players.filter(function (p) { return p.status === 'active'; })
      .sort(function (x, y) { return y.C - x.C || y.W - x.W || x.name.localeCompare(y.name); });
    var h = '<section class="block"><h2 class="section-title">Active players <span class="count">' + act.length + '</span></h2>' + (S.phase === 'active' && !S.rr && act.length ? '<p class="hint">Tap a name to edit.</p>' : '') + '<div class="scroll-x"><table class="data"><thead><tr><th>Player</th><th class="num">Chips remaining</th><th class="num">Wins</th><th>Status</th></tr></thead><tbody>';
    act.forEach(function (p) {
      var canEdit = S.phase === 'active' && !S.rr;
      h += '<tr><td class="nm">' + (canEdit ? '<span class="nm-edit" data-act="edit" data-id="' + p.id + '" role="button" tabindex="0" title="Tap to edit">' + esc(dn(p.name)) + '</span>' : esc(dn(p.name))) + runBadge(p.id) + '</td>' +
        '<td class="num">' + chipsHTML(p) + ' <span class="frac">' + p.C + '/' + p.S + '</span></td><td class="num">' + p.W + '</td><td>' + esc(whereText(p.id)) + '</td></tr>';
    });
    h += '</tbody></table></div></section>';
    /* everyone out with a place, knocked out or dropped, in finishing order */
    var el = S.players.filter(function (p) { return p.status !== 'active' && p.place; }).sort(E.byPlace);
    h += '<section class="block"><h2 class="section-title">Eliminated players <span class="count">' + el.length + '</span></h2>';
    if (!el.length) h += '<p class="muted">None yet.</p>';
    else {
      h += '<ul class="log">';
      el.forEach(function (p) {
        var dropped = p.status === 'dropped';
        h += '<li style="grid-template-columns:96px 1fr auto"><span class="place">' + placeLabel(p) + '</span><span><span class="nm" style="font-family:var(--display);font-weight:700;font-size:1.15rem">' + esc(dn(p.name)) + '</span>' + droppedTag(p) + ' <span class="frac">(' + p.C + '/' + p.S + ' chips' + (dropped ? ' when they left' : '') + ', ' + plural(p.W, 'win') + (E.isTied(p) ? ', tied for ' + E.placeText(p) : '') + (p.po ? ', placed in the playoff' : '') + ')</span></span>' +
          (S.phase === 'active' && !S.rr && !S.pr && !dropped ? '<button class="btn small ghost" data-act="reinstate-open" data-id="' + p.id + '">Reinstate</button>' : '<span></span>') + '</li>';
      });
      h += '</ul>';
    }
    h += '</section>';
    var dr = S.players.filter(function (p) { return p.status === 'dropped' && !p.place; });   /* drops saved by versions before ALPHA20 have no place */
    if (dr.length) {
      h += '<section class="block"><h2 class="section-title">Dropped players <span class="count">' + dr.length + '</span></h2><ul class="log">';
      dr.forEach(function (p) { h += '<li style="grid-template-columns:1fr"><span>' + esc(dn(p.name)) + ' <span class="frac">(' + p.C + '/' + p.S + ' chips when they left)</span></span></li>'; });
      h += '</ul></section>';
    }
    return h;
  }

  function logHTML() {
    var h = '<section class="block"><h2 class="section-title">Match log <span class="count">' + S.log.length + '</span></h2>';
    if (!S.log.length) h += '<p class="muted">Nothing yet.</p>';
    else {
      h += '<ol class="log" reversed style="list-style:none">';
      for (var i = S.log.length - 1; i >= 0; i--) {
        var e = S.log[i];
        var dur = (e.type === 'result' || e.type === 'presult') && e.start ? ' <span class="muted">(' + Math.round(E.playMs(S, e.start, e.t) / 60000) + ' min)</span>' : '';
        h += '<li><span class="t">' + E.fmtTime(e.t) + '</span><span>' + esc(capNames(e.text)) + dur + '</span></li>';
      }
      h += '</ol>';
    }
    h += '<div class="row-actions" style="justify-content:flex-start"><button class="btn" data-act="csv-log">Download match log</button><button class="btn" data-act="csv-results">Download results</button></div></section>';
    if (S.rr) {
      h += '<section class="block"><h2 class="section-title">Playoff draw order</h2><ol class="draw">';
      S.rr.order.forEach(function (id) { h += '<li>' + esc(dn(P(id).name)) + '</li>'; });
      h += '</ol></section>';
    }
    if (S.draw.length) {
      h += '<section class="block"><h2 class="section-title">Draw order</h2><ol class="draw">';
      S.draw.forEach(function (id) { var p = P(id); h += '<li>' + esc(dn(p.name)) + ' <span class="muted">(#' + p.reg + ')</span></li>'; });
      h += '</ol></section>';
    }
    return h;
  }

  /* ---------- toast ---------- */
  function toast(msg, o) {
    o = o || {};
    clearTimeout(ui.toastTimer);
    toastRoot.innerHTML = '<div class="toast' + (o.bad ? ' bad' : '') + '" role="status" data-act="toast-close" title="Tap to dismiss"><span>' + esc(capNames(msg)) + '</span>' + (o.undo ? '<button class="btn small" data-act="undo-toast">Undo</button>' : '') + '</div>';
    ui.toastTimer = setTimeout(function () { toastRoot.innerHTML = ''; }, o.undo ? 7000 : 5000);
  }

  /* ---------- modals ---------- */
  function shell(title, body, actions) {
    return '<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><h2 id="mtitle">' + title + '</h2>' + body + (actions ? '<div class="actions">' + actions + '</div>' : '') + '</div></div>';
  }
  var CANCEL = '<button type="button" class="btn" data-act="m-close">Cancel</button>';

  function openModal(m) {
    if (!ui.modal) ui.lastFocus = document.activeElement;
    ui.modal = m; renderModal();
  }
  /* A yes-or-no question in the app's own pop-up. The browser's confirm() box is switched off without a word in some viewers
     (a file previewed inside another app, for one), where it always answers Cancel: Import backup, New link, Forget this setup
     and throwing a rematch did nothing there. Cancel goes back to the pop-up the question was asked from. */
  function askConfirm(o, yes) {
    openModal({ type: 'confirm', title: o.title, text: o.text, ok: o.ok, danger: !!o.danger, yes: yes, back: ui.modal || null });
  }
  function closeModal() {
    if (ui.modal && ui.modal.type === 'confirm' && ui.modal.back) { ui.modal = ui.modal.back; renderModal(); return; }   /* a question: back to where it was asked */
    if (ui.modal && ui.modal.type === 'po-offer' && ui.poKey) ui.poDismissed = ui.poKey;   /* closing the offer any way counts as "Not now" */
    if (ui.modal && ui.modal.type === 'pr-draw' && ui.prKey) ui.prDismissed = ui.prKey;   /* the banner brings the draw back */
    ui.modal = null; ui.shownType = null; modalRoot.innerHTML = '';
    if (ui.lastFocus && document.body.contains(ui.lastFocus)) { try { ui.lastFocus.focus(); } catch (e) { /* ignore */ } }
    ui.lastFocus = null;
  }
  function modalErr(msg) { var el = modalRoot.querySelector('.err'); if (el) el.textContent = msg; }

  function poolFor(tableN) {
    var out = [];
    S.queue.forEach(function (id) { out.push({ id: id, from: 'Waitlist #' + (S.queue.indexOf(id) + 1) }); });
    E.waitingTables(S).forEach(function (t) { if (t.n !== tableN) out.push({ id: t.a, from: 'Winner waiting at Table ' + t.n }); });
    return out;
  }

  function renderModal() {
    var m = ui.modal, h = '';
    if (!m) { modalRoot.innerHTML = ''; return; }
    switch (m.type) {
      case 'start': {
        var n = S.players.length, t = plannedTables();
        var sn = plannedNums().map(function (v) { return parseInt(v, 10); }).sort(function (x, y) { return x - y; });
        var where = plural(n, 'player') + ' on ' + plural(t, 'table') + ' (' + (t === 1 ? 'Table ' : 'Tables ') + sn.join(', ') + ').';
        if (S.playoffRounds && n <= E.PR_MAX) {
          var first = n === 2 ? 'The two of them play the final right away, match after match until one is out of chips.'
            : n === 3 ? 'With three players, you go straight to the round robin playoff draw.'
            : 'Nobody is seated at random. After you start, enter the in-person draw for round 1.';
          h = shell('Start with playoff rounds?',
            '<p>' + where + ' Playoff rounds are on and there are ' + n + ' players, so the whole tournament is playoff rounds.</p><p>' + first + '</p><p class="muted">Undo will bring this screen back.</p><p class="err" role="alert"></p>',
            CANCEL + '<button class="btn primary" data-act="start-go" data-autofocus>Start</button>');
          break;
        }
        h = shell('Draw and start?',
          '<p>' + where + ' ' + (2 * t) + ' will be seated at random and ' + (n - 2 * t) + ' will go on the waitlist in draw order.</p><p class="muted">Chips and the draw cannot be changed after the draw, but Undo will bring this screen back.</p><p class="err" role="alert"></p>',
          CANCEL + '<button class="btn primary" data-act="start-go" data-autofocus>Draw and start</button>');
        break;
      }
      case 'pr-draw': {
        var di = E.prDrawInfo(S);
        if (!di) { ui.modal = null; modalRoot.innerHTML = ''; return; }
        var full = di.picks === di.n, need = full ? di.n - 1 : 2, ordr = m.order;
        var pool = di.pool.map(P).sort(function (x, y) { return x.name.localeCompare(y.name); });
        var implied = full && ordr.length === need ? di.pool.filter(function (id) { return ordr.indexOf(id) < 0; })[0] : null;
        var whole = implied ? ordr.concat([implied]) : ordr;
        var ptiles = pool.map(function (p) {
          var k = ordr.indexOf(p.id), num = k >= 0 ? k + 1 : (p.id === implied ? di.n : null);
          var waits = !full && ordr.length === 2 && k < 0;
          return '<button type="button" class="po-tile' + (p.id === implied ? ' sits' : '') + '" data-act="pr-pick" data-id="' + p.id + '" aria-pressed="' + (k >= 0) + '">' +
            '<span class="num">' + (num || '&nbsp;') + '</span>' + esc(dn(p.name)) + (waits ? ' <span class="sub">waits</span>' : '') + '</button>';
        }).join('');
        var slot = function (i) { return whole[i] ? poName(whole[i]) : '<span class="muted">player ' + (i + 1) + '</span>'; };
        var topts = function (i) {
          return S.tables.map(function (tb) {
            return '<option value="' + tb.n + '"' + (m.tables[i] === tb.n ? ' selected' : '') + '>Table ' + tb.n + (tb.open ? '' : ' (closed now)') + '</option>';
          }).join('') + '<option value=""' + (m.tables[i] === null ? ' selected' : '') + '>Next free table</option>';
        };
        var lines = '';
        for (var mi = 0; mi < di.matches; mi++) {
          lines += '<div class="pr-mline"><span class="muted">' + (di.kind === 'playin' ? 'Play-in' : di.kind === 'semis' ? 'Semi-final ' + (mi + 1) : 'Match ' + (mi + 1)) + '</span>' +
            '<span>' + slot(2 * mi) + ' vs ' + slot(2 * mi + 1) + '</span>' +
            '<select class="input" data-input="pr-table" data-i="' + mi + '" aria-label="Table for ' + (di.kind === 'playin' ? 'the play-in' : 'match ' + (mi + 1)) + '">' + topts(mi) + '</select></div>';
        }
        var how = di.kind === 'playin' ? 'Tap the two players who drew the play-in. The other three wait.'
          : 'Tap the players in the order they drew. 1 plays 2, 3 plays 4' + (di.n === 6 ? ', 5 plays 6.' : '.');
        var foot = di.kind === 'playin' ? 'If the loser is out, the 4 left draw semi-finals. If not, there\'s another play-in draw.'
          : 'After the round, the players left draw again.';
        h = shell('Round ' + di.round + ' draw: ' + di.name,
          '<p class="muted">' + how + '</p><div class="po-tiles">' + ptiles + '</div>' +
          '<div class="pr-plan">' + lines + '</div>' +
          '<p class="muted" style="margin-top:8px">Rematches are allowed and chips count as usual. Tables not used in this round close. ' + foot + '</p><p class="err" role="alert"></p>',
          CANCEL + '<button class="btn primary" data-act="pr-start" data-autofocus>' + (di.kind === 'playin' ? 'Start play-in' : 'Start round ' + di.round) + '</button>');
        break;
      }
      case 'addtable':

          '<p class="muted">Tap a color to change it. The Default, Light and Dark buttons set the chips to match; the chip choices below change only the chips. Colors are saved in this browser and kept for future tournaments.</p>';
        h = shell('Colors', body, '<button class="btn primary" data-act="m-close">Done</button>');
        break;
      }
      case 'text':
        h = shell(esc(m.title), '<p class="muted">Select all and copy.</p><textarea class="input" rows="14" readonly data-autofocus onfocus="this.select()">' + esc(m.text) + '</textarea>', '<button class="btn primary" data-act="m-close">Done</button>');
        break;
      case 'newc':
        h = shell(m.keep ? 'Start over with the same players?' : 'Clear everything?',
          '<p>' + (m.keep ? 'Everyone stays registered with their starting chips. Chips, wins and the log are reset.' : 'All players, results and the log are removed. Export a backup first if you might need them.') + '</p>',
          CANCEL + '<button class="btn danger" data-act="newc-go" data-keep="' + (m.keep ? 1 : 0) + '" data-autofocus>' + (m.keep ? 'Start over' : 'Clear everything') + '</button>');
        break;
    }
    var old = modalRoot.querySelector('.modal'), keep = old && ui.shownType === m.type ? old.scrollTop : null;
    modalRoot.innerHTML = h;
    ui.shownType = m.type;
    var md = modalRoot.querySelector('.modal');
    if (md && keep !== null) md.scrollTop = keep;
    var f = modalRoot.querySelector('[data-autofocus]') || modalRoot.querySelector('button, input, select');
    if (f) { try { f.focus(keep !== null ? { preventScroll: true } : undefined); } catch (e) { f.focus(); } }
    if (m.type === 'colors' && m.reveal) {   /* show the editor for the color just opened */
      m.reveal = false;
      var ed = modalRoot.querySelector('.ced');
      if (ed && ed.scrollIntoView) ed.scrollIntoView({ block: 'nearest' });
    }
  }

  /* The playoff-rounds option in the Menu: the same checkbox as setup, locked once the playoffs have begun. */
  /* the top of the Menu while a tournament is running: Pause tournament, or Resume while paused */
  function pauseMenuHTML() {
    if (S.phase !== 'active') return '';
    if (E.isPaused(S)) {
      return '<div class="stack"><button class="btn warn pause-item" data-act="play-resume" data-autofocus><span class="pi pi-play" aria-hidden="true"></span>Resume tournament</button></div>' +
        '<p class="muted pause-note">Paused since ' + E.fmtTime(S.pause.at) + '. Match clocks, wait times and the finish time start again on the TV and on phones.</p>';
    }
    return '<div class="stack"><button class="btn pause-item" data-act="play-pause"><span class="pi pi-pause" aria-hidden="true"></span>Pause tournament</button></div>' +
      '<p class="muted pause-note">For a break: match clocks stop, and wait times and the finish time are put on hold, on the TV and on phones.</p>';
  }
  function prSettingHTML() {
    var locked = E.playoffRoundsLocked(S), on = !!S.playoffRounds;
    return '<div class="grp">Playoff rounds</div><label class="opt' + (locked ? ' locked' : '') + '" for="pr-opt-play"><input id="pr-opt-play" type="checkbox" data-act="pr-toggle"' + (on ? ' checked' : '') + (locked ? ' disabled' : '') + '>' +
      '<span><b>Playoff rounds at ' + E.PR_MAX + ' players or fewer</b><small>' +
      (locked ? 'The playoffs have begun, so this can\'t be changed now.'
        : 'Auto-throw stops when a result leaves ' + E.PR_MAX + ' players or fewer. After each round the players draw in person for the next one.' +
          (!on && E.activeCount(S) <= E.PR_MAX ? ' ' + E.activeCount(S) + ' players are left, so turning this on starts the playoff rounds now.' : '')) +
      '</small></span></label>';
  }

  /* ---------- batch parsing ---------- */
  /* One player per line. A line is cut at BATCH_LINE before it is read: no name is anywhere near that long, and the
     patterns below slow down sharply on a very long line (a whole page pasted as one line used to freeze the screen on
     every keystroke). Reading stops past the most players a tournament can hold. */
  var BATCH_LINE = 200;
  function parseBatch(text) {
    var out = [];
    String(text).split(/\r?\n/).some(function (raw) {
      var line = raw.trim();
      if (!line) return false;
      if (line.length > BATCH_LINE) line = line.slice(0, BATCH_LINE);
      var mt = line.match(/^(.*?)\s*[,;:\t]\s*(\d+)\s*(?:chips?)?$/i) || line.match(/^(.*?)\s*\(\s*(\d+)\s*(?:chips?)?\s*\)$/i) || line.match(/^(.*\D)\s+(\d+)\s*(?:chips?)?$/i);
      if (mt && mt[1].trim()) out.push({ name: mt[1].trim(), chips: parseInt(mt[2], 10) });
      else out.push({ name: line.replace(/[,;:]+$/, '').trim(), chips: S.defaultChips });
      return out.length > E.MAX_PLAYERS;
    });
    return out;
  }
  function batchPreview(text) {
    var list = parseBatch(text);
    if (!list.length) return 'No names yet.';
    return (list.length > E.MAX_PLAYERS ? 'More than ' + E.MAX_PLAYERS + ' players (the most a tournament can have)' : plural(list.length, 'player')) + ': ' +
      list.slice(0, 6).map(function (p) { return esc(dn(shortName(p.name))) + ' (' + p.chips + ')'; }).join(', ') + (list.length > 6 ? ', and ' + (list.length - 6) + ' more' : '');
  }
  function shortName(n) { n = String(n); return n.length > E.MAX_NAME ? n.slice(0, E.MAX_NAME) + '…' : n; }

  /* ---------- files ---------- */
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime || 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 500);
  }
  function stamp() {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes());
  }
  function copyText(text, title) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove();
        if (ok) { toast('Copied'); return; }
      } catch (e) { /* fall through */ }
      openModal({ type: 'text', title: title, text: text });
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
    else fallback();
  }

  /* ---------- actions ---------- */
  function afterChange(opts) {
    if (!commit()) return;
    if (opts && opts.toast) toast(opts.toast, opts.undo ? { undo: true } : null);
    maybePrompt();
  }
  function maybePrompt() {
    if (ui.modal || S.phase !== 'active') return;
    /* the playoff rounds are down to three players: offer the round robin playoff once (the banner stays after "Not now") */
    var po = E.playoffCandidates(S);
    if (po) {
      var pkey = po.slice().sort(function (x, y) { return x - y; }).join(',');
      if (ui.poDismissed !== pkey) { ui.poKey = pkey; openModal({ type: 'po-offer' }); }
      return;
    }
    /* playoff rounds: when a round is over, ask for the next in-person draw (the banner stays if it's closed) */
    var di = E.prDrawInfo(S);
    if (di) {
      var dkey = di.round + ':' + di.n;
      if (ui.prDismissed !== dkey) openPrDraw();
      return;
    }
    var pc = E.pendingConsolidation(S);
    if (!pc) return;
    var key = pc.tables.join(',') + ':' + S.seq;
    if (ui.consDismissed === key) return;
    ui.consKey = key;
    openModal({ type: 'consol' });
  }
  function doUndo() {
    if (now() - ui.lastUndoAt < 700) return;   /* a double-tap on Undo undoes one step, not two */
    ui.lastUndoAt = now();
    var r = E.undo(S);
    if (r.error) { toast(r.error, { bad: true }); return; }
    E.ensureAuto(S, now());   /* an Undo step saved by an earlier version may have auto-throw paused */
    ui.flips = {};
    if (commit()) toast('Undid: ' + r.label);
  }
  function tooSoon(t) { var d = now() - t; return !!t && d >= 0 && d < TAP_GUARD_MS; }   /* a start time ahead of this clock (a backup from another device) never blocks taps */
  function fail(r) { toast(r.error, { bad: true }); }
  function openPrDraw() {
    var di = E.prDrawInfo(S);
    if (!di) return;
    ui.prKey = di.round + ':' + di.n;
    openModal({ type: 'pr-draw', order: [], tables: E.prDefaultTables(S, di.matches) });
  }
  /* "Next on Table 7: A vs B" for matches the app seated by itself during the playoff rounds (waiting matches, the final) */
  function seatedNote(before) {
    if (!S.pr || S.phase !== 'active') return '';
    var notes = [];
    S.tables.forEach(function (t) {
      if (E.tableState(t) === 'match' && before.indexOf(t.n + ':' + t.a + ':' + t.b + ':' + t.since) < 0) notes.push('Next on Table ' + t.n + ': ' + P(t.a).name + ' vs ' + P(t.b).name + '.');
    });
    return notes.length ? ' ' + notes.join(' ') : '';
  }
  function tableKeys() { return S.tables.map(function (t) { return t.n + ':' + t.a + ':' + t.b + ':' + t.since; }); }
  function shot(made) {
    var rr = S.rr;
    if (!rr || rr.stage !== 'shootout') { toast('No shootout in progress.', { bad: true }); return; }
    var at = rr.shootout.attempts;
    if (tooSoon(at.length ? at[at.length - 1].t : rr.shootout.t0)) return;   /* the second tap of a double-tap */
    var p = P(rr.order[rr.shootout.turn]);
    var r = E.shootoutAttempt(S, made, now());
    if (r.error) { fail(r); return; }
    var so = S.rr.shootout, msg = (made ? '🎯 ' + p.name + ' made it.' : '❌ ' + p.name + ' missed (' + so.strikes[p.id] + ' of ' + so.allowed[p.id] + ').');
    if (r.finished) msg += ' ' + P(r.champion).name + ' wins the shootout and is the champion. ' + P(r.second).name + ' takes 2nd, ' + P(r.third).name + ' 3rd.';
    else if (r.out) msg += ' ' + p.name + ' is out and takes 3rd. ' + P(S.rr.order[so.turn]).name + ' shoots next.';
    else msg += ' ' + P(S.rr.order[so.turn]).name + ' shoots next.';
    afterChange({ toast: msg, undo: true });
    shotFx(made, dn(p.name), made ? 'made the spot shot'
      : (r.out ? 'is out and takes ' + (r.finished ? '2nd' : '3rd') : 'strike ' + so.strikes[p.id] + ' of ' + so.allowed[p.id]),
      r.finished ? '🏆 ' + dn(P(r.champion).name) + ' wins the shootout' : '');
  }
  /* A few seconds of celebration (or sympathy) after each spot shot. It sits above everything, lets taps through, and fades out by itself. */
  var fxTimer = null;
  function shotFx(made, name, line, extra) {
    var root = document.getElementById('fx-root');
    if (!root) { root = document.createElement('div'); root.id = 'fx-root'; root.setAttribute('aria-hidden', 'true'); document.body.appendChild(root); }
    clearTimeout(fxTimer);
    root.innerHTML = '<div class="shotfx ' + (made ? 'hit' : 'miss') + '"><div class="fxcard">' + (made ? '<span class="fxring"></span>' : '') +
      '<div class="fxem">' + (made ? '🎯' : '❌') + '</div><div class="fxbig">' + (made ? 'MADE IT!' : 'MISSED') + '</div>' +
      '<div class="fxsub">' + esc(name) + ' ' + esc(line) + '</div>' + (extra ? '<div class="fxwin">' + esc(extra) + '</div>' : '') + '</div></div>';
    fxTimer = setTimeout(function () { root.innerHTML = ''; }, 2700);
  }

  var actions = {
    /* registration */
    'def-dec': function () { S.defaultChips = clamp(S.defaultChips - 1, 1, 20); commit(); },
    'def-inc': function () { S.defaultChips = clamp(S.defaultChips + 1, 1, 20); commit(); },
    'reg-dec': function (el) { var p = P(+el.dataset.id); E.editRegistered(S, p.id, { S: Math.max(1, p.S - 1) }); commit(); },
    'reg-inc': function (el) { var p = P(+el.dataset.id); E.editRegistered(S, p.id, { S: Math.min(20, p.S + 1) }); commit(); },
    'reg-remove': function (el) { E.removePlayer(S, +el.dataset.id); commit(); },
    'tbl-dec': function () { S.plannedTables = Math.max(1, plannedTables() - 1); ui.tablesTouched = true; commit(); },
    'tbl-inc': function () { S.plannedTables = Math.min(40, plannedTables() + 1); ui.tablesTouched = true; commit(); },
    'batch-open': function () { openModal({ type: 'batch' }); },
    'batch-add': function () {
      var list = parseBatch(ui.batchText), added = 0, skipped = [];
      list.forEach(function (p) { var r = E.addPlayer(S, p.name, p.chips); if (r.ok) added++; else skipped.push(p.name); });
      if (!list.length) { modalErr('Type or paste at least one name.'); return; }
      ui.batchText = ''; closeModal();
      var full = S.players.length >= E.MAX_PLAYERS;
      if (commit()) toast('Added ' + plural(added, 'player') + (skipped.length ? '. Skipped ' + skipped.length + (full ? ' or more' : '') + ' that could not be added: ' + skipped.slice(0, 3).map(function (n) { return dn(shortName(n)); }).join(', ') : '') +
        (full && skipped.length ? '. A tournament can have up to ' + E.MAX_PLAYERS + ' players.' : ''), skipped.length ? { bad: true } : null);
    },
    'start-open': function () { openModal({ type: 'start' }); },
    'start-go': function () {
      var r = E.startTournament(S, plannedTables(), now(), undefined, plannedNums());
      if (r.error) { modalErr(r.error); return; }
      ui.tab = 'tables'; ui.flips = {}; ui.consDismissed = null; ui.poDismissed = null; ui.prDismissed = null;
      closeModal(); commit();   /* straight to the tables; the draw order is listed on the Log tab */
      maybePrompt();            /* with playoff rounds from the start: the round 1 draw (or the round robin offer) */
    },

    /* play */
    won: function (el) {
      var id = +el.dataset.id, w = P(id), t = E.tableOf(S, id);
      if (!t || !t.a || !t.b) { toast('That match is already finished.', { bad: true }); return; }
      if (tooSoon(t.since)) return;   /* the match was thrown a moment ago: this is the second tap of a double-tap */
      var l = P(t.a === id ? t.b : t.a), n = t.n, hadPr = !!S.pr, before = tableKeys();
      var r = E.reportResult(S, id, now());
      if (r.error) { fail(r); return; }
      delete ui.flips[n];
      var msg = w.name + ' def. ' + l.name + (r.eliminated ? '. ' + l.name + ' is eliminated.' : '. ' + l.name + ' has ' + l.C + ' left.');
      if (!hadPr && S.pr) msg += ' Playoff rounds: ' + E.activeCount(S) + ' players left, so auto-throw has stopped.';
      msg += seatedNote(before);
      if (S.phase === 'finished') msg = w.name + ' wins the tournament';
      afterChange({ toast: msg, undo: true });
    },
    undo: function () { doUndo(); },
    'undo-toast': function () { doUndo(); },
    'play-pause': function () {
      var r = E.pausePlay(S, now());
      if (r.error) { fail(r); return; }
      if (ui.modal) closeModal();
      afterChange({ toast: 'Tournament paused. Match clocks and wait times are on hold.', undo: true });
    },
    'play-resume': function () {
      var r = E.resumePlay(S, now());
      if (r.error) { fail(r); return; }
      if (ui.modal) closeModal();
      afterChange({ toast: 'Tournament resumed' + (r.minutes >= 1 ? ' after ' + fmtDur(r.minutes) + ' paused' : '') + '.', undo: true });
    },
    tab: function (el) { ui.tab = el.dataset.tab; render(); },
    flip: function (el) {
      var t = E.T(S, +el.dataset.n); if (!t) return;
      ui.flips[t.n] = P(rand() < 0.5 ? t.a : t.b).name; render();
    },
    'consol-open': function () { ui.consKey = null; openModal({ type: 'consol' }); },
    'consol-go': function (el) {
      var keep = +el.dataset.keep, close = +el.dataset.close;
      var r = E.consolidate(S, keep, close, now());
      if (r.error) { modalErr(r.error); return; }
      var t = E.T(S, keep);
      closeModal(); afterChange({ toast: 'Table ' + close + ' closed. ' + P(t.a).name + ' vs ' + P(t.b).name + ' on Table ' + keep + ': flip for the break.', undo: true });
    },
    'consol-later': function () { if (ui.consKey) ui.consDismissed = ui.consKey; closeModal(); },
    'throw-open': function (el) { openModal({ type: 'throw', n: +el.dataset.n }); },
    'throw-go': function (el) {
      var n = +el.dataset.n, a = +el.dataset.a, t = E.T(S, n);
      var go = function () {
        var r = E.throwMatch(S, n, a, null, now());
        if (r.error) { modalErr(r.error); return; }
        closeModal(); afterChange({ toast: 'Match thrown on Table ' + n, undo: true });
      };
      if (t.a && !E.canPair(S, t.a, a)) askConfirm({ title: 'Throw the rematch?', text: dn(P(a).name) + ' and ' + dn(P(t.a).name) + ' just played each other. Throw the rematch anyway?', ok: 'Throw the rematch' }, go);
      else go();
    },
    'cf-yes': function () {
      var m = ui.modal;
      if (!m || m.type !== 'confirm') return;
      closeModal();   /* back to the pop-up it was asked from, or closed */
      m.yes();
    },
    'close-table': function (el) {
      var r = E.closeTable(S, +el.dataset.n, now()); if (r.error) { fail(r); return; }
      afterChange({ toast: 'Table ' + el.dataset.n + ' closed', undo: true });
    },
    'reopen-table': function (el) {
      var before = tableKeys();
      var r = E.reopenTable(S, +el.dataset.n, now()); if (r.error) { fail(r); return; }
      afterChange({ toast: 'Table ' + el.dataset.n + ' reopened.' + seatedNote(before), undo: true });
    },
    'add-table': function () { openModal({ type: 'addtable' }); },

    /* playoff rounds: the in-person draw */
    'pr-draw-open': function () { openPrDraw(); },
    'pr-pick': function (el) {
      var m = ui.modal, di = E.prDrawInfo(S), id = +el.dataset.id, k = m.order.indexOf(id);
      if (!di) { closeModal(); return; }
      var need = di.picks === di.n ? di.n - 1 : 2;
      if (k >= 0) m.order.splice(k, 1);
      else if (m.order.length < need) m.order.push(id);
      else { modalErr(di.kind === 'playin' ? 'Two players are already picked. Tap one of them to change the draw.' : 'The draw is complete. Tap a numbered player to change it.'); return; }
      renderModal();
    },
    'pr-start': function () {
      var m = ui.modal, di = E.prDrawInfo(S);
      if (!di) { closeModal(); return; }
      var full = di.picks === di.n, order = m.order.slice();
      if (order.length < (full ? di.n - 1 : 2)) { modalErr('Tap the players in the order they drew.'); return; }
      if (full && order.length === di.n - 1) order.push(di.pool.filter(function (id) { return order.indexOf(id) < 0; })[0]);
      var r = E.prStartRound(S, order, m.tables, now());
      if (r.error) { modalErr(r.error); return; }
      var cur = S.pr.cur, parts = cur.matches.map(function (x) {
        return P(x.a).name + ' vs ' + P(x.b).name + (x.state === 'on' ? ' on Table ' + x.table : ', next free table');
      });
      closeModal(); afterChange({ toast: 'Round ' + cur.round + ': ' + parts.join('; ') + '.', undo: true });
    },

    /* the three-player round robin playoff */
    'po-offer': function () { ui.poKey = null; openModal({ type: 'po-offer' }); },
    'po-later': function () { closeModal(); },
    'po-draw-open': function () {
      var cand = E.playoffCandidates(S);
      if (!cand) { closeModal(); return; }
      if (ui.poKey) ui.poDismissed = ui.poKey;
      /* default table: the lowest-numbered open table one of the three is at, otherwise the lowest open table */
      var here = S.tables.filter(function (t) { return t.open && cand.some(function (id) { return t.a === id || t.b === id; }); });
      var open = S.tables.filter(function (t) { return t.open; });
      var def = (here[0] || open[0] || S.tables[0]).n;
      openModal({ type: 'po-draw', order: [], table: def });
    },
    'po-pick': function (el) {
      var m = ui.modal, id = +el.dataset.id, k = m.order.indexOf(id);
      if (k >= 0) m.order.splice(k, 1);
      else if (m.order.length < 2) m.order.push(id);
      else { modalErr('Two players are already picked. Tap one of them to change the draw.'); return; }
      renderModal();
    },
    'po-start': function () {
      var m = ui.modal, cand = E.playoffCandidates(S);
      if (!cand) { closeModal(); return; }
      if (m.order.length < 2) { modalErr('Tap the players in the order they drew.'); return; }
      var third = cand.filter(function (id) { return m.order.indexOf(id) < 0; })[0];
      var r = E.startPlayoff(S, m.order.concat([third]), m.table, now());
      if (r.error) { modalErr(r.error); return; }
      var rr = S.rr;
      ui.tab = 'tables';
      closeModal(); afterChange({ toast: 'Playoff match 1 on Table ' + rr.table + ': ' + P(rr.order[0]).name + ' vs ' + P(rr.order[1]).name, undo: true });
    },
    'po-won': function (el) {
      var id = +el.dataset.id, rr = S.rr, c = rr && rr.current;
      if (!c || (c.a !== id && c.b !== id)) { toast('That match is already finished.', { bad: true }); return; }
      if (tooSoon(c.since)) return;   /* the second tap of a double-tap */
      var w = P(id), l = P(c.a === id ? c.b : c.a);
      var r = E.playoffResult(S, id, now());
      if (r.error) { fail(r); return; }
      var msg = w.name + ' def. ' + l.name + '. ';
      if (r.finished) msg = w.name + ' takes 2nd and ' + l.name + ' 3rd. ' + P(S.champion).name + ' is the champion.';
      else if (r.champion) msg += w.name + ' is the champion. ' + P(S.rr.current.a).name + ' and ' + P(S.rr.current.b).name + ' play for 2nd.';
      else if (r.tie) msg += 'Everyone is 1-1. Choose how to break the tie.';
