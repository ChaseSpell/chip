    }
    // SS2: I was a card behind going into this round and made my hand — check-raise (strong) or check-call (rough)
    if (opp && !ip && toCall === 0 && c.made && nextDraw === 0 && myLast > c.oppLast) {
      if (strongPat || R() < 0.4) {
        p.bot.crPlan = c.st;
        return act('check', 'Made ' + mk(hn.short) + ' after being a card behind — check, planning to check-raise. SS2: he will bet automatically to avoid giving a free draw; ' + (strongPat
          ? 'with a good eight or a seven, check-raise.'
          : 'with a rough eight or nine, check-raising some of the time is fine — it tells you whether to call a river bet and may make him break a better hand.'), 'check-raise');
      }
      p.bot.checkCall = c.st;
      return act('check', 'Made a rough ' + mk(hn.short) + ' after being a card behind — check and call, then stay pat. SS2: with rough eights and nines, minimize losses out of position (check-raising sometimes is fine too).');
    }
    // in position, both drew one, he checks, we are unimproved
    if (opp && ip && toCall === 0 && c.oppLast === 1 && myLast === 1 && nextDraw === 1) {
      if (c.premiumDraw && c.deadWheel >= 2 && R() < 0.5) {
        return act('bet', 'Both drew one; he checks and I\'m unimproved but hold a premium draw with valuable discards. SS2: bet some premium draws in position with or without improvement — it\'s a value bet, avoids being predictable, and can make him break a ten.', 'semi-bluff');
      }
      // the notes' reason to check is his check-raise; against a player who doesn't check-raise, bet more (ToP ch. 25 #7)
      const ncr = userNoCheckRaise(game, opp), r0 = R();
      if (r0 < 0.88 - ncr) return act('check', 'Checked to me in position after we both drew one; I\'m unimproved. Notes: against a good player, don\'t bet the unimproved one-card draw — he would start check-raising his pat hands. SS2 agrees: even with the best draw, it\'s only a slight edge — avoid the check-raise.', 'gto');
      if (r0 < 0.88) return act('bet', 'Checked to me in position after we both drew one; unimproved, but I bet the draw. The notes check here to avoid his check-raise, and this player doesn\'t check-raise.' + noCheckRaiseNote(game), 'semi-bluff');
    }
    // out of position, both drew one and I made a hand: bet it (SS2) or check-raise (notes, mixed)
    if (opp && !ip && toCall === 0 && myLast >= 1 && nextDraw === 0 && c.made && c.oppLast === 1 && hn.top <= 10) {
      let f = 0.3;
      if (opp.isHuman) f = clamp(0.3 + (userPosterior(game).turnStab - 0.35) * 1.6, 0.3, 0.65);
      if (R() < f && hn.top <= 9) {
        p.bot.crPlan = c.st;
        return act('check', 'Made ' + mk(hn.short) + ' out of position — check, planning to check-raise.' + (f > 0.5 ? ' Notes: this opponent bets unimproved in position often, so check more when improved.' : ' (mixed for balance)'), 'check-raise');
      }
      return act('bet', 'Both drew one and I made ' + mk(hn.short) + ': bet and stand pat if not raised. SS2: into the last draw, bet the hands you plan to pat — a nine already beats a lone draw more often than not.', 'value');
    }
    // SS2: a card ahead going into the last draw — always bet (no free cards)
    if (toCall === 0 && c.cardAhead) {
      return act('bet', (nextDraw === 0 ? 'Pat ' + mk(hn.short) : 'Drawing ' + nextDraw) + ' vs opponents drawing ' + c.oppsLast.join(', ') + ': bet. SS2: needing fewer cards than him, bet whatever your position — free cards are too costly with one draw to come.', 'card-ahead');
    }
    if (p.bot.checkCall === c.st && toCall > 0 && c.lvl === 1) return act('call', 'Check-call as planned with ' + mk(hn.short) + ', then stay pat.');
    // SS2: raise with a seven, 8-5 or 8-6 — especially multiway, to pressure the drawers
    if (toCall > 0 && c.lvl === 1 && c.canRaise && strongPat && (c.N >= 2 || !ip || rs[0] <= 7 || rs[1] <= 5)) {
      return act('raise', 'Raise with ' + mk(hn.short) + ' — probably the best hand. SS2: sevens, 8-5s and even 8-6s are usually best — raise' + (c.N >= 2 ? '; multiway it\'s even more important, to make the drawers pay two bets.' : '.'), 'value');
    }
    // ToP ch. 9 (win big pots right away): in a big multiway pot, raise a good pat hand to drive out the drawers
    // still to act — even if the bettor may be ahead, heads-up against him beats letting the drawers in for one bet
    if (c.N >= 2 && toCall > 0 && c.lvl === 1 && c.canRaise && c.made && nextDraw === 0 && rs[0] <= 9 && c.pot >= 6 * unit) {
      const drawersBehind = c.opps.filter((q) => !q.allIn && q.roundBet < game.currentBet && q.draws[c.st - 1] > 0);
      if (drawersBehind.length && c.E > 1 / (c.N + 1) + 0.05) {
        return act('raise', 'Raise with ' + mk(hn.short) + ' to drive out the ' + (drawersBehind.length === 1 ? 'drawer' : 'drawers') + ' still to act. ToP (Sklansky): when the pot is big, try to win it right away — cut the field with a good hand even if the bettor may be ahead; drawers getting good odds are better folded than called.', 'isolate');
      }
    }
    // SS2: drew two, made a pat hand in position vs his one-card draw — just call (keep him pat with a ten)
    if (opp && ip && toCall > 0 && c.lvl === 1 && myLast === 2 && c.oppLast === 1 && c.made && nextDraw === 0 && rs[0] <= 8) {
      return act('call', 'Made ' + mk(hn.short) + ' drawing two; he drew one and bets: just call. SS2: he thinks I\'m still drawing, so if he makes a ten he stays pat — calling protects the pot instead of forcing him to break and draw live.', 'trap');
    }
    // SS2: drawing two with only one draw left — fold to a bet (unless position + live discards + big pot)
    if (toCall > 0 && nextDraw >= 2) {
      const exception = ip && c.oppsLast.some((n) => n > 0) && c.deadWheel >= 3 && c.potOdds < 0.12;
      if (exception) return act('call', 'Drawing two into the last draw, but in position with powerful discards and a big pot against a drawing opponent. SS2: the dead cards make his draw harder — the pot odds justify drawing two here.', 'mdf');
      return act('fold', 'Still drawing two with one draw left. SS2: two cards with one draw left rarely gets there (a 2-3-4 draw is even an underdog to a pat king) — fold, especially out of position.');
    }
    // SS2: rough draw against a player who stood pat right after the first draw
    if (opp && toCall > 0 && c.drawing && c.oppPrev === 0 && Math.max(...c.keepNow.map(TD.rankOf)) >= 8 && R() < 0.6) {
      return act('fold', 'Drawing rough (' + hstr(c.keepNow) + ') against a player who stood pat after the first draw. SS2: you need to make your hand AND be drawing live — he usually has at least an eight, so fold.');
    }
    // SS2 making a play: premium one-card draw with valuable discards vs a pat bettor, in position
    if (opp && ip && toCall > 0 && c.lvl === 1 && c.canRaise && nextDraw === 1 && c.premiumDraw && c.oppLast === 0 && c.deadWheel >= 2 && !isCallingStation(game, opp) && R() < 0.3 * PLAY_F) {
      return act('raise', 'Making a play: raise his pat bet with a premium draw (' + hstr(c.keepNow) + ') and valuable discards. SS2: spend an extra bet hoping to make him break or fold a nine/eight — I still have a draw if he doesn\'t (never against a calling station).', 'play');
    }
    // SS2: drawing one to a seven — always call one bet going into the last draw
    if (toCall > 0 && c.lvl === 1 && nextDraw === 1 && Math.max(...c.keepNow.map(TD.rankOf)) <= 7) {
      return act('call', 'Drawing one to ' + hstr(c.keepNow) + ': call. SS2: a one-card draw to a seven is always worth one bet before the last draw.');
    }
    // in position, we bet the draw and got check-raised: expect him pat, plan first
    if (opp && ip && c.iBet && toCall > 0 && c.drawing) {
      if (c.E >= c.potOdds * 0.8) {
        p.bot.vsCheckRaise = true;
        return act('call', 'Check-raised on the turn while drawing: expect him to stand pat. Plan made before calling: draw at ' + hstr(TD.policyKeep(c.hand, c.dRem)) + ' and reassess on the river. Notes: his turn check-raise range is usually very strong.', 'plan');
      }
      return act('fold', 'Check-raised on the turn while drawing; the price isn\'t right against a range that is usually very strong.');
    }
    // still drawing after the 2nd draw facing two bets cold: fold
    // MMG: drawing on a big-bet street and facing two bets — almost always fold. Always fold an eight draw (no idea
    // whether it is even live); a seven draw needs a pot of about 11 big bets (10.5 is break-even, and you are not
    // closing the action, and the bettors hold some of your outs)
    if (c.drawing && toCall >= 2 * unit && p.roundBet === 0) {
      const top = Math.max(...c.keepNow.map(TD.rankOf)), bb = c.pot / unit;
      if (top >= 8) return act('fold', 'Still drawing (to ' + hstr(c.keepNow) + ') and facing two big bets. MMG: always fold an eight draw here — you can\'t even tell whether it is live. Notes agree: fold unless the pot is huge.');
      if (bb < 11) return act('fold', 'Still drawing (to ' + hstr(c.keepNow) + ') and facing two big bets with ' + bb.toFixed(1) + ' big bets in the pot. MMG: a seven draw needs about 11 big bets in the pot to call two bets cold.');
      return act('call', 'Drawing to ' + hstr(c.keepNow) + ' facing two big bets, but the pot holds ' + bb.toFixed(1) + ' big bets. MMG: with a seven draw, a pot over about 11 big bets is enough to call two bets cold.', 'mdf');
    }
    // rough 8 / 9 raised after the 2nd draw
    if (opp && c.iBet && toCall > 0 && c.made && nextDraw === 0 && ((hn.top === 8 && hn.second >= 7) || (hn.top === 9 && hn.second >= 7))) {
      const roll = R();
      if (roll < 0.4) return act('fold', 'Made a rough ' + mk(hn.short) + ', bet and got raised. Notes: consider folding a rough eight or nine when raised after the 2nd draw.', 'discipline');
      p.bot.considerBreak = true;
      return act('call', 'Rough ' + mk(hn.short) + ' raised after the 2nd draw: call and decide between patting and drawing one (notes: stay pat and hope he\'s bluffing, draw one, or muck — read dependent).');
    }
    // making a play
    if (opp && toCall > 0 && c.lvl === 1 && c.canRaise && c.made && nextDraw === 0 && !p.bot.play) {
      const D = TD.rankMaskOf(c.hand);
      const under = TD.bestOfSize(D, 4, 1);
      const underScore = TD.PSCORE[under.mask] || 0;
      const breakable = (hn.top === 9 || hn.top === 10) && underScore >= 89 && (under.mask & 1);
      const rs = c.hand.map(TD.rankOf).sort((a, b) => b - a);
      const foldable = hn.top === 10 && rs[1] >= 8 && rs[2] >= 7 && !breakable; // e.g. T-8-7-6-3
      if ((breakable || foldable) && R() < 0.35 * PLAY_F) {
        p.bot.play = breakable ? 'break' : 'fold';
        p.bot.playStreet = c.st;
        return act('raise', 'Making a play: raise the turn with ' + mk(hn.short) + ' to make him fold or break. Notes: only make this play with a hand that has an easy decision if 3-bet (' + (breakable ? 'break to ' + mkMaskStr(under.mask) : 'easy fold') + ').', 'play');
      }
    }
    return freezeRule(c);
  }

  function riverRules(c) {
    const { hn, toCall, game, p } = c;
    if (c.N !== 1) {
      // multiway river: only raise strong 8s / 7s
      const strong = hn.cat === 0 && (hn.top <= 7 || (hn.top === 8 && hn.second <= 5));
      if (toCall > 0 && c.canRaise && c.lvl === 1 && strong && c.E > 0.55) return act('raise', 'Multiway river raise with ' + mk(hn.short) + '. Notes: in general only raise the river with a strong eight or a seven.', 'value');
      return null;
    }
    const opp = c.opp;
    const high = hn.cat === 0;
    const top = hn.top, sec = hn.second;
    const strong = high && (top <= 7 || (top === 8 && sec <= 5));
    const eightPlus = high && top <= 8;
    const rough8 = high && top === 8 && sec >= 7;
    const smooth9 = high && top === 9 && sec <= 6;
    const jOrBetter = high && top <= 11;
    const pairRank = hn.cat === 1 ? pairOf(c.hand) : 0;
    const qToDeuces = (high && top >= 12) || (hn.cat === 1 && pairRank === 2);
    const myLast = c.myLast, oppLast = c.oppLast;
    const mePat = myLast === 0, oppPat = oppLast === 0;

    // polarized line in position: he called my bet/raise, stood pat first and now leads into my pat hand —
    // my range is strong made hands or snows; the made-hand part never folds to the lead
    const polar = polarizedIP(c);
    if (polar && toCall > 0 && c.lvl === 1 && high) {
      const why = 'He called my ' + polar + ' after the 2nd draw, stood pat first and now leads into me after I stood pat behind him. My range is polarized — strong made hands or snows — and the made-hand part never folds to the lead';
      if (strong && c.canRaise) return act('raise', why + '; with ' + mk(hn.short) + ' I raise for value.', 'value');
      return act('call', why + ': call with ' + mk(hn.short) + '.', 'standard');
    }

    // SS2: my river bet got raised — opponents rarely raise with a 9, 10 or J; maybe with an 8, surely with a 7
    if (c.iBet && toCall > 0 && c.lvl >= 2) {
      if (high && top >= 9) {
        const shift = userBluffShift(game, opp, 2.5, -0.15, 0.35);
        if (R() < 0.75 - shift || (c.potOdds > 0.1 && shift <= 0)) return act('fold', 'My river bet with ' + mk(hn.short) + ' got raised: fold. SS2: river raises rarely come from nines, tens or jacks — expect an eight or, more likely, a seven.' + (shift < 0 ? userBluffNote(game, opp, shift) : ''), 'discipline');
        return act('call', 'River raise: call once with ' + mk(hn.short) + (shift > 0 ? ' (mixed).' + userBluffNote(game, opp, shift) : ' — the pot is huge (mixed).'));
      }
      if (high && (A5 ? top === 6 : top === 7 && sec === 5) && c.canRaise) return act('raise', 'Re-raise with the nuts (' + mk(hn.short) + ').', 'value');
      if (!high) return act('fold', 'My river bluff with ' + mk(hn.long) + ' got raised: fold.', 'discipline');
      return act('call', 'My river bet got raised: call with ' + mk(hn.short) + '. SS2: only the nuts (7-5-4-3-2) goes to five bets on the river — just call.');
    }

    if (!mePat && !oppPat) {
      const both1 = myLast === 1 && oppLast === 1;
      const lab = both1 ? 'Both drew one' : 'Both drew';
      if (toCall === 0) {
        if (jOrBetter) {
          if (!c.ip && top === 11 && R() < 0.35) return act('check', lab + ': check the jack out of position (mixed) — avoiding a marginal value bet OOP.');
          if (top >= 10 && userFoldsRiver(game, opp)) {
            const u = userPosterior(game);
            return act('check', lab + ': check ' + mk(hn.short) + '. The notes value-bet a jack because a king calls, but this player has folded to ' + u.riverFolds + ' of ' + u.riverBetFaced +
              ' river bets. ToP (Sklansky): against a player who folds too often on the end, bluff more but don\'t bet fair hands for value — only better hands call.');
          }
          return act('bet', lab + ' and I made ' + mk(hn.short) + '. Notes: value bet hands as bad as a jack — he will call with as little as a king.', 'value');
        }
        if (hn.cat === 1 && pairRank >= 4 && R() < bluffFreqVs(game, opp, c.pot, c.unit) * (pairRank >= 9 ? 1 : 0.6)) return act('bet', lab + ': bluff with ' + mk(hn.long) + ' — no showdown value. Notes/SS2: only bluff when you make a big pair (fours and higher), and only every now and then; it works when he makes a smaller pair.', 'bluff');
        if (high && top >= 12) return act('check', lab + ': check ' + mk(hn.long) + '. Notes: bluffing with an ace, king or queen is just silly — it has showdown value.');
        return act('check', lab + ': give up with ' + mk(hn.long) + '. Notes: the river is no time to get fancy.');
      }
      if (strong && c.canRaise && c.lvl === 1) return act('raise', lab + ': raise with ' + mk(hn.short) + '. Notes: only raise the river with a strong eight or a seven.', 'value');
      if (jOrBetter) return act('call', lab + ': call with ' + mk(hn.short) + '. Notes: always call with a jack or better here.');
      if (qToDeuces) {

        if (R() < 0.7 + shift) return act('call', lab + ': call with ' + mk(hn.long) + '. Notes: call most of the time with a queen through a pair of deuces.' + userBluffNote(game, opp, shift), 'mdf');
        return act('fold', lab + ': fold ' + mk(hn.long) + ' this time (mixed — notes say call "most of the time").' + (shift < 0 ? userBluffNote(game, opp, shift) : ''));
      }
      if (c.potOdds < 0.07) return act('call', 'Huge pot: call as a bluff-catcher.');

    if (oppPat && !mePat) {
      const patEarly = opp.draws[1] === 0;
      if (toCall > 0) {
        if (c.lvl === 1 && c.canRaise) {
          if (strong) return act('raise', 'He stood pat and bets; I drew and made ' + mk(hn.short) + ' — a premium hand, raise. Notes: don\'t raise unless premium (8-6 is the borderline).', 'value');
          if (high && top === 8 && sec === 6 && R() < 0.4) return act('raise', 'Raise with 8-6 vs his pat bet (borderline — mixed). Notes: against aggressive opponents you can raise an 8-6.', 'balance');
        }
        if (c.E >= c.potOdds) return act('call', 'He stood pat and bet; call with ' + mk(hn.short) + ' — ' + priceTxt(c) + '.');
        // MMG: a pat player's river bet is a very good 8-6 or better, or a bluff; in a big pot any hand that beats
        // a bluff is a call — at 12-to-1 or more, calling can't be a big mistake
        if (c.lvl === 1 && high && c.pot / toCall >= 12) return act('call', 'He stood pat and bet: call with ' + mk(hn.short) + ' as a bluff-catcher — ' + priceTxt(c) + '. MMG: his bet is a strong 8-6 or better or a bluff, and in a pot this big calling can\'t be a large mistake.', 'mdf');
        return act('fold', 'He stood pat and bet; ' + mk(hn.long) + ' can\'t beat enough of his pat range.');
      }
      if (c.ip) {
        // He stood pat and checks: the notes value-bet any eight; MMG says his check is usually a bad 8 or 9 that
        // will call, so bet 8-7-4 and better. Settled hand by hand (the user's choice, 2026-11-18): simulate his pat
        // range and bet when the hand beats more than half of the hands that would call (MoP ch. 13/17).
        if (high) {
          const Ec = mcEquity(game, p, { mode: 'bet', hypoCall: true });
          const need = 0.53 - 0.07 * userNoCheckRaise(game, opp);
          if (Ec >= need) return act('bet', 'He stood pat and checked; value bet ' + mk(hn.short) + ': simulated against his pat range, it beats more than half of the hands that would call. (Notes: bet any eight; MMG: bet 8-7-4 and better — settled here by simulation.)', 'value');
          return act('check', 'Check back ' + mk(hn.short) + ' behind his pat hand: simulated against his pat range, it doesn\'t beat half of the hands that would call, so a bet is called mainly by better. (MMG: a pat player who checks usually has a bad 8 or 9 that calls.)');
        }
        return act('check', 'Check back ' + mk(hn.long) + ' behind his pat hand.');
      }
      // out of position: I drew into his pat hand
      if (eightPlus) {
        const aggressiveOpp = opp.isHuman && opp.stats.hands >= 20 && opp.stats.pfr / opp.stats.hands > 0.28;
        if (aggressiveOpp && R() < 0.5) { p.bot.crPlan = c.st; return act('check', 'Made ' + mk(hn.short) + ' out of position into his pat hand: check to check-raise. SS2: against an aggressive opponent who will bet a nine or ten, go for the check-raise.', 'check-raise'); }
        return act('bet', 'Made ' + mk(hn.short) + ' out of position into his pat hand: bet right out. SS2: betting out is the safer line — worse pat hands call, better ones seldom raise.', 'value');
      }
      if (hn.cat === 1 && c.oppPrev > 0 && R() < 0.15) {
        return act('bet', 'Paired on the last draw against a player who only stood pat now: bluff. SS2: he knows you know he\'s pat, so a bet represents a made hand — a good player may fold a jack, ten or even a nine (this fails if he stood pat early).', 'bluff');
      }
      return null;
    }
    if (mePat && !oppPat) {
      if (toCall === 0) {
        const patEarlyMe = c.myPrev === 0; // I was already pat before the last draw
        if (!c.ip) {
          // SS2: out of position, pat vs a drawer

          }
          if (high && top === 8 && !(rough8 && patEarlyMe)) return act('bet', 'Pat ' + mk(hn.short) + ': bet. SS2: bet an eight you stood pat with after the second draw — he may call with a weak hand or a nine.', 'value');
          return act('check', 'Pat ' + mk(hn.short) + ' out of position vs a drawing opponent: check (and call one bet). SS2: check a nine, ten or jack — and a rough eight you stood pat with early; if he made a hand you would lose two bets.');

        if (high && top === 8 && !patEarlyMe && isCallingStation(game, opp)) return act('bet', 'Made the eight on the second draw and he is a calling station: bet. SS2: versus a caller who never check-raises, betting it is reasonable.', 'value');

  // exact price of a call: pot odds and the break-even share they require

  function pairOf(hand) {

  function generic(c) {

      // Heads-up river value bet. MoP ch. 13/17: what matters is how the hand does against the hands
      // that CALL — bet everything he would have bet plus the better half of the hands that will call;

        return act('check', (c.ip ? 'Check back ' : 'Check ') + mk(c.hn.short) + ': simulated against his likely range, it doesn\'t beat half of the hands that would call a bet — the worse hands fold, so a bet gets called mainly by better. MoP: don\'t bet a hand that can only beat a bluff' + (c.ip ? ' in position on the river.' : '.'));
      }
      let thr = fair + (c.N === 1 ? 0.07 : 0.10) + (c.ip ? 0 : 0.05);
      if (c.st === 3) thr = c.N === 1 ? (c.ip ? 0.58 : 0.64) : fair + 0.2;
      // ToP ch. 25 #7: bet more hands behind a player who doesn't check-raise
      const ncr = c.ip && c.N === 1 ? userNoCheckRaise(c.game, c.opp) : 0;

    let need = c.potOdds - impl;
    if (!c.ip && c.drawing) {
      const keep = TD.policyKeep(c.hand, c.dRem);
      if (keep.some((x) => TD.rankOf(x) >= 8)) need += 0.03; // OOP draw to a rough hand
    }
    // ToP ch. 5: players still to act behind me can raise, which cuts the odds a call is really getting
    const behind = c.game.players.filter((q) => q !== c.p && !q.folded && !q.allIn && q.roundBet < c.game.currentBet).length;
    if (behind > 0) need += 0.02 * Math.min(2, behind);
    const behindTxt = behind > 0 ? '; ' + plural(behind, 'player') + ' still to act behind me could raise, which cuts those odds (ToP, Sklansky)' : '';
    if (c.E >= need) return act('call', 'Call with ' + hnTxt + ' — ' + priceTxt(c) + (c.drawing ? ', plus implied odds' : '') + behindTxt + '.');
    return act('fold', 'Fold ' + hnTxt + ' — not enough for the price (' + priceTxt(c) + behindTxt + ').');
  }

  function decideBet(game, p, opts) {
    try {

    }
  }

  /* ---------------- coach: evaluate the user's play with the same strategy ----------------

  function normType(t, opts) {

    if (t === 'check' && !opts.canCheck) t = 'fold';

  function coachDraw(game, p) {
    const saved = p.bot;
    p.bot = clone(p.coach);

    const eqUser = mcEquity(game, p, { mode: 'draw', keep: userKeep, iters: it, budget: 120, patForever: false });
    return { same: false, aiKeep, userKeep, eqAI, eqUser };
  }

  TD.AI = { decideBet, decideDraw: decideDrawSafe, mcEquity, OPEN_THR, predrawKey, coachBet, coachCommit, coachDraw, coachDrawCompare, normType, hstr: hstrPlain,
    userPosterior, bluffFreqVs, riverCallLik, isCallingStation,

      this.focusSeat = -1; // play every seat: the seat whose cards are shown face up in the big card area
      this.lastFocus = -1;
      this.viewSeat = 0; // the seat drawn at the bottom of the table (play every seat turns the table to the acting seat)
      this.pending = new Set();
      this.preAction = null;
      this.drawerTab = null;
      this.reviewIndex = 0;
      this.pendingTopUp = false;
      this.logLines = [];
      this.game = null;
      this.mode = null; this.H = 0;
      this.applySettings();
      this.buildSeats();
      this.bindChrome();
      this.fit();
      const refit = () => { clearTimeout(this._fitT); this._fitT = setTimeout(() => this.fit(), 60); };
      window.addEventListener('resize', refit);
      window.addEventListener('orientationchange', refit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
      document.addEventListener('keydown', (e) => this.onKey(e));
    }
    get f() { return { slow: 1.6, normal: 1, fast: 0.55, turbo: 0.2 }[this.settings.speed] || 1; }
    get stakes() { return (this.game && this.game.stakes) || TD.makeStakes(this.settings.stakes || TD.CONST.DEFAULT_STAKES); }
    saveSettings() { store.set('lago27.settings', JSON.stringify(this.settings)); this.applySettings(); }
    applySettings() {
      const b = document.body;
      b.classList.toggle('four-color', !!this.settings.fourColor);
      ['classic', 'light', 'dark'].forEach((t) => b.classList.toggle('theme-' + t, this.settings.theme === t));
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', THEME_COLORS[this.settings.theme] || '#160a08');
      Sound.on = !!this.settings.sound;
      const w = $('#tb-sound svg'); if (w) w.style.opacity = Sound.on ? 1 : 0.35;
      if (this.game) { this.game.settings = this.settings; this.game.coachEnabled = this.settings.coach !== false; }
    }

    /* ---------- responsive layout ---------- */
    fit() {
      const vv = window.visualViewport;
      const vw = (vv && vv.width) || window.innerWidth, vh = (vv && vv.height) || window.innerHeight;
      const portrait = vw / vh < 0.85;
      const W = portrait ? 900 : 1600;
      const H = portrait ? Math.round(Math.min(2100, Math.max(1600, (900 * vh) / vw))) : 900;
      const s = Math.min(vw / W, vh / H);
      const stage = $('#stage');
      stage.style.width = W + 'px'; stage.style.height = H + 'px';
      stage.style.transform = 'scale(' + s + ')';
      this.scale = s;
      const mode = portrait ? 'portrait' : 'landscape';
      document.body.classList.toggle('compact', !portrait && s < 0.66);
      if (mode !== this.mode || H !== this.H) {
        this.mode = mode; this.H = H;
        document.body.classList.toggle('portrait', portrait);
        document.body.classList.toggle('landscape', !portrait);
        GEO = portrait ? portraitGeo(H) : landscapeGeo();
        this.relayout();
      }
    }
    relayout() {
      const g = GEO;
      const t = $('#table');
      t.style.left = g.table.x + 'px'; t.style.top = g.table.y + 'px'; t.style.width = g.table.w + 'px'; t.style.height = g.table.h + 'px';
      for (let i = 0; i < 6; i++) {
        const v = this.vpos(i);
        const s = $('#seat-' + i), a = g.seats[v], pr = g.parts[v];
        s.classList.toggle('hero', v === 0);
        place(s, a.x, a.y);
        place(s.querySelector('.draws'), pr.pills.x, pr.pills.y);
        place(s.querySelector('.bubble'), pr.bubble.x, pr.bubble.y);
        if (pr.label) place(s.querySelector('.hand-label'), pr.label.x, pr.label.y);
        s.querySelector('.hand-label').style.display = pr.label ? '' : 'none';
        place($('#bet-' + i), g.bets[v].x, g.bets[v].y);
      }
      place($('#pot'), g.pot.x, g.pot.y);
      place($('#banner'), g.banner.x, g.banner.y);
      const hc = $('#hero-cards');
      place(hc, g.hero.left, g.hero.top);
      hc.style.width = (g.hero.cw + 4 * g.hero.spacing) + 'px'; hc.style.height = g.hero.ch + 'px';
      const ft = $('#focus-tag');
      if (ft) place(ft, g.hero.left + (g.hero.cw + 4 * g.hero.spacing) / 2, g.hero.top + g.hero.ch + (g.mode === 'portrait' ? 28 : 22));
      $('#pot .pot-burns').innerHTML = ''; // re-drawn at the new chip size
      if (this.game) {
        const d = g.dealer[this.vpos(this.game.button)];
        place($('#dealer-btn'), d.x, d.y);
        for (let i = 0; i < 6; i++) this.renderSeatCards(this.game, i); // the bottom seat clears its small cards and draws the big ones
        this.renderHero(this.game);
        this.update(this.game, {});
      }
    }

    wait(ms) { if (this.ff) return Promise.resolve(); return new Promise((r) => setTimeout(r, Math.max(0, ms * this.f))); }
    // Zoom: once the user folds, the rest of the hand plays out instantly (no animation or sound)
    setFastForward(on) {
      this.ff = !!on;
      Sound.suspend = !!on;
      document.body.classList.toggle('zooming', !!on);
      if (on) { this.clearButtons(); $('#pre-actions').innerHTML = ''; this.showBanner('Zoom', 'Next hand coming up…'); }
    }
    botDelay() { return 520 + Math.random() * 640; }
    async flush() { await Promise.all(Array.from(this.pending)); }
    track(p) { this.pending.add(p); p.finally(() => this.pending.delete(p)); return p; }

    /* ---------- static chrome ---------- */
    buildSeats() {
      const root = $('#seats');
      root.innerHTML = '';
      $('#bets').innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'seat' + (this.vpos(i) === 0 ? ' hero' : '');
        el.id = 'seat-' + i;
        el.innerHTML = '<div class="cards"></div>' +
          '<div class="plate"><div class="avatar"><span class="ini"></span><svg class="timer" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34"/></svg></div>' +
          '<div class="ptext"><div class="pname"></div><div class="pstack"></div></div><div class="pos"></div><div class="allin">ALL-IN</div></div>' +
          '<div class="draws"><i></i><i></i><i></i></div><div class="bubble"></div><div class="hand-label"></div>';
        el.querySelector('.avatar').style.setProperty('--av', AVATARS[i]);
        root.appendChild(el);
        const b = document.createElement('div');
        b.className = 'bet'; b.id = 'bet-' + i;
        $('#bets').appendChild(b);
      }
    }

    bindChrome() {
      $('#tb-review').onclick = () => this.toggleDrawer('review');
      $('#tb-log').onclick = () => this.toggleDrawer('log');
      $('#tb-history').onclick = () => this.toggleDrawer('history');
      $('#tb-stats').onclick = () => this.toggleDrawer('stats');
      $('#drawer-close').onclick = () => this.toggleDrawer(null);
      $$('.tab').forEach((t) => (t.onclick = () => this.toggleDrawer(t.dataset.tab, true)));
      $('#tb-rules').onclick = () => this.showRules();
      $('#tb-settings').onclick = () => this.showSettings();
      $('#tb-sound').onclick = () => { this.settings.sound = !this.settings.sound; this.saveSettings(); Sound.init(); };
      $('#tb-chips').onclick = () => this.addChips();
      $('#ib-chips').onclick = () => this.addChips();
      // tap (or hover) the pot to see how many cards are left in the stub
      $('#pot').onclick = () => {
        const pot = $('#pot');
        clearTimeout(this._tipT);
        pot.classList.toggle('tip');
        if (pot.classList.contains('tip')) this._tipT = setTimeout(() => pot.classList.remove('tip'), 3000);
      };
      document.addEventListener('pointerdown', () => Sound.init(), { once: true });
    }

    /* ---------- engine hooks ---------- */
    attach(game) {
      this.game = game;
      game.settings = this.settings;
      game.coachEnabled = this.settings.coach !== false;
      this.refreshStakesText();
      this.update(game, {});
    }
    async gameChanged(game) {
      this.refreshStakesText();
      this.update(game, {});
      if (this.settings.speed !== 'turbo') { this.showBanner(TD.gameInfo.name, ''); await this.wait(1100); this.hideBanner(); }
    }

    // 2-7 / A-5 / Mix. Between hands the table changes at once; during a hand, from the next hand.
    setGameMode(k) {
      const s = this.settings;
      if (!['27', 'A5', 'MIX'].includes(k) || s.gameMode === k) return;
      s.gameMode = k;
      const g = this.game;
      const live = g && g.handInProgress;
      if (g && k !== 'MIX') { g.mixGame = null; g.mixLeft = 0; }
      if (!live && k !== 'MIX' && k !== TD.GAME) { TD.setGame(k); s.game = k; this.refreshStakesText(); }
      this.saveSettings();
      if (g) this.update(g, {});
      const label = k === 'MIX' ? 'Mix: 2-7 and A-5 change every 6 hands' : TD.GAME_INFO[k].name;
      if (live) this.toast(label + ' from the next hand');
      else if (k === 'MIX') this.toast(label);
      if (this.onGameMode) this.onGameMode(k);
    }

    refreshStakesText() {
      const st = this.stakes;
      const gi = TD.gameInfo;
      $('#brand-stakes').textContent = gi.limitName + ' · ' + money(st.small) + '/' + money(st.big);
      document.title = 'The Lago Room — ' + gi.limitName + ' ' + money(st.small) + '/' + money(st.big);
      const felt = document.querySelector('.felt-logo .ln2');
      if (felt) felt.innerHTML = gi.felt;
    }

    async newHand(game) {
      this.slots = [[], [], [], [], [], []];
      this.preAction = null;
      this.heroOrderCache = null;
      this.heroSorted = false;
      this.heroSel = new Set();
      this.drawMode = false;
      this.focusSeat = -1; this.lastFocus = -1;
      // play every seat, seat view for this hand: 'rotate' turns the table to the acting seat,
      // 'fixed' keeps every seat in place and rings the acting seat (its cards still use the big area)
      this.fixedView = !!game.allSeats && this.settings.seatView === 'fixed';
      this.glowSeat = -1;
      // turning table: start the hand turned to the first player to act; otherwise your seat is at the bottom
      const view = game.allSeats && !this.fixedView ? (game.button + 3) % 6 : 0;
      if (view !== this.viewSeat) { this.viewSeat = view; this.heroOrderCache = null; this.relayout(); }
      this.renderFocusTag(game);
      this.setFastForward(false);
      $('#pot').classList.remove('tip');
      $('#hero-cards').classList.remove('folded', 'selectable');
      for (let i = 0; i < 6; i++) {
        const s = $('#seat-' + i);
        s.classList.remove('folded', 'winner', 'turn', 'thinking', 'glow');
        s.querySelector('.hand-label').className = 'hand-label';
        s.querySelector('.cards').innerHTML = '';
      }
      $('#hero-cards').innerHTML = '';
      this.hideBanner();
      this.refreshStakesText();
      const d = GEO.dealer[this.vpos(game.button)];
      place($('#dealer-btn'), d.x, d.y);
      this.setStreet(game, -1);
      this.update(game, {});
      await this.wait(250);
    }

    // the street is shown by the burn cards under the pot (one per draw), not by text
    setStreet(game, street) {
      if (street < 0) return;
      this.preAction = null;
      this.renderPre();
    }
    setDrawPhase(game, k) {
      this.renderPre();
      this.update(game, {});
    }
    // burn one card before each draw: it slides from the deck point into the pot, under the chips
    async burnCard(game) {
      const from = this.stubFrom();
      const to = { x: GEO.pot.x - GEO.bot.w / 2, y: GEO.pot.y - GEO.bot.h * 0.9 };
      await this.flyCard(from, to, { dur: 240, fade: false });
      this.update(game, {});
    }
    renderBurns(game) {
      const box = $('#pot .pot-burns');
      const n = Math.min(3, game.burnCount || 0);
      if (box.childElementCount === n) return;
      box.innerHTML = '';
      const cw = GEO.chip * 1.4, spread = GEO.chip * 0.85;
      for (let i = 0; i < n; i++) {
        const off = (i - (n - 1) / 2);
        const c = cardEl(null, false, false);
        c.style.left = (off * spread - cw / 2) + 'px';
        c.style.transform = 'rotate(' + (off * 20) + 'deg)';
        box.appendChild(c);
      }
    }
    setTurn(game, seat) {
      for (let i = 0; i < 6; i++) $('#seat-' + i).classList.remove('turn', 'thinking');
      if (seat >= 0) {
        const s = $('#seat-' + seat);
        s.classList.add('turn');
        if (seat !== 0 && !game.allSeats) s.classList.add('thinking');
      } else if (game.allSeats && this.focusSeat >= 0) {
        // play every seat: as soon as a seat has acted its cards are hidden again
        this.focusSeat = -1;
        this.heroSel.clear();
        const was = this.lastFocus;
        this.setGlow(-1);
        this.renderHero(game);
        if (this.fixedView && was >= 0 && was !== this.viewSeat) this.renderSeatCards(game, was);
        this.renderFocusTag(game);
      }
      this.renderPre();
    }

    update(game, opts) {
      const human = game.players[0];
      for (const p of game.players) {
        const s = $('#seat-' + p.seat);
        s.querySelector('.ini').textContent = p.isHuman ? 'YOU' : p.name.slice(0, 2).toUpperCase();
        s.querySelector('.pname').textContent = p.isHuman ? 'You' : p.name;
        s.querySelector('.pstack').textContent = money(p.stack);
        s.classList.toggle('is-allin', p.allIn && !p.folded);
        s.querySelector('.pos').textContent = game.handNo ? game.posName(p.seat) : '';
        s.classList.toggle('folded', p.folded && game.handNo > 0);
        s.querySelectorAll('.draws i').forEach((d, k) => {
          const n = p.draws[k];
          const next = game.inDraw && game.drawRound === k && n === undefined && !p.folded;
          d.className = n === undefined ? (next ? 'next' : '') : (n === 0 ? 'done pat' : 'done');
          d.textContent = n === undefined ? '–' : (n === 0 ? 'PAT' : n);
          d.title = n === undefined ? 'Draw ' + (k + 1) : 'Draw ' + (k + 1) + ': ' + (n === 0 ? 'stood pat' : 'drew ' + n);
        });
        const bub = s.querySelector('.bubble');
        const la = p.lastAction || '';
        if (la) {
          bub.textContent = la;
          const key = la.split(' ')[0].toLowerCase();
          bub.className = 'bubble show ' + (key === 'draws' ? 'draw' : key);
        } else bub.className = 'bubble';
        const b = $('#bet-' + p.seat);
        if (p.roundBet > 0) b.innerHTML = chipsHTML(p.roundBet) + '<span class="amt">' + money(p.roundBet) + '</span>';
        else b.innerHTML = '';
      }
      const total = game.players.reduce((s, p) => s + p.totalBet, 0);
      const collected = game.players.reduce((s, p) => s + p.totalBet - p.roundBet, 0);
      const pot = $('#pot');
      pot.classList.toggle('empty', total === 0);
      pot.querySelector('.pot-chips').innerHTML = collected > 0 ? chipsHTML(collected) : '';
      pot.querySelector('.pot-amt').textContent = 'Pot ' + money(total);
      const pg = pot.querySelector('.pot-game'); if (pg) pg.textContent = TD.gameInfo.short + ' Triple Draw'; // which game this hand is
      const left = game.stub ? game.stub.length : 0;
      pot.querySelector('.pot-tip').innerHTML = '<b>' + left + '</b> card' + (left === 1 ? '' : 's') + ' left in the stub';
      pot.title = left + ' cards left in the stub';
      this.renderBurns(game);
      const net = human.stack - human.buyins;
      const st = game.stakes;
      const mixTxt = this.settings.gameMode === 'MIX' && game.mixGame ? ' · Mix, ' + (game.mixLeft > 0 ? game.mixLeft + ' more' : 'switches next hand') : '';
      $('#hand-no').textContent = (game.handNo ? 'Hand #' + game.handNo + ' · ' : '') + TD.gameInfo.short + mixTxt + ' · ' + money(st.small) + '/' + money(st.big) + ' limit';
      $('#session-net').innerHTML = 'Session <b class="' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '') + '">' + (net > 0 ? '+' : '') + money(net) + '</b>';
      const canTop = human.stack + human.totalBet < st.buyin;
      $('#tb-chips').style.display = canTop ? '' : 'none';
      $('#ib-chips').style.display = canTop ? '' : 'none';
      if (opts && opts.action) {
        const a = opts.action;
        if (a === 'check') Sound.check(); else if (a === 'fold') Sound.fold(); else Sound.chip();
      }
      this.renderHeroLabel(game);
      this.refreshSelectable(game);
      return Promise.resolve();
    }

    // discards can be marked any time before the draw (including during the betting round)
    canPreselect(game) {
      const p = game.players[0];
      if (game.allSeats) return false; // every seat: discards are marked at each seat's own draw
      return !!p && p.isHuman && !p.folded && p.hand.length === 5 && !this.heroDealing && !game.handOver &&
        p.draws.length < 3 && this.slots[0].filter(Boolean).length === 5;
    }
    refreshSelectable(game) {
      const hc = $('#hero-cards');
      if (!hc) return;
      const on = this.drawMode || this.canPreselect(game);
      hc.classList.toggle('selectable', on);
      if (!on && !this.drawMode && this.heroSel && this.heroSel.size) {
        this.heroSel.clear();
        $$('.card.sel', hc).forEach((c) => c.classList.remove('sel'));
      }
    }
    // (no hand-name tag under the user's cards)
    renderHeroLabel() { }

    /* ---------- card positions (stage coords, top-left of a card) ---------- */
    botSlotPos(seat, i) {
      const v = this.vpos(seat);
      const a = GEO.seats[v], c = GEO.parts[v].cards, b = GEO.bot;
      return { x: a.x + c.x + (i - 2) * b.spacing - b.w / 2, y: a.y + c.y - b.h / 2, rot: (i - 2) * b.rot };
    }
    heroSlotPos(i) { return { x: GEO.hero.left + i * GEO.hero.spacing, y: GEO.hero.top }; }
    heroSmallOffset() { return { x: (GEO.hero.cw - GEO.bot.w) / 2, y: (GEO.hero.ch - GEO.bot.h) / 2 }; }
    stubFrom() { return { x: GEO.stub.x - GEO.bot.w / 2, y: GEO.stub.y - GEO.bot.h / 2 }; }
    muckTo() { return { x: GEO.muck.x - GEO.bot.w / 2 + (Math.random() * 16 - 8), y: GEO.muck.y - GEO.bot.h / 2, rot: Math.random() * 40 - 20 }; }

    renderSeatCards(game, seat) {
      if (seat === this.displaySeat(game)) { $('#seat-' + seat + ' .cards').innerHTML = ''; return this.renderHero(game); }
      const box = $('#seat-' + seat + ' .cards');
      box.innerHTML = '';
      if (this.vpos(seat) === 0) return; // the bottom seat's hand only shows in the big card area
      const a = GEO.seats[this.vpos(seat)];
      const sl = this.slots[seat];
      const p = game.players[seat];
      const faceUp = p.shown;
      const order = faceUp ? TD.sortForDisplay(p.hand) : null;
      for (let i = 0; i < 5; i++) {
        if (!sl[i]) continue;
        const pos = this.botSlotPos(seat, i);
        const el = faceUp ? cardEl(order[i], true, true) : cardEl(null, true, false);
        el.style.left = (pos.x - a.x) + 'px'; el.style.top = (pos.y - a.y) + 'px';
        el.style.transform = 'rotate(' + pos.rot + 'deg)';
        el.style.transformOrigin = '50% 100%';
        box.appendChild(el);
      }
    }
    // the seat shown in the big card area: always the user's seat, except in play every seat
    // the big card area shows the bottom seat's cards; with the fixed table, the acting seat's cards
    displaySeat(game) { return this.fixedView && this.focusSeat >= 0 ? this.focusSeat : this.viewSeat; }
    setGlow(seat) {
      this.glowSeat = seat;
      for (let i = 0; i < 6; i++) $('#seat-' + i).classList.toggle('glow', i === seat);
    }
    vpos(seat) { return (seat - (this.viewSeat || 0) + 6) % 6; } // where a seat is drawn: 0 = bottom
    heroOrder(game) {
      const ds = this.displaySeat(game);
      const p = game.players[ds];
      const vis = p.hand.map((c, i) => ({ c, i })).filter((o) => this.slots[ds][o.i]);
      if (this.heroSorted && vis.length === 5) return TD.sortForDisplay(p.hand).map((c) => p.hand.indexOf(c));
      return this.heroOrderCache && this.heroOrderCache.length === 5 ? this.heroOrderCache : [0, 1, 2, 3, 4];
    }
    renderHero(game) {
      const box = $('#hero-cards');
      const ds = this.displaySeat(game);
      if (ds !== this.heroShownSeat) { this.heroShownSeat = ds; this.heroOrderCache = null; } // another seat's hand: fresh order
      const p = game.players[ds];
      if (!p.hand || !p.hand.length) { box.innerHTML = ''; return; }
      // play every seat: the user's own seat is face down too unless it is acting or has been shown
      const faceUp = !game.allSeats || this.focusSeat === ds || p.shown;
      const order = this.heroOrder(game);
      this.heroOrderCache = order;
      const existing = new Map($$('.card', box).map((el) => [el.dataset.key, el]));
      const keep = new Set();
      order.forEach((hi, pos) => {
        if (!this.slots[ds][hi]) return;
        const c = p.hand[hi];
        const key = ds + ':' + c + (faceUp ? 'u' : 'd');
        keep.add(key);
        let el = existing.get(key);
        if (!el) {
          el = cardEl(c, false, faceUp);
          el.dataset.key = key;
          el.onclick = () => this.toggleSelect(el);
          box.appendChild(el);
        }
        el.dataset.hi = hi;
        el.classList.toggle('sel', faceUp && !!(this.heroSel && this.heroSel.has(c)));
        el.style.left = (pos * GEO.hero.spacing) + 'px';
        el.style.top = '0px';
      });
      for (const [k, el] of existing) if (!keep.has(k)) el.remove();
    }

    flyCard(from, to, opts = {}) {
      if (this.ff) { if (opts.el && !opts.keep) opts.el.remove(); return Promise.resolve(opts.el || null); }
      const el = opts.el || cardEl(opts.card, opts.small !== false, !!opts.faceUp);
      el.style.left = '0px'; el.style.top = '0px';
      const r0 = from.rot || 0, r1 = to.rot || 0;
      el.style.transform = 'translate(' + from.x + 'px,' + from.y + 'px) rotate(' + r0 + 'deg)';
      const dur = (opts.dur || 300) * this.f;
      el.style.setProperty('--dur', (dur / 1000) + 's');
      $('#fx').appendChild(el);
      return this.track(new Promise((res) => {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.transform = 'translate(' + to.x + 'px,' + to.y + 'px) rotate(' + r1 + 'deg)';
          if (opts.fade) el.style.opacity = '0.0';
        }));
        setTimeout(() => { if (!opts.keep) el.remove(); res(el); }, dur + 30);
      }));
    }

    async dealCard(game, seat, idx) {
      const from = this.stubFrom();
      let to;
      const hs = this.displaySeat(game);
      if (seat === hs) {
        const o = this.heroSmallOffset(), h = this.heroSlotPos(idx);
        to = { x: h.x + o.x, y: h.y + o.y };
        this.heroDealing = true; this.heroSorted = false;
      } else to = this.botSlotPos(seat, idx);
      // the initial deal is silent; only the draw rounds play the dealing sound (dealReplacements)
      const pr = this.flyCard(from, to, { dur: 260 }).then(() => {
        this.slots[seat][idx] = true;
        this.renderSeatCards(game, seat);
        if (seat === hs && idx === 4) { this.heroDealing = false; this.heroSorted = true; setTimeout(() => { this.renderHero(game); this.renderHeroLabel(game); this.refreshSelectable(game); }, 180 * this.f); }
      });
      await this.wait(62);
      if (seat === hs && idx === 4) await pr;
    }

    async showDiscards(game, seat, idx) {
      const proms = [];
      if (seat === this.displaySeat(game)) {
        const els = $$('#hero-cards .card');
        for (const hi of idx) {
          const el = els.find((e) => +e.dataset.hi === hi);
          let from = this.heroSlotPos(0);
          if (el) {
            const o = this.heroSmallOffset();
            from = { x: GEO.hero.left + parseFloat(el.style.left) + o.x, y: GEO.hero.top + o.y };
            el.remove();
          }
          this.slots[seat][hi] = false;
          proms.push(this.flyCard(from, this.muckTo(), { dur: 320, small: true, fade: true }));
        }
        $('#hero-cards').classList.remove('selectable');

      } else {
        for (const hi of idx) {
          const from = this.botSlotPos(seat, hi);
          this.slots[seat][hi] = false;
          proms.push(this.flyCard(from, this.muckTo(), { dur: 320, fade: true }));
        }
        this.renderSeatCards(game, seat);
      }
      if (idx.length) Sound.fold();
      this.update(game, {});
      if (idx.length) await this.wait(260);
      else await this.wait(120);
    }

    async dealReplacements(game, seat, idx) {
      if (!idx.length) return;
      const from = this.stubFrom();
      const hs = this.displaySeat(game);
      if (seat === hs) this.heroSorted = false;
      const proms = [];
      for (const hi of idx) {
        let to;
        if (seat === hs) {
          const o = this.heroSmallOffset(), h = this.heroSlotPos(Math.max(0, (this.heroOrderCache || [0, 1, 2, 3, 4]).indexOf(hi)));
          to = { x: h.x + o.x, y: h.y + o.y };
        } else to = this.botSlotPos(seat, hi);
        Sound.card();
        proms.push(this.flyCard(from, to, { dur: 260 }).then(() => { this.slots[seat][hi] = true; this.renderSeatCards(game, seat); }));
        await this.wait(70);
      }
      await Promise.all(proms);
      if (seat === hs) {
        await this.wait(200);
        this.heroSorted = true;
        this.renderHero(game);
      }
      this.update(game, {});
    }

    foldCards(game, seat) {
      const sl = this.slots[seat];
      const inHero = seat === this.displaySeat(game);
      for (let i = 0; i < 5; i++) {
        if (!sl[i]) continue;
        let from;
        if (inHero) {
          const pos = this.heroOrderCache ? Math.max(0, this.heroOrderCache.indexOf(i)) : i;
          const o = this.heroSmallOffset(), h = this.heroSlotPos(pos);
          from = { x: h.x + o.x, y: h.y + o.y };
        } else from = this.botSlotPos(seat, i);
        sl[i] = false;
        this.flyCard(from, this.muckTo(), { dur: 340, fade: true });
      }
      this.renderSeatCards(game, seat);
      if (inHero) $('#hero-cards').innerHTML = '';
      $('#seat-' + seat).classList.add('folded');
    }

    async collectBets(game) {
      const proms = [];
      const cap = game.stakes.big * 2.5;
      for (const p of game.players) {
        if (p.roundBet <= 0) continue;
        if (this.ff) { $('#bet-' + p.seat).innerHTML = ''; continue; }
        const b = $('#bet-' + p.seat);
        const chip = document.createElement('div');
        chip.className = 'fly-chip';
        chip.innerHTML = chipsHTML(Math.min(p.roundBet, cap));
        const from = GEO.bets[this.vpos(p.seat)];
        place(chip, from.x - GEO.chip, from.y - GEO.chip / 2);
        $('#fx').appendChild(chip);
        b.innerHTML = '';
        proms.push(this.track(new Promise((res) => {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            chip.style.transitionDuration = (0.42 * this.f) + 's';
            chip.style.transform = 'translate(' + (GEO.pot.x - from.x) + 'px,' + (GEO.pot.y - from.y) + 'px)';
            chip.style.opacity = '0.2';
          }));
          setTimeout(() => { chip.remove(); res(); }, 440 * this.f + 30);
        })));
      }
      if (proms.length) { Sound.chip(); await Promise.all(proms); }
      const total = game.players.reduce((s, p) => s + p.totalBet, 0);
      $('#pot .pot-chips').innerHTML = total ? chipsHTML(total) : '';
    }

    async showHand(game, seat, hn) {
      const s = $('#seat-' + seat);
      const hs = this.displaySeat(game);
      if (seat === hs && game.allSeats) this.renderHero(game);
      if (seat !== hs) {
        this.renderSeatCards(game, seat);
        const lbl = s.querySelector('.hand-label');
        lbl.textContent = (hn.cat === 0 ? hn.short + ' · ' : '') + hn.long;
        lbl.className = 'hand-label show';
      }
      Sound.card();
      await this.wait(720);
    }
    async muckHand(game, seat) {
      const s = $('#seat-' + seat);
      if (seat === this.displaySeat(game)) { $('#hero-cards').classList.add('folded'); s.classList.add('folded'); }
      else this.foldCards(game, seat);
      s.querySelector('.bubble').textContent = 'Muck';
      s.querySelector('.bubble').className = 'bubble show muck';
      await this.wait(420);
    }

    async awardPot(game, awards, hn, potIdx, nPots) {
      if (this.ff) { this.update(game, {}); $('#pot').classList.add('empty'); return; }
      const proms = [];
      const cap = game.stakes.big * 15;
      for (const a of awards) {
        const to = GEO.seats[this.vpos(a.seat)];
        const chip = document.createElement('div');
        chip.className = 'fly-chip';
        chip.innerHTML = chipsHTML(Math.min(a.amount, cap));
        place(chip, GEO.pot.x - GEO.chip, GEO.pot.y - GEO.chip / 2);
        $('#fx').appendChild(chip);
        proms.push(this.track(new Promise((res) => {
          requestAnimationFrame(() => requestAnimationFrame(() => {
            chip.style.transitionDuration = (0.6 * this.f) + 's';
            chip.style.transform = 'translate(' + (to.x - GEO.pot.x) + 'px,' + (to.y - GEO.pot.y) + 'px)';
          }));
          setTimeout(() => { chip.remove(); res(); }, 620 * this.f + 30);
        })));
        const s = $('#seat-' + a.seat);
        s.classList.add('winner');
        if (hn) s.querySelector('.hand-label').classList.add('win');
      }
      const names = awards.map((a) => (game.players[a.seat].isHuman ? 'You' : game.players[a.seat].name));
      const total = awards.reduce((s, a) => s + a.amount, 0);
      const potName = nPots > 1 ? (potIdx === 0 ? ' the main pot' : ' side pot ' + potIdx) : '';
      const verb = names.length > 1 ? 'split' : (names[0] === 'You' ? 'win' : 'wins');
      this.showBanner(names.join(' & ') + ' ' + verb + potName + ' ' + money(total), hn ? hn.short + ' — ' + hn.long : 'Uncontested');
      if (awards.some((a) => a.seat === 0)) Sound.win(); else Sound.chip();
      await Promise.all(proms);
      this.update(game, {});
      $('#pot').classList.add('empty');
      await this.wait(nPots > 1 ? 1300 : 500);
    }

    showBanner(text, sub) {
      const b = $('#banner');
      b.innerHTML = escapeHTML(text) + (sub ? '<small>' + escapeHTML(sub) + '</small>' : '');
      b.classList.add('show');
    }
    hideBanner() { $('#banner').classList.remove('show'); }

    log(text, cls) {
      this.logLines.push({ text, cls });
      if (this.logLines.length > 300) this.logLines.shift();
      const el = document.createElement('div');
      el.textContent = text;
      if (cls) el.className = cls;
      const log = $('#log');
      log.appendChild(el);
      while (log.children.length > 220) log.removeChild(log.firstChild);
      log.scrollTop = log.scrollHeight;
      if (this.drawerTab === 'log') {
        const live = $('#drawer-body .log-live');
        if (live) {
          const d = el.cloneNode(true);
          live.appendChild(d);
          const body = $('#drawer-body');
          body.scrollTop = body.scrollHeight;
        }
      }
    }

    /* ---------- human input ---------- */
    clearButtons() { $('#action-btns').innerHTML = ''; $('#action-msg').textContent = ''; this.keyHandler = null; }

    requestAction(game, p, opts) {
      if (game.allSeats) return this.handOff(game, p).then(() => this.askAction(game, p, opts));
      return this.askAction(game, p, opts);
    }
    askAction(game, p, opts) {
      if (this.preAction && !game.allSeats) {
        const pa = this.preAction;
        this.preAction = null;
        this.renderPre();
        if (pa === 'fastfold') return Promise.resolve({ type: 'fold', forceFold: true });
        if (pa === 'checkfold') return Promise.resolve(opts.canCheck ? { type: 'check' } : { type: 'fold' });
        if (pa === 'callany') return Promise.resolve({ type: opts.canCheck ? 'check' : 'call' });
      }
      Sound.turn();
      return new Promise((resolve) => {
        const done = (a) => { this.clearButtons(); this.renderPre(); resolve(a); };
        const box = $('#action-btns');
        box.innerHTML = '';
        $('#pre-actions').innerHTML = '';
        const mk = (cls, label, sub, key, fn, disabled) => {
          const b = document.createElement('button');
          b.className = 'abtn ' + cls;
          b.innerHTML = label + (sub ? '<small>' + sub + '</small>' : '') + '<kbd>' + key + '</kbd>';
          b.disabled = !!disabled;
          b.onclick = fn;
          box.appendChild(b);
          return b;
        };
        mk('fold', 'Fold', '', 'F', () => done({ type: 'fold', forceFold: true }), opts.canCheck);
        if (opts.canCheck) mk('call', 'Check', '', 'C', () => done({ type: 'check' }));
        else mk('call', 'Call', money(opts.toCall) + (opts.allInCall ? ' all-in' : ''), 'C', () => done({ type: 'call' }));
        const capWord = (opts.betLevel + 1 >= 4 && !opts.headsUp) ? 'Cap' : 'Raise';
        if (opts.isBet) mk('raise', 'Bet', money(opts.raiseTo), 'R', () => done({ type: 'raise' }), !opts.canRaise);
        else mk('raise', opts.canRaise ? capWord : 'Raise', opts.canRaise ? 'to ' + money(opts.raiseTo) : 'capped', 'R', () => done({ type: 'raise' }), !opts.canRaise);
        $('#action-msg').textContent = (game.allSeats ? this.seatName(game, p) + ' · ' : '') + 'Pot ' + money(opts.pot) + (opts.toCall ? ' · to call ' + money(opts.toCall) : '') + (opts.betLevel ? ' · ' + opts.betLevel + (opts.betLevel === 1 ? ' bet' : ' bets') : '');
        this.keyHandler = (k) => {
          if (k === 'f' && !opts.canCheck) done({ type: 'fold', forceFold: true });
          else if (k === 'c' || k === ' ') done({ type: opts.canCheck ? 'check' : 'call' });
          else if (k === 'r' && opts.canRaise) done({ type: 'raise' });
        };
      });
    }

    renderPre() {
      const g = this.game;
      const box = $('#pre-actions');
      if (!g || !box) return;
      const p = g.players[0];
      const myTurn = $('#seat-0').classList.contains('turn');
      const show = !g.allSeats && g.handNo > 0 && p.isHuman && p.hand.length === 5 && !p.folded && !p.allIn && !g.inDraw && !myTurn && g.activePlayers().length > 1 && !g.handOver;
      if (!show || this.ff || $('#action-btns').children.length) { box.innerHTML = ''; return; }
      const items = [['checkfold', 'Check / Fold'], ['callany', 'Check / Call any']];
      if (this.settings.zoom !== false) items.push(['fastfold', 'Fold now']); // Zoom: fold out of turn and move on at once
      box.innerHTML = '';
      for (const [k, lbl] of items) {
        const d = document.createElement('div');
        d.className = 'pre' + (this.preAction === k ? ' on' : '');
        d.innerHTML = '<span class="box"></span>' + lbl;
        d.onclick = () => { if (k === 'fastfold') { this.fastFold(); return; } this.preAction = this.preAction === k ? null : k; this.renderPre(); };
        box.appendChild(d);
      }
    }

    // Zoom fast fold: the user is out of this hand now, so everything up to their turn (where the
    // fold is made) and the rest of the hand plays out instantly, then the next hand is dealt.
    fastFold() {
      const g = this.game;
      if (!g || g.handOver || this.settings.zoom === false) return;
      this.preAction = 'fastfold';
      g.fastForward = true;
      this.setFastForward(true);
    }

    /* ---------- play every seat ---------- */
    seatName(game, p) { return (p.isHuman ? 'You' : p.name) + ' (' + game.posName(p.seat) + ')'; }
    renderFocusTag(game) {
      const ft = $('#focus-tag');
      if (!ft) return;
      const on = !!(game && game.allSeats && this.focusSeat >= 0);
      ft.classList.toggle('show', on);
      if (on) { const fp = game.players[this.focusSeat]; ft.textContent = fp.isHuman ? 'Your seat (' + game.posName(fp.seat) + ')' : 'Playing ' + this.seatName(game, fp); }
    }
    // Hand the table to the next seat: every hand is face down while the turn passes, then only
    // the acting seat's cards are turned up. With "Tap to show cards" on, wait for a tap first.
    async handOff(game, p) {
      const same = this.lastFocus === p.seat;
      this.lastFocus = p.seat;
      this.focusSeat = -1;
      this.heroSel.clear();
      this.renderHero(game);
      this.renderFocusTag(game);
      if (!same) {
        // turn the table so the acting seat sits at the bottom (everyone keeps their place around it)
        if (this.fixedView) this.setGlow(p.seat);
        else if (this.viewSeat !== p.seat) {
          await this.flush();
          this.viewSeat = p.seat;
          this.heroOrderCache = null;
          document.body.classList.add('turning');
          this.relayout();
          setTimeout(() => document.body.classList.remove('turning'), 500);
        }
        const who = this.seatName(game, p);
        if (this.settings.tapToShow) {
          this.showBanner('Pass to ' + who, 'Cards are hidden until you tap Show cards');
          await new Promise((resolve) => {
            const box = $('#action-btns');
            box.innerHTML = '';
            $('#pre-actions').innerHTML = '';
            $('#action-msg').textContent = who + ' to act';
            const b = document.createElement('button');
            b.className = 'abtn deal';
            b.innerHTML = 'Show cards<small>' + escapeHTML(who) + '</small><kbd>Space</kbd>';
            const go = () => { this.clearButtons(); resolve(); };
            b.onclick = go;
            box.appendChild(b);
            this.keyHandler = (k) => { if (k === ' ' || k === 'enter') go(); };
          });
        } else {
          this.showBanner(who + ' to act', 'Cards hidden while the turn passes');
          await new Promise((r) => setTimeout(r, Math.max(150, 650 * this.f)));
        }
        this.hideBanner();
      }
      if (this.fixedView) {
        this.setGlow(p.seat);
        if (p.seat !== this.viewSeat) $('#seat-' + p.seat + ' .cards').innerHTML = ''; // its cards move to the big area
      }
      this.focusSeat = p.seat;
      this.renderHero(game);
      this.renderFocusTag(game);
      this.refreshSelectable(game);
    }

    toggleSelect(el) {
      if (!$('#hero-cards').classList.contains('selectable') || el.dataset.card === undefined) return;
      const c = +el.dataset.card;
      if (this.heroSel.has(c)) this.heroSel.delete(c); else this.heroSel.add(c);
      el.classList.toggle('sel', this.heroSel.has(c));
      Sound.card();
      if (this.updateDrawButtons) this.updateDrawButtons();
      if (this.game) this.renderHeroLabel(this.game);
    }
    toggleByPosition(n) {
      const els = $$('#hero-cards .card').sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left));
      if (els[n - 1]) this.toggleSelect(els[n - 1]);
    }

    requestDraw(game, p) {
      if (game.allSeats) return this.handOff(game, p).then(() => this.askDraw(game, p));
      return this.askDraw(game, p);
    }
    askDraw(game, p) {
      Sound.turn();
      return new Promise((resolve) => {
        const hc = $('#hero-cards');
        this.drawMode = true;
        hc.classList.add('selectable');
        $$('.card', hc).forEach((c) => c.classList.toggle('sel', this.heroSel.has(+c.dataset.card)));
        const box = $('#action-btns');
        $('#pre-actions').innerHTML = '';
        box.innerHTML = '';
        const k = game.drawRound;
        const others = game.activePlayers().filter((q) => q !== p).map((q) => {
          const n = q.draws[k];
          return (q.isHuman ? 'You' : q.name) + ' ' + (n === undefined ? '…' : n === 0 ? 'pat' : n);
        });
        $('#action-msg').textContent = (game.allSeats ? this.seatName(game, p) + ' · ' : '') + ['1st', '2nd', '3rd'][k] + ' draw · tap cards to discard · ' + others.join(' · ');
        const done = () => {
          const idx = $$('.card.sel', hc).map((e) => +e.dataset.hi);
          this.drawMode = false;
          this.heroSel.clear();
          hc.classList.remove('selectable');
          this.clearButtons();
          this.updateDrawButtons = null;
          resolve(idx);
        };
        const pat = document.createElement('button');
        pat.className = 'abtn pat';
        pat.innerHTML = 'Stand Pat<small>or tap cards to discard</small><kbd>P</kbd>';
        pat.onclick = () => { $$('.card', hc).forEach((c) => c.classList.remove('sel')); this.heroSel.clear(); done(); };
        const draw = document.createElement('button');
        draw.className = 'abtn draw';
        box.appendChild(pat); box.appendChild(draw);
        draw.onclick = done;
        // one button at a time: Stand Pat while no cards are marked, otherwise Draw N
        this.updateDrawButtons = () => {
          const n = $$('.card.sel', hc).length;
          draw.innerHTML = 'Draw ' + n + '<small>discard ' + (n === 1 ? 'the marked card' : 'the ' + n + ' marked cards') + '</small><kbd>D</kbd>';
          draw.style.display = n ? '' : 'none';
          pat.style.display = n ? 'none' : '';
        };
        this.updateDrawButtons();
        this.keyHandler = (key) => {
          const n = $$('.card.sel', hc).length;
          if (key === 'p' && n === 0) pat.click();
          else if (key === 'd' && n > 0) done();
          else if (key === 'enter') { if (n > 0) done(); else pat.click(); }
        };
      });
    }

    onKey(e) {
      if ($('#modal-root').classList.contains('show')) {
        if (e.key === 'Escape' && this.modalClose) this.modalClose();
        return;
      }
      const k = e.key.toLowerCase();
      if (k >= '1' && k <= '5' && k.length === 1) { this.toggleByPosition(+k); return; }
      if (this.keyHandler) { this.keyHandler(k); if (k === ' ') e.preventDefault(); }
      else if (k === 'f' && this.settings.zoom !== false && $('#pre-actions').children.length) this.fastFold(); // Zoom: F folds now, before your turn
      if (k === 'escape') this.toggleDrawer(null);
    }

    /* ---------- between hands ---------- */
    async betweenHands(game) {
      this.flushTopUp(game);
      if (this.ff) return; // Zoom: deal the next hand immediately
      const autoMs = 2600;
      return new Promise((resolve) => {
        let finished = false;
        let t = null;
        const go = () => { if (finished) return; finished = true; this.clearButtons(); clearTimeout(t); resolve(); };
        const box = $('#action-btns');
        box.innerHTML = '';
        $('#pre-actions').innerHTML = '';
        const pause = document.createElement('button');
        pause.className = 'abtn neutral';
        const b = document.createElement('button');
        b.className = 'abtn deal';
        b.innerHTML = 'Deal<small>next hand</small><kbd>Space</kbd>';
        b.onclick = go;
        box.appendChild(pause); box.appendChild(b);
        const setAuto = () => {
          clearTimeout(t);
          if (this.settings.autoDeal) {
            t = setTimeout(go, Math.max(1100, autoMs * this.f));
            pause.innerHTML = 'Pause<small>stop auto-deal</small>';
            $('#action-msg').textContent = 'Next hand deals automatically…';
          } else {
            pause.innerHTML = 'Auto-deal<small>is off</small>';
            $('#action-msg').textContent = 'Tap Deal when ready.';
          }
        };
        pause.onclick = () => { this.settings.autoDeal = !this.settings.autoDeal; this.saveSettings(); setAuto(); };
        setAuto();
        this.keyHandler = (k) => { if (k === ' ' || k === 'enter' || k === 'd') go(); };
      });
    }

    flushTopUp(game) {
      if (!this.pendingTopUp) return;
      this.pendingTopUp = false;
      const p = game.players[0];
      const add = game.stakes.buyin - p.stack;
      if (add > 0) { game.rebuy(p, add); this.update(game, {}); }
    }
    addChips() {
      const g = this.game;
      if (!g) return;
      const p = g.players[0];
      const add = g.stakes.buyin - p.stack;
      if (add <= 0) return;
      this.modal('<h2>Add Chips</h2><div class="sub">Top up your stack</div><p style="text-align:center">Add <b>' + money(add) + '</b> to bring your stack back to ' + money(g.stakes.buyin) + '. ' + (g.handInProgress ? 'Chips are added after the current hand.' : '') + '</p>',
        [['Add ' + money(add), () => { if (g.handInProgress) { this.pendingTopUp = true; this.toast('Chips will be added after this hand'); } else { g.rebuy(p, add); this.update(g, {}); } }], ['Cancel', null, true]]);
    }
    toast(msg) { this.showBanner(msg, ''); setTimeout(() => this.hideBanner(), 1600); }
    onBust(game, p) {
      return new Promise((resolve) => {
        const amt = game.stakes.buyin;
        this.modal('<svg class="crest"><use href="#crest"/></svg><h2>Out of Chips</h2><div class="sub">The seat is yours to keep</div><p style="text-align:center">Rebuy for ' + money(amt) + ' to keep playing. Your session result keeps counting every buy-in.</p>',
          [['Rebuy ' + money(amt), () => { game.rebuy(p, amt); this.update(game, {}); resolve(); }]], false);
      });
    }

    async handFinished(game, rec) {
      this.setTurn(game, -1);
      this.reviewIndex = 0;
      const diff = (rec.coach || []).filter((n) => n.verdict === 'differs').length;
      const btn = $('#tb-review');
      let badge = btn.querySelector('.badge');
      if (!badge) { badge = document.createElement('span'); badge.className = 'badge'; btn.appendChild(badge); }
      badge.textContent = diff;
      badge.title = diff ? diff + ' decision' + (diff > 1 ? 's' : '') + ' where the AI would have played differently' : '';
      badge.style.display = diff ? '' : 'none';
      if (this.drawerTab && this.drawerTab !== 'log') this.renderDrawer();
      this.renderHeroLabel(game);
      if (this.onHandDone) this.onHandDone(game, rec);
    }

    /* ---------- drawer ---------- */
    toggleDrawer(tab, force) {
      const d = $('#drawer');
      if (!tab || (this.drawerTab === tab && !force)) { this.drawerTab = null; d.classList.remove('open'); this.markToolbar(); return; }
      this.drawerTab = tab;
      d.classList.add('open');
      this.renderDrawer();
      this.markToolbar();
    }
    markToolbar() {
      ['review', 'log', 'history', 'stats'].forEach((t) => $('#tb-' + t).classList.toggle('on', this.drawerTab === t));
      $$('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === this.drawerTab));
    }
    renderDrawer() {
      const body = $('#drawer-body');
      const g = this.game;
      if (!g) return;
      if (this.drawerTab === 'history') body.innerHTML = this.historyHTML(g);
      else if (this.drawerTab === 'stats') body.innerHTML = this.statsHTML(g);
      else if (this.drawerTab === 'log') {
        body.innerHTML = '<div class="log-live">' + this.logLines.map((l) => '<div class="' + (l.cls || '') + '">' + escapeHTML(l.text) + '</div>').join('') + '</div>';
        body.scrollTop = body.scrollHeight;
      } else body.innerHTML = this.reviewHTML(g);
      $$('.hh-sum', body).forEach((el) => (el.onclick = () => el.parentElement.classList.toggle('open')));
      const sel = $('#rv-select', body);
      if (sel) sel.onchange = () => { this.reviewIndex = +sel.value; this.renderDrawer(); };
      const ns = $('#btn-new-session', body);
      if (ns) ns.onclick = () => this.resetSession();
    }

    historyHTML(g) {
      if (!g.history.length) return '<div class="rv-empty">No hands played yet.</div>';
      return g.history.map((h) => {
        const me = h.players[0];
        const winners = Object.keys(h.results.winners).map((s) => (+s === 0 ? 'You' : h.players[s].name));
        const net = me.net;
        const lines = h.log.map((l) => '<div class="' + (l.cls || '') + '">' + escapeHTML(l.text) + '</div>').join('');
        return '<div class="hh-item"><div class="hh-sum"><span><span class="n">#' + h.handNo + '</span> · ' + (h.game ? TD.GAME_INFO[h.game].short + ' · ' : '') + (h.allSeats ? 'every seat · ' : '') + me.pos + ' · ' + miniCards(me.start) + ' → ' + (me.folded ? '<span class="muted">folded</span>' : miniCards(me.final)) +
          '</span><span class="r ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '') + '">' + (net > 0 ? '+' : '') + money(net) + '</span></div>' +
          '<div class="hh-log"><div class="muted">Won by ' + escapeHTML(winners.join(' & ')) + '</div>' + lines + '</div></div>';
      }).join('');
    }

    reviewHTML(g) {
      if (!g.history.length) return '<div class="rv-empty">After each hand you will see every computer decision with the strategy note behind it, plus how each of your own decisions compares with the AI.</div>';
      const idx = Math.min(this.reviewIndex, g.history.length - 1);
      const h = g.history[idx];
      const opts = g.history.slice(0, 30).map((x, i) => '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>Hand #' + x.handNo + (x.game ? ' · ' + TD.GAME_INFO[x.game].short : '') + '</option>').join('');
      let html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap"><select class="sel-hand" id="rv-select">' + opts + '</select><span class="muted" style="font-size:13px">Study mode — all hole cards are revealed after the hand.</span></div>';
      const streetName = (n) => (n.phase === 'draw' ? 'Draw ' + n.street : ['Predraw', 'Bet · D1', 'Bet · D2', 'River'][n.street]);
      const HG = TD.forGame(h.game || TD.GAME);
      html += '<div class="muted" style="font-size:13px;margin-bottom:6px">' + HG.gameInfo.name + '</div>';
      if (HG.IS_A5) html += '<div class="muted" style="font-size:13px;margin-bottom:8px">A-5 note: predraw hand choice, pat hands and snow/bluff frequencies follow your SS2 A-5 notes. Later-street play uses the 2-7 playbook moved down one rank (an A-5 six plays like a 2-7 seven), with real A-5 draw odds and showdowns, so MMG and Notes tags there refer to the 2-7 material.</div>';
      html += this.coachHTML(h, streetName);
      const saw = (pl) => pl.draws.length > 0;
      const order = h.players.slice().sort((a, b) => (saw(b) - saw(a)) || ((a.seat === 0 ? 1 : 0) - (b.seat === 0 ? 1 : 0)) || a.seat - b.seat);
      const folds = [];
      for (const pl of order) {
        const notes = h.review.filter((n) => n.seat === pl.seat);
        if (!saw(pl) && pl.folded) {
          folds.push('<div class="rv-line"><span class="st">' + pl.pos + '</span><b>' + (pl.isHuman ? 'You' : escapeHTML(pl.name)) + '</b> ' + miniCards(pl.start) + (notes[0] ? ' <span class="muted">— ' + escapeHTML(notes[notes.length - 1].reason) + '</span>' : ' <span class="muted">— folded</span>') + '</div>');
          continue;
        }
        let s = '<div class="rv-player"><div class="rv-head"><span class="nm">' + (pl.isHuman ? 'You' : escapeHTML(pl.name)) + '</span><span class="ps">' + pl.pos + '</span>' +
          '<span class="net ' + (pl.net > 0 ? 'pos' : pl.net < 0 ? 'neg' : '') + '">' + (pl.net > 0 ? '+' : '') + money(pl.net) + '</span></div>';
        s += '<div class="rv-line"><span class="st">Dealt</span>' + miniCards(pl.start) + '</div>';
        pl.history.forEach((d) => {
          s += '<div class="rv-line"><span class="st">Draw ' + (d.drawIdx + 1) + '</span>' + (d.n === 0 ? '<b>Pat</b> ' + miniCards(d.kept) : 'kept ' + miniCards(d.kept) + ' · threw ' + miniCards(d.thrown, new Set(d.thrown)) + ' · got ' + miniCards(d.got)) + '</div>';
        });
        if (!pl.folded || pl.history.length) {
          const hn = HG.handName(pl.final);
          s += '<div class="rv-line"><span class="st">' + (pl.folded ? 'Folded' : 'Final') + '</span>' + miniCards(HG.sortForDisplay(pl.final)) + ' <span class="muted">' + hn.long + '</span></div>';
        }
        for (const n of notes) {
          const tag = n.tag ? '<span class="tagb ' + n.tag + '">' + n.tag.replace('-', ' ') + '</span>' : '';
          s += '<div class="rv-dec"><span class="st">' + streetName(n) + '</span> ' + tag + escapeHTML(n.reason) + '</div>';
        }
        html += s + '</div>';
      }
      if (folds.length) html += '<h4>Folded predraw</h4><div class="rv-player">' + folds.join('') + '</div>';
      return html;
    }

    coachHTML(h, streetName) {
      const notes = h.coach || [];
      const every = !!h.allSeats;
      const title = every ? 'Your play vs the AI · every seat' : 'Your play vs the AI';
      if (!notes.length) return '<h4>' + title + '</h4><div class="rv-player"><div class="rv-line muted">You had no decisions to make this hand.</div></div>';
      const cnt = { agree: 0, mixed: 0, differs: 0 };
      notes.forEach((n) => cnt[n.verdict]++);
      let s = '<h4>' + title + '</h4><div class="rv-player coach">';
      s += '<div class="coach-sum"><span class="vb agree">✓ ' + cnt.agree + ' same</span><span class="vb mixed">≈ ' + cnt.mixed + ' close / mixed</span><span class="vb differs">✗ ' + cnt.differs + ' different</span></div>';
      for (const n of notes) {
        const vb = n.verdict === 'agree' ? '<span class="vb agree">✓ Same as AI</span>' : n.verdict === 'mixed' ? '<span class="vb mixed">≈ ' + (n.phase === 'draw' ? 'Close' : 'AI mixes') + '</span>' : '<span class="vb differs">✗ AI differs</span>';
        const pl = every && n.seat !== undefined ? h.players[n.seat] : null;
        const as = pl ? (pl.isHuman ? 'You' : escapeHTML(pl.name)) + ' (' + pl.pos + ')' : '';
        let body = '<div class="cn-head"><span class="st">' + streetName(n) + '</span>' + (as ? '<b class="cn-seat">' + as + '</b>' : '') + vb + '</div>';
        body += '<div class="cn-line">You' + (pl && !pl.isHuman ? ' as ' + escapeHTML(pl.name) : '') + ': <b>' + escapeHTML(n.user) + '</b> &nbsp;·&nbsp; AI: <b>' + escapeHTML(n.ai) + '</b>' + (n.dist && n.verdict !== 'agree' ? ' <span class="muted">(' + escapeHTML(n.dist) + ')</span>' : '') + '</div>';
        // no simulated equity percentages here; only the comparison and exact arithmetic (the price of a call)
        if (n.phase === 'draw' && n.eqAI !== undefined && n.verdict !== 'agree') {
          body += '<div class="cn-line muted">' + (n.eqUser >= n.eqAI - 0.02 ? 'In the AI\'s simulations the two choices did about equally well.' : 'In the AI\'s simulations its choice did clearly better than yours.') + '</div>';
        }
        if (n.phase === 'bet' && n.toCall && n.potOdds && n.verdict !== 'agree') {
          const pot = n.toCall / n.potOdds - n.toCall;
          body += '<div class="cn-line muted">The price: ' + money(n.toCall) + ' to call into a ' + money(pot) + ' pot — getting ' + (pot / n.toCall).toFixed(1) + '-to-1, so a call needs ' + Math.round(n.potOdds * 100) + '% to break even.</div>';
        }
        if (n.verdict === 'agree') body += '<div class="cn-why muted">' + escapeHTML(n.why) + '</div>';
        else {
          body += '<div class="cn-why"><b>Why the AI would ' + escapeHTML(n.ai) + ':</b> ' + escapeHTML(n.why) + '</div>';
          if (n.userWhy) body += '<div class="cn-why muted"><b>When the AI does ' + escapeHTML(n.user) + ' here:</b> ' + escapeHTML(n.userWhy) + '</div>';
        }
        s += '<div class="cn cn-' + n.verdict + '">' + body + '</div>';
      }
      return s + '</div>';
    }

    statsHTML(g) {
      const me = g.players[0];
      const net = me.stack - me.buyins;
      const big = g.stakes.big;
      const bb100 = g.handNo ? (net / big) / g.handNo * 100 : 0;
      let html = '<div class="stat-cards">' +
        '<div class="stat-card"><div class="k">Hands</div><div class="v">' + g.handNo + '</div></div>' +
        '<div class="stat-card"><div class="k">Net</div><div class="v ' + (net > 0 ? 'pos' : net < 0 ? 'neg' : '') + '">' + (net > 0 ? '+' : '') + money(net) + '</div></div>' +
        '<div class="stat-card"><div class="k">BB / 100</div><div class="v ' + (bb100 > 0 ? 'pos' : bb100 < 0 ? 'neg' : '') + '">' + bb100.toFixed(1) + '</div></div>' +
        '</div>';
      const cs = g.coachStats || { agree: 0, mixed: 0, differs: 0 };
      const tot = cs.agree + cs.mixed + cs.differs;
      if (tot) {
        html += '<div class="stat-cards">' +
          '<div class="stat-card"><div class="k">Same as AI</div><div class="v pos">' + Math.round(100 * cs.agree / tot) + '%</div></div>' +
          '<div class="stat-card"><div class="k">Close / mixed</div><div class="v">' + Math.round(100 * cs.mixed / tot) + '%</div></div>' +
          '<div class="stat-card"><div class="k">AI differs</div><div class="v neg">' + Math.round(100 * cs.differs / tot) + '%</div></div>' +
          '</div><p class="muted" style="font-size:13px;margin:-4px 0 12px">Coach: ' + tot + ' of your decisions compared with the AI strategy this session.</p>';
      }
      html += '<table class="stats"><tr><th>Player</th><th>VPIP</th><th>PFR</th><th>WTSD</th><th>W$SD</th><th>Net</th><th>BB/100</th></tr>';
      for (const p of g.players) {
        const s = p.stats;
        const h = Math.max(1, s.hands);
        const n = p.stack - p.buyins;
        const b = s.hands ? (n / big) / s.hands * 100 : 0;
