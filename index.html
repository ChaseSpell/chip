      afterChange({ toast: msg, undo: true });
    },
    'po-keep': function () {
      var r = E.playoffContinue(S, now()); if (r.error) { fail(r); return; }
      afterChange({ toast: 'Keep going: ' + P(S.rr.current.a).name + ' vs ' + P(S.rr.current.b).name + '. The winner is champion.', undo: true });
    },
    'po-shoot-open': function () { openModal({ type: 'po-shootout' }); },
    'po-made': function () { shot(true); },
    'po-miss': function () { shot(false); },

    /* roster during play */
    edit: function (el) { openModal({ type: 'edit', id: +el.dataset.id }); },
    'drop-open': function (el) { openModal({ type: 'drop', id: +el.dataset.id }); },
    'drop-go': function (el) {
      var p = P(+el.dataset.id), hadPr = !!S.pr, before = tableKeys();
      var r = E.dropPlayer(S, p.id, now()); if (r.error) { modalErr(r.error); return; }
      var msg = p.name + ' dropped and finishes ' + (E.isTied(p) ? 'tied for ' : '') + E.placeText(p) + '.' + (!hadPr && S.pr ? ' Playoff rounds: ' + E.activeCount(S) + ' players left, so auto-throw has stopped.' : '') + seatedNote(before);
      if (S.phase === 'finished') msg = p.name + ' dropped. ' + P(S.champion).name + ' wins the tournament';
      closeModal(); afterChange({ toast: msg, undo: true });
    },
    'reinstate-open': function (el) { openModal({ type: 'reinstate', id: +el.dataset.id }); },

    /* menu and files */
    menu: function () { openModal({ type: 'menu' }); },
    'copy-text': function () { closeModal(); copyText(E.dashboardText(S), 'Dashboard text'); },
    'csv-results': function () { closeModal(); download(fileStem() + '-results-' + stamp() + '.csv', E.resultsCSV(S), 'text/csv'); },
    'csv-log': function () { closeModal(); download(fileStem() + '-log-' + stamp() + '.csv', E.logCSV(S), 'text/csv'); },
    'export-json': function () { closeModal(); download(fileStem() + '-backup-' + stamp() + '.json', backupText(), 'application/json'); toast('Backup file downloaded, with the colors'); },   /* without the Undo history */
    'import-pick': function () { fileInput.value = ''; fileInput.click(); },
    /* the saved tournament that couldn't be opened (see load) */
    'damaged-download': function () {
      var raw = ui.damagedRaw;
      try { raw = raw || localStorage.getItem(DAMAGED_KEY); } catch (e) { /* only the copy in memory */ }
      if (!raw) { toast('The damaged copy is no longer here.', { bad: true }); ui.damaged = false; render(); return; }
      download('chip-tournament-damaged-' + stamp() + '.json', raw, 'application/json');
      toast('Downloaded. Keep the file: it may be possible to repair it.');
    },
    'damaged-discard': function () {
      askConfirm({ title: 'Discard the damaged copy?', text: 'The tournament that couldn\'t be opened will be gone for good. Download it first if you might need it.', ok: 'Discard it', danger: true }, function () {
        try { localStorage.removeItem(DAMAGED_KEY); } catch (e) { /* ignore */ }
        ui.damaged = false; ui.damagedRaw = null; render();
      });
    },
    'newc-open': function (el) { openModal({ type: 'newc', keep: el.dataset.keep === '1' }); },
    'newc-go': function (el) {
      var keep = el.dataset.keep === '1', old = S, s = E.newState();
      s.defaultChips = old.defaultChips; s.matchMinutes = old.matchMinutes; s.plannedTables = old.plannedTables;
      s.tableNums = Array.isArray(old.tableNums) ? old.tableNums.slice() : [];
      s.playoffRounds = old.playoffRounds !== false;
      s.title = old.title || '';
      if (keep) old.players.forEach(function (p) { E.addPlayer(s, p.name, p.S); });
      S = s; ui.tab = 'tables'; ui.flips = {}; ui.consDismissed = null; ui.poDismissed = null; ui.tablesTouched = false;
      closeModal(); commit();
    },
    'title-open': function () { openModal({ type: 'title' }); },
    'end-toggle': function (el) {
      prefs.showEnd = !!el.checked; savePrefs(); showTitle();
      if (phoneLive() && S.phase !== 'registration') schedulePublish(0);   /* phones follow this switch */
      toast(prefs.showEnd ? (endText() ? 'Showing the estimated finish time.' : 'The estimated finish time shows once the tournament is running.') : 'Estimated finish time hidden.');
    },
    /* phone view */
    'phone-setup': function () { openModal({ type: 'phone-setup' }); },
    'ph-signin': function (el) {
      var m = ui.modal;
      if (!m) return;
      var keyText = String((document.getElementById('ph-key') || {}).value || '').trim();
      var cfg = keyText ? parseConfig(keyText) : { apiKey: '', db: '' };
      if (keyText && !cfg.apiKey) { modalErr('That doesn\'t look like a Firebase key. It starts with AIza, under Firebase › Project settings › General.'); return; }
      var apiKey = cfg.apiKey || phone.apiKey;
      if (!apiKey) { modalErr('Paste your Firebase key first.'); return; }
      var email = String((document.getElementById('ph-email') || {}).value || '').trim(), pw = String((document.getElementById('ph-pw') || {}).value || '');
      if (!email || !pw) { modalErr('Enter the email and password of your Firebase login.'); return; }
      if (cfg.db) m.cfgDb = cfg.db;   /* a pasted firebaseConfig block names the database: no need to look for it */
      m.email = email; el.disabled = true; el.textContent = 'Signing in…'; modalErr('');
      signIn(apiKey, email, pw).then(function () {
        el.textContent = 'Connecting…';
        return phoneConnect(m);
      }).then(function (res) { afterConnect(m, res); }, function (e) {
        el.disabled = false; el.textContent = 'Sign in and turn on';
        modalErr(e instanceof TypeError ? 'Couldn\'t reach Firebase. Check this device is online.' : ((e && e.message) || 'Sign-in didn\'t work.'));
      });
    },
    'ph-signout': function () {
      phone.refresh = ''; phone.uid = ''; phone.on = false; tok = { id: null, exp: 0 }; PUB.state = 'idle';
      savePhone(); render();
      if (ui.modal && ui.modal.type === 'phone-setup') { ui.modal.issue = ''; renderModal(); }
      toast('Signed out. Phone view is off.');
    },
    'ph-copy-rules': function () { copyText(rulesText(), 'Database rules'); },
    'ph-newcode': function () {
      askConfirm({ title: 'Make a new link?', text: 'Old QR codes and saved links will show nothing, and players will need to scan the new code.', ok: 'Make a new link' }, function () {
        var old = phone.code;
        phone.code = newLinkCode(); savePhone();
        if (phone.apiKey && phone.db && phone.refresh && old) sendToDB('DELETE', null, old).catch(function () { /* the old summary just stays behind */ });
        renderModal(); schedulePublish(0);
        toast('New link made. Show players the new QR code.');
      });
    },
    'ph-forget': function () {
      askConfirm({ title: 'Forget phone view setup?', text: 'Turn off phone view and forget this setup on this device?', ok: 'Turn off and forget', danger: true }, function () {
        phone = { on: false, apiKey: '', db: '', email: '', uid: '', refresh: '', page: '', code: '', project: '' }; tok = { id: null, exp: 0 }; PUB.state = 'idle';
        savePhone(); closeModal(); render(); toast('Phone view setup forgotten on this device.');
      });
    },
    /* signed in: Turn on, Save (after changing an address) or Check again (after publishing the rules) */
    'ph-save': function (el) {
      var m = ui.modal;
      if (!m) return;
      el.disabled = true; el.textContent = 'Checking…'; modalErr('');
      phoneConnect(m).then(function (res) { afterConnect(m, res); });
    },
    'phone-toggle': function (el) {
      phone.on = !!el.checked; savePhone(); PUB.state = 'idle';
      render(); renderModal();
      if (phone.on) schedulePublish(0);
      toast(phone.on ? 'Phone view is on.' : 'Phone view is off. Phones keep showing the last update they got.');
    },
    'qr-open': function () {
      if (!phoneReady()) { actions['phone-setup'](); return; }
      openModal({ type: 'qr' });
      checkPhonePage(false);
    },
    'phone-open-page': function () {
      var link = phoneLink(), w = null;
      try { w = window.open(link, '_blank'); } catch (e) { w = null; }
      if (!w) copyText(link, 'Phone page link');
      else { try { w.opener = null; } catch (e) { /* ignore */ } }   /* the new tab gets no handle back to this one */
    },
    'wake-toggle': function (el) {
      prefs.keepAwake = !!el.checked; savePrefs();
      if (!prefs.keepAwake) { releaseWake(); renderModal(); toast('The screen can dim and lock as usual.'); return; }
      holdWake(function (ok) {
        renderModal();
        toast(ok ? 'The screen will stay awake while the app is showing.' : 'This browser won\'t keep the screen awake. Set Auto-Lock to Never in Settings instead.', ok ? null : { bad: true });
      });
    },
    'pr-toggle': function (el) {
      var on = !!el.checked;
      if (on && E.activeCount(S) <= E.PR_MAX) { el.checked = false; openModal({ type: 'pr-confirm' }); return; }
      var r = E.setPlayoffRounds(S, on, now());
      if (r.error) { el.checked = !on; toast(r.error, { bad: true }); return; }
      if (!save()) return;
      render(); renderModal();
      toast(on ? 'Playoff rounds on. They start when ' + E.PR_MAX + ' players or fewer are left.' : 'Playoff rounds off.', { undo: true });
    },
    'pr-confirm-go': function () {
      var r = E.setPlayoffRounds(S, true, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal();
      afterChange({ toast: 'Playoff rounds on. ' + E.activeCount(S) + ' players are left, so auto-throw has stopped.', undo: true });
    },
    'colors-open': function () { openModal({ type: 'colors', sel: null }); },
    'col-scheme': function (el) {
      var src = SCHEMES[el.dataset.s]; if (!src) return;
      for (var k in src) colors[k] = src[k];
      saveColors(); applyColors(); renderModal();
    },
    'col-sel': function (el) { var m = ui.modal, k = el.dataset.k; m.sel = m.sel === k ? null : k; m.reveal = !!m.sel; renderModal(); },
    'col-pick': function (el) { if (ui.modal && ui.modal.sel) setColor(ui.modal.sel, el.dataset.c); },
    'col-def': function () { if (ui.modal && ui.modal.sel) setColor(ui.modal.sel, defaultFor(ui.modal.sel)); },
    'chip-preset': function (el) {
      var pr = CHIP_PRESETS[+el.dataset.i]; if (!pr) return;
      colors.chip = pr.chip; colors.chiprim = pr.chiprim; saveColors(); applyColors(); renderModal();
    },
    'toast-close': function () { clearTimeout(ui.toastTimer); toastRoot.innerHTML = ''; },
    'm-close': function () { closeModal(); },
    scrim: function (el, e) { if (e.target === el) closeModal(); }
  };

  var forms = {
    add: function (form) {
      var r = E.addPlayer(S, form.elements.name.value, S.defaultChips);
      if (r.error) { toast(r.error, { bad: true }); return; }
      ui.draftName = ''; commit();
      var n = document.getElementById('name-in'); if (n) n.focus();
    },
    edit: function (form) {
      var id = +form.dataset.id, p = P(id), patch = {};
      var name = form.elements.name.value, c = form.elements.C.value, s2 = form.elements.S.value;
      if (E.normName(name) !== p.name) patch.name = name;
      if (String(c).trim() !== '' && parseInt(c, 10) !== p.C) patch.C = c;
      if (String(s2).trim() !== '' && parseInt(s2, 10) !== p.S) patch.S = s2;
      if (!Object.keys(patch).length) { closeModal(); return; }
      var hadPr = !!S.pr, before = tableKeys();
      var r = E.editPlayer(S, id, patch, now());
      if (r.error) { modalErr(r.error); return; }
      var msg = 'Saved.' + (!hadPr && S.pr ? ' Playoff rounds: ' + E.activeCount(S) + ' players left, so auto-throw has stopped.' : '') + seatedNote(before);
      if (S.phase === 'finished') msg = 'Saved. ' + P(S.champion).name + ' wins the tournament';
      closeModal(); afterChange({ toast: msg, undo: true });
    },
    reinstate: function (form) {
      var id = +form.dataset.id;
      var r = E.reinstate(S, id, form.elements.chips.value, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: P(id).name + ' reinstated', undo: true });
    },
    addtable: function (form) {
      var before = tableKeys();
      var r = E.addTable(S, now(), form.elements.num.value);
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: 'Table ' + r.table + ' added.' + seatedNote(before), undo: true });
    },
    title: function (form) {
      S.title = String(form.elements.title.value).replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!save()) return;
      closeModal(); render(); toast(S.title ? 'Title saved' : 'Title cleared');
    },
    'col-hex': function (form) {
      var v = normHex(form.querySelector('#col-hex').value);
      if (!v) { modalErr('Enter a HEX code like #1A4A31 or 1A4A31.'); return; }
      if (ui.modal && ui.modal.sel) setColor(ui.modal.sel, v);
    },
    'po-shootout': function (form) {
      var rr = S.rr, allowed = {};
      if (!rr) { closeModal(); return; }
      rr.order.forEach(function (id) { allowed[id] = form.elements['al-' + id].value; });
      var r = E.startShootout(S, allowed, now());
      if (r.error) { modalErr(r.error); return; }
      closeModal(); afterChange({ toast: 'Spot shot shootout. ' + P(S.rr.order[0]).name + ' shoots first.', undo: true });
    },
    'throw-empty': function (form) {
      var n = +form.dataset.n, a = +form.elements.p1.value, b = +form.elements.p2.value;
      if (ui.modal && ui.modal.type === 'throw') { ui.modal.p1 = a; ui.modal.p2 = b; }   /* kept if the question below is cancelled */
      if (a === b) { modalErr('Pick two different players.'); return; }
      var go = function () {
        var r = E.throwMatch(S, n, a, b, now());
        if (r.error) { modalErr(r.error); return; }
        closeModal(); afterChange({ toast: 'Match thrown on Table ' + n, undo: true });
      };
      if (!E.canPair(S, a, b)) askConfirm({ title: 'Throw the rematch?', text: 'Those two just played each other. Throw the rematch anyway?', ok: 'Throw the rematch' }, go);
      else go();
    }
  };

  /* ---------- events ---------- */
  /* A form's submit button (and Enter in one of its boxes, which presses that button) runs the form here, on the click,
     instead of through the browser's form submit. Some viewers block form submits without any message (a file
     previewed inside another app, for one), which left those buttons doing nothing. */
  function runForm(form) {
    var fn = forms[form.getAttribute('data-form')];
    if (fn) fn(form);
  }
  document.addEventListener('click', function (e) {
    var sb = e.target.closest('button[type="submit"]');
    var sf = sb && sb.closest('[data-form]');
    if (sf) { e.preventDefault(); runForm(sf); return; }
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = actions[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  });
  document.addEventListener('submit', function (e) {   /* any submit that still gets through */
    var form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    runForm(form);
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-input');
    if (k === 'name') ui.draftName = e.target.value;
    else if (k === 'mm') {
      S.matchMinutes = e.target.value; save();
      var est = document.getElementById('est');
      if (est) est.innerHTML = estHTML(plannedTables());
    } else if (k === 'batch') {
      ui.batchText = e.target.value;
      var pv = document.getElementById('batch-preview'); if (pv) pv.innerHTML = batchPreview(ui.batchText);
    } else if (k === 'tnum') {
      /* table numbers: save as typed, and update the Draw and start check without redrawing (so typing is not interrupted) */
      var nums = plannedNums();
      nums[+e.target.getAttribute('data-i')] = e.target.value;
      S.tableNums = nums; save();
      var problem = regProblem(), pr = document.getElementById('problem');
      if (pr) pr.textContent = problem;
      var sb = app.querySelector('[data-act="start-open"]');
      if (sb) sb.disabled = !!problem || !S.players.length;
    } else if (k === 'po-table') {
      if (ui.modal) ui.modal.table = +e.target.value;
    } else if (k === 'pr-table') {
      if (ui.modal && ui.modal.tables) ui.modal.tables[+e.target.getAttribute('data-i')] = e.target.value === '' ? null : +e.target.value;
    } else if (k === 'title') {
      S.title = e.target.value.slice(0, 60); save(); showTitle();
    } else if (k === 'pr-opt') {
      S.playoffRounds = !!e.target.checked; commit();
    } else if (k === 'ph-key' || k === 'ph-email' || k === 'ph-db' || k === 'ph-page') {
      /* kept with the pop-up so a redraw doesn't lose what was typed (the key is saved only once a sign-in works) */
      if (ui.modal && ui.modal.type === 'phone-setup') ui.modal[k.slice(3)] = e.target.value;
    }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-input');
    if (k === 'po-table' && ui.modal) ui.modal.table = +e.target.value;
    if (k === 'pr-table' && ui.modal && ui.modal.tables) ui.modal.tables[+e.target.getAttribute('data-i')] = e.target.value === '' ? null : +e.target.value;
    if (k === 'pr-opt' && S.playoffRounds !== !!e.target.checked) { S.playoffRounds = !!e.target.checked; commit(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && ui.modal) closeModal();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.hasAttribute('data-act')) {
      e.preventDefault();
      var fn = actions[e.target.getAttribute('data-act')];
      if (fn) fn(e.target, e);
    }
  });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    /* a backup for a whole night is well under a megabyte: anything this big isn't one, and reading it could freeze the app */
    if (f.size > E.MAX_FILE) { toast('That file is too big to be a tournament backup.', { bad: true }); return; }
    var rd = new FileReader();
    rd.onerror = function () { toast('That file couldn\'t be read.', { bad: true }); };
    rd.onload = function () {
      var s, cols;
      try { s = E.deserialize(String(rd.result)); }
      catch (err) {
        toast(err && err.damaged ? 'That backup is damaged (' + String(err.message).replace(/^This tournament is damaged: /, '') + '), so it wasn\'t loaded.' : 'That file is not a tournament backup.', { bad: true });
        return;
      }
      s.undo = [];   /* backups never carry Undo steps; a file that does was made elsewhere, and its steps can't be trusted */
      cols = backupColors(s);
      delete s.colors;   /* the colors are this device's setting, not part of the tournament */
      delete s.wd; delete s.wdNo;   /* answers to players' withdrawal requests, from versions that had them */
      askConfirm({ title: 'Load this backup?', text: 'Replace the current tournament with this backup (' + plural(s.players.length, 'player') + ')?' +
        (cols ? ' Its colors replace the colors on this device too.' : ''), ok: 'Replace', danger: true }, function () {
        ui.rev = readRev();   /* a backup replaces whatever is saved, even a newer version from another tab */
        S = s; ui.tablesTouched = true; ui.flips = {}; ui.consDismissed = null; ui.poDismissed = null; ui.prDismissed = null;
        if (cols) { colors = cols; saveColors(); applyColors(); }
        E.ensureAuto(S, now());   /* a backup from an earlier version with auto-throw paused */
        closeModal(); commit(); toast(cols ? 'Backup loaded, with its colors' : 'Backup loaded');
      });
    };
    rd.readAsText(f);
  });

  /* keep the "min" counters on running matches fresh, and their colors (amber past 1.5 times the average match, red past 2 times) */
  setInterval(function () {
    if (document.hidden) return;
    var els = document.querySelectorAll('.elapsed[data-since]');
    for (var i = 0; i < els.length; i++) {
      var since = +els[i].getAttribute('data-since');
      els[i].textContent = elapsed(since);
      els[i].className = 'elapsed' + clockClass(since);
    }
    if (prefs.showEnd && S.phase === 'active') refreshEnd();   /* a minute later the finish time may move (matches running long) */
  }, 20000);
  /* another tab or window saved: show its version right away */
  window.addEventListener('storage', function (e) {
    if (e.key === REV_KEY) { if (e.newValue !== ui.rev) adoptStored(false); }
    else if (e.key === COLOR_KEY) { colors = loadColors(); applyColors(); if (ui.modal && ui.modal.type === 'colors') renderModal(); }
    else if (e.key === PREF_KEY) { loadPrefs(); if (prefs.keepAwake) holdWake(); else releaseWake(); showTitle(); }
    else if (e.key === PHONE_KEY) { loadPhone(); tok = { id: null, exp: 0 }; render(); }
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (!catchUp() && !ui.modal) render();
    holdWake();   /* the browser lets go of the screen when the page is hidden */
    if (phoneLive() && PUB.state !== 'ok') schedulePublish(500);
  });
  window.addEventListener('pageshow', function (e) { if (e.persisted) catchUp(); });
  window.addEventListener('focus', function () { catchUp(); });
  /* some browsers only keep the screen awake after a tap on the page */
  document.addEventListener('pointerdown', function () { if (prefs.keepAwake && !wake.lock) holdWake(); }, true);

  if (E.ensureAuto(S, now())) save();   /* saved by an earlier version with auto-throw paused */
  render();
  maybePrompt();
  holdWake();
  /* phone view: catch phones up after a reload, keep them posted while playing, and retry as soon as the internet is back */
  if (phoneLive() && S.phase !== 'registration') schedulePublish(1500);
  setInterval(heartbeat, 60000);
  window.addEventListener('online', function () { if (phoneLive()) schedulePublish(500); });
})();

</script>
</body>
