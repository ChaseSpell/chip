        html += '<tr class="' + (p.isHuman ? 'me' : '') + '"><td>' + (p.isHuman ? 'You' : escapeHTML(p.name)) + '</td><td>' + Math.round(100 * s.vpip / h) + '%</td><td>' + Math.round(100 * s.pfr / h) + '%</td><td>' + Math.round(100 * s.showdowns / h) + '%</td><td>' + (s.showdowns ? Math.round(100 * s.sdWins / s.showdowns) + '%' : '—') +
          '</td><td class="' + (n > 0 ? 'pos' : n < 0 ? 'neg' : '') + '">' + (n > 0 ? '+' : '') + money(n) + '</td><td>' + b.toFixed(1) + '</td></tr>';
      }
      html += '</table><p class="muted" style="font-size:13px;margin-top:10px">Stakes ' + money(g.stakes.sb) + '/' + money(g.stakes.bb) + ' blinds, ' + money(g.stakes.small) + '/' + money(g.stakes.big) + ' limit, ' + money(g.stakes.buyin) + ' stacks. BB/100 = big bets (' + money(big) + ') won per 100 hands. VPIP = voluntarily put money in predraw. PFR = predraw raise. WTSD = went to showdown. W$SD = won at showdown. Your rebuys: ' + me.stats.rebuys + '.</p>';
      html += '<div class="row" style="justify-content:flex-start;margin-top:14px;display:flex"><button class="mbtn ghost" id="btn-new-session">Start a new session</button></div>';
      return html;
    }

    /* ---------- modals ---------- */
    modal(html, buttons, closable = true, wide = false) {
      const root = $('#modal-root');
      root.innerHTML = '<div class="modal' + (wide ? ' wide' : '') + '">' + html + '<div class="row modal-actions"></div></div>';
      const row = root.querySelector('.modal-actions');
      const close = () => { root.classList.remove('show'); root.innerHTML = ''; this.modalClose = null; };
      (buttons || []).forEach(([label, fn, ghost, keepOpen]) => {
        const b = document.createElement('button');
        b.className = 'mbtn' + (ghost ? ' ghost' : '');
        b.textContent = label;
        b.onclick = () => { if (keepOpen) { if (fn) fn(b); return; } close(); Sound.init(); if (fn) fn(); };
        row.appendChild(b);
      });
      this.modalClose = closable ? close : null;
      root.onclick = (e) => { if (e.target === root && closable) close(); };
      root.classList.add('show');
      return root.firstChild;
    }

    showSettings() {
      const s = this.settings;
      const st = this.stakes;
      const speeds = [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast'], ['turbo', 'Turbo']];
      const sw = (k, on) => '<div class="switch' + (on ? ' on' : '') + '" data-k="' + k + '"></div>';
      const themeOpt = (k, label, bg, felt, fg) => '<button class="theme-opt' + (s.theme === k ? ' on' : '') + '" data-theme="' + k + '"><div class="sw" style="background:' + bg + '"><div style="background:' + felt + ';border-radius:20px;padding:5px 8px;display:flex;gap:3px"><span>7</span><span style="color:#d0021b">5</span><span>2</span></div></div><div style="color:' + fg + '">' + label + '</div></button>';
      const html = '<h2>Settings</h2><div class="sub">Table preferences</div>' +
        '<div class="set-group">Appearance</div>' +
        '<div class="theme-pick">' +
        themeOpt('classic', 'Classic', 'linear-gradient(180deg,#3a1714,#120706)', '#7a1627', 'inherit') +
        themeOpt('light', 'Light', '#e9edf2', '#5c9b74', 'inherit') +
        themeOpt('dark', 'Dark', '#0b0d10', '#171b21', 'inherit') + '</div>' +
        '<div class="setting"><div class="lbl">Four-colour deck<small>Blue diamonds, green clubs — easier to spot flushes</small></div>' + sw('fourColor', s.fourColor) + '</div>' +
        '<div class="set-group">Table</div>' +
        '<div class="setting"><div class="lbl">Game<small>Mix changes game every 6 hands (one orbit). A change during a hand starts with the next hand.</small></div><div class="seg" id="set-game">' +
        [['27', '2-7'], ['A5', 'A-5'], ['MIX', 'Mix']].map(([k, l]) => '<button data-k="' + k + '" class="' + (s.gameMode === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
        '<div class="setting"><div class="lbl">Stakes &amp; stacks<small>' + money(st.sb) + '/' + money(st.bb) + ' blinds · ' + money(st.small) + '/' + money(st.big) + ' limit · ' + money(st.buyin) + ' stacks</small></div><button class="mbtn ghost" id="btn-stakes" style="min-width:0;min-height:42px">Change</button></div>' +
        '<div class="setting"><div class="lbl">Game speed</div><div class="seg" id="set-speed">' + speeds.map(([k, l]) => '<button data-k="' + k + '" class="' + (s.speed === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
        '<div class="setting"><div class="lbl">Zoom<small>When you fold, the next hand is dealt at once (the rest plays out instantly and still shows in History and Review). Before your turn, Fold now folds straight away.</small></div>' + sw('zoom', s.zoom !== false) + '</div>' +
        '<div class="setting' + (s.zoom !== false ? ' off' : '') + '" id="set-every"><div class="lbl">Play every seat<small>You make every player\'s decisions, one seat at a time, and see only the acting seat\'s cards. The coach rates every decision. Needs Zoom off; changes apply from the next hand.</small></div>' + sw('everySeat', !!s.everySeat && s.zoom === false) + '</div>' +
        '<div class="setting' + (s.zoom !== false || !s.everySeat ? ' off' : '') + '" id="set-tap"><div class="lbl">Tap to show each seat\'s cards<small>Wait for a tap before turning up the next seat\'s cards (handy when passing the device). Off: the turn passes on its own after a short pause.</small></div>' + sw('tapToShow', !!s.tapToShow) + '</div>' +
        '<div class="setting' + (s.zoom !== false || !s.everySeat ? ' off' : '') + '" id="set-view"><div class="lbl">Seat view<small>Rotate: the table turns so the seat you\'re playing is at the bottom. Fixed: seats stay put, a glowing yellow ring marks the seat you\'re playing and its cards show at the bottom. Changes apply from the next hand.</small></div><div class="seg" id="set-seatview">' +
        [['rotate', 'Rotate'], ['fixed', 'Fixed']].map(([k, l]) => '<button data-k="' + k + '" class="' + (s.seatView === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
        '<div class="setting"><div class="lbl">Auto-deal next hand</div>' + sw('autoDeal', s.autoDeal) + '</div>' +
        '<div class="setting"><div class="lbl">Auto-muck losing hands<small>At showdown, muck when beaten by a hand already shown</small></div>' + sw('autoMuck', s.autoMuck) + '</div>' +
        '<div class="setting"><div class="lbl">Coach my decisions<small>Compare your actions and draws with the AI strategy (in Review)</small></div>' + sw('coach', s.coach !== false) + '</div>' +
        '<div class="setting"><div class="lbl">Sound effects</div>' + sw('sound', s.sound) + '</div>' +
        '<div class="setting"><div class="lbl">Rules &amp; hand rankings</div><button class="mbtn ghost" id="btn-rules" style="min-width:0;min-height:42px">Open</button></div>' +
        '<p class="muted land-only" style="font-size:13px;margin-top:14px">Keyboard: <span class="kbd">F</span> fold · <span class="kbd">C</span>/<span class="kbd">Space</span> check/call · <span class="kbd">R</span> bet/raise · <span class="kbd">1</span>–<span class="kbd">5</span> mark discards · <span class="kbd">D</span> draw · <span class="kbd">P</span> stand pat</p>';
      const m = this.modal(html, [['Done', null]]);
      $$('#set-speed button', m).forEach((b) => (b.onclick = () => { s.speed = b.dataset.k; this.saveSettings(); $$('#set-speed button', m).forEach((x) => x.classList.toggle('on', x === b)); }));
      const live = () => this.game && this.game.handInProgress;
      const syncEvery = () => {
        const zoomOn = s.zoom !== false;
        $('#set-every', m).classList.toggle('off', zoomOn);
        $('#set-tap', m).classList.toggle('off', zoomOn || !s.everySeat);
        $('#set-view', m).classList.toggle('off', zoomOn || !s.everySeat);
        $('#set-every .switch', m).classList.toggle('on', !!s.everySeat && !zoomOn);
        $('#set-tap .switch', m).classList.toggle('on', !!s.tapToShow);
      };
      $$('#set-seatview button', m).forEach((b) => (b.onclick = () => {
        if (s.zoom !== false || !s.everySeat || s.seatView === b.dataset.k) return;
        s.seatView = b.dataset.k;
        this.saveSettings();
        $$('#set-seatview button', m).forEach((x) => x.classList.toggle('on', x === b));
        if (live() && this.game.allSeats) this.toast((s.seatView === 'fixed' ? 'Fixed seats' : 'Rotating table') + ' from the next hand');
      }));
      $$('.switch', m).forEach((el) => (el.onclick = () => {
        const k = el.dataset.k;
        if (k === 'everySeat' && s.zoom !== false) { this.toast('Turn Zoom off to play every seat'); return; }
        if (k === 'tapToShow' && (s.zoom !== false || !s.everySeat)) return;
        const cur = (k === 'zoom' || k === 'coach') ? s[k] !== false : !!s[k];
        const wasEvery = !!s.everySeat && s.zoom === false;
        s[k] = !cur;
        if (k === 'zoom' && s.zoom) s.everySeat = false; // Zoom and play every seat don't mix
        el.classList.toggle('on', s[k]);
        this.saveSettings();
        if (k === 'sound') Sound.init();
        const isEvery = !!s.everySeat && s.zoom === false;
        if (k === 'zoom' || k === 'everySeat') syncEvery();
        if (wasEvery !== isEvery && live()) this.toast(isEvery ? 'Play every seat starts with the next hand' : 'Play every seat ends after this hand');
      }));
      $$('.theme-opt', m).forEach((b) => (b.onclick = () => {
        s.theme = b.dataset.theme; this.saveSettings();
        $$('.theme-opt', m).forEach((x) => x.classList.toggle('on', x === b));
      }));
      $$('#set-game button', m).forEach((b) => (b.onclick = () => { this.setGameMode(b.dataset.k); $$('#set-game button', m).forEach((x) => x.classList.toggle('on', x === b)); }));
      $('#btn-stakes', m).onclick = () => this.showStakes();
      $('#btn-rules', m).onclick = () => this.showRules();
    }

    showStakes() {
      const st = this.stakes;
      const presets = [[1, 2, 200], [5, 10, 1000], [10, 20, 2000], [20, 40, 4000], [50, 100, 10000], [100, 200, 20000], [200, 400, 40000]];
      const html = '<h2>Stakes &amp; Stacks</h2><div class="sub">Limit — the big bet is always twice the small bet</div>' +
        '<div class="stakes-grid">' +
        '<div class="field"><label for="in-bb">Big blind = small bet ($)</label><input id="in-bb" type="number" inputmode="numeric" min="1" step="1" value="' + st.bb + '"></div>' +
        '<div class="field"><label>Big bet (automatic)</label><div class="ro" id="out-big">' + money(st.big) + '</div></div>' +
        '<div class="field"><label for="in-sb">Small blind ($) — up to the big blind</label><input id="in-sb" type="number" inputmode="numeric" min="1" step="1" value="' + st.sb + '"></div>' +
        '<div class="field"><label for="in-stack">Starting stack ($)</label><input id="in-stack" type="number" inputmode="numeric" min="1" step="1" value="' + st.buyin + '"></div>' +
        '</div>' +
        '<div class="presets">' + presets.map(([sb, bb, stack]) => '<button data-sb="' + sb + '" data-bb="' + bb + '" data-stack="' + stack + '">' + money(bb) + '/' + money(bb * 2) + '</button>').join('') + '</div>' +
        '<div class="err" id="stakes-err"></div>' +
        '<p class="muted" style="font-size:13px">Changing the stakes starts a new session: every stack is reset to the starting stack and session stats are cleared.</p>';
      const m = this.modal(html, [['Start new session', (btn) => this.applyStakes(btn), false, true], ['Cancel', null, true]]);
      const inBB = $('#in-bb', m), inSB = $('#in-sb', m), inStack = $('#in-stack', m), err = $('#stakes-err', m);
      const applyBtn = m.querySelector('.modal-actions .mbtn');
      const validate = () => {
        const bb = Math.floor(+inBB.value), sb = Math.floor(+inSB.value), stack = Math.floor(+inStack.value);
        let msg = '';
        if (!(bb >= 1)) msg = 'Enter a big blind of at least $1.';
        else if (bb > 100000000) msg = 'That big blind is too large.';
        else if (!(sb >= 1)) msg = 'Enter a small blind of at least $1.';
        else if (sb > bb) msg = 'The small blind can\'t be more than the big blind (' + money(bb) + ').';
        else if (!(stack >= bb * 2)) msg = 'Starting stacks must be at least two big blinds (' + money(bb * 2) + ').';
        else if (stack > 1000000000000) msg = 'That stack is too large.';
        $('#out-big', m).textContent = bb >= 1 ? money(bb * 2) : '—';
        err.textContent = msg;
        if (!msg && stack < bb * 20) err.textContent = 'Tip: stacks under 10 big bets lead to frequent all-ins.';
        applyBtn.disabled = !!msg;
        return msg ? null : { sb, bb, buyin: stack };
      };
      [inBB, inSB, inStack].forEach((i) => (i.oninput = validate));
      $$('.presets button', m).forEach((b) => (b.onclick = () => { inBB.value = b.dataset.bb; inSB.value = b.dataset.sb; inStack.value = b.dataset.stack; validate(); }));
      this._validateStakes = validate;
      validate();
    }
    applyStakes() {
      const v = this._validateStakes && this._validateStakes();
      if (!v) return;
      $('#modal-root').classList.remove('show');
      $('#modal-root').innerHTML = '';
      this.modalClose = null;
      this.settings.stakes = TD.makeStakes(v);
      this.saveSettings();
      store.remove(TD.SESSION_KEY);
      this.resetRequested = true;
      const st = this.settings.stakes;
      this.toast('New session at ' + money(st.small) + '/' + money(st.big) + (this.game && this.game.handInProgress ? ' from the next hand' : ''));
      if (this.onStakesChanged) this.onStakesChanged();
    }

    showRules() {
      const st = this.stakes;
      if (TD.IS_A5) return this.showRulesA5(st);
      const html = '<div class="rules"><h2>Deuce-to-Seven Triple Draw</h2><div class="sub">Limit · ' + money(st.sb) + '/' + money(st.bb) + ' blinds · ' + money(st.small) + '/' + money(st.big) + '</div>' +
        '<h3>Object</h3><p>Make the <b>lowest</b> five-card hand. Aces are always <b>high</b>, and straights and flushes count against you. The best hand is 7-5-4-3-2 of mixed suits ("Number One"). A-2-3-4-5 is not a straight — it is just ace-high.</p>' +
        '<h3>The deal</h3><ul><li>Each player gets five cards face down. Small blind ' + money(st.sb) + ', big blind ' + money(st.bb) + '.</li><li>Four betting rounds with three draws between them: Predraw → Draw 1 → Bet → Draw 2 → Bet → Draw 3 → Bet → Showdown.</li><li>Bets are ' + money(st.small) + ' on the first two rounds and ' + money(st.big) + ' on the last two.</li><li>A bet and three raises is the cap with three or more players; raising is unlimited once only two players remain (if the cap was not already reached).</li><li>In each draw, players discard 0–5 cards in turn starting left of the button and receive replacements. Standing pat = drawing none.</li><li>The dealer burns one card before each draw. The last card of the stub is never dealt — it is shuffled with the discards and burn cards (not the current player\'s discards) to form a new stub.</li><li>An all-in for less than half a bet does not reopen the betting.</li></ul>' +
        '<h3>Reading the table</h3><p>The three boxes under each player show how many cards they drew on draws 1, 2 and 3 (<b>PAT</b> = stood pat). The dealer burns a card before each draw, and the burn cards tucked under the pot chips show the street: none before the first draw, one after the first draw, two after the second, three after the third. Tap (or hover over) the pot to see how many cards are left in the stub. Tap your cards at any time to mark them for the next draw.</p>' +
        '<h3>Ranking examples (best → worse)</h3><ol class="rank-list"><li>7-5-4-3-2 (the nuts)</li><li>7-6-4-3-2</li><li>7-6-5-3-2</li><li>7-6-5-4-2</li><li>8-5-4-3-2</li><li>8-6-4-3-2</li><li>8-7-6-5-3 (worst eight)</li><li>9-high, 10-high … ace-high</li><li>One pair (pair of deuces is best)</li><li>Two pair, trips, straights, flushes, full houses, quads, straight flushes</li></ol><p>7-6-5-4-3 and 8-7-6-5-4 are straights, so they lose to any no-pair hand.</p>' +
        '<h3>Showdown</h3><p>The last aggressor on the final round shows first; if it was checked through, the first player left of the button shows first. Split pots are divided evenly with odd chips to the first winner left of the button. Side pots are created for all-in players.</p></div>';
      this.modal(html, [['Close', null]], true, true);
    }

    showRulesA5(st) {
      const html = '<div class="rules"><h2>Ace-to-Five Triple Draw</h2><div class="sub">Limit · ' + money(st.sb) + '/' + money(st.bb) + ' blinds · ' + money(st.small) + '/' + money(st.big) + '</div>' +
        '<h3>Object</h3><p>Make the <b>lowest</b> five-card hand. Aces are always <b>low</b>, and straights and flushes <b>don\'t count</b>. The best hand is 5-4-3-2-A ("the wheel"), suited or not.</p>' +
        '<h3>The deal</h3><ul><li>Each player gets five cards face down. Small blind ' + money(st.sb) + ', big blind ' + money(st.bb) + '.</li><li>Four betting rounds with three draws between them: Predraw → Draw 1 → Bet → Draw 2 → Bet → Draw 3 → Bet → Showdown.</li><li>Bets are ' + money(st.small) + ' on the first two rounds and ' + money(st.big) + ' on the last two.</li><li>A bet and three raises is the cap with three or more players; raising is unlimited once only two players remain (if the cap was not already reached).</li><li>In each draw, players discard 0–5 cards in turn starting left of the button and receive replacements. Standing pat = drawing none.</li><li>The dealer burns one card before each draw. The last card of the stub is never dealt — it is shuffled with the discards and burn cards (not the current player\'s discards) to form a new stub.</li><li>An all-in for less than half a bet does not reopen the betting.</li></ul>' +
        '<h3>Reading the table</h3><p>The three boxes under each player show how many cards they drew on draws 1, 2 and 3 (<b>PAT</b> = stood pat). The burn cards tucked under the pot chips show the street. Tap (or hover over) the pot to see how many cards are left in the stub. Tap your cards at any time to mark them for the next draw.</p>' +
        '<h3>Ranking examples (best → worse)</h3><ol class="rank-list"><li>5-4-3-2-A (the wheel, the nuts)</li><li>6-4-3-2-A</li><li>6-5-3-2-A</li><li>6-5-4-3-2</li><li>7-4-3-2-A</li><li>7-6-5-4-3 (worst seven)</li><li>8-high, 9-high … king-high</li><li>One pair (pair of aces is best)</li><li>Two pair, trips, full houses, quads</li></ol><p>Hands are compared from the top card down: 7-5-4-3-2 beats 7-6-3-2-A. 9-8-7-6-5 is just a nine-low, and a flush is just its high cards.</p>' +
        '<h3>Showdown</h3><p>The last aggressor on the final round shows first; if it was checked through, the first player left of the button shows first. Split pots are divided evenly with odd chips to the first winner left of the button. Side pots are created for all-in players.</p></div>';
      this.modal(html, [['Close', null]], true, true);
    }

    resetSession() {
      const st = this.stakes;
      this.modal('<h2>New Session?</h2><div class="sub">Reset stacks &amp; stats</div><p style="text-align:center">All stacks return to ' + money(st.buyin) + ' and session statistics are cleared. The new session starts with the next hand.</p>',
        [['Start fresh', () => { store.remove(TD.SESSION_KEY); this.resetRequested = true; this.toast('New session starts next hand'); }], ['Cancel', null, true]]);
    }
  }

  function escapeHTML(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  TD.UI = UI;
  TD.Sound = Sound;
  TD.uiHelpers = { cardEl, miniCards, chipsHTML, money, escapeHTML };
})(window.TD);

</script>
  <script>
/* =====================================================================
   Bootstrap: welcome screen, session persistence, main game loop
   ===================================================================== */
'use strict';
(function (TD) {
  const ui = new TD.UI();
  TD.ui = ui;
  const newGame = () => new TD.Game(ui, { settings: ui.settings, stakes: ui.settings.stakes || TD.CONST.DEFAULT_STAKES });
  let game = newGame();
  TD.game = game;
  ui.attach(game);

  const SESSION_KEY = TD.SESSION_KEY; // one saved session for both games
  let saved = null;
  try { saved = JSON.parse(TD.store.get(SESSION_KEY) || 'null'); } catch (e) { saved = null; }
  // don't re-save a session that is about to be replaced (new stakes / new session requested mid-hand)
  ui.onHandDone = (g) => { if (!ui.resetRequested && g === game) TD.store.set(SESSION_KEY, JSON.stringify(g.serialize())); };

  function welcome() {
    return new Promise((resolve) => {
      const canResume = saved && saved.v === 1 && saved.handNo > 0;
      const m = TD.uiHelpers.money;
      const st = game.stakes;
      const gi = TD.gameInfo;
      const rulesTxt = () => (ui.settings.gameMode === 'MIX' ? 'Mix: six hands (one orbit) of each game in turn. Lowest hand wins — in 2-7 aces are high and straights and flushes count against you; in A-5 aces are low and they don\'t count.'
        : TD.IS_A5 ? 'Lowest hand wins — aces are low and straights and flushes don\'t count, so 5-4-3-2-A is the nuts.' : 'Lowest hand wins — aces are high, straights and flushes count against you.');
      const subTxt = () => (ui.settings.gameMode === 'MIX' ? 'Limit 2-7 / A-5 Mix' : TD.gameInfo.limitName) + ' · ' + m(st.small) + '/' + m(st.big);
      let html = '<svg class="crest"><use href="#crest"/></svg>' +
        '<h2>THE LAGO ROOM</h2><div class="sub" id="wel-sub">' + subTxt() + '</div>' +
        '<div style="display:flex;justify-content:center;margin:4px 0 10px"><div class="seg" id="welcome-game">' +
        [['27', '2-7'], ['A5', 'A-5'], ['MIX', 'Mix']].map(([k, l]) => '<button data-k="' + k + '" class="' + (ui.settings.gameMode === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
        '<p style="text-align:center">Six-handed against five seasoned regulars. Blinds ' + m(st.sb) + '/' + m(st.bb) + ', bets ' + m(st.small) + ' before and after the first draw, ' + m(st.big) + ' after the second and third. <span id="wel-rules">' + rulesTxt() + '</span></p>' +
        '<p style="text-align:center;font-size:14px" class="muted">Buy-in ' + m(st.buyin) + '. Tap your cards any time to mark discards for the next draw. Open <b>Review</b> after a hand to see every opponent\'s cards and reasoning — and how your decisions compare with the AI. Change stakes and the table style in <b>Settings</b>.</p>';
      if (canResume) {
        const net = saved.players[0].stack - saved.players[0].buyins;
        const ss = TD.makeStakes(saved.stakes || TD.CONST.DEFAULT_STAKES);
        html += '<p style="text-align:center;font-size:15px">Saved session: ' + saved.handNo + ' hands at ' + m(ss.small) + '/' + m(ss.big) + ', ' + (net >= 0 ? '+' : '') + m(net) + '.</p>';
      }
      const buttons = [];
      if (canResume) buttons.push(['Resume session', () => {
        game.restore(saved);
        ui.settings.stakes = game.stakes; ui.saveSettings();
        ui.attach(game);
        resolve();
      }]);
      buttons.push([canResume ? 'New session' : 'Take your seat', () => { TD.store.remove(SESSION_KEY); resolve(); }, canResume]);
      const box = ui.modal(html, buttons, false);
      box.querySelectorAll('#welcome-game button').forEach((b) => (b.onclick = () => {
        ui.setGameMode(b.dataset.k);
        box.querySelectorAll('#welcome-game button').forEach((x) => x.classList.toggle('on', x === b));
        box.querySelector('#wel-sub').textContent = subTxt();
        box.querySelector('#wel-rules').textContent = rulesTxt();
      }));
    });
  }

  async function loop() {
    await welcome();
    TD.Sound.init();
    ui.log('Welcome to the Lago Room. ' + (ui.settings.gameMode === 'MIX' ? 'Limit 2-7 / A-5 Mix, six hands of each' : TD.gameInfo.limitName) + '.', 'sys');
    for (;;) {
      if (ui.resetRequested) {
        ui.resetRequested = false;
        game = newGame();
        TD.game = game;
        ui.attach(game);
        document.getElementById('log').innerHTML = '';
        ui.logLines = [];
        ui.log('New session started at ' + TD.uiHelpers.money(game.stakes.small) + '/' + TD.uiHelpers.money(game.stakes.big) + '.', 'sys');
      }
      const me = game.players[0];
      if (me.stack <= 0) await ui.onBust(game, me);
      ui.flushTopUp(game);
      game.handInProgress = true; game.handOver = false;
      try {
        await game.playHand();
      } catch (e) {
        console.error(e);
        ui.log('Table error: ' + e.message, 'sys');
      }
      game.handInProgress = false; game.handOver = true;
      ui.renderPre();
      await ui.betweenHands(game);
    }
  }
  loop();
})(window.TD);

</script>
