        var hi = Math.max.apply(null, grp.map(function (x) { return x.placeTo || x.place; }));
        grp.forEach(function (x) { x.place = lo; x.placeTo = hi; });
      }
    }
  }
  /* "3rd", or "3rd/4th" for two tied, or "4th–6th" for three or more */
  function placeText(p) {
    if (!p || !p.place) return '';
    if (!p.placeTo || p.placeTo === p.place) return ordinal(p.place);
    return ordinal(p.place) + (p.placeTo - p.place === 1 ? '/' : '–') + ordinal(p.placeTo);
  }
  function isTied(p) { return !!(p && p.placeTo && p.placeTo !== p.place); }
  /* standings order: by place, tied players by name */
  function byPlace(a, b) { return a.place - b.place || (isTied(a) && isTied(b) ? a.name.localeCompare(b.name) : 0); }

  function checkEnd(s, now) {
    var act1 = s.players.filter(function (p) { return p.status === 'active'; });
    if (act1.length === 1) { finish(s, act1[0], now); return true; }
    return false;
  }
  /* After anything that can change who is left: end the tournament, start the playoff rounds, or seat the next matches. */
  function afterPlay(s, now) {
    if (checkEnd(s, now)) return;
    prBegin(s, now, false);
    tick(s, now);
  }
  function tick(s, now) { if (s.pr) prAdvance(s, now); else settle(s, now); }

  function reportResult(s, winnerId, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return playoffResult(s, winnerId, now);
    var W = P(s, winnerId);
    var t = W ? tableOf(s, winnerId) : null;
    if (!W || W.status !== 'active' || !t || !(t.a && t.b)) return { error: 'That player is not in a match right now' };
    var loserId = t.a === winnerId ? t.b : t.a;
    var L = P(s, loserId);
    return act(s, 'Result: ' + W.name + ' def. ' + L.name, function () {
      var start = t.since, prName = prResultName(s, t.n);
      W.W += 1;
      L.C -= 1;
      W.lastOpp = L.id; L.lastOpp = W.id;
      t.a = W.id; t.b = null; t.since = null; t.note = null; t.wseq = ++s.seq;
      prRecord(s, t.n, W.id, L.id);
      var elim = L.C <= 0;
      if (elim) { eliminate(s, L, now); } else { s.queue.push(L.id); }
      var data = { table: t.n, winner: W.id, loser: L.id, start: start, loserC: L.C, elim: elim };
      if (prName) data.pr = prName;   /* a playoff-round match keeps its name ("semi-final 1"), for players' match history */
      addLog(s, now, 'result', data, 'Table ' + t.n + ': ' + W.name + ' def. ' + L.name + (elim ? ' (' + L.name + ' eliminated)' : ' (' + L.name + ' ' + L.C + '/' + L.S + ')'));
      afterPlay(s, now);
      return { ok: true, table: t.n, eliminated: elim, loser: L.id };
    });
  }

  /* ---------- manual throw / tables ---------- */
  function throwMatch(s, tableN, p1, p2, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return blockedByPlayoff(s);
    if (s.pr) return blockedByRounds(s);
    var t = T(s, tableN);
    if (!t || !t.open) return { error: 'That table is closed' };
    if (t.a && t.b) return { error: 'That table already has a match' };
    function inPool(id) {
      var p = P(s, id);
      if (!p || p.status !== 'active') return false;
      if (s.queue.indexOf(id) >= 0) return true;
      var ot = tableOf(s, id);
      return !!(ot && ot !== t && tableState(ot) === 'waiting');
    }
    var first, second;
    if (t.a) {
      if (!p1 || !inPool(p1)) return { error: 'Pick a challenger from the waitlist' };
      first = t.a; second = p1;
    } else {
      if (!p1 || !p2 || p1 === p2) return { error: 'Pick two different players' };
      if (!inPool(p1) || !inPool(p2)) return { error: 'Both players must be on the waitlist or waiting at a table' };
      first = p1; second = p2;
    }
    return act(s, 'Throw Table ' + tableN, function () {
      function take(id) {
        var qi = s.queue.indexOf(id);
        if (qi >= 0) { s.queue.splice(qi, 1); return; }
        var ot = tableOf(s, id);
        if (ot) { ot.a = null; ot.b = null; ot.since = null; ot.note = null; ot.wseq = 0; }
      }
      if (!t.a) { take(first); t.a = first; }
      take(second);
      t.b = second; t.since = now; t.note = null; t.wseq = 0;
      addLog(s, now, 'throw', { table: t.n, manual: true }, 'Table ' + t.n + ': ' + P(s, t.a).name + ' vs ' + P(s, t.b).name + ' (thrown manually)');
      settle(s, now);
      return { ok: true };
    });
  }

  function closeTable(s, n, now) {
    if (s.rr) return blockedByPlayoff(s);
    var t = T(s, n);
    if (!t || !t.open) return { error: 'Table is already closed' };
    if (t.a || t.b) return { error: 'Table ' + n + ' still has a player on it' };
    if (s.phase === 'active' && s.tables.filter(function (x) { return x.open; }).length <= 1) return { error: 'Table ' + n + ' is the last open table, so it stays open' };
    return act(s, 'Close Table ' + n, function () {
      t.open = false; t.since = null; t.note = null; t.wseq = 0;
      addLog(s, now, 'close', { table: n }, 'Table ' + n + ' closed');
      return { ok: true };
    });
  }

  function reopenTable(s, n, now) {
    if (s.rr) return blockedByPlayoff(s);
    var t = T(s, n);
    if (!t || t.open) return { error: 'Table is already open' };
    return act(s, 'Reopen Table ' + n, function () {
      t.open = true; t.a = null; t.b = null; t.since = null; t.note = null; t.wseq = 0;
      addLog(s, now, 'open', { table: n }, 'Table ' + n + ' reopened');
      tick(s, now);
      return { ok: true };
    });
  }

  /* num is the number on the table being added; without one, the next number above the highest is used. */
  function addTable(s, now, num) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return blockedByPlayoff(s);
    var n;
    if (num === undefined || num === null || String(num).trim() === '') n = nextTableNum(s);
    else {
      if (!isTableNum(num)) return { error: 'Table numbers must be whole numbers from 1 to ' + MAX_TABLE_NUM };
      n = parseInt(num, 10);
      var ex = T(s, n);
      if (ex) return { error: ex.open ? 'Table ' + n + ' is already in use' : 'Table ' + n + ' is closed. Use Reopen Table ' + n + ' instead.' };
    }
    return act(s, 'Add Table ' + n, function () {
      s.tables.push({ n: n, open: true, a: null, b: null, since: null, wseq: 0, note: null });
      sortTables(s);
      addLog(s, now, 'open', { table: n }, 'Table ' + n + ' added');
      tick(s, now);
      return { ok: true, table: n };
    });
  }

  /* Auto-throw is always on (the switch to pause it is gone). A tournament saved while it was paused, by an earlier
     version, is switched back on here and the matches waiting to be thrown are thrown. True when anything changed. */
  function ensureAuto(s, now) {
    if (s.mode === 'AUTO') return false;
    s.mode = 'AUTO';
    if (s.phase === 'active') tick(s, now);
    return true;
  }

  /* ---------- roster changes during play (late entries are not permitted) ---------- */
  function dropPlayer(s, id, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return blockedByPlayoff(s);
    var p = P(s, id);
    if (!p || p.status !== 'active') return { error: 'Only active players can be dropped' };
    if (activeCount(s) <= 1) return { error: 'Cannot drop the last player' };
    return act(s, 'Drop ' + p.name, function () {
      knockOut(s, p, now, 'dropped');
      addLog(s, now, 'drop', { player: p.id }, p.name + ' dropped out');
      afterPlay(s, now);
      return { ok: true };
    });
  }

  function editPlayer(s, id, patch, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return blockedByPlayoff(s);
    var p = P(s, id);
    if (!p || p.status !== 'active') return { error: 'Only active players can be edited' };
    var nm = null, S2 = null, C2 = null, bad;
    if (patch.name !== undefined) {
      nm = normName(patch.name);
      if ((bad = nameProblem(nm))) return { error: bad };
      if (nameTaken(s, nm, id)) return { error: '"' + nm + '" is already registered' };
    }
    if (patch.S !== undefined) {
      S2 = parseInt(patch.S, 10);
      if ((bad = chipProblem(S2, 1, 'Starting chips'))) return { error: bad };
    }
    if (patch.C !== undefined) {
      C2 = parseInt(patch.C, 10);
      if ((bad = chipProblem(C2, 0, 'Chips remaining'))) return { error: bad };
      if (C2 === 0 && activeCount(s) <= 1) return { error: 'Cannot eliminate the last player' };
    }
    return act(s, 'Edit ' + p.name, function () {
      var old = label(p);
      if (nm !== null) p.name = nm;
      if (S2 !== null) p.S = S2;
      if (C2 !== null) p.C = C2;
      if (C2 === 0) {
        eliminate(s, p, now);
        addLog(s, now, 'edit', { player: p.id }, p.name + ' set to 0 chips (eliminated)');
        afterPlay(s, now);
      } else {
        addLog(s, now, 'edit', { player: p.id }, 'Edited ' + old + ' to ' + label(p));
      }
      return { ok: true };
    });
  }

  function reinstate(s, id, chips, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.rr) return blockedByPlayoff(s);
    if (s.pr) return blockedByRounds(s);
    var p = P(s, id);
    if (!p || p.status !== 'eliminated') return { error: 'Only eliminated players can be reinstated' };
    chips = parseInt(chips, 10);
    var bad = chipProblem(chips, 1, 'Chips');
    if (bad) return { error: bad };
    return act(s, 'Reinstate ' + p.name, function () {
      /* everyone who went out after this player moves down one place: this player now finishes ahead of them */
      var was = p.place;
      if (was) s.players.forEach(function (x) {
        if (x !== p && x.place && x.place < was) { x.place += 1; if (x.placeTo) x.placeTo += 1; }
      });
      p.status = 'active'; p.C = chips; p.place = null; p.placeTo = null; p.prRound = null; p.lastOpp = null; p.elimAt = null;
      s.queue.push(p.id);
      addLog(s, now, 'reinstate', { player: p.id }, p.name + ' reinstated with ' + chips + ' chip' + (chips === 1 ? '' : 's') + ', added to the bottom of the waitlist');
      settle(s, now);
      return { ok: true };
    });
  }

  /* ---------- playoff rounds ----------
     With the setup option on, auto-throw stops once anything leaves 6 players or fewer. Matches already being played
     finish; everyone else waits for the draw (in no order). When no matches are running, the players left draw in
     person for the next round: 6 -> three matches, 5 -> a play-in (the other three wait), 4 -> two semi-finals,
     3 -> the round robin playoff, 2 -> the final, thrown match after match until one player is out of chips.
     After every round the field is counted again, so the next draw depends on how many are left.
     Chips count as usual and rematches are allowed. */
  var PR_MAX = 6;
  var PR_KINDS = {
    6: { kind: 'three', matches: 3, picks: 6, name: 'three matches' },
    5: { kind: 'playin', matches: 1, picks: 2, name: 'play-in' },
    4: { kind: 'semis', matches: 2, picks: 4, name: 'semi-finals' }
  };
  function runningCount(s) { return s.tables.filter(function (t) { return tableState(t) === 'match'; }).length; }

  function prBegin(s, now, atStart) {
    if (s.pr || !s.playoffRounds || s.phase !== 'active' || s.rr) return;
    var n = activeCount(s);
    if (n > PR_MAX) return;
    s.pr = { stage: 'finishing', round: 0, cur: null, last: null };
    if (!atStart) {
      var run = runningCount(s);
      addLog(s, now, 'prounds', {}, 'Playoff rounds: ' + n + ' players left. Auto-throw stops' +
        (run ? '. The draw for round 1 comes after ' + (run === 1 ? 'the match in progress finishes' : 'the ' + run + ' matches in progress finish') : ''));
    }
  }

  /* "semi-final 2", "play-in", "round 1, match 3" */
  function prMatchName(cur, m) {
    if (cur.kind === 'semis') return 'semi-final ' + m.n;
    if (cur.kind === 'playin') return 'play-in';
    return 'round ' + cur.round + ', match ' + m.n;
  }

  function seatPr(s, t, m, now) {
    t.open = true; t.a = m.a; t.b = m.b; t.since = now; t.note = null; t.wseq = 0;
    m.table = t.n; m.state = 'on';
    addLog(s, now, 'throw', { table: t.n }, 'Table ' + t.n + ': ' + P(s, m.a).name + ' vs ' + P(s, m.b).name + ' (' + prMatchName(s.pr.cur, m) + ')');
  }

  /* the name of the playoff-round match on a table ("semi-final 1", "final"), or '' for a regular match */
  function prResultName(s, tableN) {
    if (!s.pr) return '';
    if (s.pr.stage === 'final') return 'final';
    var name = '';
    if (s.pr.cur) s.pr.cur.matches.forEach(function (m) { if (m.state === 'on' && m.table === tableN) name = prMatchName(s.pr.cur, m); });
    return name;
  }
  function prRecord(s, tableN, w, l) {
    if (!s.pr || !s.pr.cur) return;
    s.pr.cur.matches.forEach(function (m) {
      if (m.state === 'on' && m.table === tableN) { m.state = 'done'; m.winner = w; m.loser = l; }
    });
  }

  /* Keeps the playoff rounds moving: winners go back to wait for the draw, matches waiting for a table get the first
     free one, and once nothing is running the field is counted for the next step. */
  function prAdvance(s, now) {
    var pr = s.pr;
    if (!pr || s.phase !== 'active' || s.rr) return;
    s.tables.forEach(function (t) {
      if (t.open && t.a && !t.b) { s.queue.push(t.a); t.a = null; t.since = null; t.note = null; t.wseq = 0; }
    });
    if (pr.cur) {
      pr.cur.matches.forEach(function (m) {
        if (m.state !== 'pending') return;
        for (var i = 0; i < s.tables.length; i++) {
          var t = s.tables[i];
          if (t.open && !t.a && !t.b) { seatPr(s, t, m, now); return; }
        }
      });
      if (runningCount(s) || pr.cur.matches.some(function (m) { return m.state === 'pending'; })) return;
      pr.last = pr.cur;
      pr.cur = null;
    }
    if (runningCount(s)) return;
    if (activeCount(s) === 2 && s.queue.length === 2) {
      /* the final: on one table, match after match until one player is out of chips */
      var open = s.tables.filter(function (t) { return t.open; });
      var t = open[0] || s.tables[0];
      if (!t) { pr.stage = 'draw'; return; }
      var first = pr.stage !== 'final';
      s.tables.forEach(function (x) {
        if (x !== t && x.open && !x.a && !x.b) {
          x.open = false; x.since = null; x.note = null; x.wseq = 0;
          addLog(s, now, 'close', { table: x.n }, 'Table ' + x.n + ' closed (final)');
        }
      });
      var a = s.queue[1], b = s.queue[0];   // the last winner (added last) keeps the first seat
      s.queue = [];
      t.open = true; t.a = a; t.b = b; t.since = now; t.note = null; t.wseq = 0;
      pr.stage = 'final';
      pr.last = null;
      addLog(s, now, 'throw', { table: t.n }, first
        ? 'Final on Table ' + t.n + ': ' + P(s, a).name + ' vs ' + P(s, b).name + '. They play until one is out of chips'
        : 'Table ' + t.n + ': ' + P(s, a).name + ' vs ' + P(s, b).name + ' (final)');
      return;
    }
    pr.stage = 'draw';
  }

  /* ---------- pausing the whole tournament ----------
     For a break or a problem in the room: match clocks stop, and wait times and the finish time give way to a "paused"
     notice. Time paused never counts toward a match's length, so it doesn't change the average match either. Results can
     still be entered while paused (a match that ended as the pause was called); a match thrown during a pause starts its
     clock when play resumes. Pausing and resuming are steps Undo can take back, like a result. */
  function isPaused(s) { return !!(s.pause && s.pause.at && s.phase === 'active'); }
  /* every pause as [start, end], the one in progress ending at `to` */
  function pauseSpans(s, to) {
    var out = [];
    (Array.isArray(s.pauses) ? s.pauses : []).forEach(function (p) { if (p && p[1] > p[0]) out.push([p[0], p[1]]); });
    if (s.pause && s.pause.at && to > s.pause.at) out.push([s.pause.at, to]);
    return out;
  }
  /* milliseconds of play between two times: the time in between, less any time paused */
  function playMs(s, from, to) {
    if (!(from > 0) || !(to > from)) return 0;
    var off = 0;
    pauseSpans(s, to).forEach(function (p) { var a = Math.max(p[0], from), b = Math.min(p[1], to); if (b > a) off += b - a; });
    return Math.max(0, to - from - off);
  }
  /* ends the pause in progress (if any); gives its length in milliseconds */
  function endPause(s, now) {
    if (!s.pause || !s.pause.at) { s.pause = null; return 0; }
    var at = s.pause.at, end = Math.max(at, now);
    if (!Array.isArray(s.pauses)) s.pauses = [];
    s.pauses.push([at, end]);
    s.pause = null;
    return end - at;
  }
  function pausePlay(s, now) {
    if (s.phase !== 'active') return { error: 'The tournament is not running' };
    if (s.pause && s.pause.at) return { error: 'The tournament is already paused' };
    return act(s, 'Pause tournament', function () {
      s.pause = { at: now };
      addLog(s, now, 'pause', {}, 'Tournament paused');
      return { ok: true };
    });
  }
  function resumePlay(s, now) {
    if (!(s.pause && s.pause.at)) return { error: 'The tournament is not paused' };
    return act(s, 'Resume tournament', function () {
      var at = s.pause.at, min = Math.round(endPause(s, now) / 60000);
      addLog(s, now, 'resume', { from: at }, 'Tournament resumed after ' + (min < 1 ? 'under a minute' : min + ' min') + ' paused (since ' + fmtTime(at) + ')');
      return { ok: true, minutes: min };
    });
  }

  /* The setup option can be changed during play until the playoffs begin (playoff rounds or the round robin).
     Turning it on with 6 players or fewer already left starts the playoff rounds right away. Undo rewinds it. */
  function playoffRoundsLocked(s) { return s.phase !== 'registration' && !!(s.pr || s.rr || s.phase === 'finished'); }
  function setPlayoffRounds(s, on, now) {
    on = !!on;
    if (s.phase === 'registration') { s.playoffRounds = on; return { ok: true }; }
    if (playoffRoundsLocked(s)) return { error: s.phase === 'finished' ? 'The tournament is over' : 'The playoffs have begun, so this setting can\'t be changed' };
    if (s.playoffRounds === on) return { ok: true };
    return act(s, 'Playoff rounds ' + (on ? 'on' : 'off'), function () {
      s.playoffRounds = on;
      addLog(s, now, 'setting', {}, 'Playoff rounds at ' + PR_MAX + ' players or fewer turned ' + (on ? 'on' : 'off'));
      if (on) { prBegin(s, now, false); if (s.pr) prAdvance(s, now); }
      return { ok: true, started: !!s.pr };
    }, false, true);
  }

  /* The draw the players need to make now, or null. */
  function prDrawInfo(s) {
    if (!s.pr || s.pr.stage !== 'draw' || s.rr || s.phase !== 'active') return null;
    var n = activeCount(s), k = hasOwn(PR_KINDS, n) ? PR_KINDS[n] : null;
    if (!k) return null;
    return { n: n, round: s.pr.round + 1, kind: k.kind, matches: k.matches, picks: k.picks, name: k.name, pool: s.queue.slice() };
  }

  /* Default tables for a round: tables in use first, then closed ones, lowest numbers first; null = next free table. */
  function prDefaultTables(s, k) {
    var open = s.tables.filter(function (t) { return t.open; }), closed = s.tables.filter(function (t) { return !t.open; });
    var pick = open.concat(closed).slice(0, k).map(function (t) { return t.n; }).sort(function (x, y) { return x - y; });
    while (pick.length < k) pick.push(null);
    return pick;
  }

  /* order: the players in the order they drew (1 plays 2, 3 plays 4, 5 plays 6; for a play-in, just the two who play).
     tables: a table number for each match, or null for the next free table. */
  function prStartRound(s, order, tables, now) {
    var info = prDrawInfo(s);
    if (!info) return { error: 'There is no playoff round draw to enter right now' };
    if (!Array.isArray(order) || order.length !== info.picks) return { error: 'Enter the whole draw' };
    order = order.map(Number);
    var seen = {};
    for (var i = 0; i < order.length; i++) {
      if (seen[order[i]] || s.queue.indexOf(order[i]) < 0) return { error: 'The draw must be the players who are left, each once' };
      seen[order[i]] = true;
    }
    if (!Array.isArray(tables) || tables.length !== info.matches) return { error: 'Pick a table for each match' };
    var tn = [], used = {};
    for (var j = 0; j < tables.length; j++) {
      var v = tables[j];
      if (v === null || v === undefined || String(v).trim() === '') { tn.push(null); continue; }
      var tb = T(s, parseInt(v, 10));
      if (!tb) return { error: 'Table ' + v + ' does not exist' };
      if (used[tb.n]) return { error: 'Table ' + tb.n + ' is picked twice. Use "Next free table" for a match that waits.' };
      used[tb.n] = true; tn.push(tb.n);
    }
    if (!tn.some(function (x) { return x !== null; })) return { error: 'Pick a table for at least one match' };
    return act(s, 'Start playoff round ' + info.round, function () {
      var pr = s.pr;
      s.tables.forEach(function (t) {
        if (used[t.n]) {
          if (!t.open) { t.open = true; addLog(s, now, 'open', { table: t.n }, 'Table ' + t.n + ' reopened (playoff round ' + info.round + ')'); }
        } else if (t.open) {
          t.open = false; t.a = null; t.b = null; t.since = null; t.note = null; t.wseq = 0;
          addLog(s, now, 'close', { table: t.n }, 'Table ' + t.n + ' closed (not used in playoff round ' + info.round + ')');
        }
      });
      order.forEach(function (id) { s.queue.splice(s.queue.indexOf(id), 1); });
      pr.round = info.round;
      pr.stage = 'playing';
      pr.last = null;
      pr.cur = { round: info.round, kind: info.kind, matches: [] };
      for (var k = 0; k < info.matches; k++) {
        pr.cur.matches.push({ n: k + 1, a: order[2 * k], b: order[2 * k + 1], table: tn[k], state: 'pending', winner: null, loser: null });
      }
      var desc = pr.cur.matches.map(function (m) { return P(s, m.a).name + ' vs ' + P(s, m.b).name + (m.table ? ' on Table ' + m.table : ' on the next free table'); });
      var waits = s.queue.map(function (id) { return P(s, id).name; });
      addLog(s, now, 'pround', { round: info.round },
        'Playoff round ' + info.round + ' (' + info.name + '), drawn in person: ' + desc.join('; ') + (waits.length ? '. Waiting: ' + waits.join(', ') : ''));
      pr.cur.matches.forEach(function (m) { if (m.table) seatPr(s, T(s, m.table), m, now); });
      prAdvance(s, now);
      return { ok: true, round: info.round };
    });
  }

  /* ---------- three-player round robin playoff ----------
     Offered when the playoff rounds are down to three players and none of them is in a match.
     Matches are played one at a time on one table. The players draw in person for the order: players 1 and 2 play
     match 1 and player 3 sits out. After every match the winner stays on and plays whoever sat out, so the matches
     are A-B, A-C, B-C with A = the winner of match 1. The first player to 2 wins is champion, then the other two
     play a 2nd/3rd place decider. If match 3 leaves everyone 1-1, the director chooses: keep going in the same
     rotation, or a spot shot shootout (shooting in draw order, out after a set number of misses each). The shootout sets
     all three places with no decider: first out is 3rd, second out is 2nd, the last player left is champion.
     Chips stop counting during the playoff. */
  function rrSitter(order, a, b) {
    for (var i = 0; i < order.length; i++) if (order[i] !== a && order[i] !== b) return order[i];
    return null;
  }

  /* The three players who could start the round robin playoff right now, or null: the playoff rounds are down to three
     players and waiting for a draw. */
  function playoffCandidates(s) {
    if (s.phase !== 'active' || s.rr || !s.pr || s.pr.stage !== 'draw') return null;
    var left = s.players.filter(function (p) { return p.status === 'active'; });
    if (left.length !== 3) return null;
    if (s.tables.some(function (t) { return tableState(t) === 'match'; })) return null;
    return left.map(function (p) { return p.id; });
  }

  function startPlayoff(s, order, tableN, now) {
    var cand = playoffCandidates(s);
    if (!cand) return { error: 'The round robin playoff starts when the playoff rounds are down to three players, with no match in progress' };
    if (!Array.isArray(order) || order.length !== 3) return { error: 'Enter the draw order for all three players' };
    order = order.map(Number);
    var distinct = order[0] !== order[1] && order[0] !== order[2] && order[1] !== order[2];
    if (!distinct || !order.every(function (id) { return cand.indexOf(id) >= 0; })) return { error: 'The draw must be the three players who are left' };
    var t = T(s, parseInt(tableN, 10));
    if (!t) return { error: 'Pick a table for the playoff' };
    return act(s, 'Start playoff', function () {
      s.queue = [];
      s.tables.forEach(function (x) {
        x.a = null; x.b = null; x.since = null; x.note = null; x.wseq = 0;
        if (x !== t && x.open) {
          x.open = false;
          addLog(s, now, 'close', { table: x.n }, 'Table ' + x.n + ' closed (playoff)');
        }
      });
      t.open = true;
      var wins = {}, losses = {};
      order.forEach(function (id) { P(s, id).po = true; wins[id] = 0; losses[id] = 0; });
      s.rr = { stage: 'rr', table: t.n, order: order, wins: wins, losses: losses, matches: [],
        current: { a: order[0], b: order[1], since: now }, champion: null, tie: null, tieChoice: null, shootout: null };
      var nm = order.map(function (id) { return P(s, id).name; });
      addLog(s, now, 'playoff', { table: t.n },
        'Round robin playoff on Table ' + t.n + '. Draw: 1. ' + nm[0] + ', 2. ' + nm[1] + ', 3. ' + nm[2] + '. Match 1: ' + nm[0] + ' vs ' + nm[1]);
      return { ok: true };
    });
  }

  /* The champion is decided: the other two play for 2nd and 3rd, in draw order. */
  function crownPlayoff(s, champId, now, how) {
    var rr = s.rr;
    rr.champion = champId;
    rr.stage = 'decider';
    var others = rr.order.filter(function (id) { return id !== champId; });
    rr.current = { a: others[0], b: others[1], since: now };
    addLog(s, now, 'pchampion', { player: champId },
      P(s, champId).name + ' ' + how + ' and is the champion. ' + P(s, others[0]).name + ' vs ' + P(s, others[1]).name + ' for 2nd place');
  }

  function playoffResult(s, winnerId, now) {
    var rr = s.rr, cur = rr && rr.current;
    if (!cur) return { error: 'No playoff match is being played right now' };
    winnerId = Number(winnerId);
    if (winnerId !== cur.a && winnerId !== cur.b) return { error: 'That player is not in the playoff match' };
    var loserId = winnerId === cur.a ? cur.b : cur.a;
    var W = P(s, winnerId), L = P(s, loserId), decider = rr.stage === 'decider';
    return act(s, (decider ? '2nd place: ' : 'Playoff: ') + W.name + ' def. ' + L.name, function () {
      var num = rr.matches.length + 1;
      W.W += 1;   /* every match win counts toward a player's total, playoff matches included */
      rr.matches.push({ n: num, a: cur.a, b: cur.b, winner: winnerId, loser: loserId, start: cur.since, t: now, kind: decider ? 'decider' : 'rr' });
      if (decider) {
        addLog(s, now, 'presult', { table: rr.table, winner: winnerId, loser: loserId, start: cur.since, decider: true },
          'Table ' + rr.table + ': ' + W.name + ' def. ' + L.name + ' for 2nd place');
        rr.current = null;
        rr.stage = 'done';
        W.status = 'eliminated'; W.place = 2; W.elimAt = now;
        L.status = 'eliminated'; L.place = 3; L.elimAt = now;
        finish(s, P(s, rr.champion), now);
        return { ok: true, finished: true, second: winnerId, third: loserId };
      }
      rr.wins[winnerId] += 1;
      rr.losses[loserId] += 1;
      addLog(s, now, 'presult', { table: rr.table, winner: winnerId, loser: loserId, start: cur.since, match: num },
        'Playoff match ' + num + ' (Table ' + rr.table + '): ' + W.name + ' def. ' + L.name);
      var sitter = rrSitter(rr.order, cur.a, cur.b);
      if (rr.wins[winnerId] >= 2) {
        crownPlayoff(s, winnerId, now, 'wins the playoff with 2 wins');
        return { ok: true, champion: winnerId };
      }
      if (rr.order.every(function (id) { return rr.wins[id] === 1; })) {
        rr.current = null;
        rr.stage = 'tie';
        rr.tie = { winner: winnerId, sitter: sitter };
        addLog(s, now, 'ptie', {}, 'Playoff tied: everyone is 1-1');
        return { ok: true, tie: true };
      }
      rr.current = { a: winnerId, b: sitter, since: now };
      addLog(s, now, 'throw', { table: rr.table }, 'Playoff match ' + (num + 1) + ': ' + W.name + ' vs ' + P(s, sitter).name);
      return { ok: true, next: [winnerId, sitter] };
    });
  }

  /* Tie-break, option 1: keep going. The winner of match 3 plays whoever sat out; that winner has 2 wins. */
  function playoffContinue(s, now) {
    var rr = s.rr;
    if (!rr || rr.stage !== 'tie') return { error: 'The playoff is not tied' };
    return act(s, 'Playoff tie: keep going', function () {
      rr.stage = 'rr';
      rr.tieChoice = 'continue';
      rr.current = { a: rr.tie.winner, b: rr.tie.sitter, since: now };
      addLog(s, now, 'throw', { table: rr.table },
        'Playoff tie, keep going. Match ' + (rr.matches.length + 1) + ': ' + P(s, rr.tie.winner).name + ' vs ' + P(s, rr.tie.sitter).name);
      return { ok: true };
    });
  }

  /* Tie-break, option 2: spot shot shootout. allowed maps each player id to the number of misses that puts them out. */
  function startShootout(s, allowed, now) {
    var rr = s.rr;
    if (!rr || rr.stage !== 'tie') return { error: 'The playoff is not tied' };
    var al = {}, strikes = {};
    for (var i = 0; i < rr.order.length; i++) {
      var id = rr.order[i], v = allowed ? allowed[id] : null;
      if (!/^\s*\d+\s*$/.test(String(v === undefined || v === null ? '' : v)) || !(parseInt(v, 10) >= 1) || parseInt(v, 10) > 99) {
        return { error: 'Enter a number of misses, 1 or more, for ' + P(s, id).name };
      }
      al[id] = parseInt(v, 10); strikes[id] = 0;
    }
    return act(s, 'Start shootout', function () {
      rr.stage = 'shootout';
      rr.tieChoice = 'shootout';
      rr.shootout = { allowed: al, strikes: strikes, out: [], turn: 0, attempts: [], t0: now };
      addLog(s, now, 'shootout', {}, 'Spot shot shootout. Shooting order and misses until out: ' +
        rr.order.map(function (id, k) { return (k + 1) + '. ' + P(s, id).name + ' (' + al[id] + ')'; }).join(', '));
      return { ok: true };
    });
  }

  /* One spot shot attempt by the shooter whose turn it is. */
  function shootoutAttempt(s, made, now) {
    var rr = s.rr, so = rr && rr.shootout;
    if (!so || rr.stage !== 'shootout') return { error: 'No shootout in progress' };
    var id = rr.order[so.turn], p = P(s, id);
    return act(s, 'Shootout: ' + p.name + (made ? ' made it' : ' missed'), function () {
      var r = { ok: true, shooter: id, made: !!made };
      so.attempts.push({ id: id, made: !!made, t: now });
      if (made) {
        addLog(s, now, 'shot', { player: id, made: true }, '🎯 Shootout: ' + p.name + ' made the spot shot');
      } else {
        so.strikes[id] += 1;
        r.out = so.strikes[id] >= so.allowed[id];
        if (r.out) so.out.push(id);
        addLog(s, now, 'shot', { player: id, made: false },
          '❌ Shootout: ' + p.name + ' missed (' + so.strikes[id] + ' of ' + so.allowed[id] + ')' + (r.out ? ' and is out' : ''));
      }
      var left = rr.order.filter(function (x) { return so.out.indexOf(x) < 0; });
      if (left.length === 1) {
        /* The shootout sets all three places: first out is 3rd, second out is 2nd, last player left is champion. No decider. */
        var third = P(s, so.out[0]), second = P(s, so.out[1]), champ = P(s, left[0]);
        third.status = 'eliminated'; third.place = 3; third.elimAt = now;
        second.status = 'eliminated'; second.place = 2; second.elimAt = now;
        rr.champion = champ.id;
        rr.current = null;
        rr.stage = 'done';
        addLog(s, now, 'pchampion', { player: champ.id },
          champ.name + ' wins the spot shot shootout. ' + second.name + ' takes 2nd, ' + third.name + ' 3rd');
        finish(s, champ, now);
        r.champion = champ.id; r.second = second.id; r.third = third.id; r.finished = true;
        return r;
      }
      var i = so.turn;
      do { i = (i + 1) % rr.order.length; } while (so.out.indexOf(rr.order[i]) >= 0);
      so.turn = i;
      return r;
    });
  }

  /* What a win by this player in the current playoff match would lead to (for the on-screen "if ... wins" lines). */
  function playoffIfWins(s, id) {
    var rr = s.rr, cur = rr && rr.current;
    if (!cur || rr.stage !== 'rr' || (id !== cur.a && id !== cur.b)) return null;
    if (rr.wins[id] + 1 >= 2) return { champion: true, decider: rr.order.filter(function (x) { return x !== id; }) };
    var w = {};
    rr.order.forEach(function (x) { w[x] = rr.wins[x]; });
    w[id] += 1;
    if (rr.order.every(function (x) { return w[x] === 1; })) return { tie: true };
    return { next: [id, rrSitter(rr.order, cur.a, cur.b)] };
  }

  /* ---------- waitlist wait estimate ----------
     Average match length divided by the tables with a match in progress gives the minutes between results, and every
     result moves the waitlist up one spot. Your setup estimate is used until as many matches have finished as there
     were tables at the start (the first matches to finish are the quick ones), then the actual average. */
  /* the average match length: the setup estimate until as many matches have finished as there were starting tables, then the real average */
  function avgMatch(s) {
    var durs = s.log.filter(function (e) { return e.type === 'result' && e.start; }).map(function (e) { return playMs(s, e.start, e.t); });
    var need = 1;
    for (var i = 0; i < s.log.length; i++) if (s.log[i].type === 'start') { need = Math.max(1, s.log[i].tables || 1); break; }
    if (durs.length >= need) return { avgMin: durs.reduce(function (a, b) { return a + b; }, 0) / durs.length / 60000, source: 'actual', finished: durs.length, need: need };
    var est = parseFloat(s.matchMinutes);
    return est > 0 ? { avgMin: est, source: 'setup', finished: durs.length, need: need } : null;
  }
  function waitEstimate(s) {
    if (s.phase !== 'active' || s.rr || s.pr) return null;
    var playing = s.tables.filter(function (t) { return tableState(t) === 'match'; }).length;
    if (!playing) return null;
    var am = avgMatch(s);
    if (!am) return null;
    return { avgMin: am.avgMin, playing: playing, perSpotMin: am.avgMin / playing, source: am.source, finished: am.finished, need: am.need };
  }

  /* How the rest of the night plays out. Every match takes one chip out of play, and fewer tables stay busy as players go out,
     so the rest is played out 200 times from the real chip counts (two random players per open table, a coin flip for each
     result) and the typical (median) number of rounds is used. The answer depends only on the chip counts and the number of
     tables, which change once per result, so it is worked out once and kept; the same situation always gives the same answer.
     The work is capped so a huge field or a mistyped chip count (thousands) can't freeze the screen: a normal night takes well
     under 1 million player-rounds for all 200 runs and is never affected. Past 1.5 million, the runs done so far are used (at
     least 25); past 3 million it stops, and a night too long to play out even once gets a plain estimate (each round takes one
     chip from every busy table). */
  var roundsCache = { key: null, rounds: 0 };
  var SIM_RUNS = 200, SIM_MIN_RUNS = 25, SIM_BUDGET = 1.5e6, SIM_HARD = 3e6;
  function roundsKey(chips, tables) { return tables + ':' + chips.slice().sort(function (a, b) { return a - b; }).join(','); }
  function medianRounds(chips, tables) {
    var key = roundsKey(chips, tables);
    if (roundsCache.key === key) return roundsCache.rounds;
    var seed = 7;
    for (var q = 0; q < key.length; q++) seed = (seed * 31 + key.charCodeAt(q)) % 2147483647;
    seed = seed || 1;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    /* one array, reused: players out of chips are squeezed out in place (same order as before, so the same answers) */
    var runs = [], work = 0, c = [], stopped = false;
    for (var r = 0; r < SIM_RUNS && !stopped; r++) {
      var len = chips.length, n = 0;
      for (var y = 0; y < len; y++) c[y] = chips[y];
      while (len > 1) {
        var k = Math.max(1, Math.min(tables, Math.floor(len / 2)));
        for (var i = len - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)), tmp = c[i]; c[i] = c[j]; c[j] = tmp; }
        for (var x = 0; x < k; x++) c[rnd() < 0.5 ? 2 * x : 2 * x + 1]--;
        var keep = 0;
        for (var z = 0; z < len; z++) if (c[z] > 0) c[keep++] = c[z];
        work += len; len = keep; n++;
        if (work > SIM_HARD) { stopped = true; break; }
      }
      if (!stopped) runs.push(n);
      if (work > SIM_BUDGET && runs.length >= SIM_MIN_RUNS) break;
    }
    var est;
    if (runs.length) { runs.sort(function (a, b) { return a - b; }); est = runs[runs.length >> 1]; }
    else {
      var total = 0;
      for (var t = 0; t < chips.length; t++) total += chips[t];
      est = Math.ceil(total / Math.max(1, Math.min(tables, Math.floor(chips.length / 2))));
    }
    roundsCache = { key: key, rounds: est };
    return roundsCache.rounds;
  }
  function liveChips(s) { return s.players.filter(function (p) { return p.status === 'active'; }).map(function (p) { return p.C; }); }
  function openTables(s) { return Math.max(1, s.tables.filter(function (t) { return t.open; }).length); }
  /* true when the estimate can be given without playing the night out again (the interface can then show it at once) */
  function finishReady(s) {
    if (s.phase !== 'active' || s.rr) return true;
    var chips = liveChips(s);
    return chips.length < 2 || roundsCache.key === roundsKey(chips, openTables(s));
  }
  /* Estimated minutes until the tournament ends: the rounds left at the average match length, where the first round is the time
     the matches in progress still need. */
  function finishEstimate(s, now) {
    if (s.phase !== 'active') return null;
    var am = avgMatch(s);
    if (!am) return null;
    var m = am.avgMin;
    var running = s.rr ? (s.rr.current ? [s.rr.current.since] : []) : s.tables.filter(function (t) { return t.open && tableState(t) === 'match'; }).map(function (t) { return t.since; });
    var first = m;
    if (running.length) {
      var left = running.map(function (since) { return since ? Math.max(m * 0.15, m - playMs(s, since, now) / 60000) : m; });
      first = left.reduce(function (a, b) { return a + b; }, 0) / left.length;
    }
    if (s.rr) {   /* the round robin playoff: a few more matches on one table */
      var rr = s.rr, more = rr.stage === 'rr' ? Math.max(1, 3 - rr.matches.length) + 1 : rr.stage === 'tie' ? 2 : (rr.stage === 'shootout' || rr.stage === 'decider') ? 1 : 0;
      return more ? { min: first + (more - 1) * m, avgMin: m, source: am.source } : null;
    }
    var chips = liveChips(s);
    if (chips.length < 2) return null;
    return { min: first + (medianRounds(chips, openTables(s)) - 1) * m, avgMin: m, source: am.source };
  }
  /* The setup screen's estimate: the same method for the whole night, from everyone's starting chips. */
  function plannedMinutes(chips, tables, matchMin) {
    if (!(tables >= 1) || chips.length < 2 || !(matchMin > 0)) return null;
    return medianRounds(chips, tables) * matchMin;
  }

  /* ---------- awards ---------- */
  function mostWins(s) {
    var top = 0;
    s.players.forEach(function (p) { if (p.W > top) top = p.W; });
    if (!top) return null;
    return { wins: top, ids: s.players.filter(function (p) { return p.W === top; }).map(function (p) { return p.id; }) };
  }
  /* the top win totals, highest first: up to n groups of players sharing a total; knocked-out players count too */
  function winTiers(s, n) {
    var tiers = [], max = n || 3;
    s.players.filter(function (p) { return p.W > 0; }).sort(function (a, b) { return b.W - a.W || a.reg - b.reg; }).forEach(function (p) {
      var t = tiers[tiers.length - 1];
      if (!t || t.wins !== p.W) { if (tiers.length >= max) return; tiers.push(t = { wins: p.W, ids: [] }); }
      t.ids.push(p.id);
    });
    return tiers;
  }
  /* Win runs: match wins in a row with no loss in between. Chip play, playoff rounds and the round robin all count.
     cur = each player's run right now, best = each player's longest run, top = the longest run anyone has had (ids = who) */
  function runs(s) {
    var cur = {}, best = {}, top = 0;
    s.log.forEach(function (e) {
      if ((e.type !== 'result' && e.type !== 'presult') || !e.winner) return;
      cur[e.winner] = (cur[e.winner] || 0) + 1;
      if (cur[e.winner] > (best[e.winner] || 0)) best[e.winner] = cur[e.winner];
      if (best[e.winner] > top) top = best[e.winner];
      cur[e.loser] = 0;
    });
    return { cur: cur, best: best, top: top, ids: top ? s.players.filter(function (p) { return best[p.id] === top; }).map(function (p) { return p.id; }) : [] };
  }
  /* compared, never looked up by key: on the phone page a lookup like MEDALS[place] could pick up something hostile data
     planted on Object.prototype, and medals go into the page as markup */
  function medal(place) { return place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : ''; }

  /* ---------- read-only views ---------- */
  function where(s, id) {
    if (s.rr && s.rr.stage !== 'done' && s.rr.order.indexOf(id) >= 0) return { kind: 'playoff' };
    if (s.pr && s.pr.cur) {
      for (var i = 0; i < s.pr.cur.matches.length; i++) {
        var m = s.pr.cur.matches[i];
        if (m.state === 'pending' && (m.a === id || m.b === id)) return { kind: 'pending', name: prMatchName(s.pr.cur, m) };
      }
    }
    var t = tableOf(s, id);
    if (t) return { kind: 'table', n: t.n, waiting: !(t.a && t.b) };
    var qi = s.queue.indexOf(id);
    if (qi >= 0) return { kind: 'queue', pos: qi + 1 };
    return null;
  }

  /* For a waitlisted player: the waiting winner they cannot yet face again (or null). */
  function heldFrom(s, id) {
    var p = P(s, id);
    if (!p || s.queue.indexOf(id) < 0 || !p.lastOpp) return null;
    var t = tableOf(s, p.lastOpp);
    if (t && tableState(t) === 'waiting' && t.a === p.lastOpp && !canPair(s, id, p.lastOpp)) return p.lastOpp;
    return null;
  }

  function stats(s) {
    var res = s.log.filter(function (e) { return e.type === 'result'; });
    var durs = res.filter(function (e) { return e.start; }).map(function (e) { return playMs(s, e.start, e.t); });
    var avg = durs.length ? durs.reduce(function (a, b) { return a + b; }, 0) / durs.length : null;
    var act1 = s.players.filter(function (p) { return p.status === 'active'; });
    return {
      results: res.length,
      avgMatchMs: avg,
      active: act1.length,
      eliminated: s.players.filter(function (p) { return p.status === 'eliminated'; }).length,
      dropped: s.players.filter(function (p) { return p.status === 'dropped'; }).length,
      chipsInPlay: act1.reduce(function (a, p) { return a + p.C; }, 0),
      openTables: s.tables.filter(function (t) { return t.open; }).length
    };
  }

  /* Rough planning estimate used on the setup screen. */
  function estimateMinutes(totalChips, tables, matchMin) {
    if (!(tables >= 1) || !(totalChips > 0) || !(matchMin > 0)) return null;
    return totalChips * matchMin / tables;
  }

  /* ---------- exports ---------- */
  function dashboardText(s, timeFn) {
    timeFn = timeFn || fmtTime;
    var out = [];
    var ttl = String(s.title || '').trim();
    out.push('🎱 ' + (ttl ? ttl + ': ' : '') + 'TOURNAMENT DASHBOARD');
    out.push('');
    if (isPaused(s)) { out.push('\u23F8\uFE0F Tournament paused since ' + timeFn(s.pause.at)); out.push(''); }
    if (s.phase === 'finished' && s.champion) {
      out.push('🏆 Champion: ' + P(s, s.champion).name);

<script>
/* Chip tournament: the read-only phone view. When this page is opened from the director's QR link (?v=CODE&db=DATABASE),
   it shows that tournament live from Firebase instead of running the director app. Nothing on this page can change the
   tournament: the database only accepts updates from the director's signed-in app. */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var code = (q.get('v') || '').replace(/[^0-9A-Za-z]/g, '').slice(0, 32);
  var db = (q.get('db') || '').toLowerCase().replace(/[^0-9a-z.\-]/g, '');
  var VERSION = (document.querySelector('meta[name="chip-version"]') || {}).content || '';
  if (!code || !/^[0-9a-z][0-9a-z\-]*(\.[0-9a-z][0-9a-z\-]*)*\.(firebaseio\.com|firebasedatabase\.app)$/.test(db)) {   /* a real database name: no empty or dash-led parts */
    if (!q.has('v') && !q.has('db')) return;   /* a plain address: the director app */
    /* a phone link that lost part of its code: say so, rather than showing players the director's setup screen */
    window.CHIP_VIEWER = true;
    document.getElementById('app').innerHTML = '<main class="vw"><div class="banner info vw-sec">This link is incomplete, so it can\'t show the tournament. Scan the QR code again, or ask the director for the link.</div>' +
      '<p class="vw-foot">' + VERSION + '</p></main>';
    return;
  }
  window.CHIP_VIEWER = true;

  var E = window.ChipEngine;
  var SRC = 'https://' + db + '/live/' + code + '.json';
  var ME_KEY = 'chipTourney.me';
  var app = document.getElementById('app');
  var VM = null, got = false, conn = 'connecting', es = null, errs = 0, pollT = null, picking = false, rq = 0, pmap = Object.create(null), moreOpen = false, histOpen = false;
  var retryT = null, polling = false, pollBusy = false, lastMsg = 0;   /* the stream's retry timer, checking every 5 s instead, the last word from Firebase */
  var me = '';
  try { me = localStorage.getItem(ME_KEY) || ''; } catch (e) { /* this visit only */ }
  try { localStorage.removeItem('chipTourney.wd'); } catch (e) { /* a withdrawal request saved by an earlier version: no longer used */ }
  /* the director's colors arrive with the tournament, so phones match the TV */
  var COLOR_VARS = { bg: 'deep', panel: 'felt', cloth: 'cloth', rail: 'rail', railsh: 'rail-dk', trim: 'sight', text: 'chalk', text2: 'chalk-dim',
    line: 'line', hi: 'blue', hiink: 'blue-ink', att: 'yellow', attink: 'yellow-ink', danger: 'red', err: 'red-text', chip: 'chip-face', chiprim: 'chip-rim' };

  function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function up(s) { return String(s === undefined || s === null ? '' : s).toUpperCase(); }
  /* Everything on this page comes from the database the link names, and a link can name any database, not just yours. So
     numbers are made numbers and words made words before use: nothing from there can turn into part of the page itself. */
  function num(v) { v = Number(v); return isFinite(v) ? v : 0; }
  function str(v) { return v === undefined || v === null ? '' : String(v); }
  function cleanPlayer(p) {
    return { id: num(p.id), n: str(p.n).slice(0, 100), c: num(p.c), s: num(p.s), w: num(p.w), st: p.st === 'a' || p.st === 'd' ? p.st : 'e',
      pl: num(p.pl), pt: num(p.pt), r: num(p.r), wh: str(p.wh).slice(0, 200) };
  }
  function now() { return Date.now(); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  /* a list from the database, at most LIST_MAX long: a real night has a few hundred of anything, and a hostile database
     sending millions of entries must not freeze the phone */
  var LIST_MAX = 5000;
  function list(x) {
    if (!x || typeof x !== 'object') return [];
    if (Array.isArray(x)) return x.slice(0, LIST_MAX).filter(function (v) { return v !== null && v !== undefined; });
    return Object.keys(x).slice(0, LIST_MAX).map(function (k) { return x[k]; });
  }
  function P(id) { return Object.prototype.hasOwnProperty.call(pmap, id) ? pmap[id] : null; }
  /* path parts and keys that would reach into Object.prototype (or stretch an array) instead of the tournament's data */
  function badKey(k) { return k === '__proto__' || k === 'constructor' || k === 'prototype' || k === 'length'; }
  function placeText(p) {
    if (!p || !p.pl) return '';
    if (!p.pt || p.pt === p.pl) return E.ordinal(p.pl);
